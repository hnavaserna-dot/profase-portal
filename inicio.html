<!doctype html><html lang="es" data-rol="todos" data-incrustada="1"><head><meta charset="utf-8"><script>/* Cierre temporal del portal (30-oct-2026, pedido de Daniel cuando la base se trabó: «cierra temporalmente crm»;
   «Saca a todos del CRM con ese aviso y cuando quede ya les avisamos»).
   construir.py lo pone escrito al principio del <head> de cada página que arma (y va a mano en index.html), antes de
   cualquier otro script. Lee cierre.json, que vive en la raíz de profase-portal (no pasa por la base), y si dice
   "cerrado": true detiene la página y lleva a cerrado.html, que avisa y regresa sola al portal en cuanto cierre.json
   diga false. Si la página va en un marco, se lleva a la de arriba. Guarda a dónde iba cada quien para regresarlo ahí.
   Solo en crmprofase.com.mx: en las pruebas locales no hace nada (salvo con window.__PRUEBA_CIERRE).
   Si cierre.json no llega, la página sigue normal. No lee ni escribe nada de la base.
   Desde el 24-nov-2026 no detiene la pantalla mientras pregunta, salvo si la última vez el CRM estaba cerrado (abajo). */
(function () {
  'use strict';
  if (!/(^|\.)crmprofase\.com\.mx$/.test(location.hostname) && !window.__PRUEBA_CIERRE) return;
  // Nadie de fuera mete el CRM dentro de su página (auditoría externa del 11-nov-2026, H-04; Héctor Daniel Nava: «3 A»).
  // GitHub Pages no deja poner la protección del navegador (X-Frame-Options / frame-ancestors), así que se hace aquí,
  // antes que todo: si la página va en un marco de otro sitio, no se enseña ni se carga nada más. Los marcos del mismo
  // portal (las pantallas dentro de su vista) sí. Única excepción: la llamada del soporte de Quo (sala.html?marca=quo),
  // que va dentro de la burbuja de los sistemas Quo.
  if (window.top !== window.self && !(/\/sala\.html$/.test(location.pathname) && /[?&]marca=quo(?:&|$)/.test(location.search))) {
    var mismo = false;
    try { mismo = window.top.location.host === location.host; } catch (e) { mismo = false; }
    if (!mismo) {
      try { var st = document.createElement('style'); st.textContent = 'html{display:none!important}'; (document.head || document.documentElement).appendChild(st); } catch (e) { /* nada */ }
      try { window.stop(); } catch (e) { /* navegador viejo */ }
      return;
    }
  }
  if (/\/cerrado\.html$/.test(location.pathname)) return;
  // la llamada del soporte de Quo (sala.html?marca=quo, Q Chat): nunca lleva a la pantalla de cierre de PROFASE (PROFASE no
  // sale en los sistemas Quo); si la base no contesta, la misma sala lo dice con la marca de Quo
  if (/\/sala\.html$/.test(location.pathname) && /[?&]marca=quo(?:&|$)/.test(location.search)) return;
  // Sin trabar la pantalla (Héctor Daniel Nava, 24-nov-2026, 17:38 a 17:42: el CRM se le quedó en blanco en la app de su
  // iPhone Duo; «lo cambio para que mientras espera salga el logo» → «Si dale»). Antes esta revisión esperaba la respuesta
  // de cierre.json con el teléfono detenido (pedido «síncrono»): con el internet lento, nada se pintaba y la pantalla se
  // quedaba en blanco. Ahora solo espera así si la última vez el CRM estaba cerrado (marca profase-cierre en el
  // navegador): mientras el CRM está cerrado, nadie alcanza a ver ni mover nada. Si estaba abierto, pregunta sin
  // detener nada: la entrada y el «Abriendo tu pantalla…» con el signo se pintan en cuanto llegan, y si la respuesta dice
  // que se cerró, la página se detiene y lleva a cerrado.html igual que antes (y js/portal.js lo sigue revisando cada
  // minuto en la página abierta).
  var MARCA = 'profase-cierre';
  function marca(v) { try { if (v) localStorage.setItem(MARCA, '1'); else localStorage.removeItem(MARCA); } catch (e) { /* sin almacenamiento */ } }
  function cerrado(j) {
    if (!j || j.cerrado !== true) return false;
    // «hasta» (2-nov-2026, Daniel: «no dejes ingresar al sistema hasta las nueve A.M.»): a esa hora abre solo
    if (j.hasta && !isNaN(Date.parse(j.hasta)) && Date.now() >= Date.parse(j.hasta)) return false;
    return true;
  }
  function lleva() {
    var w = window;
    try { if (window.top && window.top.location.host === location.host) w = window.top; } catch (e) { w = window; }
    try {
      var r = w.location.pathname + w.location.search + w.location.hash;
      if (!/cerrado\.html/.test(r)) sessionStorage.setItem('profase-regreso', r);
    } catch (e) { /* sin almacenamiento: regresa a la entrada */ }
    try { window.stop(); } catch (e) { /* navegador viejo */ }
    try { w.location.replace('/cerrado.html'); } catch (e) { location.replace('/cerrado.html'); }
  }
  function lee(x) { try { return x.status === 200 ? JSON.parse(x.responseText) : null; } catch (e) { return null; } }
  var antes = false;
  try { antes = localStorage.getItem(MARCA) === '1'; } catch (e) { antes = false; }
  var x = new XMLHttpRequest();
  if (antes) {
    var j = null;
    try { x.open('GET', '/cierre.json?t=' + Date.now(), false); x.send(null); j = lee(x); } catch (e) { j = null; }
    if (j) marca(cerrado(j));
    if (cerrado(j)) lleva();
    return;
  }
  try {
    x.open('GET', '/cierre.json?t=' + Date.now(), true);
    x.timeout = 20000;
    x.onload = function () { var j = lee(x); if (!j) return; marca(cerrado(j)); if (cerrado(j)) lleva(); };
    x.send(null);
  } catch (e) { /* si cierre.json no llega, la página sigue normal */ }
})();</script><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Portal PROFASE · Inicio</title>

   Arriba de todas, para todos, «Tu agenda» (31-oct-2026): las pilas de pendientes, citas, recordatorios… (ini_pilas,
   portal/sql/108_inicio_pilas.sql). Las actividades del WorkFlow se llaman «Mis actividades» para no confundirlas con

   Cada tarjeta lee con la sesión de quien entró: la base decide qué ve cada quien (si no puede leer algo, la tarjeta no

   «Equipo conectado» (Daniel, 30-oct-2026, 16:26 y 17:22: «solo yo y HNR»; «si» a la tarjeta en su Inicio): quién del

      if (fl) { mueve(fl.closest('.pila').getAttribute('data-k'), +fl.getAttribute('data-d')); return; }
      var hj = e.target.closest('.pi-hoja');
      if (hj) {
        var P = pilaDe(hj.closest('.pila')), it = P && (P.items || [])[+hj.getAttribute('data-it')];
        // 468: una alerta se abre con lo mismo que la campanita (window.__ntfAbre de notif_tab.js): se marca como leída y lleva a
        // donde está lo que avisa; después la pila se pone al día
        if (it && it.nt) { try { if (typeof window.parent.__ntfAbre === 'function') { window.parent.__ntfAbre(it.nt); setTimeout(function () { AG.firma = null; cargaAgenda(); }, 1500); return; } } catch (er) { /* sigue como antes */ } }
        if (it) abre(it.liga || P.liga, it.x, P.liga); return;
      }
      var rcb = e.target.closest('.pi-recb');   // 464: «Recordarle»
      if (rcb) { recordar({ cosa: rcb.getAttribute('data-r') }, rcb); return; }
      var oj = e.target.closest('.pi-ojo');   // el ojito: tapa o destapa los montos de esa pila
      if (oj) { var ok = oj.closest('.pila').getAttribute('data-k'); if (tapable(ok)) { AG.ver[ok] = !AG.ver[ok]; pintaAgenda(); } return; }
      var ms = e.target.closest('.pi-mas');
      if (ms) { var f = nuevoDe(ms.closest('.pila').getAttribute('data-k')); if (f) f(); return; }
      var cb = e.target.closest('.pi-cab');
      if (cb && !cb.disabled) { var Q = pilaDe(cb.closest('.pila')); if (Q) abre(Q.liga, Q.k === 'alertas' ? 'ver:alertas' : null, null); }
    });
    cont.addEventListener('keydown', function (e) {
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
      var pi = e.target.closest('.pila'); if (!pi) return;
      e.preventDefault(); mueve(pi.getAttribute('data-k'), e.key === 'ArrowRight' ? 1 : -1, false, true);
    });
    // siempre al día, sin preguntar de más: solo si el Inicio se ve
    setInterval(function () { if (seVe()) retoca(); }, 30000);
    setInterval(function () { if (seVe() && PERFIL && Date.now() - AG.ult > 100000) cargaAgenda(); }, 120000);
    document.addEventListener('visibilitychange', function () { if (seVe() && PERFIL && Date.now() - AG.ult > 15000) cargaAgenda(); });
    // los montos se vuelven a tapar en cuanto el Inicio deja de verse (otra pestaña, la app en segundo plano)
    document.addEventListener('visibilitychange', function () { if (document.hidden) tapaTodo(); });
    addEventListener('pagehide', tapaTodo);
    try { window.parent.addEventListener('profase:notif', function () { clearTimeout(AG.tn); AG.tn = setTimeout(function () { if (seVe() && PERFIL) cargaAgenda(); }, 1200); }); } catch (e) { /* sin página de afuera */ }
  })();

  /* ---------- quién ve qué tarjetas ---------- */
  function en(c, lado) { c.lado = lado; return c; }
  function arma() {
    if (PERFIL === 'direccion') TARJETAS = [tCobranza('Cobranza', 'Lo que nos deben, por compañía'), tCumplimiento(), tRevisar(),
      tFirmas('e.firma y sellos', 'De todos los clientes'), tAvisos()];
    // «B · Indicadores grandes» (26-nov-2026): arriba los cuatro indicadores (lado 'top'), a la izquierda ('i') lo que se
    // trabaja y a la derecha (sin lado) «Tu agenda» y lo demás
    else if (PERFIL === 'cadengo') TARJETAS = [tTopCadengo(DEP), en(tCobradoMeses(), 'i'), en(tPorAutorizar(), 'i'), en(tEquipo(DEP), 'i'),
      en(tCobranza('Cobranza DECOMSA', 'Lo que nos deben'), 'i'), tTesoreria(), tPortal(), tPendientes('Mis actividades', 'Donde eres responsable o autorizas'), tAvisos()];
    else if (PERFIL === 'gerente') TARJETAS = [tTopEquipo(DEP), tEquipo(DEP), en(tConfirmar(DEP), 'i'), tAvanceMeses('equipo', DEP),
      tPendientes('Mis actividades', 'Donde eres responsable o autorizas'), tAdeudoEquipo(DEP), tFirmas('e.firma y sellos de tu equipo', 'Clientes de tu departamento', DEP), tAvisos()];
    else if (PERFIL === 'gabo') TARJETAS = [tTopYo(), en(tPendientes('Lo que vence primero', 'Del WorkFlow: donde eres responsable, autorizas o eres el contador asignado'), 'i'),
      en(tPropuestas(), 'i'), tAvanceMeses('yo'), tJustificar(), tPantallas(), tAvisos()];
    // 464: quien coordina la operación de DECOMSA: primero a quién hay que ir a buscar, luego lo suyo
    else if (PERFIL === 'coordina') TARJETAS = [tCorretea(), tPendientes('Mis actividades', 'Del WorkFlow: donde eres responsable o autorizas'),
      tTesoreria(), tFirmas('e.firma y sellos', 'Vencidas o por vencer'), tPantallas(), tAvisos()];
    else TARJETAS = [tTopYo(), en(tPendientes('Lo que vence primero', 'Del WorkFlow: donde eres responsable, autorizas o eres el contador asignado'), 'i'),
      tAvanceMeses('yo'), tJustificar(), tFirmas('e.firma y sellos de tus clientes', 'Vencidas o por vencer'), tTesoreria(), tPantallas(), tAvisos()];
    // RH: quién está fuera (gerentes y dirección) y lo que espera en RH (quien lo ve); la base decide si salen
    if (PERFIL === 'direccion' || PERFIL === 'cadengo' || PERFIL === 'gerente') TARJETAS.splice(Math.max(0, TARJETAS.length - 1), 0, tAusencias(), tRH());
    // «Equipo conectado»: solo a quien la base se la da (hoy la dirección); junto a la cobranza o antes de los avisos
    if (VEO_EQ) TARJETAS.splice(PERFIL === 'direccion' ? 1 : Math.max(0, TARJETAS.length - 1), 0, tConectados());
  }

  /* Cobranza (Héctor Daniel Nava, 4-nov-2026): la pila abre su resumen (PROFASE_CXC.resumen, js/cobranza.js: la misma
     cuenta de la pantalla de Cobranza) con «Ver en Cobranza», que abre la pantalla ya con esa compañía y esa pila
     (PROFASE_ABRE.cobranza de la vista); un grupo de «Los que más deben…» abre la Cobranza en ese grupo. */
  var CXP = null;
  function abreCobranza(x) {
    abre('cobranza', x);
  }
  document.addEventListener('click', function (e) {
    var co = e.target.closest('.c-ojo');   // el ojito de una tarjeta: tapa o destapa su dinero
    if (co) { e.preventDefault(); e.stopPropagation(); ojoTarjeta(co.getAttribute('data-c')); return; }
    var wv = e.target.closest('[data-wf]');
    if (wv) { e.preventDefault(); e.stopPropagation(); abre('panel', wv.getAttribute('data-wf')); return; }
    var c = e.target.closest('[data-cxc]');
    if (c && window.PROFASE_CXC) {
      var p = String(c.getAttribute('data-cxc')).split('|');
      if (c.classList.contains('k')) {
        e.preventDefault(); e.stopPropagation();
        cargaCXC().then(function (C) {
          if (!C) return;
          if (!CXP || CXP.D !== C.D) CXP = window.PROFASE_CXC.prepara(C.D);
          window.PROFASE_CXC.resumen(CXP, { cia: p[0], pila: p[1], ver: ve('cobranza') ? abreCobranza : null });
          // si su tarjeta está tapada, el resumen también sale tapado (para destaparlo, el ojito de la tarjeta)
          var card = c.closest('.card'), dl = document.querySelectorAll('.cx-dlg');
          if (card && tarjetaTapada(card.id.slice(2)) && dl.length) tapaNodo(dl[dl.length - 1]);
        });
        return;
      }
      if (ve('cobranza')) { e.preventDefault(); e.stopPropagation(); abreCobranza('cia:' + p[0] + '|pila:' + p[1] + '|grp:' + p.slice(2).join('|')); return; }
    }
    var b = e.target.closest('[data-liga],[data-equipo]'); if (!b) return;
    if (b.hasAttribute('data-equipo') || b.closest('#c-conectados')) { abreEquipo(); return; }
    var id = b.getAttribute('data-notif');
    if (id) {
      try { if (window.parent && window.parent !== window && typeof window.parent.__ntfAbre === 'function') { window.parent.__ntfAbre(AVISOS[id] || { id: +id, liga: b.getAttribute('data-liga') }); return; } } catch (er) { /* sigue como antes */ }
      try { P.sb.rpc('notif_leer', { p_ids: [+id] }); } catch (er) { /* no detiene la liga */ }
    }
    ir(b.getAttribute('data-liga'));
  });
  document.addEventListener('keydown', function (e) {   // los renglones de «Tu equipo» se abren también con Enter o espacio
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var tr = e.target.closest && e.target.closest('tr.ir-p'); if (!tr) return;
    e.preventDefault(); tr.click();
  });
  $('recarga').onclick = function () { corre(); };

  /* ---------- «Fuera de la ciudad» de la dirección (Daniel, 1-nov-2026; portal/sql/116_fuera_ciudad.sql) ----------
     Una franja arriba, para todos: quién de la dirección está fuera hoy (con si hoy está disponible y hasta cuándo) y
     quién sale en los próximos 7 días. Nunca el motivo: la base solo se lo da a la dirección (fuera_ciudad_lista()), y
     aquí solo se le enseña a ella. */
  var DIAS3 = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
  function fdDia(iso) { var d = new Date(String(iso).slice(0, 10) + 'T12:00:00Z'); return isNaN(d) ? String(iso || '') : DIAS3[d.getUTCDay()] + ' ' + d.getUTCDate() + ' de ' + MESC[d.getUTCMonth()]; }
  var FDC_MOT = { cliente: 'visita a cliente', vacaciones: 'vacaciones' };
  async function cargaFuera() {
    var b = $('fdc'); if (!b) return;
    var L = null;
    try { L = await rpc('fuera_ciudad_lista', { p_desde: HOY, p_hasta: masDias(HOY, 7) }); } catch (e) { L = null; }   // sin 116: no sale
    if (!Array.isArray(L) || !L.length) { b.hidden = true; b.innerHTML = ''; return; }
    var dom = new Date(HOY + 'T12:00:00Z').getUTCDay() === 0, lin = [];
    L.forEach(function (f) {
      if (!f || !f.desde || !f.hasta) return;
      var yo = f.usuario === YO, quien = yo ? 'Tú' : esc(f.nombre || f.corto || ''), mot = f.motivo && FDC_MOT[f.motivo] ? ' <span class="s">(' + esc(FDC_MOT[f.motivo]) + ')</span>' : '';
      if (f.desde <= HOY && f.hasta >= HOY) {
        var hoy = dom ? '' : (f.dias && f.dias[HOY] === false ? ' · <span class="fdc-no">hoy no disponible</span>' : ' · <span class="fdc-si">hoy disponible</span>');
        lin.push('<p><b>' + quien + '</b> ' + (yo ? 'estás' : 'está') + ' fuera de la ciudad hasta el ' + esc(fdDia(f.hasta)) + hoy + mot + '.</p>');
      } else if (f.desde > HOY) {
        lin.push('<p><b>' + quien + '</b> ' + (yo ? 'sales' : 'sale') + ' de la ciudad del ' + esc(fdDia(f.desde)) + ' al ' + esc(fdDia(f.hasta)) + mot + '.</p>');
      }
    });
    if (!lin.length) { b.hidden = true; b.innerHTML = ''; return; }
    b.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>'
      + '<div class="fdc-tx">' + lin.join('') + '<p class="s">Los días que no están disponibles, el portal avisa antes de llamarles o agendarles; los mensajes les llegan igual.</p></div>'
      + '<button type="button" class="btn" data-liga="calendario">Ver en el Calendario</button>';
    b.hidden = false;
  }
  try { window.parent.addEventListener('profase:fuera', function () { if (PERFIL) cargaFuera(); }); } catch (e) { /* sin página de afuera */ }

  // La página de afuera avisa al regresar al Inicio: «Tu agenda» se pone al día siempre (con su firma, casi nada viaja) y
  // las tarjetas, si pasó más de un minuto, sin parpadear
  // (y la de afuera llama a tapa al salir del Inicio: las pilas con montos regresan tapadas)
  window.INICIO = { refresca: function () { tapaTodo(); if (!PERFIL) return; cargaAgenda(); if (Date.now() - CARGADO > 60000) corre(true); },
                    tapa: tapaTodo };

  (async function () {
    try {
      var p = await P.listo; if (!p) return;
      YO = p.usuario || ''; ROL = p.rolReal || p.rol || ''; NOM = nombreCorto(p); NOMWF = p.nombre_wf || p.nombre || '';
      if (YO === 'gabriel.cavazos') { PERFIL = 'gabo'; ROL = 'contador'; }
      else if (ROL === 'director') PERFIL = 'direccion';
      else if (ROL === 'gerente') PERFIL = YO === 'fernando.cadengo' ? 'cadengo' : 'gerente';
      else PERFIL = 'contador';
      DEP = depDe(YO, NOMWF);
      if (PERFIL === 'gerente' && DEP < 0) PERFIL = 'contador';
      try { adelanta(); } catch (e) { ADELANTO = false; }   // si algo falla aquí, cada tarjeta lo pide sola, como antes
      // 464: quien coordina la operación (la base decide: ini_coordino(), la lista de 461); se pregunta a la vez que «Equipo conectado»
      var coordP = PERFIL === 'contador' ? rpc('ini_coordino').catch(function () { return false; }) : null;
      try { VEO_EQ = (await rpc('chat_veo_conectados')) === true; } catch (e) { VEO_EQ = false; }   // sin 65: no sale
      if (coordP && (await coordP) === true) PERFIL = 'coordina';
      $('que').textContent = TITULO[PERFIL];
      document.title = TITULO[PERFIL] + ' · Portal PROFASE';
      arma();
      await corre();
    } catch (e) {
      ARRIBA_LISTO = true; revela();   // (25-nov-2026: adelanta() ya tapó lo de arriba)
      sacaAgenda(); $('grid').className = 'grid';
      $('grid').innerHTML = '<section class="card"><p class="falla">No se pudo abrir el inicio. Vuelve a cargar en un momento.</p></section>';
    }
  })();
})();
</script>
