   «Saca a todos del CRM con ese aviso y cuando quede ya les avisamos»).
   construir.py lo pone escrito al principio del <head> de cada página que arma (y va a mano en index.html), antes de
   cualquier otro script. Lee cierre.json, que vive en la raíz de profase-portal (no pasa por la base), y si dice
   "cerrado": true detiene la página y lleva a cerrado.html, que avisa y regresa sola al portal en cuanto cierre.json
   diga false. Si la página va en un marco, se lleva a la de arriba. Guarda a dónde iba cada quien para regresarlo ahí.
   Solo en crmprofase.com.mx: en las pruebas locales no hace nada (salvo con window.__PRUEBA_CIERRE).
   Si cierre.json no llega, la página sigue normal. No lee ni escribe nada de la base. */
(function () {
  'use strict';
  if (!/(^|\.)crmprofase\.com\.mx$/.test(location.hostname) && !window.__PRUEBA_CIERRE) return;
  if (/\/cerrado\.html$/.test(location.pathname)) return;
  var j = null;
  try {
    var x = new XMLHttpRequest();
    x.open('GET', '/cierre.json?t=' + Date.now(), false);
    x.send(null);
    if (x.status === 200) j = JSON.parse(x.responseText);
  } catch (e) { j = null; }
  if (!j || j.cerrado !== true) return;
  var w = window;
  try { if (window.top && window.top.location.host === location.host) w = window.top; } catch (e) { w = window; }
  try {
    var r = w.location.pathname + w.location.search + w.location.hash;
    if (!/cerrado\.html/.test(r)) sessionStorage.setItem('profase-regreso', r);
  } catch (e) { /* sin almacenamiento: regresa a la entrada */ }
  try { window.stop(); } catch (e) { /* navegador viejo */ }
  try { w.location.replace('/cerrado.html'); } catch (e) { location.replace('/cerrado.html'); }

  // el mes contable que se trabaja: el anterior al de hoy (si todavía no tiene tareas, el último que sí tenga)

        [['fiel', 'vFiel', 'e.firma'], ['sellos', 'vSellos', 'Sellos']].forEach(function (q) {
          var f = e[q[1]]; if (!e[q[0]] || !f) return;
          f = String(f).slice(0, 10);
          if (f <= HOY) { c[q[0] === 'fiel' ? 'fm' : 'sm']++; if (f >= masDias(HOY, -60)) l.push({ e: e, q: q[2], f: f, mal: true }); }
          else if (f <= EN90) { c[q[0] === 'fiel' ? 'fo' : 'so']++; l.push({ e: e, q: q[2], f: f, mal: false }); }
        });
      });
      if (!c.fm && !c.fo && !c.sm && !c.so) return aldia('Ninguna e.firma ni sello vence en los próximos 3 meses.');
      l.sort(function (a, b) { return a.f < b.f ? -1 : 1; });
      // en qué paso va su renovación (portal/sql/71_renovaciones.sql: la base decide qué seguimiento ve cada quien)
      var PASO = { cotizar: 'por cotizar', cotizado: 'cotizado', facturado: 'falta el pago', tramite: 'en trámite', cargar: 'cargar el nuevo',
                   vencimiento: 'falta el vencimiento nuevo', baja: 'ya no es cliente' }, ren = {};
      try { (await rpc('ren_lista', { p_cerrados: false }) || []).forEach(function (x) { ren[x.empresa_id] = PASO[x.etapa] || ''; }); } catch (er) { ren = {}; }
      var h = '<div class="chips">' + (c.fm ? chip(c.fm, c.fm === 1 ? ' e.firma vencida' : ' e.firmas vencidas', 'mal') : '') + (c.fo ? chip(c.fo, c.fo === 1 ? ' e.firma por vencer' : ' e.firmas por vencer', 'ojo') : '')
        + (c.sm ? chip(c.sm, c.sm === 1 ? ' sello vencido' : ' sellos vencidos', 'mal') : '') + (c.so ? chip(c.so, c.so === 1 ? ' sello por vencer' : ' sellos por vencer', 'ojo') : '') + '</div>';
      h += lista(l.slice(0, 5).map(function (x) {
        var sel = x.q === 'Sellos';
        return { pt: x.mal ? 'mal' : 'ojo', a: esc(x.e.rs), b: esc(x.q) + (x.mal ? (sel ? ' vencidos el ' : ' vencida el ') : (sel ? ' vencen el ' : ' vence el ')) + fCortaA(x.f)
                 + (ren[x.e.id] ? ' · ' + esc(ren[x.e.id]) : ''), n: '', liga: 'renovaciones' };
      }));
      h += '<p class="nota">Por vencer: en los próximos 3 meses. Solo empresas activas e incubadas. Datos al ' + esc(horaCorta(doc.refreshedAt)) + '.</p>';
      return h;
    } };
  }

  // --- Tus pantallas (atajos a lo que cada quien usa, solo si su menú las tiene) ---
  function tPantallas() {
    var OPC = [['facturacion', 'Facturación', 'Alta y control de facturas'], ['pagos', 'Pagos', 'Pagos de los clientes y su reparto'],
               ['recordatorios', 'Recordatorios de pago', 'Saldos a los clientes'], ['base-clientes', 'Base de clientes', 'La ficha de cada cliente'],
               ['cotizador', 'Cotizador DECOMSA', 'Cotizaciones'], ['cajachica', 'Caja chica', 'Gastos menores'], ['quo-cotizador', 'Cotizador QUO', 'Cotizaciones de Quo Contabilita'],
               ['quo-membresias', 'Control de membresías', 'Membresías de QUO'], ['variaciones', 'Variaciones', 'Variaciones contables'], ['activofijo', 'Activo fijo', 'Revisión de activo fijo']];
    return { id: 'pant', t: 'Tus pantallas', s: 'Atajos a lo que usas', arma: async function () {
      var l = OPC.filter(function (o) { return ve(o[0]); });
      if (!l.length) return null;
      return lista(l.map(function (o) { return { pt: 'az', a: esc(o[1]), b: esc(o[2]), n: '›', liga: o[0] }; }));
    } };
  }

  // --- Avisos sin leer y chat ---
  function tAvisos() {
    return { id: 'avisos', t: 'Avisos y mensajes', s: 'Lo nuevo para ti', liga: 'notificaciones', ligaTxt: 'Ver todos', arma: async function () {
      var res = await Promise.all([rpc('notif_mias', { p_limite: 5, p_antes: null, p_sin_leer: true }).catch(function () { return null; }),
        rpc('chat_pendientes', { p_desde: 0 }).catch(function () { return null; })]);
      var n = res[0], ch = res[1], f = [];
      if (ch && +ch.total > 0) f.push({ pt: 'na', a: 'Chat', b: plural(+ch.total, 'mensaje sin leer', 'mensajes sin leer'), n: fi(ch.total), liga: 'chat' });
      if (n && n.items) n.items.forEach(function (x) {
        f.push({ pt: x.tipo === 'cumple' || x.tipo === 'aniversario' || x.tipo === 'evento' ? 'az' : 'ojo', a: esc(x.titulo), b: esc(x.texto || '') , n: haceTxt(x.creada).replace('hace ', ''), liga: x.liga || 'notificaciones', notif: x.id });
      });
      if (!f.length) return aldia('No tienes avisos ni mensajes nuevos.');
      var mas = n && +n.sin_leer > (n.items || []).length ? '<p class="nota">Tienes ' + plural(+n.sin_leer, 'aviso sin leer', 'avisos sin leer') + ' en total.</p>' : '';
      return lista(f) + mas;
    } };
  }

  // --- Equipo conectado (Daniel, 30-oct-2026: «solo yo y HNR»): al momento, del chat de la página de afuera ---
  var VEO_EQ = false, EQ = null, repT = 0;
  function estChat() { try { var a = window.parent; return a && a !== window && a.__chatEstado ? a.__chatEstado : null; } catch (e) { return null; } }
  function avEq(x) {
    var url = x.uid && EQ.fotos[String(x.uid).toLowerCase()];
    var w = String(x.nombre || '').trim().split(/\s+/).filter(Boolean);
    var ini = ((w[0] || '?')[0] + (w.length > 1 ? w[w.length - 1][0] : '')).toUpperCase();
    return '<span class="avq">' + (url ? '<img alt="" src="' + esc(url) + '">' : '<span>' + esc(ini) + '</span>') + '</span>';
  }
  function rolEq(r) { return r === 'director' ? 'Dirección' : r === 'gerente' ? 'Gerente' : r === 'contador' ? 'Contador' : ''; }
  function htmlConectados() {
    var x = estChat();
    if (!EQ || !x) return '<p class="falla">El estatus del equipo sale en cuanto carga el chat. Vuelve a cargar en un momento.</p>';
    var g = { linea: [], ausente: [], nd: [], off: [] };
    EQ.dir.forEach(function (p) {
      if (!p || p.usuario === YO || p.registrado === false) return;
      var st; try { st = x.de(p.usuario) || { e: 'off' }; } catch (e) { st = { e: 'off' }; }
      (g[st.e] || g.off).push({ p: p, st: st });
    });
    var porNombre = function (a, b) { return String(a.p.nombre || '').localeCompare(String(b.p.nombre || ''), 'es'); };
    g.linea.sort(porNombre); g.ausente.sort(porNombre); g.nd.sort(porNombre);
    var h = '<div class="chips">' + chip(g.linea.length, 'en línea', 'bien')
      + (g.ausente.length ? chip(g.ausente.length, g.ausente.length === 1 ? 'ausente' : 'ausentes', 'ojo') : '')
      + (g.nd.length ? chip(g.nd.length, g.nd.length === 1 ? 'no disponible' : 'no disponibles', 'mal') : '')
      + chip(g.off.length, g.off.length === 1 ? 'desconectado' : 'desconectados', '') + '</div>';
    var filas = [].concat(g.linea, g.ausente, g.nd);
    if (!filas.length) return h + '<p class="nota">Nadie del equipo está conectado ahora. En «Ver todos» está la última vez de cada quien.</p>';
    var MAX = 8;
    h += '<ul class="lista">' + filas.slice(0, MAX).map(function (f) {
      var txt = ''; try { txt = x.texto(f.st); } catch (e) { txt = ''; }
      var rol = rolEq(f.p.rol);
      return '<li><button type="button" class="fila" data-equipo="1" title="Ver al equipo en el chat"><span class="avw">' + avEq(f.p) + '<span class="pq" data-e="' + esc(f.st.e) + '"></span></span>'
        + '<span class="tx"><span class="a">' + esc(f.p.nombre) + '</span><span class="b' + (f.st.e === 'linea' ? ' linea' : '') + '">' + esc(txt + (rol ? ' · ' + rol : '')) + '</span></span></button></li>';
    }).join('') + '</ul>';
    var mas = filas.length - MAX;
    if (mas > 0) h += '<p class="nota">' + (mas === 1 ? 'Y 1 persona más conectada; está' : 'Y ' + fi(mas) + ' personas más conectadas; están') + ' en «Ver todos».</p>';
    return h;
  }
  function repintaEq() {
    var el = $('c-conectados'); if (!el || el.classList.contains('carga') || !EQ) return;
    el.querySelector('.cuerpo').innerHTML = htmlConectados();
  }
  function tConectados() {
    return { id: 'conectados', t: 'Equipo conectado', s: 'Ahora mismo · se actualiza solo', liga: 'chat', ligaTxt: 'Ver todos', arma: async function () {
      var dir = (await rpc('chat_directorio')) || [], fotos = {};
      try { fotos = (await P.fotosDe(dir.map(function (x) { return x.uid; }).filter(Boolean))) || {}; } catch (e) { fotos = {}; }
      EQ = { dir: dir, fotos: fotos };
      for (var i = 0; i < 20 && !estChat(); i++) await new Promise(function (ok) { setTimeout(ok, 250); });   // el chat de afuera
      return htmlConectados();
    } };
  }
  // «Ver todos» o una persona: el Chat ya en la lista de todo el equipo (chat_tab.js); si no, solo el Chat
  function abreEquipo() {
    try { if (window.parent && window.parent !== window && window.parent.__chatAbreEquipo) { window.parent.__chatAbreEquipo(); return; } } catch (e) { /* sin chat */ }
    ir('chat');
  }
  try { window.parent.addEventListener('profase:presencia', function () { clearTimeout(repT); repT = setTimeout(repintaEq, 250); }); } catch (e) { /* sin página de afuera */ }
  setInterval(function () { if (!document.hidden) repintaEq(); }, 30000);

  /* ---------- RH (30-oct-2026): quién está fuera (gerentes y dirección) y lo que espera en RH ---------- */
  // La base decide: rh_ausencias_cal() solo contesta a los gerentes y a la dirección (sin notas ni faltas) y rh_estado()
  // dice si la persona ve RH. Nunca sueldos ni montos de préstamos en el Inicio.
  var AUS_T = { vacaciones: 'de vacaciones', permiso: 'con permiso', incapacidad: 'de incapacidad' };
  function fCorta(iso) { var d = new Date(iso + 'T12:00:00Z'); return DIAS[d.getUTCDay()] + ' ' + d.getUTCDate() + ' de ' + MESL[d.getUTCMonth()]; }
  function tAusencias() {
    return { id: 'aus', t: 'Quién está fuera', s: 'Vacaciones, permisos e incapacidades · hoy y los próximos 15 días', liga: 'calendario', arma: async function () {
      var L = await rpc('rh_ausencias_cal', { p_desde: HOY, p_hasta: masDias(HOY, 15) });
      if (!Array.isArray(L)) return null;
      var hoy = L.filter(function (a) { return a.desde <= HOY && a.hasta >= HOY; }), prox = L.filter(function (a) { return a.desde > HOY; });
      if (!hoy.length && !prox.length) return aldia('Nadie está fuera hoy ni sale en los próximos 15 días.');
      return lista(hoy.map(function (a) {
        return { pt: 'ojo', a: esc(a.nombre), b: 'Hoy ' + esc(AUS_T[a.tipo] || 'fuera') + ' · regresa el ' + esc(fCorta(a.regresa)) + (a.cubre ? ' · buscar a ' + esc(a.cubre) : ''), liga: 'calendario' };
      }).concat(prox.slice(0, 6).map(function (a) {
        return { pt: 'az', a: esc(a.nombre), b: 'Sale ' + esc(AUS_T[a.tipo] || '') + ' el ' + esc(fCorta(a.desde)) + ' · regresa el ' + esc(fCorta(a.regresa)), liga: 'calendario' };
      })));
    } };
  }
  function tRH() {
    return { id: 'rh', t: 'RH', s: 'Lo que espera en recursos humanos', arma: async function () {
      var e = await rpc('rh_estado');
      if (!e || !e.ve) return null;
      var f = [], c = e.carga || {};
      if (e.autoriza) {
        f.push({ pt: +e.por_autorizar ? 'ojo' : 'bien', a: 'Préstamos por autorizar', b: +e.por_autorizar ? 'Basta que uno de la dirección autorice' : 'Nada esperando', n: +e.por_autorizar ? fi(e.por_autorizar) : '✓', liga: 'rh-prestamos' });
      }
      if (c.pendientes > 0 || !c.prestamos) {
        f.push({ pt: 'na', a: 'Carga inicial de RH', b: c.pendientes > 0 ? 'Faltan días y sueldo de ' + fi(c.pendientes) + (c.pendientes === 1 ? ' persona' : ' personas') : 'Faltan los préstamos que ya existen', n: c.pendientes > 0 ? fi(c.pendientes) : '1', liga: 'rh-vacaciones' });
      }
      return f.length ? lista(f) : null;
    } };
  }

  /* ---------- quién ve qué tarjetas ---------- */
  function arma() {
    if (PERFIL === 'direccion') TARJETAS = [tCobranza('Cobranza', 'Lo que nos deben, por compañía'), tCumplimiento(), tRevisar(),
      tFirmas('e.firma y sellos', 'De todos los clientes'), tAvisos()];
    else if (PERFIL === 'cadengo') TARJETAS = [tPorAutorizar(), tCobranza('Cobranza DECOMSA', 'Lo que nos deben'), tPortal(), tEquipo(DEP),
      tPendientes('Mis actividades', 'Donde eres responsable o autorizas'), tAvisos()];
    else if (PERFIL === 'gerente') TARJETAS = [tEquipo(DEP), tConfirmar(DEP), tPendientes('Mis actividades', 'Donde eres responsable o autorizas'),
      tAdeudoEquipo(DEP), tFirmas('e.firma y sellos de tu equipo', 'Clientes de tu departamento', DEP), tAvisos()];
    else if (PERFIL === 'gabo') TARJETAS = [tPendientes('Mis pendientes', 'Donde eres responsable, autorizas o eres el contador asignado'), tPropuestas(),
      tAvance(), tJustificar(), tPantallas(), tAvisos()];
    else TARJETAS = [tPendientes('Mis pendientes', 'Donde eres responsable, autorizas o eres el contador asignado'), tAvance(), tJustificar(),
      tFirmas('e.firma y sellos de tus clientes', 'Vencidas o por vencer'), tPantallas(), tAvisos()];
    // RH: quién está fuera (gerentes y dirección) y lo que espera en RH (quien lo ve); la base decide si salen
    if (PERFIL === 'direccion' || PERFIL === 'cadengo' || PERFIL === 'gerente') TARJETAS.splice(Math.max(0, TARJETAS.length - 1), 0, tAusencias(), tRH());
    // «Equipo conectado»: solo a quien la base se la da (hoy la dirección); junto a la cobranza o antes de los avisos
    if (VEO_EQ) TARJETAS.splice(PERFIL === 'direccion' ? 1 : Math.max(0, TARJETAS.length - 1), 0, tConectados());
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-liga],[data-equipo]'); if (!b) return;
    if (b.hasAttribute('data-equipo') || b.closest('#c-conectados')) { abreEquipo(); return; }
    var id = b.getAttribute('data-notif');
    if (id) { try { P.sb.rpc('notif_leer', { p_ids: [+id] }); } catch (er) { /* no detiene la liga */ } }
    ir(b.getAttribute('data-liga'));
  });
  $('recarga').onclick = function () { corre(); };

  // La página de afuera la vuelve a cargar al regresar al Inicio, si pasó más de un minuto
  window.INICIO = { refresca: function () { if (PERFIL && Date.now() - CARGADO > 60000) corre(); } };

  (async function () {
    try {
      var p = await P.listo; if (!p) return;
      YO = p.usuario || ''; ROL = p.rolReal || p.rol || ''; NOM = nombreCorto(p); NOMWF = p.nombre_wf || p.nombre || '';
      if (YO === 'gabriel.cavazos') { PERFIL = 'gabo'; ROL = 'contador'; }
      else if (ROL === 'director') PERFIL = 'direccion';
      else if (ROL === 'gerente') PERFIL = YO === 'fernando.cadengo' ? 'cadengo' : 'gerente';
      else PERFIL = 'contador';
      DEP = depDe(YO, NOMWF);
      if (PERFIL === 'gerente' && DEP < 0) PERFIL = 'contador';
      try { VEO_EQ = (await rpc('chat_veo_conectados')) === true; } catch (e) { VEO_EQ = false; }   // sin 65: no sale
      $('que').textContent = TITULO[PERFIL];
      document.title = TITULO[PERFIL] + ' · Portal PROFASE';
      arma();
      await corre();
    } catch (e) {
      $('grid').innerHTML = '<section class="card"><p class="falla">No se pudo abrir el inicio. Vuelve a cargar en un momento.</p></section>';
    }
  })();
})();
</script>
