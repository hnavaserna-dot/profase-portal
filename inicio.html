<!doctype html><html lang="es" data-rol="todos" data-incrustada="1"><head><meta charset="utf-8"><script>/* Cierre temporal del portal (30-oct-2026, pedido de Daniel cuando la base se trabó: «cierra temporalmente crm»;
   «Saca a todos del CRM con ese aviso y cuando quede ya les avisamos»).
   construir.py lo pone escrito al principio del <head> de cada página que arma (y va a mano en index.html), antes de
   cualquier otro script. Lee cierre.json, que vive en la raíz de profase-portal (no pasa por la base), y si dice
   "cerrado": true detiene la página y lleva a cerrado.html, que avisa y regresa sola al portal en cuanto cierre.json
   diga false. Si la página va en un marco, se lleva a la de arriba. Guarda a dónde iba cada quien para regresarlo ahí.
   Solo en crmprofase.com.mx: en las pruebas locales no hace nada (salvo con window.__PRUEBA_CIERRE).
   Si cierre.json no llega, la página sigue normal. No lee ni escribe nada de la base. */
(function () {
  'use strict';
  if (!/(^|\.)crmprofase\.com\.mx$/.test(location.hostname) && !window.__PRUEBA_CIERRE) return;
  if (/\/cerrado\.html$/.test(location.pathname)) return;
  var j = null;
  try {
    var x = new XMLHttpRequest();
    x.open('GET', '/cierre.json?t=' + Date.now(), false);
    x.send(null);
    if (x.status === 200) j = JSON.parse(x.responseText);
  } catch (e) { j = null; }
  if (!j || j.cerrado !== true) return;
  // «hasta» (2-nov-2026, Daniel: «no dejes ingresar al sistema hasta las nueve A.M.»): a esa hora abre solo
  if (j.hasta && !isNaN(Date.parse(j.hasta)) && Date.now() >= Date.parse(j.hasta)) return;
  var w = window;
  try { if (window.top && window.top.location.host === location.host) w = window.top; } catch (e) { w = window; }
  try {
    var r = w.location.pathname + w.location.search + w.location.hash;
    if (!/cerrado\.html/.test(r)) sessionStorage.setItem('profase-regreso', r);
  } catch (e) { /* sin almacenamiento: regresa a la entrada */ }
  try { window.stop(); } catch (e) { /* navegador viejo */ }
  try { w.location.replace('/cerrado.html'); } catch (e) { location.replace('/cerrado.html'); }
})();</script><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Portal PROFASE · Inicio</title>

     · Dirección (Daniel y su papá, en solo consulta): «Cómo va PROFASE»: dinero, cumplimiento SAT, lo que espera su
       «sí» y riesgos. Solo excepciones, nada de tareas.
     · Fernando Cadengo: «Mi bandeja»: por autorizar, cobranza, cómo está el portal y lo suyo.
     · Gerentes: «Mi equipo»: el WorkFlow de su departamento, lo que tienen que confirmar y lo suyo.
     · Gabriel Cavazos: «Mi trabajo y mis propuestas».
     · Los demás: «Mi día»: sus actividades del WorkFlow, su avance, sus justificaciones y sus clientes.
   Arriba de todas, para todos, «Tu agenda» (31-oct-2026): las pilas de pendientes, citas, recordatorios… (ini_pilas,
   portal/sql/108_inicio_pilas.sql). Las actividades del WorkFlow se llaman «Mis actividades» para no confundirlas con

   Cada tarjeta lee con la sesión de quien entró: la base decide qué ve cada quien (si no puede leer algo, la tarjeta no

   código no la nombra. Solo lee: lo único que escribe es marcar como leído un aviso propio (notif_leer). Las horas,
   siempre en hora de Monterrey.
   «Equipo conectado» (Daniel, 30-oct-2026, 16:26 y 17:22: «solo yo y HNR»; «si» a la tarjeta en su Inicio): quién del
   equipo está en línea, ausente o no disponible, al momento. Solo sale si la base dice que sí (chat_veo_conectados(),

.pi-fl:hover{border-color:var(--navy)} .pi-fl:disabled{opacity:.35;cursor:default}
.pi-dots{flex:1;display:flex;justify-content:center;align-items:center;gap:5px;min-width:0;font-size:11.5px;font-weight:700;color:var(--muted)}
.pi-dots i{width:6px;height:6px;border-radius:50%;background:var(--line-strong)}
.pi-dots i.on{width:16px;border-radius:4px;background:var(--navy)}
.pi-cab:focus-visible,.pi-hoja:focus-visible,.pi-fl:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;white-space:nowrap;clip:rect(0 0 0 0)}
/* en el celular (dos pilas por renglón): el número va en la esquina del ícono, como en las apps, para que el nombre
   quepa completo (nunca a media palabra) */
@media (max-width:560px){
  .pila{padding:9px 8px 7px}
  .pi-cab{position:relative;flex-wrap:wrap;gap:6px 7px;padding:4px 2px 8px}
  .pi-ico{width:25px;height:25px}
  .pi-cab h3{flex-basis:100%;font-size:14px;overflow-wrap:normal}   /* el ícono arriba y el nombre completo abajo, como un widget */
  .pi-n{position:absolute;left:17px;top:-3px;min-width:18px;height:18px;padding:0 5px;font-size:11px;box-shadow:0 0 0 2px var(--surface)}
  .pi-va{display:none}
  .pi-mas{width:28px;height:28px;font-size:18px}
  .pi-hoja{min-height:118px;padding:8px 9px}.pi-t{font-size:13.5px}.pi-fl{width:32px}
}

<script>
(function(){
  'use strict';
  var P = window.PORTAL, $ = function (id) { return document.getElementById(id); };
  var ZONA = 'America/Monterrey';

  }
  function haceTxt(iso) {

    var min = Math.round(ms / 60000);

  }

  /* ---------- a dónde lleva cada tarjeta: el menú de la página de afuera (js/menu.js) ---------- */
  function ir(k) {

  }

  /* ---------- lectura (con la sesión de quien entró: la base decide) ---------- */
  async function todas(armar) {
    var r = await armar(true).range(0, 999);
    if (r.error) throw r.error;
    var out = r.data || [], total = r.count == null ? out.length : r.count, pide = [];
    for (var de = 1000; de < total; de += 1000) pide.push(armar(false).range(de, de + 999));
    (await Promise.all(pide)).forEach(function (x) { if (x.error) throw x.error; out = out.concat(x.data || []); });
    return out;
  }
  async function leeDoc(col, id) {
    var q = await P.sb.from('docs').select('data').eq('col', col).eq('id', id).maybeSingle();
    if (q.error) throw q.error;
    return q.data ? q.data.data : null;
  }
  async function coleccion(col) {
    var filas = await todas(function (c) { return P.sb.from('docs').select('id,data', c ? { count: 'exact' } : undefined).eq('col', col).order('id'); });
    return filas.map(function (f) { return { id: f.id, d: f.data || {} }; });
  }
  // «Datos al…» de una tarjeta: no sale si es al instante; si se detuvo, sale con el aviso (Daniel, 31-oct-2026, 6:28)
  function datosAl(d) {
    if (!d || (d.vivo && !d.detenido)) return '';
    return 'Datos al ' + esc(horaCorta(d.refreshedAt)) + (d.detenido ? ' (se detuvo la actualización al instante)' : '') + '. ';
  }
  async function gunzip(b64) {

  }
  // un paquete de la actualización de cada 3 horas (puede venir en varias partes: <base>_0, <base>_1…; el de cada

  async function paquete(col, base, solo) {
    var p0 = await leeDoc(col, solo ? base : base + '_0');

    if (p0 && p0.json && typeof p0.json === 'object') { var j = p0.json; if (p0.detenido) j.detenido = p0.detenido; return j; }
    if (!p0 || !p0.b64) return null;
    var n = Math.max(1, +p0.partes || 1), partes = [p0.b64];
    for (var i = 1; i < n; i++) {
      var pi = await leeDoc(col, base + '_' + i);
      if (!pi || pi.refreshedAt !== p0.refreshedAt) return null;
      partes.push(pi.b64);
    }
    return gunzip(partes.join(''));
  }
  async function rpc(fn, args) {
    var r = await P.sb.rpc(fn, args || {});
    if (r.error) throw r.error;
    return r.data;
  }
  var MEMO = {};
  function una(k, f) { if (!MEMO[k]) MEMO[k] = f().catch(function (e) { delete MEMO[k]; throw e; }); return MEMO[k]; }

  /* ---------- quién entró ---------- */
  var YO = '', ROL = '', PERFIL = '', NOM = '', NOMWF = '', DEP = -1;
  var DEPS = ['Contabilidad', 'VAX', 'Administración', 'Nóminas', 'Fiscal', 'Sin departamento'];
  var DEP_DE = { 'fernando barbosa': 0, 'sebastian sanchez': 0, 'felipe hernandez': 0, 'salomon perez': 0, 'erick macias barcelo': 0, 'victor quintos': 0,
    'johan hernandez': 1, 'susana flores': 1, 'daniela castro': 1, 'fernando gutierrez': 1, 'francisco zaragoza': 1,
    'fernando cadengo': 2, 'gabriel cavazos': 2, 'elisa mata': 2, 'nefertari garcia': 2,
    'jesus luna': 3, 'andrea reyna': 3,
    'francisco rivera': 4, 'liliana lechuga': 4 };
  // gerente → su departamento (por si su nombre del WorkFlow no viene en el perfil)
  var DEP_GERENTE = { 'fernando.barbosa': 0, 'fernando.gutierrez': 1, 'fernando.cadengo': 2, 'alex.luna': 3, 'francisco.rivera': 4 };
  // usuario del portal → departamento (las justificaciones traen el usuario de quien las mandó)
  var DEP_USUARIO = { 'sebastian.sanchez': 0, 'felipe.hernandez': 0, 'salomon.perez': 0, 'erick.macias': 0, 'victor.quintos': 0,
    'johan.hernandez': 1, 'susana.flores': 1, 'daniela.castro': 1, 'francisco.zaragoza': 1,
    'gabriel.cavazos': 2, 'elisa.mata': 2, 'nefertari.garcia': 2, 'andrea.reyna': 3, 'liliana.lechuga': 4 };
  function depDe(usuario, nombre) {
    if (DEP_GERENTE[usuario] != null) return DEP_GERENTE[usuario];
    if (DEP_USUARIO[usuario] != null) return DEP_USUARIO[usuario];
    var n = norm(nombre); return DEP_DE[n] != null ? DEP_DE[n] : -1;
  }
  // personas con dos sombreros: cuentan en Contabilidad en los clientes donde son el contador asignado
  var DOBLE = { 'gabriel cavazos': 1, 'susana flores': 1 };
  var MOTIVOS = { 'no-info': 'cliente', 'no-contesta': 'cliente', 'carga': 'despacho', 'revision': 'despacho' };
  var TITULO = { direccion: 'Cómo va PROFASE', cadengo: 'Mi bandeja', gerente: 'Mi equipo', gabo: 'Mi trabajo y mis propuestas', contador: 'Mi día' };

  function saludo() {
    var h = +new Intl.DateTimeFormat('en-US', { timeZone: ZONA, hour: 'numeric', hourCycle: 'h23' }).format(new Date());
    return h < 12 ? 'Buenos días' : h < 19 ? 'Buenas tardes' : 'Buenas noches';
  }
  function nombreCorto(p) {
    if (p.usuario === 'daniel.nava') return 'Héctor Daniel';
    var w = String(p.nombre || '').trim().split(/\s+/)[0];
    return w ? bonito(w) : '';
  }

  /* ---------- WorkFlow (paquete de cada 3 horas: el mismo del Panel, con las mismas reglas) ---------- */
  function wfColYId() {
    if (ROL === 'director') return ['director', 'wf'];
    if (ROL === 'gerente') return ['datos', 'wf'];
    return ['datos', 'wfc_' + YO, true];
  }
  function cargaWF() {
    return una('wf', async function () {
      var ci = wfColYId();
      var res = await Promise.all([paquete(ci[0], ci[1], ci[2]), coleccion('pausas').catch(function () { return []; }), coleccion('clientes').catch(function () { return []; })]);
      var D = res[0]; if (!D || !D.rows) return null;
      var W = { D: D, DIM: D.dims, R: [], cols: D.cols };
      var ix = {}; D.cols.forEach(function (k, i) { ix[k] = i; });
      W.R = D.rows.map(function (r) {
        var o = {}; for (var k in ix) o[k] = r[ix[k]];
        o.y = 2000 + Math.floor(o.ym / 100); o.m = o.ym % 100; return o;
      });
      W.ASOF = iso2n(D.refreshedAt) || HOYN;
      W.EN7 = iso2n(masDias(n2iso(W.ASOF), 7));
      W.CUR_Y = Math.floor(W.ASOF / 10000);
      // pausas: las del cliente (no cuentan) y el cliente en pausa (todo fuera del avance)
      var CLI = {}; (W.DIM.cli || []).forEach(function (n, i) { CLI[norm(n)] = i; });
      W.PZK = {}; W.PZKA = {}; W.PZC = {};
      res[1].forEach(function (x) {
        var p = x.d; if (!p || !p.activa) return;
        var i = CLI[norm(p.cli)]; if (i === undefined) return;
        var cat = MOTIVOS[p.motivoId] || 'cliente';
        (cat === 'cliente' ? W.PZK : W.PZKA)[(+p.ym) * 10000 + i] = 1;
      });
      W.enPausa = 0;
      res[2].forEach(function (x) {
        var d = x.d; if (!d) return;
        var i = CLI[norm(d.cli)]; if (i === undefined) return;
        if (d.estatus === 'pausado') { W.PZC[i] = 1; W.enPausa++; }
      });
      W.pz = function (o) { return !!(W.PZC[o.c] || W.PZK[o.ym * 10000 + o.c]); };
      W.venc = function (o) { return o.v > 0 && o.v < W.ASOF && !W.pz(o); };
      var DEPC = {};
      W.depR = function (r) {
        if (DEPC[r] === undefined) { var n = norm(W.DIM.resp[r]); DEPC[r] = n in DEP_DE ? DEP_DE[n] : DEPS.length - 1; }
        return DEPC[r];
      };
      W.depO = function (o) {
        var d = W.depR(o.r); if (!(o.a >= 0) || !W.DIM.con || !W.DIM.con[o.a]) return d;
        var n = norm(W.DIM.resp[o.r]); return DOBLE[n] && norm(W.DIM.con[o.a]) === n ? 0 : d;
      };
      return W;
    });
  }
  // el mes contable que se trabaja: el anterior al de hoy (si todavía no tiene tareas, el último que sí tenga)
  function mesTrabajo(W, lista) {
    var y = +HOY.slice(0, 4), m = +HOY.slice(5, 7) - 1; if (!m) { m = 12; y--; }
    var ym = (y - 2000) * 100 + m, hay = {};

    var ks = Object.keys(hay).map(Number).filter(function (k) { return k < hoyYm && hay[k] > 0; }).sort(function (a, b) { return b - a; });

  }
  function resumenWF(W, lista) {
    var o = { tar: 0, ter: 0, pen: 0, ven: 0, venAnio: 0, venRez: 0, plazo: 0, semana: 0, pausa: 0, satA: 0, terA: 0, mes: 0, mTar: 0, mTer: 0, mPen: 0, mVen: 0, mSat: 0 };
    var wm = mesTrabajo(W, lista); o.mes = wm;

      if (x.y === W.CUR_Y) { o.satA += x.sat; o.terA += x.ter; }
      if (x.ym === wm) { o.mTar += x.ter + x.pen; o.mTer += x.ter; o.mPen += x.pen; o.mSat += x.sat; }

  }

  /* ---------- Cobranza (paquete de cada 3 horas: el mismo de la pestaña Cobranza) ---------- */
  function cargaCXC() {

  function grupoDe(a) { return a.pausa ? 'pz' : !a.vence ? 'sin' : a.vence < HOY ? 'ven' : a.vence === HOY ? 'hoy' : a.vence <= EN7 ? 'sem' : 'des'; }

  function k(t, v, s, cls) { return '<div class="k' + (cls ? ' ' + cls : '') + '"><div class="t">' + esc(t) + '</div><div class="v">' + v + '</div>' + (s ? '<div class="s">' + s + '</div>' : '') + '</div>'; }

  function resumen(L) {

  }
  function pintaAgenda() {

    var foco = document.activeElement, fk = null, fc = '';
    if (foco && $('pilas').contains(foco)) { var fp = foco.closest('.pila'); fk = fp && fp.getAttribute('data-k'); fc = foco.classList.contains('pi-fl') ? '.pi-fl[data-d="' + foco.getAttribute('data-d') + '"]' : foco.classList.contains('pi-cab') ? '.pi-cab' : foco.classList.contains('pi-mas') ? '.pi-mas' : '.pi-hoja'; }

  // cada 30 segundos: solo los textos de cuándo (y los colores), sin preguntar a la base ni mover nada
  function retoca() {

  function pilaEl(k) { var l = $('pilas').querySelectorAll('.pila'); for (var i = 0; i < l.length; i++) if (l[i].getAttribute('data-k') === k) return l[i]; return null; }
  function pilaDe(el) { var k = el && el.getAttribute('data-k'); for (var i = 0; i < AG.pilas.length; i++) if (AG.pilas[i].k === k) return AG.pilas[i]; return null; }

  // pasar a la siguiente (d = 1) o a la anterior (d = -1); al final vuelve a empezar

  // abrir una cosa en su pantalla: si el módulo dejó cómo abrirla (window.PROFASE_ABRE['<sección>'](id)), con eso;
  // si no, su sección del menú (si la persona la tiene)
  // «+» de una pila: si el módulo dejó cómo abrir uno nuevo desde fuera (window.PROFASE_NUEVO['<clave>'], o el de
  // Recordatorios, window.__rcdNuevo de rcd_tab.js, y el de la Agenda, window.__agendaNuevo de cal_tab.js)
  function nuevoDe(k) {

    for (var i = 0; i < l.length; i++) {
      if (A && typeof A[l[i]] === 'function') { try { if (A[l[i]](x) !== false) return; } catch (e) { /* sigue con el menú */ } }

  }
  (function () {
    var cont = $('pilas'), d = null;
    cont.addEventListener('pointerdown', function (e) {

  /* ---------- «Fuera de la ciudad» de la dirección (Daniel, 1-nov-2026; portal/sql/116_fuera_ciudad.sql) ----------
