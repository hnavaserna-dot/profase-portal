  return APL_IDX;
}
// 2 o 3 anticipos o notas que juntos suman el saldo de la factura (al centavo); los 30 de fecha más cercana, hasta 2 sumas
function aplSumas(f,c){
  const obj=Math.round(f.saldo*100), out=[];
  const ds=c.filter(x=>-x.d.saldo<f.saldo-0.01).sort((a,b)=>a.dias-b.dias).slice(0,30).map(x=>({d:x.d,v:Math.round(-x.d.saldo*100)}));
  const idx=new Map(); ds.forEach((x,i)=>{ const a=idx.get(x.v)||[]; a.push(i); idx.set(x.v,a); });
  const busca=(v,mayor)=>{ for(const w of [v,v-1,v+1]){ const a=idx.get(w); if(a){ const j=a.find(j=>j>mayor); if(j!=null) return j; } } return -1; };
  for(let i=0;i<ds.length&&out.length<2;i++){ const j=busca(obj-ds[i].v,i); if(j>=0) out.push([ds[i].d,ds[j].d]); }
  for(let i=0;i<ds.length&&out.length<2;i++) for(let j=i+1;j<ds.length&&out.length<2;j++){
    const k=busca(obj-ds[i].v-ds[j].v,j); if(k>=0) out.push([ds[i].d,ds[j].d,ds[k].d]); }
  return out;
}
/* las relaciones de una empresa: por cada factura y cada anticipo o nota, las posibles y lo que se aplicaría */
function aplEmp(ci){
  let R=APL.cache.get(ci); if(R) return R;
  R={fac:new Map(),doc:new Map()};
  const G=new Map();
  (aplIdx().get(ci)||[]).forEach(r=>{
    const fac=esFacApl(r), lado=fac?ladoFac(r):ladoDoc(r), key=cpKey(r), k=lado+'#'+key;
    let g=G.get(k); if(!g) G.set(k,g={lado,key,rfc:cpRfc(r),f:[],d:[]});
    (fac?g.f:g.d).push(r);
    if(fac) R.fac.set(r,{r,rels:[],apl:[],aplicado:0,queda:r.saldo});
    else R.doc.set(r,{r,rels:[],usado:0,queda:-r.saldo});
  });
  const rels=[]; let nid=0;
  const nueva=(f,docs,tipo)=>{
    const tot=docs.reduce((a,d)=>a-d.saldo,0);
    const rl={id:++nid,fac:f,docs,tipo,tot,dif:Math.abs(tot-f.saldo),dias:Math.max(...docs.map(d=>diasEntre(f.fecha,d.fecha))),
      parte:new Map(),monto:0,on:false,dec:null,quien:null};
    // lo que decidió el contador: aplicada si todas sus parejas lo están; quitada si alguna lo está
    const ds=docs.map(d=>aplDec(f,d));
    if(ds.some(x=>x&&x.e==='quitada')){ rl.dec='quitada'; rl.quien=ds.find(x=>x&&x.e==='quitada'); }
    else if(ds.every(x=>x&&x.e==='aplicada')){ rl.dec='aplicada'; rl.quien=ds[0]; }
    rels.push(rl); R.fac.get(f).rels.push(rl); docs.forEach(d=>R.doc.get(d).rels.push(rl));
    return rl;
  };
  G.forEach(g=>{
    if(!g.f.length||!g.d.length) return;
    g.f.forEach(f=>{
      const c=g.d.map(d=>({d,dif:Math.abs(-d.saldo-f.saldo),dias:diasEntre(f.fecha,d.fecha)}));
      const ex=c.filter(x=>x.dif<=0.01).sort((a,b)=>a.dias-b.dias);
      ex.forEach(x=>nueva(f,[x.d],'auto'));
      const ot=c.filter(x=>x.dif>0.01).sort((a,b)=>a.dif-b.dif||a.dias-b.dias);
      // las 5 más parecidas y, además, las que el contador ya decidió
      ot.forEach((x,i)=>{ if(i<5||aplDec(f,x.d)) nueva(f,[x.d],'sug'); });
      if(!ex.length) aplSumas(f,c).forEach(ds=>nueva(f,ds,'suma'));
    });
  });
  // otro nombre con el mismo RFC genérico: solo con importe exacto, para revisar
  const gen=[...G.values()].filter(g=>RFC_GEN.has(g.rfc));
  gen.forEach(g=>g.f.forEach(f=>gen.forEach(h=>{ if(h===g||h.lado!==g.lado||h.rfc!==g.rfc) return;
    h.d.forEach(d=>{ if(Math.abs(-d.saldo-f.saldo)<=0.01) nueva(f,[d],'rev'); }); })));
  // lo que se aplicaría: lo aceptado, luego lo exacto (uno a uno, por fecha), luego una sugerida por factura y lo de revisar
  const qF=f=>R.fac.get(f), qD=d=>R.doc.get(d), libre=d=>qD(d).usado<0.005, tocada=f=>qF(f).apl.length>0;
  const pon=rl=>{
    let resta=qF(rl.fac).queda;
    rl.docs.forEach(d=>{ const x=qD(d), m=Math.min(x.queda,resta); if(m<=0.005) return;
      rl.parte.set(d,m); x.queda-=m; x.usado+=m; resta-=m; rl.monto+=m; });
    if(rl.monto>0.005){ rl.on=true; const F2=qF(rl.fac); F2.apl.push(rl); F2.aplicado+=rl.monto; F2.queda-=rl.monto; }
  };
  rels.filter(x=>x.dec==='aplicada').sort((a,b)=>a.dias-b.dias).forEach(pon);
  rels.filter(x=>!x.dec&&x.tipo==='auto').sort((a,b)=>a.dias-b.dias).forEach(x=>{ if(!tocada(x.fac)&&x.docs.every(libre)) pon(x); });
  ['sug','rev'].forEach(fase=>R.fac.forEach(F2=>{
    if(F2.apl.length) return;
    const op=F2.rels.filter(x=>!x.dec&&(fase==='rev'?x.tipo==='rev':(x.tipo==='suma'||x.tipo==='sug'))&&x.docs.every(libre))
      .sort((a,b)=>APL_ORD[a.tipo]-APL_ORD[b.tipo]||a.dif-b.dif||a.dias-b.dias);
    if(op.length) pon(op[0]);
  }));
  R.fac.forEach(F2=>{ F2.queda=Math.max(0,F2.queda); F2.est=F2.aplicado>0.005?(F2.queda<=0.01?'cancela':'reduce'):null;
    F2.orden=relsOrden(F2.rels); F2.prim=F2.apl[0]||F2.orden[0]||null; });
  R.doc.forEach(X=>{ X.orden=relsOrden(X.rels); X.prim=X.orden.find(x=>x.on&&x.parte.has(X.r))||X.orden[0]||null; });
  APL.cache.set(ci,R);
  return R;
}
const aplF=r=>esFacApl(r)?(aplEmp(r.cli).fac.get(r)||null):null;
const aplD=r=>esDocApl(r)?(aplEmp(r.cli).doc.get(r)||null):null;

function aplEstados(r){ const X=aplX(r), s=new Set(); if(X) X.rels.forEach(rl=>s.add(relFiltro(rl))); return s; }
function pasaApl(r){

  if(S.aplT.size){ const s=aplEstados(r); if(![...s].some(x=>S.aplT.has(x))) return false; }
  return true;

/* lo que se puede aplicar en un conjunto de documentos: el monto, por lado y cuántas relaciones de cada tipo */
function aplSuma(rows){
  const o={tot:0,c:0,p:0,nf:0,n:{conf:0,acep:0,auto:0,sug:0,rev:0}};
  rows.forEach(r=>{ const F2=aplF(r); if(!F2||F2.aplicado<0.005) return;
    o.tot+=F2.aplicado; if(r.mod===0) o.c+=F2.aplicado; else o.p+=F2.aplicado; o.nf++;
    F2.apl.forEach(rl=>{ o.n[relFiltro(rl)]=(o.n[relFiltro(rl)]||0)+1; }); });
  return o;
}
const yoApl=()=>APL.ok&&!!APL.puede.cambiar&&!(window.PORTAL&&window.PORTAL.consulta);
async function cargaApl(){
  let q; try{ q=await SB.rpc('cartera_apl'); }catch(e){ q={error:e}; }
  if(!q||q.error||!q.data){ APL.ok=false; APL.dec=new Map(); aplLimpia(); return false; }
  const d=q.data; APL.ok=true; APL.puede=d.puede||{}; APL.firma=d.firma||null; APL.dec=new Map();
  (d.rel||[]).forEach(x=>APL.dec.set(x.rfc+'|'+x.parte+'|'+String(x.f).toUpperCase()+'|'+String(x.d).toUpperCase(),{e:x.e,por:x.por,en:x.en}));
  // para reconocer lo que ya se decidió, los folios fiscales de esas empresas
  if(ROWS.length){
    const rs=[...new Set((d.rel||[]).map(x=>x.rfc))].filter(r=>!UUID_OK.has(r)&&(RANGO['k|'+r]||RANGO['p|'+r]));
    if(rs.length){ try{ await cargaUuids(rs); }catch(e){} }
  }
  aplLimpia();
  return true;
}
/* guarda lo que decide el contador. items: [{rl, d, accion}] (d: el anticipo o nota de esa relación) */
async function aplPon(items,txt){
  if(!yoApl()) return;
  const f=items[0].rl.fac;
  const falta=items.some(x=>!x.rl.fac.uuid||!x.d.uuid);
  if(falta){ avisaArriba('Espera a que carguen los folios fiscales y vuelve a intentar.'); return; }
  const p={rfc:rfcDe(f),items:items.map(x=>{ const cp=D.cp[x.rl.fac.cp]||['',''];
    return {parte:x.rl.fac.parte,tipo:x.rl.fac.tipo,rfc_cp:cp[0],contraparte:cp[1],
      fac:x.rl.fac.uuid,doc:x.d.uuid,folio_fac:folioDe(x.rl.fac),folio_doc:folioDe(x.d),accion:x.accion}; })};
  let q; try{ q=await SB.rpc('cartera_apl_pon',{p}); }catch(e){ q={error:e}; }
  if(q.error){ avisaArriba('No se pudo guardar: '+msgErr(q.error)); return; }
  await cargaApl(); render(); if(S.cliente!=null) pintaModal();

    const todos=acc=>rl.docs.map(d=>({rl,d,accion:acc}));

    const solo=()=>{ const it=todos('aplicar'), ya=new Set();

      if(fac) aplF(rl.fac).rels.filter(x=>x!==rl).forEach(x=>x.docs.filter(d=>!rl.docs.includes(d)).forEach(d=>quita(x,d)));
      else aplD(desde).rels.filter(x=>x!==rl&&x.fac!==rl.fac).forEach(x=>quita(x,desde));

let EXJS=null;
function cargaExcelJS(){
  if(window.ExcelJS) return Promise.resolve(window.ExcelJS);
  if(!EXJS) EXJS=new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';
    s.onload=()=>window.ExcelJS?res(window.ExcelJS):rej(new Error('sin generador de Excel'));
    s.onerror=()=>{EXJS=null; rej(new Error('no cargó el generador de Excel'));};

}

  b.title='Todas las empresas con lo filtrado, en el formato del reporte CXC CXP, con una hoja de resumen y otra de saldos de IVA';
  b.onclick=async()=>{
    if(GEN_TXT) return;
    const pon=t=>{ GEN_TXT=t; const x=document.getElementById('xlgen'); if(x){ x.textContent=t||GEN_LAB; x.disabled=!!t; } };
    let fin;
    try{ fin=await exportaGeneral(pon); }
    catch(e){ fin='No se pudo exportar'; const x=document.getElementById('xlgen'); if(x) x.title=String(e&&e.message||e); }
    pon(fin); setTimeout(()=>pon(null),2500);
  };
  return b;
}
function seleccionGeneral(modo){
  if(modo==='estrategia'){
    // todo lo de «Estrategia fiscal» que ve quien lo baja, sin los filtros de la pantalla
    const docs=ROWS.filter(r=>r.st==='estrategia'), ms=new Set(docs.map(r=>r.mod));
    return {docs,mods:ms,hojas:RCX_HOJAS.filter(h=>h.mods.some(m=>ms.has(m)))};
  }
  const docs=ROWS.filter(r=>pasa(r));
  return {docs,mods:S.mod,hojas:RCX_HOJAS.filter(h=>h.mods.some(m=>S.mod.has(m)))};
}
function textoFiltros(modo){
  if(modo==='estrategia') return 'Estatus en la cartera: Estrategia fiscal (todo lo que ves, sin los filtros de la pantalla)';
  const p=['Rubros: '+[...S.mod].sort((a,b)=>a-b).map(i=>MOD_SHORT[i]).join(', ')];
  const nom=(rfc)=>{ const c=D.cli.find(x=>x[2]===rfc); return c?c[1]:rfc; };
  if(S.clis.size) p.push('Cliente: '+[...S.clis].map(nom).join(', '));
  if(S.grupos.size) p.push('Grupo: '+[...S.grupos].join(', '));
  if(S.per.size) p.push('Persona: '+[...S.per].map(k=>k==='F'?'física':k==='M'?'moral':'sin dato').join(', '));
  if(S.reg.size) p.push('Régimen: '+[...S.reg].join(', '));
  if(S.mon.size) p.push('Moneda: '+[...S.mon].join(', '));
  if(S.anios.size) p.push('Año del CFDI: '+[...S.anios].sort().join(', '));
  if(S.mp.size) p.push('Método de pago: '+[...S.mp].map(k=>k==='—'?'sin dato':k).join(', '));
  if(S.pl.size) p.push('Plantilla: '+[...S.pl].map(k=>k==='—'?'sin plantilla':k).join(', '));
  if(S.age4.size) p.push('Antigüedad: '+AGE4.filter(a=>S.age4.has(a.k)).map(a=>a.lab).join(', '));
  if(S.cont.size) p.push('Contador: '+[...S.cont].join(', '));
  p.push('Estatus: '+Object.keys(EST_LAB).filter(k=>S.estc.has(k)).map(k=>EST_LAB[k].toLowerCase()).join(', '));
  if(S.marca.size) p.push('Marca: '+[...S.marca].map(k=>ST_LAB[k]).join(', '));
  if(S.motivo.size) p.push('Motivo: '+[...S.motivo].map(k=>k==='—'?'sin motivo':motivoTxt(k)).join(', '));
  if(S.q) p.push('Búsqueda: «'+S.q+'»');
  return p.join(' · ');
}
/* el orden de la pantalla (encabezado y flecha de la lista de empresas) para el Excel general: cada empresa en el lugar
   que tiene en la pantalla y sus grupos en el orden de su primera empresa */
function rangosPantalla(docs){
  const C=new Map();
  docs.forEach(r=>{ if(!C.has(r.cli)){ const c=D.cli[r.cli]; C.set(r.cli,nuevaEmp(r.cli,c[1],contDe(c))); } sumaEmp(C.get(r.cli),r); });
  const rc=new Map(), rg=new Map();
  [...C.values()].sort(ordEmp).forEach((o,i)=>{ rc.set(o.k,i); const g=D.cli[o.k][3]||'Sin grupo'; if(!rg.has(g)) rg.set(g,i); });
  return {g:x=>rg.get(x||'Sin grupo')??1e9, c:x=>rc.get(x)??1e9};
}

  [['A'+R(4),'Todos los clientes'],['B'+R(4),clientes.length],['C'+R(4),corte],['D'+R(4),docs.length]].forEach(([a,v])=>{
    const x=ws.getCell(a); x.value=v; x.font={name:fuente,size:11};
    x.fill={type:'pattern',pattern:'solid',fgColor:{argb:gris}}; x.alignment={horizontal:'center',vertical:'middle'};
  });
  ws.getCell('C'+R(4)).numFmt='dd/mm/yyyy'; ws.getCell('D'+R(4)).numFmt='#,##0';
  ws.getRow(R(5)).height=5.1;
  for(let i=1;i<=nc;i++) ws.getCell(R(5),i).fill={type:'pattern',pattern:'solid',fgColor:{argb:MK.colores.naranja}};

/* ── hoja «Saldos de IVA» (3-nov-2026, pedido de Fernando con su formato «Saldos IVA por cliente»): por cliente, el IVA
   del saldo (lo pendiente por cobrar o por pagar, la misma cuenta de las tarjetas de IVA: sumaIva/ivaNeto) de los
   documentos que se bajan (los filtros de la pantalla), la estrategia fiscal (el IVA neto de lo marcado «Estrategia
   fiscal», que se resta) y el resultado con fórmulas de Excel: el saldo a favor de periodos anteriores no lo tiene el CRM y
   va en amarillo para capturarlo; al escribirlo se recalcula todo. Abajo, el resumen por grupo (SUMIF de la tabla de
   clientes). Resultado positivo = a cargo; negativo = a favor. ── */
const IVA_MODS=[0,1,4,5];
const IVA_COLS=['Grupo','Cliente','RFC','Contador asignado','IVA trasladado (por cobrar a clientes)','IVA retenido por clientes',
  'IVA acreditable (por pagar a proveedores)','IVA retenido a terceros (por enterar)','IVA notas de crédito proveedores',
  'IVA notas de crédito clientes','Saldo a favor periodos anteriores','Saldo IVA antes de estrategia','Estrategia fiscal',
  'Resultado IVA','IVA a cargo (en contra)','IVA a favor','Estatus','Observaciones',
  // el ISR retenido del saldo (3-nov-2026, pedido de Fernando): al final y solo informa; no entra en ninguna cuenta del IVA
  'ISR retenido por clientes (informativo)','ISR por retener a terceros (informativo)'];
const ivaEstatus=n=>n>0?'A CARGO':n<0?'A FAVOR':'SIN SALDO';
function filasIva(docs){
  const por=new Map();
  docs.forEach(r=>{ if(!IVA_MODS.includes(r.mod)) return; let l=por.get(r.cli); if(!l){ l=[]; por.set(r.cli,l); } l.push(r); });
  const rk=rangosPantalla(docs);
  return [...por.entries()].sort((a,b)=>rk.g(D.cli[a[0]][3])-rk.g(D.cli[b[0]][3])||rk.c(a[0])-rk.c(b[0])).map(([ci,l])=>{
    const c=D.cli[ci], o=sumaIva(l);
    const est=cent(l.reduce((a,r)=>a+(r.st==='estrategia'?ivaNeto(r):0),0));
    const v=[o.tras,o.retC,o.acr,o.retP,o.ntcP,o.ntcC].map(cent);
    const antes=cent(v[0]-v[1]-v[2]+v[3]+v[4]-v[5]), res=cent(antes-est);
    return {g:c[3]||'Sin grupo',nom:c[1],rfc:c[2],cont:contDe(c),v,antes,est,res,isr:[cent(o.isrC),cent(o.isrP)]};
  });
}

    'Estrategia fiscal (naranja): el IVA de lo marcado «Estrategia fiscal», que no se considera y se resta. '+
    'Resultado positivo = a cargo (en contra); negativo = a favor; cada uno va en su columna como monto positivo.');
  nota(R(7),'Saldo antes de estrategia = Trasladado − Retenido por clientes − Acreditable + Retenido a terceros + '+
    'Notas de crédito proveedores − Notas de crédito clientes − Saldo a favor anterior · Resultado = Saldo antes de estrategia − Estrategia fiscal. '+

  const encab=(fila,cols)=>{ const h=ws.getRow(fila); h.height=40;

      x.font={name:fuente,bold:true,color:{argb:'FFFFFFFF'}}; x.fill={type:'pattern',pattern:'solid',fgColor:{argb:azul}};
      x.alignment={horizontal:'center',vertical:'middle',wrapText:true}; }); };
  const st=(n,col)=>'IF('+col+n+'>0,"A CARGO",IF('+col+n+'<0,"A FAVOR","SIN SALDO"))';
  const pinta=(x,arg)=>{ x.fill={type:'pattern',pattern:'solid',fgColor:{argb:arg}}; };
  // por cliente
  const lab=ws.getCell('A'+R(9)); lab.value='Por cliente'; lab.font={name:fuente,bold:true,size:12,color:{argb:azul}};
  const hdr=R(10), p1=hdr+1, p2=hdr+lista.length, ft=p2+1;

      {formula:'L'+n+'-M'+n,result:x.res},{formula:'MAX(N'+n+',0)',result:Math.max(x.res,0)},

    val.forEach((v,i)=>{ const c=row.getCell(i+1); c.value=v; c.font={name:fuente,size:10};

  const tot=i=>cent(lista.reduce((a,x)=>a+[...x.v,0,x.antes,x.est,x.res,Math.max(x.res,0),Math.max(-x.res,0)][i-4],0));

  // por grupo (solo en el Excel general): sale de la tabla de clientes, así que el saldo a favor capturado también suma

      for(let i=1;i<=gcols.length;i++){ const c=row.getCell(i); c.font={name:fuente,size:10};

    rg.getCell(1).value='TOTAL';

async function exportaGeneral(paso,modo){
  const espera=()=>new Promise(r=>setTimeout(r,30));
  paso('Preparando…'); await espera();
  const EX=await cargaExcelJS();
  let sel=seleccionGeneral(modo);
  if(!sel.docs.length||!sel.hojas.length) throw new Error(modo==='estrategia'?'No hay nada marcado como estrategia fiscal':'Ningún documento cumple con los filtros');
  paso('Bajando UUID…'); await espera();
  await cargaUuids([...new Set(sel.docs.map(r=>D.cli[r.cli][2]))]);
  sel=seleccionGeneral(modo);
  const corte=xd(M.generado||iso(TODAY));
  // grupos y clientes en el orden de la pantalla; dentro de cada cliente, por fecha
  const rk=rangosPantalla(sel.docs);
  const orden=(a,b)=>rk.g(D.cli[a.cli][3])-rk.g(D.cli[b.cli][3])||rk.c(a.cli)-rk.c(b.cli)
    ||(a.fecha||'').localeCompare(b.fecha||'')||String(a.quo).localeCompare(String(b.quo));
  const docs=sel.docs.slice().sort(orden);
  const empresas=new Set(docs.map(r=>r.cli)).size;
  const est=modo==='estrategia';
  const wb=window.PROFASE_MARCA.libro(EX,est?'Reporte de estrategia fiscal':'Reporte CXC CXP · general');
  paso('Armando resumen…'); await espera();
  hojaResumen(wb,docs,corte,{modo,mods:sel.mods,titulo:est?'REPORTE DE ESTRATEGIA FISCAL':null});
  paso('Armando saldos de IVA…'); await espera();
  hojaIva(wb,docs,corte,{modo,grupos:true});
  for(const h of sel.hojas){
    paso('Armando '+h.nombre+'…'); await espera();
    hojaRCX(wb,h,null,docs.filter(r=>h.mods.includes(r.mod)),corte,{empresas});
  }
  paso('Guardando archivo…'); await espera();
  const mm=String(TODAY.getMonth()+1).padStart(2,'0');
  const et=sel.hojas.map(h=>h.etq);
  const que=et.length>1?et.slice(0,-1).join(' ')+' y '+et[et.length-1]:et[0];
  return descargaXlsx(wb,(mm+(est?' Reporte estrategia fiscal':' Reporte '+que+' General')).replace(/[\\/:*?"<>|]+/g,' ').replace(/\s+/g,' ').trim()+'.xlsx');
}
</script>
