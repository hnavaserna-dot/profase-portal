<!doctype html><html lang="es" data-rol="todos" data-incrustada="1"><head><meta charset="utf-8"><script>/* Cierre temporal del portal (30-oct-2026, pedido de Daniel cuando la base se trabó: «cierra temporalmente crm»;
   «Saca a todos del CRM con ese aviso y cuando quede ya les avisamos»).
   construir.py lo pone escrito al principio del <head> de cada página que arma (y va a mano en index.html), antes de
   cualquier otro script. Lee cierre.json, que vive en la raíz de profase-portal (no pasa por la base), y si dice
   "cerrado": true detiene la página y lleva a cerrado.html, que avisa y regresa sola al portal en cuanto cierre.json
   diga false. Si la página va en un marco, se lleva a la de arriba. Guarda a dónde iba cada quien para regresarlo ahí.
   Solo en crmprofase.com.mx: en las pruebas locales no hace nada (salvo con window.__PRUEBA_CIERRE).
   Si cierre.json no llega, la página sigue normal. No lee ni escribe nada de la base. */
(function () {
  'use strict';
  if (!/(^|\.)crmprofase\.com\.mx$/.test(location.hostname) && !window.__PRUEBA_CIERRE) return;
  if (/\/cerrado\.html$/.test(location.pathname)) return;
  var j = null;
  try {
    var x = new XMLHttpRequest();
    x.open('GET', '/cierre.json?t=' + Date.now(), false);
    x.send(null);
    if (x.status === 200) j = JSON.parse(x.responseText);
  } catch (e) { j = null; }
  if (!j || j.cerrado !== true) return;
  var w = window;
  try { if (window.top && window.top.location.host === location.host) w = window.top; } catch (e) { w = window; }
  try {
    var r = w.location.pathname + w.location.search + w.location.hash;
    if (!/cerrado\.html/.test(r)) sessionStorage.setItem('profase-regreso', r);
  } catch (e) { /* sin almacenamiento: regresa a la entrada */ }
  try { window.stop(); } catch (e) { /* navegador viejo */ }
  try { w.location.replace('/cerrado.html'); } catch (e) { location.replace('/cerrado.html'); }
})();</script><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Portal PROFASE · Cartera</title><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><script src="js/supabase.js?v=bb37eb706b"></script><script src="js/portal.js?v=3bff98e028"></script><script src="js/marca.js?v=a743a9d941"></script></head><body>

const F={

};
const AGES=[
  {k:'0-30',lo:0,hi:30,lab:'0 a 30 días',c:'0-30 d'},{k:'31-60',lo:31,hi:60,lab:'31 a 60 días',c:'31-60 d'},

];
/* módulo 6 = terceros (TERCERO_GRAL*): informativo, fuera de los anticipos, del neto y de la vista por omisión */
const TER=6, MODS_BASE=[0,1,2,3,4,5];
const MOD_SHORT=['CXC','CXP','ANT CLIEN','ANT PROV','NTC CLIEN','NTC PROV','TERCEROS'];
const MOD_VAR=['--cli','--prov','--cli-2','--prov-2','--cli-3','--prov-3','--ink-3'];
const ES_CLI=[true,false,true,false,true,false,false];
const FAM={todos:MODS_BASE,fac:[0,1],ant:[2,3],ntc:[4,5],ter:[TER]};
const FAM_LAB=[['todos','Todos'],['fac','Facturas'],['ant','Anticipos'],['ntc','Notas de crédito'],['ter','Terceros']];
const LADO={todos:[0,1,2,3,4,5,TER],cli:[0,2,4,TER],prov:[1,3,5,TER]};
const DOC_IC=['F','F','A','A','N','N','T'];
const modLab=i=>(M.modLab&&M.modLab[i])||(i===TER?'Terceros (informativo)':MOD_SHORT[i]);
const vistaParcial=()=>!(S.mod.size===MODS_BASE.length&&!S.mod.has(TER));
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const WD=['L','M','M','J','V','S','D'];
const FP={'01':'Efectivo','02':'Cheque nominativo','03':'Transferencia','04':'Tarjeta de crédito',
 '05':'Monedero electrónico','06':'Dinero electrónico','08':'Vales de despensa','12':'Dación en pago',
 '15':'Condonación','17':'Compensación','23':'Novación','28':'Tarjeta de débito',
 '29':'Tarjeta de servicios','30':'Aplicación de anticipos','31':'Intermediario de pagos','99':'Por definir'};
const AVC=['#014f8e','#3183ce','#e8781f','#6b5ca5','#1d7a4f','#9a6a00','#a33224','#2d6a7e'];

const REGF={601:'General de Ley PM',603:'PM con fines no lucrativos',605:'Sueldos y salarios',606:'Arrendamiento',
 607:'Enajenación de bienes',608:'Demás ingresos',610:'Residentes en el extranjero',611:'Dividendos',
 612:'PF Actividad Empresarial',614:'Intereses',616:'Sin obligaciones fiscales',620:'Cooperativas de producción',
 621:'Incorporación Fiscal',622:'Actividades agrícolas',623:'Opcional grupos de sociedades',624:'Coordinados',
 625:'Plataformas tecnológicas',626:'RESICO'};

let M=null,D=null,ROWS=[],TODAY=new Date();
const S={vista:'res',q:'',mod:new Set(MODS_BASE),mp:new Set(['PUE','PPD','—']),est:new Set(['Vigente']),
  age:new Set(AGES.map(a=>a.k)),mon:new Set(['MXN','USD','EUR','GBP']),cont:new Set(),reg:new Set(),soloAlerta:false,
  desde:'',hasta:'',sort:'saldo',dir:-1,grupo:null,cliente:null,doc:null,corte:null,tab:'todos',lado:'todos',
  calMes:null,calPick:0};

const el=(t,c,x)=>{const n=document.createElement(t); if(c)n.className=c; if(x!=null)n.textContent=x; return n;};
const days=iso=>{if(!iso) return null; const d=new Date(iso+'T00:00:00'); return Math.floor((TODAY-d)/864e5);};
const ageKey=d=>d==null?null:(AGES.find(a=>d>=a.lo&&d<=a.hi)||AGES[AGES.length-1]).k;
const dic=(k,i)=>(i==null||!D.dic[k])?null:(D.dic[k][i]||null);
const plural=(n,s,p)=>F.int.format(n)+' '+(n===1?s:p);
function iniciales(s){
  const w=String(s||'').replace(/[^A-Za-zÁÉÍÓÚÑáéíóúñ ]/g,' ').trim().split(/\s+/).filter(Boolean);
  return ((w[0]||'?')[0]+(w[1]?w[1][0]:'')).toUpperCase();
}
function colorDe(s){let h=0; for(const c of String(s||'')) h=(h*31+c.charCodeAt(0))>>>0; return AVC[h%AVC.length];}
function entidad(nombre,sub){
  const d=el('div','ent'); const a=el('span','av',iniciales(nombre));
  a.style.background=colorDe(nombre); d.appendChild(a);
  const t=el('div','tx'); t.appendChild(el('div','t1',nombre||'—'));
  if(sub) t.appendChild(el('div','t2',sub));
  d.appendChild(t); return d;
}
function chipContador(nom,extra){
  const c=el('span','ct'); const a=el('span','av',iniciales(nom));
  a.style.background=colorDe(nom); c.appendChild(a);
  c.appendChild(el('b',null,nom));
  if(extra) c.appendChild(el('span','n',extra));
  return c;
}
const fmtD=s=>{if(!s)return '—'; const d=new Date(s+'T00:00:00');
  return d.toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'});};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fallo=e=>{document.getElementById('vista').innerHTML='<div class="empty">No se pudieron cargar los datos. '+String(e).replace(/[<>&]/g,'')+'</div>';};


/* ── Datos: colección «cartera» de la base del portal ──
   La actualización del portal (cada 3 horas y con el botón «Actualizar») lee el Tablero QUO directo de
   PorfaseDBSolutions y deja un documento por cliente (k|RFC) y sus UUID aparte (u|RFC). La base decide qué
   clientes ve cada quien. Esta página guarda en el navegador lo que ya bajó y solo trae los clientes que cambiaron. */
const COLS_K=['mod','cp','saldo','total','fecha','mp','est','tipo','quo','mon','tc','tme','cta','cl','fp','regf','ser','folio','pl','ver',
  'sub','iva','ivaret','isrret','ter','mif','rol','cc','proy','conta','cic','ieps','dsc'];
const DIC_K=['mon','cl','ver','ser','cta','fp','pl','rol','cc','proy'];
let SB=null, YO=null, ALCANCE=null, META=null, RANGO={}, UUID_OK=new Set(), K_FIRMA={};
async function desb64(b64){
  const r=await fetch('data:application/octet-stream;base64,'+b64);
  const s=r.body.pipeThrough(new DecompressionStream('gzip'));
  return JSON.parse(await new Response(s).text());
}
/* lo ya bajado se guarda en este navegador por usuario y firma; si entra otra persona, se borra */
const CACHE=(()=>{
  let p=null;
  const abre=()=>p||(p=new Promise((res,rej)=>{
    const r=indexedDB.open('portal-cartera',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('docs');
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  }));
  const tx=async(modo,fn)=>{ try{ const db=await abre(); return await new Promise(res=>{
    const t=db.transaction('docs',modo), st=t.objectStore('docs'); let out; const q=fn(st);
    if(q) q.onsuccess=()=>{out=q.result;}; t.oncomplete=()=>res(out); t.onerror=()=>res(undefined); t.onabort=()=>res(undefined); }); }
    catch(e){ return undefined; } };
  return {
    get:k=>tx('readonly',st=>st.get(k)),
    set:(k,v)=>tx('readwrite',st=>st.put(v,k)),
    borra:()=>tx('readwrite',st=>st.clear())
  };
})();
async function cacheDe(id,firma){ const c=await CACHE.get(id); return c&&c.firma===firma?c.obj:null; }
async function bajaDocs(ids){
  const out={};
  for(let i=0;i<ids.length;i+=12){
    const lote=ids.slice(i,i+12);
    const q=await SB.from('docs').select('id,data').eq('col','cartera').in('id',lote);
    if(q.error) throw q.error;
    for(const x of q.data||[]) out[x.id]=x.data;
  }
  return out;
}
async function firmas(pref){
  const q=await SB.from('docs').select('id,firma:data->>firma').eq('col','cartera').like('id',pref+'|%');
  if(q.error) throw q.error;
  const o={}; (q.data||[]).forEach(x=>{ o[x.id]=x.firma; }); return o;
}
/* arma M y D con el mismo formato que usaba la página «Cartera SQL» (un renglón por documento) */
async function cargaCartera(avance){
  const m=await SB.from('docs').select('data').eq('col','cartera').eq('id','meta').maybeSingle();
  if(m.error) throw m.error;
  if(!m.data) return null;
  META=m.data.data;
  // k|RFC: lo que ve quien tiene ese cliente; p|RFC: lo que solo ve la dirección (la base no se lo da a nadie más)
  const fs=Object.assign(await firmas('k'), YO&&YO.rol==='director'?await firmas('p'):{});
  const ids=Object.keys(fs).sort();
  const objs={}, faltan=[];
  for(const id of ids){ const o=await cacheDe(id,fs[id]); if(o) objs[id]=o; else faltan.push(id); }
  let hechos=ids.length-faltan.length; avance&&avance(hechos,ids.length);
  for(let i=0;i<faltan.length;i+=12){
    const lote=faltan.slice(i,i+12), docs=await bajaDocs(lote);
    for(const id of lote){
      const d=docs[id]; if(!d) continue;
      const o=await desb64(d.b64); objs[id]=o;
      CACHE.set(id,{firma:d.firma,obj:o});
      fs[id]=d.firma;
    }
    hechos+=lote.length; avance&&avance(hechos,ids.length);
  }
  const cont=[], ixC={}, gx=(arr,ix,v)=>{ if(v==null) return null; if(!(v in ix)){ ix[v]=arr.length; arr.push(v);} return ix[v]; };
  const regs=META.regimenes.slice(), procs=META.procesos.slice(), ixR={}, ixP={};
  regs.forEach((r,i)=>ixR[r]=i); procs.forEach((p,i)=>ixP[p]=i);
  const dic={}, ixD={}; DIC_K.forEach(k=>{ dic[k]=[]; ixD[k]={}; }); dic.mon.push('MXN'); ixD.mon.MXN=0;
  const cli=[], cp=[], f=[]; RANGO={}; UUID_OK=new Set(); K_FIRMA={};
  const ci={}; COLS_K.forEach((c,i)=>ci[c]=i);
  const cliIx={};
  for(const id of ids){
    const o=objs[id]; if(!o) continue;
    const c=o.cli, off=cp.length, rfc=c[1];
    let n=cliIx[rfc];
    if(n==null){ n=cliIx[rfc]=cli.length;
      cli.push([c[0],c[0],rfc,c[2],(c[3]||[]).map(x=>gx(cont,ixC,x)),c[4]==null?null:gx(regs,ixR,c[4]),(c[5]||[]).map(x=>gx(procs,ixP,x)),c[6]||'']); }
    for(const x of o.cp) cp.push(x);
    const loc={}; DIC_K.forEach(k=>{ loc[k]=(o.dic[k]||[]).map(v=>gx(dic[k],ixD[k],v)); });
    const ini=f.length;
    for(const r of o.f){
      const d=k=>{ const v=r[ci[k]]; return v==null?null:loc[k][v]; };
      f.push([n,r[ci.mod],off+r[ci.cp],r[ci.saldo],r[ci.total],r[ci.fecha],r[ci.mp],r[ci.est],r[ci.tipo],'',r[ci.quo],d('mon'),r[ci.tc],r[ci.tme],
        d('cta'),d('cl'),d('fp'),r[ci.regf],d('ser'),r[ci.folio],d('pl'),d('ver'),r[ci.sub],r[ci.iva],r[ci.ivaret],r[ci.isrret],r[ci.ter],r[ci.mif],d('rol'),
        d('cc'),d('proy'),r[ci.conta],r[ci.cic],r[ci.ieps],r[ci.dsc]]);
    }
    RANGO[id]=[ini,f.length]; K_FIRMA[id]=fs[id];
  }
  const meta={generado:META.generado,hora:META.hora,fuente:META.fuente,modLab:META.modLab,refreshedAt:META.refreshedAt,
    id:META.refreshedAt+'|'+ids.map(i=>fs[i]).join(','),contadores:cont,regimenes:regs,procesos:procs};
  return {meta,filas:f,extra:{cli,cp,dic,mp:META.mp,est:META.est,tipo:META.tipo}};
}
/* los UUID de un cliente (o de todos) se bajan la primera vez que hacen falta; van en u|RFC (y q|RFC para p|RFC) */
const uDe=id=>(id[0]==='k'?'u':'q')+id.slice(1);
async function cargaUuids(rfcs){
  const ids=[];
  rfcs.forEach(r=>{ if(!UUID_OK.has(r)) ['k|','p|'].forEach(t=>{ if(RANGO[t+r]) ids.push(t+r); }); });
  if(!ids.length) return false;
  const objs={}, faltan=[];
  for(const id of ids){ const o=await cacheDe(uDe(id),K_FIRMA[id]); if(o) objs[id]=o; else faltan.push(id); }
  if(faltan.length){
    const docs=await bajaDocs(faltan.map(uDe));
    for(const id of faltan){ const d=docs[uDe(id)]; if(!d||d.firma!==K_FIRMA[id]) continue;
      const o=await desb64(d.b64); objs[id]=o; CACHE.set(uDe(id),{firma:d.firma,obj:o}); }
  }
  let viejo=false; const listos=new Set();
  for(const id of ids){
    const u=objs[id], [a,b]=RANGO[id];
    // si los UUID ya son de una actualización más nueva que la del cliente, se recarga todo
    if(!u||u.length!==b-a){ viejo=true; continue; }
    for(let i=a;i<b;i++){ ROWS[i].uuid=u[i-a]||''; D.f[i][9]=ROWS[i].uuid; }
    listos.add(id);
  }
  rfcs.forEach(r=>{ if(['k|','p|'].every(t=>!RANGO[t+r]||listos.has(t+r))) UUID_OK.add(r); });
  if(viejo) setTimeout(()=>arranca(true).catch(()=>{}),0);
  return true;
}

    return {cli:r[0],mod:r[1],cp:r[2],saldo:r[3],total:r[4],fecha:r[5],alerta,
      mp:D.mp[r[6]],est:D.est[r[7]],tipo:D.tipo[r[8]],uuid:r[9]||'',quo:String(r[10]||''),
      dias:dd,age:ageKey(dd),grupo:c[3],cliNom:c[1],
      cont:(c[4]||[]).map(i=>M.contadores[i]),
      reg:(c[5]==null?null:M.regimenes[c[5]]),
      proc:(c[6]||[]).map(i=>M.procesos[i]),
      mon:dic('mon',r[11])||'MXN',tc:r[12],tme:r[13],
      cta:dic('cta',r[14]),cl:dic('cl',r[15]),fp:dic('fp',r[16]),regf:r[17],
      serie:dic('ser',r[18]),folio:r[19]||'',pl:dic('pl',r[20]),ver:dic('ver',r[21]),
      sub:r[22],iva:r[23],ivaret:r[24],isrret:r[25],ter:r[26]===1,
      mif:r[27]||null,rol:dic('rol',r[28]),
      // lo que antes se subía con el Excel del Tablero QUO y ya viene de la base
      cc:dic('cc',r[29]),proy:dic('proy',r[30]),conta:r[31]===1,cic:r[32]||null,ieps:r[33],dsc:r[34]};
  });
  const fs=ROWS.map(r=>r.fecha).filter(Boolean).sort();
  const min0=D._min, max0=D._max;
  D._min=fs[0]||'2019-01-01'; D._max=fs[fs.length-1]||iso(TODAY);

  }

function pasa(r,conMod){
  if(conMod&&r.mod!==TER&&!S.mod.has(r.mod)) return false;
  if(!S.est.has(r.est==='—'?'Vigente':r.est)) return false;
  if((r.mod===0||r.mod===1)&&!S.mp.has(r.mp)) return false;
  if(r.age&&!S.age.has(r.age)) return false;
  if(!S.mon.has(r.mon)) return false;
  if(r.fecha&&(r.fecha<S.desde||r.fecha>S.hasta)) return false;
  if(S.cont.size&&!r.cont.some(c=>S.cont.has(c))) return false;
  if(S.reg.size&&!(r.reg&&S.reg.has(r.reg))) return false;
  if(S.soloAlerta&&!r.alerta) return false;
  if(S.q){
    const cp=D.cp[r.cp], q=S.q;
    let ok=(cp[1]||'').toLowerCase().includes(q)||(cp[0]||'').toLowerCase().includes(q)
      ||r.uuid.toLowerCase().includes(q)||r.quo.includes(q)||r.cliNom.toLowerCase().includes(q);
    if(!ok) ok=((r.serie||'')+(r.folio||'')).toLowerCase().includes(q)||(r.folio||'').toLowerCase().includes(q);
    if(!ok) ok=[r.cc,r.proy,r.cta].some(x=>x&&String(x).toLowerCase().includes(q));
    if(!ok) return false;
  }
  return true;
}

function ord(a,b){
  const k=S.sort; let res;
  if(k==='nom') res=String(a.nom||'').localeCompare(String(b.nom||''),'es');
  else if(k.startsWith('m')&&k.length===2){const i=+k[1]; res=(a.m[i]??0)<(b.m[i]??0)?-1:(a.m[i]??0)>(b.m[i]??0)?1:0;}
  else {const av=a[k]??0,bv=b[k]??0; res=av<bv?-1:av>bv?1:0;}
  return S.dir===-1?-res:res;
}

const flotante=()=>window.innerWidth>=820;

  catch(e){ return {mini:false,max:false}; } })();
const guardaVen=()=>{ try{ localStorage.setItem('cartera.ventana',JSON.stringify(VEN)); }catch(e){} };
function colocaVentana(m){
  const W=window.innerWidth, H=window.innerHeight;
  if(VEN.max){ Object.assign(m.style,{left:'8px',top:'8px',width:(W-16)+'px',height:(H-16)+'px'}); return; }
  const w=Math.min(Math.max(VEN.w||Math.min(1240,W-32),480),W), h=Math.min(Math.max(VEN.h||Math.round(H*.88),260),H);
  const x=VEN.x==null?W-w-16:VEN.x, y=VEN.y==null?Math.round((H-h)/2):VEN.y;
  // que siempre quede a la vista al menos el encabezado
  Object.assign(m.style,{width:w+'px',height:h+'px',
    left:Math.min(Math.max(x,120-w),W-120)+'px',top:Math.min(Math.max(y,0),H-60)+'px'});
}
function arrastre(m){
  m.addEventListener('pointerdown',e=>{
    if(VEN.max||e.button!==0||!e.target.closest('.mh')||e.target.closest('button,input,a,select,label')) return;
    const x0=e.clientX, y0=e.clientY, l0=m.offsetLeft, t0=m.offsetTop;
    const mueve=ev=>{ m.style.left=(l0+ev.clientX-x0)+'px'; m.style.top=Math.max(0,t0+ev.clientY-y0)+'px'; };
    const suelta=()=>{ window.removeEventListener('pointermove',mueve); window.removeEventListener('pointerup',suelta);
      VEN.x=m.offsetLeft; VEN.y=m.offsetTop; colocaVentana(m); guardaVen(); };
    window.addEventListener('pointermove',mueve); window.addEventListener('pointerup',suelta);
    e.preventDefault();
  });
  // el tamaño que deja el usuario al estirar desde la esquina
  let t; new ResizeObserver(()=>{ if(VEN.max||VEN.mini||!m.isConnected) return;
    clearTimeout(t); t=setTimeout(()=>{ VEN.w=m.offsetWidth; VEN.h=m.offsetHeight; guardaVen(); },250); }).observe(m);
}

let EXJS=null;
function cargaExcelJS(){
  if(window.ExcelJS) return Promise.resolve(window.ExcelJS);
  if(!EXJS) EXJS=new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';
    s.onload=()=>window.ExcelJS?res(window.ExcelJS):rej(new Error('sin generador de Excel'));
    s.onerror=()=>{EXJS=null; rej(new Error('no cargó el generador de Excel'));};
    document.head.appendChild(s);
  });
  return EXJS;
}

    x.alignment={horizontal:'center',vertical:'middle',wrapText:true}; }
  const fmt={'TOTAL CFDI':RCX_MON,'SALDO CFDI':RCX_MON,'Saldo':RCX_MON,'Total':RCX_MON,
    'FECHA CFDI':'dd/mm/yyyy hh:mm','FechaCancelacion':'dd/mm/yyyy hh:mm','Fecha':'dd/mm/yyyy hh:mm','satTQ_MiFecha':'dd/mm/yyyy',
    'DIAS DE ATRASO':'0','Días de Atraso':'0'};
  const centro=new Set(['QUO ID','Id','Version xml','FECHA CFDI','Fecha','DIAS DE ATRASO','Días de Atraso','MÉTODO DE PAGO',
    'Tipo de Comprobante','Tipo','TIPO','satTQ_MiFecha']);
  for(let n=R(7);n<R(7)+Math.max(1,filas.length);n++){
    const row=ws.getRow(n);
    cols.forEach((k,i)=>{ const x=row.getCell(i+1); x.font={name:fuente,size:10};
      if(fmt[k]) x.numFmt=fmt[k]; if(centro.has(k)) x.alignment={horizontal:'center'}; });
  }
  ws.views=[{state:'frozen',ySplit:R(6)}];
  MK.impresion(ws,{repetir:R(6)});
}
/* exporta exactamente lo que muestra la ventana del cliente: pestaña (Todos, Facturas, Anticipos, Notas de crédito,
   Terceros), lado (Clientes / Proveedores) y los filtros de la ventana (contraparte, saldo, estatus, días) */
function seleccionRCX(ci){
  const mods=FAM[S.tab].filter(m=>LADO[S.lado].includes(m));
  const docs=ROWS.filter(r=>r.cli===ci&&pasa(r,true)&&mods.includes(r.mod)&&pasaMF(r));
  return {mods,docs,hojas:RCX_HOJAS.filter(h=>h.mods.some(m=>mods.includes(m)))};
}
async function exportaReporteCxcCxp(ci){
  const EX=await cargaExcelJS();
  await cargaUuids([D.cli[ci][2]]);
  const c=D.cli[ci], sel=seleccionRCX(ci);
  if(!sel.hojas.length) throw new Error('No hay nada seleccionado para exportar');
  const orden=(a,b)=>(a.fecha||'').localeCompare(b.fecha||'')||String(a.quo).localeCompare(String(b.quo));
  const corte=xd(M.generado||iso(TODAY));
  const wb=window.PROFASE_MARCA.libro(EX,'Reporte CXC CXP · '+c[1]);
  sel.hojas.forEach(h=>hojaRCX(wb,h,c,sel.docs.filter(r=>h.mods.includes(r.mod)).sort(orden),corte));
  const mm=String(TODAY.getMonth()+1).padStart(2,'0');
  const et=sel.hojas.map(h=>h.etq);
  const que=et.length>1?et.slice(0,-1).join(' ')+' y '+et[et.length-1]:et[0];
  const nombre=(mm+' Reporte '+que+' '+c[1]).replace(/[\\/:*?"<>|]+/g,' ').replace(/\s+/g,' ').trim()+'.xlsx';
  return descargaXlsx(wb,nombre);
}
// con PROFASE_MARCA.guardar(): el mismo libro sale en Excel o, con su botón «PDF» al lado, en PDF (siempre juntos)
async function descargaXlsx(wb,nombre){
  try{ await window.PROFASE_MARCA.guardar(wb,nombre); return 'Descargado ✓'; }
  catch(e){ if(e&&e.code==='declined') return 'Descarga cancelada'; throw e; }
}
/* ── reporte general: todos los grupos y todos los clientes que ve el usuario, con los filtros de la pantalla
   principal (rubros, periodo, contador, más filtros y búsqueda; el grupo abierto no cuenta). Mismas hojas que el
   reporte de cada cliente, con el grupo y el cliente en cada renglón, y una hoja «Resumen» por grupo y por cliente ── */
let GEN_TXT=null;
const GEN_LAB='Exportar a Excel · general';
function botonGeneral(){
  const b=el('button','minibtn xlgen',GEN_TXT||GEN_LAB); b.type='button'; b.id='xlgen'; b.disabled=!!GEN_TXT; b.setAttribute('data-excel',GEN_LAB);
  b.title='Descarga en Excel todos los grupos y todas las empresas, con los filtros de esta pantalla, '+
    'en el formato del reporte CXC CXP y con una hoja de resumen';
  b.onclick=async()=>{
    if(GEN_TXT) return;
    const pon=t=>{ GEN_TXT=t; const x=document.getElementById('xlgen'); if(x){ x.textContent=t||GEN_LAB; x.disabled=!!t; } };
    let fin;
    try{ fin=await exportaGeneral(pon); }
    catch(e){ fin='No se pudo exportar'; const x=document.getElementById('xlgen'); if(x) x.title=String(e&&e.message||e); }
    pon(fin); setTimeout(()=>pon(null),2500);
  };
  return b;
}
function seleccionGeneral(){
  const docs=ROWS.filter(r=>S.mod.has(r.mod)&&pasa(r,false));
  return {docs,hojas:RCX_HOJAS.filter(h=>h.mods.some(m=>S.mod.has(m)))};
}
function textoFiltros(){
  const p=['Rubros: '+[...S.mod].sort((a,b)=>a-b).map(i=>MOD_SHORT[i]).join(', ')];
  p.push('Periodo del CFDI: '+((S.desde===D._min&&S.hasta===D._max)?'todo el histórico':fmtD(S.desde)+' a '+fmtD(S.hasta)));
  if(S.cont.size) p.push('Contador: '+[...S.cont].join(', '));
  if(S.mp.size<3) p.push('Método de pago: '+[...S.mp].map(k=>k==='—'?'sin dato':k).join(', '));
  p.push('Estatus: '+([...S.est].join(', ')||'ninguno'));
  if(S.mon.size<D.monedas.length) p.push('Moneda: '+[...S.mon].join(', '));
  if(S.age.size<AGES.length) p.push('Antigüedad: '+AGES.filter(a=>S.age.has(a.k)).map(a=>a.c).join(', '));
  if(S.reg.size) p.push('Régimen: '+[...S.reg].join(', '));
  if(S.soloAlerta) p.push('Sólo saldo mayor al total del CFDI');
  if(S.q) p.push('Búsqueda: «'+S.q+'»');
  return p.join(' · ');
}
// saldos por grupo y por cliente, con las mismas cuentas que la tabla de la pantalla
function hojaResumen(wb,docs,corte){
  const MK=window.PROFASE_MARCA;
  const ws=wb.addWorksheet('Resumen');
  const azul=MK.colores.azul, gris='FFE7EBF0', fuente=MK.fuente;
  const MV=MOD_SHORT.map((l,i)=>i).filter(i=>S.mod.has(i));
  const neto=m=>m.reduce((a,v,i)=>i===TER?a:a+(ES_CLI[i]?v:-v),0);
  const nuevo=()=>({m:MOD_SHORT.map(()=>0),n:0,vieja:0,hijos:new Set(),cps:new Set(),cont:new Set()});
  const porG=new Map(), porC=new Map();
  docs.forEach(r=>{
    const c=D.cli[r.cli], g=c[3]||'Sin grupo';
    if(!porG.has(g)) porG.set(g,Object.assign(nuevo(),{nom:g}));
    if(!porC.has(r.cli)) porC.set(r.cli,Object.assign(nuevo(),{g,nom:c[1],rfc:c[2]}));
    [porG.get(g),porC.get(r.cli)].forEach(o=>{
      o.m[r.mod]+=r.saldo; o.n++; if(r.dias!=null&&r.dias>o.vieja) o.vieja=r.dias;
      o.hijos.add(r.cli); o.cps.add(r.cp); r.cont.forEach(x=>o.cont.add(x));
    });
  });
  const es=(a,b)=>String(a).localeCompare(String(b),'es');
  const grupos=[...porG.values()].sort((a,b)=>es(a.nom,b.nom));
  const clientes=[...porC.values()].sort((a,b)=>es(a.g,b.g)||es(a.nom,b.nom));
  const nc=4+MV.length+3;
  [26,48,16,40].concat(MV.map(()=>17),[18,10,14]).forEach((w,i)=>ws.getColumn(i+1).width=w);
  // marca PROFASE arriba (js/marca.js); el resumen conserva su forma, recorrido o renglones
  const o=MK.encabezado(wb,ws,nc)-1, R=n=>n+o;
  ws.mergeCells('A'+R(1)+':B'+R(1));
  const t=ws.getCell('A'+R(1)); t.value='RESUMEN DE CARTERA'; t.font={name:fuente,bold:true,size:14,color:{argb:azul}};
  ws.getRow(R(1)).height=21;
  const fl=ws.getCell('A'+R(2)); fl.value='Filtros: '+textoFiltros();
  fl.font={name:fuente,italic:true,size:9,color:{argb:'FF808080'}};
  [['A'+R(3),'Alcance'],['B'+R(3),'Empresas'],['C'+R(3),'Fecha Corte'],['D'+R(3),'Documentos']].forEach(([a,v])=>{
    const x=ws.getCell(a); x.value=v; x.font={name:fuente,bold:true,size:10,color:{argb:azul}};
    x.fill={type:'pattern',pattern:'solid',fgColor:{argb:gris}}; x.border={bottom:{style:'thin',color:{argb:azul}}};
    x.alignment={horizontal:'center',vertical:'middle'};
  });
  [['A'+R(4),'Todos los clientes'],['B'+R(4),clientes.length],['C'+R(4),corte],['D'+R(4),docs.length]].forEach(([a,v])=>{
    const x=ws.getCell(a); x.value=v; x.font={name:fuente,size:11};
    x.fill={type:'pattern',pattern:'solid',fgColor:{argb:gris}}; x.alignment={horizontal:'center',vertical:'middle'};
  });
  ws.getCell('C'+R(4)).numFmt='dd/mm/yyyy'; ws.getCell('D'+R(4)).numFmt='#,##0';
  ws.getRow(R(5)).height=5.1;
  for(let i=1;i<=nc;i++) ws.getCell(R(5),i).fill={type:'pattern',pattern:'solid',fgColor:{argb:MK.colores.naranja}};
  const fin=['Neto','Docs','Más antiguo (días)'], ENT=new Set(['Clientes','Contrapartes']);
  const tabla=(fila,nombre,lab,cab,list,celdas)=>{
    const s=ws.getCell(fila,1); s.value=lab; s.font={name:fuente,bold:true,size:12,color:{argb:azul}};
    const hdr=fila+1, cols=cab.concat(MV.map(i=>MOD_SHORT[i]),fin);
    ws.addTable({name:nombre,ref:'A'+hdr,headerRow:true,totalsRow:true,style:{theme:'TableStyleMedium2',showRowStripes:true},
      columns:cols.map((n,i)=>i===0?{name:n,filterButton:true,totalsRowLabel:'Total'}
        :{name:n,filterButton:true,totalsRowFunction:i<cab.length?'none':n==='Más antiguo (días)'?'max':'sum'}),
      rows:list.map(o=>celdas(o).concat(MV.map(i=>o.m[i]),[neto(o.m),o.n,o.vieja||null]))});
    const h=ws.getRow(hdr); ws.getRow(hdr).height=27.95;
    for(let i=1;i<=cols.length;i++){ const x=h.getCell(i);
      x.font={name:fuente,bold:true,color:{argb:'FFFFFFFF'}}; x.fill={type:'pattern',pattern:'solid',fgColor:{argb:azul}};
      x.alignment={horizontal:'center',vertical:'middle',wrapText:true}; }
    for(let n=hdr+1;n<=hdr+list.length+1;n++){ const row=ws.getRow(n);
      cols.forEach((k,i)=>{ const x=row.getCell(i+1);
        if(i>=cab.length&&i<cols.length-2) x.numFmt=RCX_MON;
        else if(i>=cols.length-2||ENT.has(k)) x.numFmt='#,##0';
        x.font=n===hdr+list.length+1?{name:fuente,bold:true}:{name:fuente,size:10}; }); }
    return hdr+list.length+1;
  };
  let f=tabla(R(7),'TablaGrupos','Por grupo',['Grupo','Clientes','Contrapartes','Contadores asignados'],grupos,
    o=>[o.nom,o.hijos.size,o.cps.size,[...o.cont].join(', ')]);
  tabla(f+3,'TablaClientes','Por cliente',['Grupo','Cliente','RFC','Contador asignado'],clientes,
    o=>[o.g,o.nom,o.rfc,[...o.cont].join(', ')]);
  ws.views=[{state:'frozen',ySplit:R(5)}];
  MK.impresion(ws);
}
async function exportaGeneral(paso){
  const espera=()=>new Promise(r=>setTimeout(r,30));
  paso('Preparando…'); await espera();
  const EX=await cargaExcelJS();
  let sel=seleccionGeneral();
  if(!sel.docs.length||!sel.hojas.length) throw new Error('Ningún documento cumple con los filtros');
  paso('Bajando UUID…'); await espera();
  await cargaUuids([...new Set(sel.docs.map(r=>D.cli[r.cli][2]))]);
  sel=seleccionGeneral();
  const corte=xd(M.generado||iso(TODAY));
  const es=(a,b)=>String(a||'').localeCompare(String(b||''),'es');
  const orden=(a,b)=>{ const x=D.cli[a.cli], y=D.cli[b.cli];
    return es(x[3],y[3])||es(x[1],y[1])||(a.fecha||'').localeCompare(b.fecha||'')||String(a.quo).localeCompare(String(b.quo)); };
  const docs=sel.docs.slice().sort(orden);
  const empresas=new Set(docs.map(r=>r.cli)).size;
  const wb=window.PROFASE_MARCA.libro(EX,'Reporte CXC CXP · general');
  paso('Armando resumen…'); await espera();
  hojaResumen(wb,docs,corte);
  for(const h of sel.hojas){
    paso('Armando '+h.nombre+'…'); await espera();
    hojaRCX(wb,h,null,docs.filter(r=>h.mods.includes(r.mod)),corte,{empresas});
  }
  paso('Guardando archivo…'); await espera();
  const mm=String(TODAY.getMonth()+1).padStart(2,'0');
  const et=sel.hojas.map(h=>h.etq);
  const que=et.length>1?et.slice(0,-1).join(' ')+' y '+et[et.length-1]:et[0];
  return descargaXlsx(wb,(mm+' Reporte '+que+' General').replace(/[\\/:*?"<>|]+/g,' ').replace(/\s+/g,' ').trim()+'.xlsx');
}
</script>
