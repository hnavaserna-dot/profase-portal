<!doctype html><html lang="es" data-rol="todos" data-incrustada="1"><head><meta charset="utf-8"><script>/* Cierre temporal del portal (30-oct-2026, pedido de Daniel cuando la base se trabó: «cierra temporalmente crm»;
   «Saca a todos del CRM con ese aviso y cuando quede ya les avisamos»).
   construir.py lo pone escrito al principio del <head> de cada página que arma (y va a mano en index.html), antes de
   cualquier otro script. Lee cierre.json, que vive en la raíz de profase-portal (no pasa por la base), y si dice
   "cerrado": true detiene la página y lleva a cerrado.html, que avisa y regresa sola al portal en cuanto cierre.json
   diga false. Si la página va en un marco, se lleva a la de arriba. Guarda a dónde iba cada quien para regresarlo ahí.
   Solo en crmprofase.com.mx: en las pruebas locales no hace nada (salvo con window.__PRUEBA_CIERRE).
   Si cierre.json no llega, la página sigue normal. No lee ni escribe nada de la base. */
(function () {
  'use strict';
  if (!/(^|\.)crmprofase\.com\.mx$/.test(location.hostname) && !window.__PRUEBA_CIERRE) return;
  if (/\/cerrado\.html$/.test(location.pathname)) return;
  var j = null;
  try {
    var x = new XMLHttpRequest();
    x.open('GET', '/cierre.json?t=' + Date.now(), false);
    x.send(null);
    if (x.status === 200) j = JSON.parse(x.responseText);
  } catch (e) { j = null; }
  if (!j || j.cerrado !== true) return;
  // «hasta» (2-nov-2026, Daniel: «no dejes ingresar al sistema hasta las nueve A.M.»): a esa hora abre solo
  if (j.hasta && !isNaN(Date.parse(j.hasta)) && Date.now() >= Date.parse(j.hasta)) return;
  var w = window;
  try { if (window.top && window.top.location.host === location.host) w = window.top; } catch (e) { w = window; }
  try {
    var r = w.location.pathname + w.location.search + w.location.hash;
    if (!/cerrado\.html/.test(r)) sessionStorage.setItem('profase-regreso', r);
  } catch (e) { /* sin almacenamiento: regresa a la entrada */ }
  try { window.stop(); } catch (e) { /* navegador viejo */ }
  try { w.location.replace('/cerrado.html'); } catch (e) { location.replace('/cerrado.html'); }
})();</script><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Portal PROFASE · Cartera</title><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><script src="js/supabase.js?v=bb37eb706b"></script><script src="js/portal.js?v=bc8b94bad2"></script><script src="js/marca.js?v=a743a9d941"></script><script src="js/bitacora.js?v=a62c64c724"></script><script src="js/buscador.js?v=3399471b0c"></script><script src="js/ocultos.js?v=df79ec94dd"></script><script src="js/quo-al-dia.js"></script><script src="js/filtros.js"></script></head><body>

*{box-sizing:border-box}

/* las columnas siguen el ancho del contenido (no el de la pantalla) para acomodarse al estirar o encoger */

.mod{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:13px 15px;text-align:left;cursor:pointer;box-shadow:var(--sh-1);min-width:0;display:flex;flex-direction:column}

.ages{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line-2);

@container main (max-width:900px){.ages{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container main (max-width:540px){.ages{grid-template-columns:1fr}}
.agec{background:var(--surface);padding:12px 16px;min-width:0}
.agec .k{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.agec .row{display:flex;align-items:baseline;gap:8px;margin-top:6px}
.agec .row .t{font-size:10.5px;color:var(--ink-3);width:9px;flex:none}
.agec .row .v{font-family:var(--f-num);font-size:clamp(12px,1.05cqi,16px);font-variant-numeric:tabular-nums}
.agec .row .v.c{color:var(--cli)} .agec .row .v.p{color:var(--prov)}

.tsc{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:9px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line-2)}

/* la lista de cada tarjeta se desliza dentro de su recuadro para que su encabezado y su renglón TOTAL queden a la vista */

/* ── IVA de los saldos (solo facturas: CXC y CXP) ── */
.ivas{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:11px;margin-bottom:16px}

  display:inline-flex;align-items:center;gap:4px;white-space:nowrap;text-align:inherit}

.rubh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.btnv:hover{border-color:var(--ink-3)}

  padding:max(14px,env(safe-area-inset-left,0px)) max(14px,env(safe-area-inset-right,0px))}
.ov[hidden]{display:none!important}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:16px;width:min(560px,100%);
  max-height:min(760px,88vh);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 64px rgba(6,14,24,.36)}
.sheet-h{display:flex;align-items:center;gap:12px;padding:16px 18px 13px;flex:none;border-bottom:1px solid var(--line-2)}
.sheet-h h3{font-size:16px;font-weight:700;letter-spacing:-.01em}
.sheet-h .sub{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.sheet-b{padding:15px 18px;overflow:auto;min-height:0;flex:1}
.sheet-f{display:flex;gap:9px;justify-content:space-between;align-items:center;padding:12px 18px;
  border-top:1px solid var(--line-2);flex:none;flex-wrap:wrap}
.mx{background:var(--surface-2);border:none;width:30px;height:30px;border-radius:9px;cursor:pointer;
  color:var(--ink-2);font-size:15px;line-height:1;flex:none;margin-left:auto}
.mx:hover{background:var(--line)}
.btn{background:var(--brand);color:#fff;border:none;border-radius:9px;padding:8px 16px;font-size:13px;
  font-weight:600;cursor:pointer}
.btn.g{background:var(--surface-2);color:var(--ink-2)}
.grp{margin-bottom:16px}
.grp:last-child{margin-bottom:0}
.grp .glab{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);font-weight:600;
  display:block;margin-bottom:7px}
.grp .chips{display:flex;gap:7px;flex-wrap:wrap}

/* calendario */
.cal{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:12px}
.cal-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
.cal-h .m{font-weight:600;font-size:13.5px}
.cal-h button{background:var(--surface-2);border:none;width:26px;height:26px;border-radius:7px;cursor:pointer;color:var(--ink-2)}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-g .wd{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);text-align:center;
  font-weight:600;padding-block:3px}
.cal-g button{background:none;border:none;border-radius:7px;padding:6px 0;font-size:12.5px;cursor:pointer;
  font-variant-numeric:tabular-nums}
.cal-g button:hover{background:var(--surface-2)}
.cal-g button.out{color:var(--ink-3);opacity:.45}
.cal-g button.in{background:color-mix(in srgb,var(--brand) 11%,transparent)}
.cal-g button.end{background:var(--brand);color:#fff;font-weight:600}
.cal-g button[disabled]{opacity:.25;cursor:default}
.dates{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.dates label{display:block}
.dates .k{font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.dates input{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;
  padding:7px 10px;margin-top:3px;font-family:var(--f-num);font-size:13px}

/* ── ventana de documentos ── */
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;width:min(1680px,calc(100vw - 28px));
  height:94vh;max-height:94vh;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 24px 64px rgba(6,14,24,.34)}
/* ventana del cliente flotante: se arrastra del encabezado, se estira de la esquina y deja usar la página de atrás */
.ov.flota{background:none;backdrop-filter:none;-webkit-backdrop-filter:none;pointer-events:none;display:block;padding:0}
.ov.flota .modal{position:fixed;pointer-events:auto;resize:both;min-width:480px;min-height:260px;max-height:none;max-width:100vw;
  box-shadow:0 18px 56px rgba(6,14,24,.42)}
.ov.flota .modal.max{resize:none;border-radius:10px}
.ov.flota .modal.mini{resize:none;height:auto!important;min-height:0}
.ov.flota .modal.mini > :not(.mh){display:none}
.ov.flota .mh{cursor:move;user-select:none;-webkit-user-select:none;flex-wrap:nowrap}
.ov.flota .mh > div:not(.wbtns){flex:1 1 auto}
.ov.flota .mh input,.ov.flota .mh button{cursor:pointer}
.wbtns{display:flex;gap:6px;margin-left:auto;flex:none}
.wbtns .mx{margin-left:0}
.mh{display:flex;gap:13px;align-items:flex-start;padding:18px 20px 15px;flex:none;flex-wrap:wrap}
.mh .av{width:38px;height:38px;border-radius:11px;font-size:13px}
.mh .eyebrow{font-size:9.5px;letter-spacing:.13em}
.mh h3{font-family:var(--f-dis);font-size:19px;font-weight:700;letter-spacing:-.015em;margin-top:2px}
.mh .rfc{font-family:var(--f-num);font-size:11.5px;color:var(--ink-3);margin-top:2px}
.mh .ct{margin-top:7px}
.mstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:1px;background:var(--line-2);
  border-top:1px solid var(--line-2);flex:none}
.mstat{background:var(--surface);padding:12px 20px;min-width:0}
.mstat .k{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.mstat .v{font-family:var(--f-dis);font-size:18px;font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums}
.mstat .ln{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--ink-2);margin-top:3px}
.mstat .ln b{font-family:var(--f-num);font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.mtabs .pend{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.tfil{display:flex;flex-wrap:wrap;gap:8px 18px;padding:10px 18px;border-bottom:1px solid var(--line-2);flex:none}
.tfil .fi{display:flex;flex-direction:column;gap:4px;min-width:0}
.tfil .fi>span{font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.tfil .chips{display:flex;gap:5px;flex-wrap:wrap}
.tfil .chip{padding:4px 10px;font-size:11.5px}
.tfil .chip small{opacity:.8;margin-left:4px;font-family:var(--f-num)}
.aplv{padding:34px 22px;text-align:center;color:var(--ink-2);max-width:62ch;margin:0 auto;font-size:13px}
.aplv .k{display:inline-block;margin-bottom:10px}
.mtabsrow{display:flex;align-items:center;gap:12px;padding:9px 18px 0;border-bottom:1px solid var(--line-2);
  flex:none;flex-wrap:wrap}
.mtabs{display:flex;gap:2px;overflow-x:auto}
.mtabs button{background:none;border:none;border-bottom:2px solid transparent;padding:7px 10px 9px;
  font-size:13px;color:var(--ink-2);cursor:pointer;display:inline-flex;gap:7px;align-items:center;white-space:nowrap}
.mtabs button[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
.mtabs .cnt{background:var(--surface-2);border-radius:999px;padding:1px 7px;font-size:10.5px;color:var(--ink-3)}
.mtabs button[aria-selected="true"] .cnt{background:color-mix(in srgb,var(--brand) 13%,transparent);color:var(--brand)}
.mbody{display:grid;grid-template-columns:minmax(0,1fr) 360px;min-height:0;flex:1 1 auto;overflow:hidden}
/* filtros dentro de la ventana del cliente */
.mfil{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:flex-end;padding:10px 18px;border-bottom:1px solid var(--line-2);
  background:var(--surface-3);flex:none}
.mfil .fi{display:flex;flex-direction:column;gap:3px;min-width:0}
.mfil .fi>span{font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.mfil input{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12.5px;min-width:0}
.mfil input.cpq{width:300px;max-width:62vw}
.mfil input.nn{width:96px;font-family:var(--f-num)}
.mfil .rng{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-3)}
.mfil .chips{display:flex;gap:5px;flex-wrap:wrap}
.mfil .chip{padding:4px 10px;font-size:11.5px}
.cpsel{display:inline-flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--brand) 9%,var(--surface));
  border:1px solid color-mix(in srgb,var(--brand) 30%,transparent);border-radius:999px;padding:3px 4px 3px 11px;font-size:12px}
.cpsel b{font-weight:600;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cpsel button{background:var(--surface);border:none;border-radius:999px;width:22px;height:22px;cursor:pointer;color:var(--ink-2)}
.minibtn{background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);border-radius:8px;padding:5px 10px;
  font-size:12px;cursor:pointer;margin-top:10px}
.minibtn:hover{border-color:var(--ink-3)}
.wbtns .xlbtn{margin-top:0;height:30px;white-space:nowrap;align-self:center}
.wbtns .xlbtn:disabled{opacity:.7;cursor:default}
.topacc{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.topacc .xlgen{margin-top:0;white-space:nowrap}
.topacc .xlgen:disabled{opacity:.7;cursor:default}
.mlist{overflow:auto;min-height:0}
/* lista de documentos: cada pestaña trae sus columnas (contraparte primero, que se estira); las demás tienen su ancho
   y, si la lista es angosta, se esconden por prioridad (p4, luego p3, luego p2). Se mide la lista, no la pantalla. */
.mlist{container-type:inline-size;container-name:dl}
.dhead,.drow{display:flex;align-items:center;gap:12px}
.dhead > *,.drow > *{flex:0 0 var(--w,90px);min-width:0}
.dhead > .g,.drow > .g{flex:1 1 auto}
.dhead > .ch,.drow > .ch{flex:0 0 14px}
.dc.r{text-align:right}
.dc.tx{font-size:12px;color:var(--ink-2);overflow-wrap:anywhere}
.dc.mo{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.dc.mo.b{font-weight:600}
.dhead .ordb{width:100%}
.dhead .r .ordb{justify-content:flex-end}
/* que «Contraparte» nunca quede tan angosta que su título se encime (con las casillas de Facturas, 2-nov-2026) */
/* las retenciones de la lista se esconden antes que el IVA del saldo cuando ya no caben (el detalle las trae) */
@container dl (max-width:780px){.dhead .rt,.drow .rt,.dtot .rt{display:none}}
@container dl (max-width:1100px){.dhead .p4,.drow .p4,.dtot .p4{display:none}}
@container dl (max-width:930px){.dhead .p3,.drow .p3,.dtot .p3{display:none}}
@container dl (max-width:600px){.dhead .p2,.drow .p2,.dtot .p2{display:none}}
/* el renglón TOTAL de la lista (2-nov-2026, pedido de Fernando): las mismas columnas que la lista, pegado abajo al
   deslizar y con lo que pasa los filtros; si hay clientes y proveedores, un renglón por lado (no se mezclan) */
.dtots{position:sticky;bottom:0;z-index:1;background:var(--surface);border-top:2px solid var(--line);
  box-shadow:0 -6px 16px rgba(6,14,24,.07)}
.dtots.suelto{position:static;box-shadow:none}
.dtot{display:flex;align-items:center;gap:12px;padding:10px 20px}
.dtot + .dtot{border-top:1px solid var(--line-2)}
.dtot > *{flex:0 0 var(--w,90px);min-width:0}
.dtot > .g{flex:1 1 auto}
.dtot > .ch{flex:0 0 14px}
.dtot.consel{padding-left:0}
.dtot.consel > .ck{flex:0 0 26px}
.dtot .k{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--ink-2)}
.dtot .k small{display:block;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink-3);font-size:11px;margin-top:1px}
.dtot .dc.mo{font-weight:700;color:var(--ink)}
.dhead{gap:12px;padding:9px 20px;
  font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600;
  border-bottom:1px solid var(--line-2);position:sticky;top:0;background:var(--surface);z-index:1}
.dhead .r{text-align:right}
.dhead > *{font:inherit;color:inherit;letter-spacing:inherit}
.c-tip .tp{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.03em;padding:2px 8px;border-radius:999px;white-space:nowrap}
.c-tip .mp{display:block;font-size:10.5px;color:var(--ink-3);margin-top:2px}
.c-fec{font-family:var(--f-num);font-weight:600;font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.c-dia{text-align:right;font-family:var(--f-num);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.c-dia small{display:block;font-family:var(--f-ui);font-size:10.5px;color:var(--ink-3)}
.c-sal,.c-tot{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.c-sal{font-weight:600}
.c-tot{color:var(--ink-2)}
.c-est{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.drow{
  width:100%;padding:11px 20px;border:none;border-bottom:1px solid var(--line-2);background:none;
  text-align:left;cursor:pointer;font:inherit;color:inherit}
.drow:hover{background:var(--surface-3)}
.drow[aria-current="true"]{background:var(--surface-3);box-shadow:inset 3px 0 0 var(--brand)}
.dmain{display:flex;align-items:center;gap:10px;min-width:0}
.dic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;
  font-family:var(--f-dis);font-size:11px;font-weight:700}
.dtx{min-width:0}
/* el nombre se lee completo: si no cabe pasa entero al siguiente renglón (3-nov-2026, con las columnas de retenciones) */
.dt1{font-weight:600;font-size:12.5px;overflow-wrap:break-word}
.dt2{font-size:11px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dnum{text-align:right}
.dnum .a{font-family:var(--f-num);font-weight:600;font-variant-numeric:tabular-nums}
.dnum .b{font-size:11px;color:var(--ink-3);font-family:var(--f-num)}
.dfec .a{font-weight:600} .dfec .b{font-size:11px;color:var(--ink-3)}
.chev{color:var(--ink-3);font-size:13px}
.mside{border-left:1px solid var(--line-2);background:var(--surface-3);overflow:auto;padding:16px 18px;min-height:0}
.mside .hd{display:flex;align-items:flex-start;gap:10px;margin-bottom:13px}
.mside .hd .k{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.mside .hd h4{font-size:16px;font-weight:700;margin-top:2px}
.saldobox{background:color-mix(in srgb,var(--cli) 10%,var(--surface));
  border:1px solid color-mix(in srgb,var(--cli) 28%,transparent);border-radius:11px;padding:12px 14px;margin-bottom:14px}
.saldobox .k{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.saldobox .v{font-family:var(--f-dis);font-size:23px;font-weight:700;letter-spacing:-.025em;margin-top:3px;
  font-variant-numeric:tabular-nums}
.saldobox .u{font-size:11px;color:var(--ink-3);margin-left:5px;font-weight:500}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px 12px}
.sgrid .f{min-width:0}
.sgrid .f.w{grid-column:1/-1}
.sgrid .k{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.sgrid .v{margin-top:3px;font-size:13px;word-break:break-word}
.sgrid .v.num{font-family:var(--f-num);font-size:12px}
.sgrid .sep{grid-column:1/-1;height:1px;background:var(--line-2)}
.mside .vacio{color:var(--ink-3);font-size:13px;text-align:center;padding:40px 10px}
.conc{display:flex;flex-direction:column;gap:5px;margin-top:7px;padding:0}
.conc li{list-style:none;padding:6px 10px;background:var(--surface-2);border-radius:8px;font-size:12.5px}
.nodata{color:var(--ink-3);font-size:12.5px;margin-top:5px}

@media (max-width:820px){
  .mbody{grid-template-columns:1fr}
  .mside{border-left:none;border-top:1px solid var(--line-2)}
  .dates{grid-template-columns:1fr}
}
@media (max-width:860px){
  .main{padding-block:12px 26px}
  th:first-child,td:first-child{min-width:180px}
}
/* la ventana flotante se acomoda a su propio ancho, no al de la pantalla */
.ov.flota .modal{container-type:inline-size}
@container (max-width:1000px){
  .mbody{grid-template-columns:minmax(0,1fr) 300px}
}
@container (max-width:720px){
  .mbody{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .mside{border-left:none;border-top:1px solid var(--line-2);max-height:45%;overflow:auto}
}

/* portal */
.alc{font-size:11.5px;color:var(--ink-3)}
.foot2{font-size:11.5px;color:var(--ink-3);margin:2px 0 14px}

/* ── estatus de la cartera: «Estrategia fiscal» y «Fuera del reporte» (2-nov-2026) ── */
.p-est{background:color-mix(in srgb,var(--accent) 17%,transparent);color:color-mix(in srgb,var(--accent) 62%,var(--ink))}
.p-pap{background:color-mix(in srgb,var(--warn) 17%,transparent);color:var(--warn)}
.p-fue{background:color-mix(in srgb,var(--ink-3) 20%,transparent);color:var(--ink-2)}
.p-ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.drow.fuera .dt1,.drow.fuera .dc.mo{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--ink-3) 70%,transparent)}
.drow.fuera{opacity:.78}
.dsel{display:flex;align-items:stretch;border-bottom:1px solid var(--line-2)}
.dsel > .drow{border-bottom:none;flex:1 1 auto;min-width:0;padding-left:6px}
.ck{flex:0 0 32px;display:flex;align-items:center;justify-content:flex-end;cursor:pointer;margin:0}
.ck input{width:18px;height:18px;margin:0;accent-color:var(--brand);cursor:pointer}
.dhead.consel{padding-left:0}
.dhead.consel > .ck{flex:0 0 26px}
.selbar{position:sticky;bottom:0;z-index:2;display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 14px;
  background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 16px rgba(6,14,24,.08)}
.selbar .n{font-size:12.5px;font-weight:600;margin-right:auto;min-width:0}
.selbar .n small{display:block;font-weight:400;color:var(--ink-3);font-size:11px}
.selbar .btn{padding:7px 13px;font-size:12.5px}
.btn.o{background:var(--accent)}
.btn.l{background:none;color:var(--ink-2);border:1px solid var(--line)}
.btn[disabled]{opacity:.55;cursor:default}
.estbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:13px}
.estbox .k{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.estbox .l{font-size:12.5px;color:var(--ink-2);margin-top:6px;overflow-wrap:anywhere}
.estbox .acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.estbox .acts .btn{padding:6px 11px;font-size:12px}
.estinfo{align-items:center}
.estinfo .tx{flex:1 1 260px;min-width:0;font-size:12.5px;color:var(--ink-2)}
.estinfo .tx > div + div{margin-top:4px}
.estinfo .bt{display:flex;gap:7px;flex-wrap:wrap}
.exbtn{margin-top:0;white-space:nowrap}
.exbtn b{background:var(--accent);color:#fff;border-radius:999px;padding:0 7px;margin-left:5px;font-size:11px}
#ovbox .sheet.ancha{width:min(900px,calc(100vw - 28px))}
.ov2{z-index:70}
/* la ventana de cada empresa en el celular: sus botones bajan de renglón (Excel, PDF, estatus y cerrar) sin salirse */
@media (max-width:819px){.wbtns{flex-wrap:wrap;justify-content:flex-end;max-width:100%}}
/* en el celular la ventana de cada empresa se desliza completa: arriba sus datos y filtros, luego la lista de
   documentos y su detalle (antes la lista quedaba sin espacio debajo de los filtros y no se alcanzaba; revisión a fondo
   del 2-nov-2026). Los encabezados de la lista y la barra de lo escogido se quedan pegados al deslizar. */
@media (max-width:819px){
  .ov:not(.flota) .modal{overflow-y:auto;overscroll-behavior:contain}
  .ov:not(.flota) .modal .mbody{flex:none;overflow:visible;min-height:auto;grid-template-rows:auto auto}
  .ov:not(.flota) .modal .mlist{overflow:visible}
  .ov:not(.flota) .modal .mside{max-height:none;overflow:visible}
}
.fmot{display:block;margin-bottom:13px}
.fmot .k{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);font-weight:600;display:block;margin-bottom:5px}
.fmot select,.fmot textarea,.fmot input{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;
  padding:8px 10px;font-size:14px;font-family:var(--f-ui);color:var(--ink)}
.fmot textarea{resize:vertical;min-height:64px}
@media (max-width:700px){.fmot select,.fmot textarea,.fmot input,.exq input{font-size:16px}}
.enota{font-size:12px;color:var(--ink-3);margin:0}

<script>

const F={
  mxn:new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0}),
  mxn2:new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',minimumFractionDigits:2,maximumFractionDigits:2}),
  int:new Intl.NumberFormat('es-MX'),
  dec:new Intl.NumberFormat('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2})
};
const AGES=[
  {k:'0-30',lo:0,hi:30,lab:'0 a 30 días',c:'0-30 d'},{k:'31-60',lo:31,hi:60,lab:'31 a 60 días',c:'31-60 d'},
  {k:'61-90',lo:61,hi:90,lab:'61 a 90 días',c:'61-90 d'},{k:'91-180',lo:91,hi:180,lab:'91 a 180 días',c:'91-180 d'},
  {k:'181-365',lo:181,hi:365,lab:'181 a 365 días',c:'181-365 d'},{k:'>365',lo:366,hi:1e9,lab:'más de un año',c:'+1 año'}
];
/* módulo 6 = terceros (TERCERO_GRAL*): informativo, fuera de los anticipos, del neto y de la vista por omisión */
const TER=6, MODS_BASE=[0,1,2,3,4,5];
const MOD_SHORT=['CXC','CXP','ANT CLIEN','ANT PROV','NTC CLIEN','NTC PROV','TERCEROS'];
const MOD_VAR=['--cli','--prov','--cli-2','--prov-2','--cli-3','--prov-3','--ink-3'];
const ES_CLI=[true,false,true,false,true,false,false];
const FAM={todos:MODS_BASE,fac:[0,1],ant:[2,3],ntc:[4,5],ter:[TER],apl:[]};
const FAM_LAB=[['todos','Todos'],['fac','Facturas'],['ant','Anticipos'],['ntc','Notas de crédito'],['ter','Terceros'],['apl','Aplicaciones']];
/* tarjetas por rubro del resumen; cada una abre su lista */
const RUBROS=[
  {k:'cxc',lab:'Cuentas por cobrar',mods:[0],tab:'fac',lado:'cli',iva:'emi',dot:'--cli'},
  {k:'cxp',lab:'Cuentas por pagar',mods:[1],tab:'fac',lado:'prov',iva:'rec',dot:'--prov'},
  {k:'ant',lab:'Anticipos',mods:[2,3],tab:'ant',lado:'todos',dot:'--cli-2',lin:['De clientes','A proveedores']},
  {k:'ntc',lab:'Notas de crédito',mods:[4,5],tab:'ntc',lado:'todos',dot:'--cli-3',lin:['A clientes','De proveedores']},
  {k:'ter',lab:'Terceros',mods:[TER],tab:'ter',lado:'todos',dot:'--ink-3'}
];
const rubroDe=k=>RUBROS.find(x=>x.k===k)||null;
/* IVA del saldo: el IVA del CFDI en proporción a lo que falta pagar (saldo ÷ total). Así respeta las facturas con
   tasas mixtas (0 %, exentas y 16 % en la misma); nunca es el 16 % del saldo. Si el saldo pasa del total (viene así de
   Quo), cuenta el IVA completo del CFDI. Solo facturas (CXC y CXP); los anticipos no entran. */
const propSaldo=r=>{ if(!r.total) return 0; const p=r.saldo/r.total; return Math.abs(p)>1?Math.sign(p):p; };
const ivaSaldo=r=>(r.mod===0||r.mod===1)?(r.iva||0)*propSaldo(r):0;
const retSaldo=r=>(r.mod===0||r.mod===1)?(r.ivaret||0)*propSaldo(r):0;
/* el ISR retenido del saldo (3-nov-2026, pedido de Fernando): la misma cuenta que el IVA retenido. Es informativo: no es
   IVA y no resta en las cajas de IVA ni en el IVA neto */
const isrSaldo=r=>(r.mod===0||r.mod===1)?(r.isrret||0)*propSaldo(r):0;
/* el IVA del saldo de una nota de crédito, con la misma cuenta (3-nov-2026). La cartera solo trae las notas de crédito
   que todavía tienen saldo en el Tablero QUO (satTQ_Saldo <> 0, nube/cartera_nube.py) y la cuenta va en proporción a ese
   saldo: solo cuenta la parte que falta por aplicar; lo ya aplicado no entra (no se resta dos veces). */
const ivaNtc=r=>(r.mod===4||r.mod===5)?Math.abs((r.iva||0)*propSaldo(r)):0;
const ivaDoc=r=>(r.mod===4||r.mod===5)?ivaNtc(r):ivaSaldo(r);
function sumaIva(rows){
  const o={tras:0,retC:0,acr:0,retP:0,ntcC:0,ntcP:0,nC:0,nP:0,isrC:0,isrP:0};
  rows.forEach(r=>{ if(r.mod===0){o.tras+=ivaSaldo(r); o.retC+=retSaldo(r); o.isrC+=isrSaldo(r); o.nC++;}
    else if(r.mod===1){o.acr+=ivaSaldo(r); o.retP+=retSaldo(r); o.isrP+=isrSaldo(r); o.nP++;}
    else if(r.mod===4) o.ntcC+=ivaNtc(r); else if(r.mod===5) o.ntcP+=ivaNtc(r); });
  o.causar=o.tras-o.retC-o.ntcC; o.acreditar=o.acr-o.retP-o.ntcP; o.neto=o.causar-o.acreditar;
  return o;
}
/* terceros: el rol que trae Quo se agrupa para filtrar; la naturaleza sale de la cuenta (1 activo = deudora, 2 pasivo =
   acreedora) y, si no hay cuenta, del signo del saldo (positivo: nos deben; negativo: le debemos) */
const ROL_T=[['pre','Préstamos'],['soc','Deuda de socios'],['rep','Reposición de gastos'],['otr','Otros']];
function rolGrupo(r){
  const s=String(r.rol||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();
  if(/PREST/.test(s)) return 'pre';
  if(/SOCIO|ACCIONIST/.test(s)) return 'soc';
  if(/REPOS|REEMB|GASTO/.test(s)) return 'rep';
  return 'otr';
}
function naturaleza(r){
  const d=String(r.cta||'').match(/\d/);
  if(d&&d[0]==='1') return 'Deudora';
  if(d&&d[0]==='2') return 'Acreedora';
  return r.saldo<0?'Acreedora':'Deudora';
}
const aplicacion=r=>(r.total&&Math.abs(r.saldo)<Math.abs(r.total)-0.01)?'Aplicado en parte':'Sin aplicar';
const flecha=(on,dir)=>on?(dir<0?'▼':'▲'):'⇅';
/* botón de encabezado que ordena: primera vez de mayor a menor (en textos, de la A a la Z) y luego al revés */
function botonOrden(lab,on,dir,fn){
  const b=el('button','ordb'); b.type='button'; b.dataset.on=on?'1':'0';
  b.appendChild(document.createTextNode(lab)); b.appendChild(el('span','fl',flecha(on,dir)));
  b.title=on?(dir<0?'De mayor a menor · pica para al revés':'De menor a mayor · pica para al revés'):'Ordenar por '+lab.toLowerCase();
  b.onclick=e=>{e.stopPropagation(); fn();};
  return b;
}
const ariaOrden=(on,dir)=>on?(dir<0?'descending':'ascending'):'none';
const LADO={todos:[0,1,2,3,4,5,TER],cli:[0,2,4,TER],prov:[1,3,5,TER]};
const DOC_IC=['F','F','A','A','N','N','T'];
const modLab=i=>(M.modLab&&M.modLab[i])||(i===TER?'Terceros (informativo)':MOD_SHORT[i]);
const vistaParcial=()=>!(S.mod.size===MODS_BASE.length&&!S.mod.has(TER));
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const WD=['L','M','M','J','V','S','D'];
const FP={'01':'Efectivo','02':'Cheque nominativo','03':'Transferencia','04':'Tarjeta de crédito',
 '05':'Monedero electrónico','06':'Dinero electrónico','08':'Vales de despensa','12':'Dación en pago',
 '15':'Condonación','17':'Compensación','23':'Novación','28':'Tarjeta de débito',
 '29':'Tarjeta de servicios','30':'Aplicación de anticipos','31':'Intermediario de pagos','99':'Por definir'};
const AVC=['#014f8e','#3183ce','#e8781f','#6b5ca5','#1d7a4f','#9a6a00','#a33224','#2d6a7e'];

const REGF={601:'General de Ley PM',603:'PM con fines no lucrativos',605:'Sueldos y salarios',606:'Arrendamiento',
 607:'Enajenación de bienes',608:'Demás ingresos',610:'Residentes en el extranjero',611:'Dividendos',
 612:'PF Actividad Empresarial',614:'Intereses',616:'Sin obligaciones fiscales',620:'Cooperativas de producción',
 621:'Incorporación Fiscal',622:'Actividades agrícolas',623:'Opcional grupos de sociedades',624:'Coordinados',
 625:'Plataformas tecnológicas',626:'RESICO'};

let M=null,D=null,ROWS=[],TODAY=new Date();

/* ── Datos: colección «cartera» de la base del portal ──
   La actualización del portal (cada 3 horas y con el botón «Actualizar») lee el Tablero QUO directo de
   PorfaseDBSolutions y deja un documento por cliente (k|RFC) y sus UUID aparte (u|RFC). La base decide qué
   clientes ve cada quien. Esta página guarda en el navegador lo que ya bajó y solo trae los clientes que cambiaron. */
const COLS_K=['mod','cp','saldo','total','fecha','mp','est','tipo','quo','mon','tc','tme','cta','cl','fp','regf','ser','folio','pl','ver',
  'sub','iva','ivaret','isrret','ter','mif','rol','cc','proy','conta','cic','ieps','dsc'];
const DIC_K=['mon','cl','ver','ser','cta','fp','pl','rol','cc','proy'];
let SB=null, YO=null, ALCANCE=null, META=null, RANGO={}, UUID_OK=new Set(), K_FIRMA={};
async function desb64(b64){
  const r=await fetch('data:application/octet-stream;base64,'+b64);
  const s=r.body.pipeThrough(new DecompressionStream('gzip'));
  return JSON.parse(await new Response(s).text());
}
/* lo ya bajado se guarda en este navegador por usuario y firma; si entra otra persona, se borra */
const CACHE=(()=>{
  let p=null;
  const abre=()=>p||(p=new Promise((res,rej)=>{
    const r=indexedDB.open('portal-cartera',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('docs');
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  }));
  const tx=async(modo,fn)=>{ try{ const db=await abre(); return await new Promise(res=>{
    const t=db.transaction('docs',modo), st=t.objectStore('docs'); let out; const q=fn(st);
    if(q) q.onsuccess=()=>{out=q.result;}; t.oncomplete=()=>res(out); t.onerror=()=>res(undefined); t.onabort=()=>res(undefined); }); }
    catch(e){ return undefined; } };
  return {
    get:k=>tx('readonly',st=>st.get(k)),
    set:(k,v)=>tx('readwrite',st=>st.put(v,k)),
    borra:()=>tx('readwrite',st=>st.clear())
  };
})();
async function cacheDe(id,firma){ const c=await CACHE.get(id); return c&&c.firma===firma?c.obj:null; }
async function bajaDocs(ids){
  const out={};
  for(let i=0;i<ids.length;i+=12){
    const lote=ids.slice(i,i+12);
    const q=await SB.from('docs').select('id,data').eq('col','cartera').in('id',lote);
    if(q.error) throw q.error;
    for(const x of q.data||[]) out[x.id]=x.data;
  }
  return out;
}
async function firmas(pref){
  const q=await SB.from('docs').select('id,firma:data->>firma').eq('col','cartera').like('id',pref+'|%');
  if(q.error) throw q.error;
  const o={}; (q.data||[]).forEach(x=>{ o[x.id]=x.firma; }); return o;
}
/* arma M y D con el mismo formato que usaba la página «Cartera SQL» (un renglón por documento) */
async function cargaCartera(avance){
  const m=await SB.from('docs').select('data').eq('col','cartera').eq('id','meta').maybeSingle();
  if(m.error) throw m.error;
  if(!m.data) return null;
  META=m.data.data;
  // k|RFC: lo que ve quien tiene ese cliente; p|RFC: lo que solo ve la dirección (la base no se lo da a nadie más)
  const fs=Object.assign(await firmas('k'), YO&&YO.rol==='director'?await firmas('p'):{});
  const ids=Object.keys(fs).sort();
  const objs={}, faltan=[];
  for(const id of ids){ const o=await cacheDe(id,fs[id]); if(o) objs[id]=o; else faltan.push(id); }
  let hechos=ids.length-faltan.length; avance&&avance(hechos,ids.length);
  for(let i=0;i<faltan.length;i+=12){
    const lote=faltan.slice(i,i+12), docs=await bajaDocs(lote);
    for(const id of lote){
      const d=docs[id]; if(!d) continue;
      const o=await desb64(d.b64); objs[id]=o;
      CACHE.set(id,{firma:d.firma,obj:o});
      fs[id]=d.firma;
    }
    hechos+=lote.length; avance&&avance(hechos,ids.length);
  }
  const cont=[], ixC={}, gx=(arr,ix,v)=>{ if(v==null) return null; if(!(v in ix)){ ix[v]=arr.length; arr.push(v);} return ix[v]; };
  const regs=META.regimenes.slice(), procs=META.procesos.slice(), ixR={}, ixP={};
  regs.forEach((r,i)=>ixR[r]=i); procs.forEach((p,i)=>ixP[p]=i);
  const dic={}, ixD={}; DIC_K.forEach(k=>{ dic[k]=[]; ixD[k]={}; }); dic.mon.push('MXN'); ixD.mon.MXN=0;
  const cli=[], cp=[], f=[], parte=[]; RANGO={}; UUID_OK=new Set(); K_FIRMA={};
  const ci={}; COLS_K.forEach((c,i)=>ci[c]=i);
  const cliIx={};
  for(const id of ids){
    const o=objs[id]; if(!o) continue;
    const c=o.cli, off=cp.length, rfc=c[1];
    let n=cliIx[rfc];
    if(n==null){ n=cliIx[rfc]=cli.length;
      cli.push([c[0],c[0],rfc,c[2],(c[3]||[]).map(x=>gx(cont,ixC,x)),c[4]==null?null:gx(regs,ixR,c[4]),(c[5]||[]).map(x=>gx(procs,ixP,x)),c[6]||'']); }
    for(const x of o.cp) cp.push(x);
    const loc={}; DIC_K.forEach(k=>{ loc[k]=(o.dic[k]||[]).map(v=>gx(dic[k],ixD[k],v)); });
    const ini=f.length;
    for(const r of o.f){
      const d=k=>{ const v=r[ci[k]]; return v==null?null:loc[k][v]; };
      f.push([n,r[ci.mod],off+r[ci.cp],r[ci.saldo],r[ci.total],r[ci.fecha],r[ci.mp],r[ci.est],r[ci.tipo],'',r[ci.quo],d('mon'),r[ci.tc],r[ci.tme],
        d('cta'),d('cl'),d('fp'),r[ci.regf],d('ser'),r[ci.folio],d('pl'),d('ver'),r[ci.sub],r[ci.iva],r[ci.ivaret],r[ci.isrret],r[ci.ter],r[ci.mif],d('rol'),
        d('cc'),d('proy'),r[ci.conta],r[ci.cic],r[ci.ieps],r[ci.dsc]]);
      parte.push(id[0]==='p'?'p':'k');
    }
    RANGO[id]=[ini,f.length]; K_FIRMA[id]=fs[id];
  }
  const meta={generado:META.generado,hora:META.hora,fuente:META.fuente,modLab:META.modLab,refreshedAt:META.refreshedAt,
    id:META.refreshedAt+'|'+ids.map(i=>fs[i]).join(','),contadores:cont,regimenes:regs,procesos:procs};
  return {meta,filas:f,extra:{cli,cp,dic,mp:META.mp,est:META.est,tipo:META.tipo,parte}};
}
/* los UUID de un cliente (o de todos) se bajan la primera vez que hacen falta; van en u|RFC (y q|RFC para p|RFC) */
const uDe=id=>(id[0]==='k'?'u':'q')+id.slice(1);
async function cargaUuids(rfcs){
  const ids=[];
  rfcs.forEach(r=>{ if(!UUID_OK.has(r)) ['k|','p|'].forEach(t=>{ if(RANGO[t+r]) ids.push(t+r); }); });
  if(!ids.length) return false;
  const objs={}, faltan=[];
  for(const id of ids){ const o=await cacheDe(uDe(id),K_FIRMA[id]); if(o) objs[id]=o; else faltan.push(id); }
  if(faltan.length){
    const docs=await bajaDocs(faltan.map(uDe));
    for(const id of faltan){ const d=docs[uDe(id)]; if(!d||d.firma!==K_FIRMA[id]) continue;
      const o=await desb64(d.b64); objs[id]=o; CACHE.set(uDe(id),{firma:d.firma,obj:o}); }
  }
  let viejo=false; const listos=new Set();
  for(const id of ids){
    const u=objs[id], [a,b]=RANGO[id];
    // si los UUID ya son de una actualización más nueva que la del cliente, se recarga todo
    if(!u||u.length!==b-a){ viejo=true; continue; }
    for(let i=a;i<b;i++){ ROWS[i].uuid=u[i-a]||''; D.f[i][9]=ROWS[i].uuid; }
    listos.add(id);
  }
  rfcs.forEach(r=>{ if(['k|','p|'].every(t=>!RANGO[t+r]||listos.has(t+r))) UUID_OK.add(r); });
  if(listos.size&&typeof aplLimpia==='function') aplLimpia();   // con los folios fiscales se reconoce lo que ya se decidió
  if(viejo) setTimeout(()=>arranca(true).catch(()=>{}),0);
  return true;
}

  const v=document.getElementById('vista');

  if(recarga&&CARGADA===r.meta.id) return;
  const abierto=S.cliente!=null?D.cli[S.cliente][2]:null;
  aplica(r.meta,r.filas,r.extra); prep(!!recarga); CARGADA=r.meta.id; TODOS_UUID=null;
  await cargaMarcas(); aplicaMarcas();
  await cargaApl();
  if(!recarga) restauraFiltros();
  // con datos nuevos cambian los números de las contrapartes: el filtro de cliente o proveedor de la ventana se quita
  if(abierto){ const i=D.cli.findIndex(c=>c[2]===abierto); S.cliente=i>=0?i:null; S.doc=null; if(S.mf) S.mf.cps=new Set(); quitaVF();
    if(i<0) cierraOv(); else cargaUuids([abierto]).then(()=>pintaModal()); }
  render();

  if(ABRE_PEND!=null){ const x=ABRE_PEND; ABRE_PEND=null; setTimeout(()=>abreDesdeAviso(x),60); }

/* ── Resumen de saldos (3-nov-2026: el concepto de Gabriel Cavazos; lo pidió Fernando). Arriba, el buscador, el botón
   FILTROS (js/filtros.js, con sus pestañas Cliente, Documento, Antigüedad, Personas y Estatus), Excel y PDF con lo
   filtrado y, debajo, solo las etiquetas de lo escogido. Luego el IVA (emitidas, recibidas y el neto), las tarjetas por
   rubro y las barras de antigüedad (las dos filtran al picarlas) y la lista por empresa, que se ordena con ▼▲. Lo que se
   escoge se recuerda en este navegador (por usuario). Todo sale de lo que la página ya recibe para cada quien. ── */
const AGE4=[{k:'0-30',lab:'0–30 días',ks:['0-30'],c:'--ok'},{k:'31-60',lab:'31–60',ks:['31-60'],c:'--cli'},
  {k:'61-90',lab:'61–90',ks:['61-90'],c:'--warn'},{k:'90+',lab:'Más de 90',ks:['91-180','181-365','>365'],c:'--crit'}];
const age4De=r=>r.age==null?null:(AGE4.find(a=>a.ks.includes(r.age))||AGE4[3]).k;
/* el estatus de cada documento en el resumen: dentro del reporte, revisar en el origen (su saldo pasa del total de su
   CFDI), fuera del reporte (el estatus de la cartera) o cancelado. Por omisión se ven y suman los dos primeros, como
   antes. En la ventana de cada empresa lo cancelado lo decide su propio filtro (Plantilla › Estatus). */
const EST_DEF=['dentro','origen'];
const EST_LAB={dentro:'Dentro del reporte',origen:'Revisar en el origen',fuera:'Fuera del reporte',can:'Cancelados'};
const catDe=(r,ven)=>(!ven&&r.est==='Cancelada')?'can':r.st==='fuera'?'fuera':r.alerta?'origen':'dentro';
// persona física (RFC de 13) o moral (de 12), por el RFC de la empresa
const personaDe=rfc=>{ const n=String(rfc||'').trim().length; return n===13?'F':n===12?'M':'—'; };
const RUBRO_LAB=['Cuentas por cobrar','Cuentas por pagar','Anticipos de clientes','Anticipos a proveedores',
  'Notas de crédito a clientes','Notas de crédito de proveedores','Terceros'];
const mismoSet=(a,b)=>a.size===b.size&&[...a].every(x=>b.has(x));
const modBase=()=>mismoSet(S.mod,new Set(MODS_BASE));
const ICQ_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>';

/* ¿el documento pasa los filtros del resumen? sinMod: sin el rubro (las tarjetas); sinAge: sin la antigüedad (sus barras);
   sinEst: sin el estatus (sus números); ven: para la ventana de una empresa (sin rubro, sin los filtros de empresa y sin
   lo cancelado, que lo decide la ventana) */
function pasa(r,o){
  o=o||{};
  // «Mis clientes ocultos» (js/ocultos.js, 172_clientes_ocultos.sql): los que ocultó quien entró no salen (solo a él)
  if(OCU(D.cli[r.cli][2])) return false;
  if(!o.sinMod&&!o.ven&&!S.mod.has(r.mod)) return false;
  if(!o.sinEst){
    if(!S.estc.has(catDe(r,o.ven))) return false;
    if(S.marca.size&&!S.marca.has(r.st)) return false;
    if(S.motivo.size&&!S.motivo.has(r.mot||'—')) return false;
  }
  // Aplicaciones (FILTROS › Aplicaciones): las empresas con aplicaciones posibles y el estado de la relación
  if(!o.ven&&(S.aplE.size||S.aplT.size)&&!pasaApl(r)) return false;
  if(!o.sinAge&&S.age4.size&&r.age&&!S.age4.has(age4De(r))) return false;
  if(S.mon.size&&!S.mon.has(r.mon)) return false;
  if(S.anios.size&&!S.anios.has((r.fecha||'').slice(0,4))) return false;
  if(S.mp.size&&(r.mod===0||r.mod===1)&&!S.mp.has(r.mp)) return false;
  if(S.pl.size&&!S.pl.has(r.pl||'—')) return false;
  if(!o.ven){
    if(S.clis.size&&!S.clis.has(r.rfcCli)) return false;
    if(S.grupos.size&&!S.grupos.has(r.grupo||'Sin grupo')) return false;
    if(S.per.size&&!S.per.has(personaDe(r.rfcCli))) return false;
    if(S.reg.size&&!(r.reg&&S.reg.has(r.reg))) return false;
    if(S.cont.size&&!r.cont.some(c=>S.cont.has(c))) return false;
  }
  if(S.q){
    const cp=D.cp[r.cp], q=S.q;
    let ok=(cp[1]||'').toLowerCase().includes(q)||(cp[0]||'').toLowerCase().includes(q)
      ||r.uuid.toLowerCase().includes(q)||r.quo.includes(q)||r.cliNom.toLowerCase().includes(q)||r.rfcCli.toLowerCase().includes(q);
    if(!ok) ok=((r.serie||'')+(r.folio||'')).toLowerCase().includes(q)||(r.folio||'').toLowerCase().includes(q);
    if(!ok) ok=[r.cc,r.proy,r.cta].some(x=>x&&String(x).toLowerCase().includes(q));
    if(!ok) return false;
  }
  return true;
}

const F_SETS=['clis','grupos','per','reg','mon','anios','mp','pl','age4','cont','estc','marca','motivo','aplE','aplT'];
const FKEY=()=>'cartera.filtros:'+((YO&&YO.id)||'');
function guardaFiltros(){
  try{ const o={mod:[...S.mod],sort:S.sort,dir:S.dir}; F_SETS.forEach(k=>{ o[k]=[...S[k]]; }); localStorage.setItem(FKEY(),JSON.stringify(o)); }catch(e){}
}
function restauraFiltros(){
  let o=null; try{ o=JSON.parse(localStorage.getItem(FKEY())||'null'); }catch(e){ o=null; }
  if(!o||typeof o!=='object') return;
  // solo lo que existe hoy en lo que ve esta persona
  const ok={clis:new Set(D.cli.map(c=>c[2])),grupos:new Set(D.cli.map(c=>c[3]||'Sin grupo')),per:new Set(['F','M','—']),
    reg:new Set(M.regimenes),mon:new Set(D.monedas),anios:new Set(ROWS.map(r=>(r.fecha||'').slice(0,4)).filter(Boolean)),
    mp:new Set(['PUE','PPD','—']),pl:new Set(ROWS.map(r=>r.pl||'—')),age4:new Set(AGE4.map(a=>a.k)),cont:new Set(M.contadores),
    estc:new Set(Object.keys(EST_LAB)),marca:new Set(['estrategia','por_aprobar']),motivo:new Set(MOTIVOS.map(x=>x[0]).concat('—')),
    aplE:new Set(APL_EMP.map(x=>x[0])),aplT:new Set(APL_EST.map(x=>x[0]))};
  F_SETS.forEach(k=>{ if(Array.isArray(o[k])) S[k]=new Set(o[k].map(String).filter(v=>ok[k].has(v))); });
  if(!S.estc.size) S.estc=new Set(EST_DEF);
  if(Array.isArray(o.mod)){ const m=o.mod.map(Number).filter(i=>Number.isInteger(i)&&i>=0&&i<=TER); if(m.length) S.mod=new Set(m); }
  if(COLS_EMP.some(c=>c[0]===o.sort)){ S.sort=o.sort; S.dir=o.dir===1?1:-1; }
}

/* las pestañas del botón FILTROS del resumen (js/filtros.js; una sola versión de los filtros del portal) */
const cuentaPor=(f,rows)=>{ const o={}; (rows||ROWS).forEach(r=>{ const k=f(r); if(k!=null) o[k]=(o[k]||0)+1; }); return o; };
const empPor=f=>{ const o={}; D.cli.forEach(c=>{ const k=f(c); if(k!=null) o[k]=(o[k]||0)+1; }); return o; };
// un campo de varios: con pocas opciones va en botones (con su número en el nombre); con muchas, lista con buscador
function campoVarios(k,t,opsFn,extra){
  extra=extra||{};
  const ops=()=>{ const o=opsFn(); const seg=o.length<=8&&!extra.buscar&&!extra.lista;
    return o.map(x=>({v:String(x.v),t:seg&&x.n!=null?x.t+' · '+x.n:x.t,n:seg?null:x.n,base:x.t})); };
  return Object.assign({k,t,tipo:'varios',opciones:ops,
    chip:vals=>{ if(vals.length>2) return F.int.format(vals.length); const o=ops(); return vals.map(v=>{ const x=o.find(y=>y.v===v); return x?x.base:v; }).join(', '); },
    valor:()=>[...S[k]].map(String),pon:v=>{ S[k]=new Set(v.map(String)); }},extra);
}

    ]},

/* IVA: el de las emitidas (trasladado − retenido − el IVA del saldo de las notas de crédito a clientes), el de las
   recibidas (acreditable − retenido − el IVA del saldo de las notas de crédito de proveedores) y el neto */
function cajasIva(o){
  const w=el('div','ivas');
  const caja=(tit,dot,lin)=>{
    const c=el('section','ivac'); const h=el('h3'); const d=el('span','dot'); d.style.background=`var(${dot})`;
    h.appendChild(d); h.appendChild(document.createTextNode(tit)); c.appendChild(h);
    lin.forEach(([t,v,tot])=>{ const r=el('div','ivr'+(tot?' t':'')); r.appendChild(el('span',null,t)); r.appendChild(el('b',null,v)); c.appendChild(r); });
    return c;
  };
  const menos=x=>Math.abs(x)<0.5?F.mxn.format(0):'− '+F.mxn.format(Math.abs(x));
  w.appendChild(caja('IVA emitidas','--cli',[['Trasladado',F.mxn.format(o.tras)],['IVA retenido',menos(o.retC)],
    ['Notas de crédito',menos(o.ntcC)],['Por causar',F.mxn.format(o.causar),1]]));
  w.appendChild(caja('IVA recibidas','--prov',[['Acreditable',F.mxn.format(o.acr)],['IVA retenido',menos(o.retP)],
    ['Notas de crédito',menos(o.ntcP)],['Por acreditar',F.mxn.format(o.acreditar),1]]));
  const n=el('section','ivac neto'); n.appendChild(el('h3',null,'IVA neto'));
  const cero=Math.abs(o.neto)<0.5, favor=o.neto<0;
  n.appendChild(el('div','ivv',F.mxn.format(Math.abs(o.neto))));
  n.appendChild(el('span','pn '+(cero?'cero':favor?'favor':'contra'),cero?'En cero':favor?'A favor':'En contra'));
  w.appendChild(n);
  return w;
}
/* ISR retenido del saldo (3-nov-2026, pedido de Fernando): solo informa, no toca el IVA de arriba. En las emitidas, el que
   los clientes le van a retener al pagar (lo podrá acreditar); en las recibidas, el que tendrá que retener al pagarles a sus
   proveedores (por enterar). La retención se hace al pago, por eso solo cuenta lo que falta pagar. */

  const c=el('section','ivac isrc');

/* tarjetas por rubro: su total y cuántos hay; al picar una, se filtra ese rubro (otra vez, regresa a todos) */

  const ap=aplSuma(base), sola=S.aplE.size===1&&S.aplE.has('con');
  const b=el('button','mod apl'); b.type='button'; b.dataset.rubro='apl'; b.setAttribute('aria-pressed',sola);

/* antigüedad del saldo en cuatro tramos (desde la fecha del CFDI); cada barra filtra al picarla */
function antig(rows){
  const c=el('div','card'); c.id='car-antig';
  const h=el('div','card-h'); h.appendChild(el('h2','tt','Antigüedad del saldo')); c.appendChild(h);
  const tot=AGE4.map(()=>0); rows.forEach(r=>{ const i=AGE4.findIndex(a=>a.k===age4De(r)); if(i>=0) tot[i]+=Math.abs(r.saldo); });
  const suma=tot.reduce((a,x)=>a+x,0)||1;
  const g=el('div','agg');
  AGE4.forEach((a,i)=>{
    const b=el('button','agb'); b.type='button'; b.dataset.age=a.k; b.setAttribute('aria-pressed',S.age4.has(a.k));
    b.appendChild(el('span','k',a.lab)); b.appendChild(el('span','v',F.mxn.format(tot[i])));
    const br=el('span','bar'), x=el('i'); x.style.width=Math.max(tot[i]?2:0,Math.round(tot[i]/suma*100))+'%'; x.style.background=`var(${a.c})`;
    br.appendChild(x); b.appendChild(br);
    b.onclick=()=>{ S.age4.has(a.k)?S.age4.delete(a.k):S.age4.add(a.k); if(S.age4.size===AGE4.length) S.age4=new Set();
      S.doc=null; guardaFiltros(); render(); };
    g.appendChild(b);
  });
  c.appendChild(g);
  return c;
}
/* la lista por empresa: por cobrar y por pagar son el saldo de lado de los clientes y de los proveedores de los rubros en
   vista (los terceros solo informan); el IVA del saldo es su neto, con la misma cuenta que el IVA de arriba */
const ivaNeto=r=>r.mod===0?ivaSaldo(r)-retSaldo(r):r.mod===1?-(ivaSaldo(r)-retSaldo(r)):r.mod===4?-ivaNtc(r):r.mod===5?ivaNtc(r):0;
const COLS_EMP=[['nom','Empresa',1],['cont','Contador',1],['pc','Por cobrar'],['pp','Por pagar'],['iva','IVA del saldo'],['apl','Por aplicar'],['vieja','Días'],['n','Docs.']];
function sumaEmp(o,r){
  if(r.mod!==TER){ if(ES_CLI[r.mod]) o.pc+=r.saldo; else o.pp+=r.saldo; }
  o.iva+=ivaNeto(r); o.n++; if(r.dias!=null&&(o.vieja==null||r.dias>o.vieja)) o.vieja=r.dias;
  if(r.mod===0||r.mod===1){ const F2=aplF(r); if(F2) o.apl+=F2.aplicado; }   // lo que se puede aplicar (demostrativo)
}
const nuevaEmp=(k,nom,cont)=>({k,nom:nom||'—',cont:cont||'',pc:0,pp:0,iva:0,apl:0,vieja:null,n:0});
const contDe=c=>(c[4]||[]).map(i=>M.contadores[i]).join(', ');
function porEmpresa(rows){
  const map=new Map();
  rows.forEach(r=>{ let o=map.get(r.cli); if(!o){ const c=D.cli[r.cli]; o=nuevaEmp(r.cli,c[1],contDe(c)); o.rfc=c[2]; map.set(r.cli,o); } sumaEmp(o,r); });
  return [...map.values()];
}
function ordEmp(a,b){
  const k=S.sort, x=a[k], y=b[k], txt=COLS_EMP.some(c=>c[0]===k&&c[2]);
  let res;
  if(txt) res=String(x||'').localeCompare(String(y||''),'es');
  else { const p=x==null?-1e18:x, q=y==null?-1e18:y; res=p<q?-1:p>q?1:0; }
  return (S.dir<0?-res:res)||String(a.nom).localeCompare(String(b.nom),'es');
}
function tablaEmpresas(rows){
  const c=el('div','card'); c.id='car-emp';
  const lst=porEmpresa(rows).sort(ordEmp);
  const h=el('div','card-h bd'); h.appendChild(el('h2',null,'Empresas')); h.appendChild(el('span','cnt',plural(lst.length,'empresa','empresas')));
  c.appendChild(h);
  if(!lst.length){ c.appendChild(el('div','empty','Ningún documento cumple con los filtros.')); return c; }
  const conMenu=ESTC.ok;   // el estatus de cada empresa (⋯): lo ve quien ve la cartera; lo cambia quien marca
  const sc=el('div','tsc'); const tb=el('table','temp'); const th=el('thead'); const tr=el('tr');

function colocaVentana(m){

   plantilla, antigüedad, búsqueda y estatus del reporte); lo cancelado lo decide el filtro de la ventana */
const docsVentana=ci=>ROWS.filter(r=>r.cli===ci&&pasa(r,{ven:true}));

/* los filtros propios de la ventana (botón FILTROS): cliente o proveedor, saldo (sin signo) y días de atraso, fecha del
   CFDI, plantilla y estatus, y en Todos y Terceros, el rol, la naturaleza y la cuenta contable de los terceros. Se quedan
   puestos al cambiar de pestaña o de empresa (menos el cliente o proveedor, que es de cada empresa) */
const nuevoMF=()=>({cps:new Set(),smin:'',smax:'',age:new Set(),desde:'',hasta:'',pl:new Set(),est:new Set(),
  trol:new Set(),tnat:new Set(),tcta:new Set(),q:''});
const numMF=v=>{const n=parseFloat(String(v).replace(/[$,\s]/g,'')); return isFinite(n)?n:null;};
const MF_SETS=['age','pl','est','trol','tnat','tcta'];
const MF_KEY=()=>'cartera.ventana:'+((YO&&YO.id)||'');
function guardaMF(){
  try{ const f=S.mf, o={smin:f.smin,smax:f.smax,desde:f.desde,hasta:f.hasta}; MF_SETS.forEach(k=>{ o[k]=[...f[k]]; });
    localStorage.setItem(MF_KEY(),JSON.stringify(o)); }catch(e){}
}
function mfGuardado(){
  const f=nuevoMF();
  try{ const o=JSON.parse(localStorage.getItem(MF_KEY())||'null');
    if(o&&typeof o==='object'){
      ['smin','smax'].forEach(k=>{ if(typeof o[k]==='string'&&o[k].length<24) f[k]=o[k]; });
      ['desde','hasta'].forEach(k=>{ if(typeof o[k]==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(o[k])) f[k]=o[k]; });
      MF_SETS.forEach(k=>{ if(Array.isArray(o[k])) f[k]=new Set(o[k].map(String).slice(0,500)); });
    } }catch(e){}
  return f;
}
function pasaMF(r){
  const f=S.mf; if(!f) return true;
  if(f.cps.size&&!f.cps.has(r.cp)) return false;
  const a=Math.abs(r.saldo), s1=numMF(f.smin), s2=numMF(f.smax);
  if(s1!=null&&!(a>s1)) return false;
  if(s2!=null&&!(a<s2)) return false;
  if(f.age.size&&!(r.age&&f.age.has(r.age))) return false;
  if(f.desde&&(!r.fecha||r.fecha<f.desde)) return false;
  if(f.hasta&&(!r.fecha||r.fecha>f.hasta)) return false;
  if(f.pl.size&&!f.pl.has(r.pl||'—')) return false;
  if(f.est.size&&!f.est.has(r.est==='Cancelada'?'Cancelada':'Vigente')) return false;
  if(r.mod===TER){
    if(f.trol.size&&!f.trol.has(rolGrupo(r))) return false;
    if(f.tnat.size&&!f.tnat.has(naturaleza(r))) return false;
    if(f.tcta.size&&!f.tcta.has(r.cta||'—')) return false;
  }
  if(f.q){
    const cp=D.cp[r.cp], q=f.q;
    const ok=[cp[1],cp[0],r.uuid,r.quo,[r.serie,r.folio].filter(Boolean).join(' '),r.folio].some(x=>x&&String(x).toLowerCase().includes(q));
    if(!ok) return false;
  }
  return true;
}

    if(conSel){ const l=el('label','ck'); const i=el('input'); i.type='checkbox'; i.id='sel-todas';
      i.setAttribute('aria-label','Escoger todas las facturas de la lista');
      i.checked=vistos.length>0&&vistos.every(r=>S.sel.has(r)); i.indeterminate=!i.checked&&S.sel.size>0;
      i.onchange=()=>{ S.sel=i.checked?new Set(vistos):new Set(); pintaModal(); };
      l.appendChild(i); hd.appendChild(l); }
    cols.forEach(k=>{
      const cc=DCOL[k], x=el('span',claseCol(k));
      if(cc.w) x.style.setProperty('--w',cc.w+'px');
      const on=srt.k===k; x.setAttribute('aria-sort',ariaOrden(on,srt.dir));
      x.appendChild(botonOrden(cc.lab,on,srt.dir,()=>{ const d0=S.dsort;
        S.dsort={k,dir:d0&&d0.k===k?-d0.dir:(cc.txt?1:-1)}; pintaModal(); }));
      hd.appendChild(x);
    });
    hd.appendChild(el('span','ch',''));
    lista.appendChild(hd);
    if(!docs.length) lista.appendChild(el('div','empty','Sin documentos con estos filtros.'));
    vistos.forEach(d=>{
      const b=el('button','drow'+(d.st==='fuera'?' fuera':'')); b.type='button';
      b.setAttribute('aria-current',!!(S.doc&&S.doc.quo===d.quo&&S.doc.uuid===d.uuid));
      cols.forEach(k=>{ const x=celdaDoc(k,d); if(DCOL[k].w) x.style.setProperty('--w',DCOL[k].w+'px'); b.appendChild(x); });
      b.appendChild(el('span','chev ch','›'));
      b.onclick=()=>{ if(!flotante()) SCR_LISTA=m.scrollTop; S.doc=d; pintaModal(); };
      if(!conSel){ lista.appendChild(b); return; }
      const w2=el('div','dsel'), l=el('label','ck'), i=el('input'); i.type='checkbox'; i.checked=S.sel.has(d);
      i.setAttribute('aria-label','Escoger '+([d.serie,d.folio].filter(Boolean).join(' ')||'la factura')+' de '+(D.cp[d.cp][1]||''));
      i.onchange=()=>{ i.checked?S.sel.add(d):S.sel.delete(d); pintaModal(); };
      l.appendChild(i); w2.appendChild(l); w2.appendChild(b); lista.appendChild(w2);
    });
    if(docs.length) lista.appendChild(totalDocs(docs,cols,conSel,conSel&&S.sel.size>0));
    if(conSel&&S.sel.size) lista.appendChild(barraSel([...S.sel]));
  }
  body.appendChild(lista);
  body.appendChild(panelDoc());
  m.appendChild(body);
  if(VF&&VF.f) VF.f.pinta();
  lista.scrollTop=scr; m.scrollTop=scrM;
  // en el celular: al abrir un detalle se ve desde arriba; al regresar a la lista, donde se había quedado
  if(!flotante()){
    if(S.doc&&S.doc!==DOC_VISTO) setTimeout(()=>{ try{ body.scrollIntoView({block:'start'}); }catch(e){} },0);
    else if(!S.doc&&DOC_VISTO) m.scrollTop=SCR_LISTA;
  }
  DOC_VISTO=S.doc;
  if(foco){ const e=document.getElementById(foco); if(e){ e.focus(); if(pos!=null&&e.setSelectionRange) try{e.setSelectionRange(pos,pos);}catch(_){} } }
}
/* el renglón TOTAL de la lista de la ventana: suma todo lo que pasa los filtros (también lo que no cabe en los 500 que se
   ven), con las mismas columnas que la lista; clientes y proveedores en renglones aparte para no mezclar lo que nos deben
   con lo que se debe. Cuadra con las cifras de arriba de la ventana. Con la barra de lo escogido abajo, no se pega. */
const TOT_LADO={todos:['Clientes','Proveedores'],fac:['Por cobrar','Por pagar'],ant:['De clientes','A proveedores'],
  ntc:['A clientes','De proveedores']};
const TOT_DOC={todos:['documento','documentos'],fac:['factura','facturas'],ant:['anticipo','anticipos'],
  ntc:['nota de crédito','notas de crédito'],ter:['documento','documentos']};
function totalDocs(docs,cols,conSel,suelto){
  const w=el('div','dtots'+(suelto?' suelto':'')); w.id='dtots';
  const lado=r=>r.mod===TER?2:[0,2,4].includes(r.mod)?0:1;
  const grupos=[0,1,2].map(i=>docs.filter(r=>lado(r)===i)).filter(g=>g.length);
  const nom=TOT_DOC[S.tab]||TOT_DOC.todos, labs=TOT_LADO[S.tab];
  grupos.forEach(g=>{
    const r=el('div','dtot'+(conSel?' consel':''));
    if(conSel) r.appendChild(el('span','ck'));
    const lab=grupos.length>1&&labs&&lado(g[0])<2?labs[lado(g[0])]:lado(g[0])===2&&grupos.length>1?'Terceros':'Total';
    cols.forEach(k=>{
      const x=el('div',claseCol(k)); if(DCOL[k].w) x.style.setProperty('--w',DCOL[k].w+'px');
      if(k==='cp'){ x.classList.add('k'); x.appendChild(document.createTextNode(lab+' · '+plural(g.length,nom[0],nom[1]))); }
      else { const f=k==='tot'||k==='mto'?(d=>d.total||0):k==='sal'||k==='xap'?(d=>d.saldo||0):k==='iva'?ivaDoc:k==='ivr'?retSaldo:k==='isr'?isrSaldo:null;
        if(f){ x.classList.add('mo'); x.textContent=F.mxn.format(g.reduce((a,d)=>a+f(d),0)); } }
      r.appendChild(x);
    });
    r.appendChild(el('span','ch',''));
    w.appendChild(r);
  });
  return w;
}
/* columnas de la lista de la ventana. p: prioridad (si la lista es angosta, se esconden p4, luego p3, luego p2);
   txt: ordena de la A a la Z la primera vez. «Terceros» no usa palabras de factura. */
const DCOL={
  cp:{lab:'Cliente o proveedor',g:1,txt:1,v:r=>D.cp[r.cp][1]||''},
  tip:{lab:'Tipo',w:104,p:4,v:r=>r.mod},
  fol:{lab:'Folio',w:96,p:3,txt:1,v:r=>[r.serie,r.folio].filter(Boolean).join(' ')},
  fec:{lab:'Fecha',w:92,p:3,v:r=>r.fecha||''},
  dia:{lab:'Días',w:70,p:2,r:1,v:r=>r.dias==null?-1:r.dias},
  pl:{lab:'Plantilla',w:150,p:4,txt:1,v:r=>r.pl||''},
  rol:{lab:'Rol',w:130,p:3,txt:1,v:r=>r.rol||''},
  cta:{lab:'Cuenta contable',w:120,p:4,txt:1,v:r=>r.cta||''},
  nat:{lab:'Naturaleza',w:100,p:2,txt:1,v:r=>naturaleza(r)},
  tot:{lab:'Total',w:110,p:3,r:1,v:r=>Math.abs(r.total||0)},
  mto:{lab:'Monto',w:110,p:3,r:1,v:r=>Math.abs(r.total||0)},
  sal:{lab:'Saldo',w:110,p:1,r:1,v:r=>Math.abs(r.saldo)},
  xap:{lab:'Por aplicar',w:110,p:1,r:1,v:r=>Math.abs(r.saldo)},
  iva:{lab:'IVA del saldo',w:104,p:2,r:1,v:r=>Math.abs(ivaDoc(r))},
  // retenciones de lo que falta pagar (3-nov-2026, pedido de Fernando): con la misma prioridad que el IVA del saldo
  ivr:{lab:'IVA retenido',w:104,p:2,rt:1,r:1,v:r=>Math.abs(retSaldo(r))},
  isr:{lab:'ISR retenido',w:104,p:2,rt:1,r:1,v:r=>Math.abs(isrSaldo(r))},
  est:{lab:'Estatus',w:130,p:2,r:1,v:r=>r.est==='Cancelada'?1e9:(r.dias==null?-1:r.dias)},
  apc:{lab:'Aplicación',w:124,p:2,txt:1,v:r=>aplicacion(r)},
  // la relación más exacta con un anticipo, nota o factura (4-nov-2026; demostrativo)
  // prioridad 3: en listas angostas (celular, ventana mediana) se esconde y el detalle de la derecha trae las relaciones
  rel:{lab:'Relación',w:168,p:3,v:r=>relTxt(r)}
};
const TABCOLS={todos:['cp','tip','fec','dia','sal','tot','est'],ntc:['cp','tip','fec','dia','sal','rel','iva','tot','est'],
  fac:['cp','fol','fec','pl','tot','sal','rel','iva','ivr','isr','est'],ant:['cp','fol','fec','pl','mto','xap','apc','rel'],
  ter:['cp','pl','rol','cta','nat','fec','mto','sal']};
const claseCol=k=>{ const c=DCOL[k]; return 'dc'+(c.g?' g':'')+(c.r?' r':'')+(c.p>1?' p'+c.p:'')+(c.rt?' rt':''); };
const ordenDocs=()=>S.dsort&&(TABCOLS[S.tab]||TABCOLS.todos).includes(S.dsort.k)?S.dsort:{k:'sal',dir:-1};
function cmpDocs(a,b){
  const o=ordenDocs(), f=DCOL[o.k].v, x=f(a), y=f(b);
  const res=typeof x==='string'?x.localeCompare(y,'es'):(x<y?-1:x>y?1:0);
  return (o.dir<0?-res:res)||Math.abs(b.saldo)-Math.abs(a.saldo);
}
// lo que enseña la pestaña abierta, en el orden de la pantalla (el Excel sale igual)
const docsDeTab=todos=>todos.filter(r=>FAM[S.tab].includes(r.mod)).sort(cmpDocs);
function celdaDoc(k,d){
  const x=el('div',claseCol(k));
  if(k==='cp'){
    x.classList.add('dmain');
    const ic=el('span','dic',DOC_IC[d.mod]);
    ic.style.background=`color-mix(in srgb, var(${MOD_VAR[d.mod]}) 15%, transparent)`; ic.style.color=`var(${MOD_VAR[d.mod]})`;
    x.appendChild(ic);
    const t2=el('div','dtx'); t2.appendChild(el('div','dt1',D.cp[d.cp][1]||'—'));
    // el renglón de detalle repite lo que se esconde cuando la lista es angosta
    const meta=d.mod===TER?[d.rol||'Tercero',naturaleza(d)]:[MOD_SHORT[d.mod]];
    if(d.mod!==TER){ if(d.mp!=='—') meta.push(d.mp); meta.push(d.mon); if(d.folio) meta.push([d.serie,d.folio].filter(Boolean).join(' ')); }
    if(d.quo) meta.push('QUO '+d.quo);
    if(d.cc) meta.push(d.cc);
    t2.appendChild(el('div','dt2',meta.join(' · ')));
    x.appendChild(t2); return x;
  }
  const din=v=>{ x.classList.add('mo'); x.textContent=v?F.mxn.format(v):'—'; return x; };
  switch(k){
    case 'tip': { x.classList.add('c-tip'); const tg=el('span','tp',MOD_SHORT[d.mod]);
      tg.style.background=`color-mix(in srgb, var(${MOD_VAR[d.mod]}) 15%, transparent)`; tg.style.color=`var(${MOD_VAR[d.mod]})`;
      x.appendChild(tg); if(d.mp!=='—') x.appendChild(el('span','mp',d.mp)); return x; }
    case 'fol': x.classList.add('tx'); x.textContent=[d.serie,d.folio].filter(Boolean).join(' ')||'—'; return x;
    case 'fec': x.classList.add('c-fec'); x.textContent=d.fecha||'—'; return x;
    case 'dia': x.classList.add('c-dia'); x.textContent=d.dias!=null?F.int.format(d.dias):'—'; return x;
    case 'pl': case 'rol': case 'cta': x.classList.add('tx'); x.textContent=d[k]||'—'; return x;
    case 'nat': x.classList.add('tx'); x.textContent=naturaleza(d); return x;
    case 'tot': case 'mto': din(d.total); x.style.color='var(--ink-2)'; return x;
    case 'sal': case 'xap': din(d.saldo); x.classList.add('b'); return x;
    case 'iva': return din(ivaDoc(d));
    case 'ivr': return din(retSaldo(d));
    case 'isr': return din(isrSaldo(d));
    case 'est': x.classList.add('c-est'); x.appendChild(pillEstatus(d)); if(d.alerta) x.appendChild(el('span','pill p-can','Saldo > total'));
      if(d.st&&d.st!=='normal') x.appendChild(el('span','pill '+ST_CLS[d.st],ST_LAB[d.st])); return x;
    case 'rel': x.classList.add('c-rel'); return celdaRel(x,d);
    case 'apc': { const p=aplicacion(d)==='Sin aplicar'; x.appendChild(el('span','pill '+(p?'p-ppd':'p-pue'),aplicacion(d))); return x; }
  }
  return x;
}
function pillEstatus(d){
  if(d.est==='Cancelada') return el('span','pill p-can','Cancelada');
  const p=el('span','pill');
  if(d.dias==null){p.className='pill p-cl'; p.textContent='Sin fecha'; return p;}
  const a=AGES.find(x=>d.dias>=x.lo&&d.dias<=x.hi)||AGES[AGES.length-1];
  p.textContent=a.c;
  const sev=d.dias>365?'crit':d.dias>90?'warn':'ok';
  p.style.background=`color-mix(in srgb, var(--${sev}) 15%, transparent)`;
  p.style.color=`var(--${sev})`;
  return p;
}
/* el detalle del documento escogido: a la derecha (en el celular, en lugar de la lista) */

    campo('Contabilizado',d.conta?'Sí':'No');
  } else {
    campo('Tipo',modLab(d.mod));

    campo(d.mod===2||d.mod===3?'Por aplicar':'Saldo',F.mxn2.format(d.saldo),'num');

    campo('Versión XML',d.ver||'—','num');
    if(d.ter) campo('Por cuenta de terceros','Sí');
    campo('Centro de costo',d.cc||'—');
    campo('Proyecto',d.proy||'—');

    campo('Periodo contable',d.cic?MESES[(d.cic%100)-1]+' '+Math.floor(d.cic/100):'—');
  }

    s.appendChild(b);

}

/* ── Estatus de la cartera (2-nov-2026: petición de Fernando con la idea y los bocetos de Gabo; la autorizó Daniel a las
   13:43, «autorízala; ya me la enseñó Cadengo»). Cada factura, o la empresa entera, puede llevar un estatus:
   · «Estrategia fiscal»: sigue sumando; se filtra y tiene su reporte (Excel y PDF con la marca).
   · «Fuera del reporte»: con motivo de la lista; deja de sumar en los saldos y el IVA cuando está aprobado. Lo que pide
     quien no aprueba queda «Por aprobar» y, mientras, sigue sumando. Se ve con «Mostrar fuera del reporte».
   Marca quien ve la cartera de esa empresa; aprueban la dirección y quienes ven toda la cartera. Las reglas automáticas
   (RFC genérico nacional y nómina) sacan solas lo que les toca; se pueden apagar y nunca borran nada. Lo que se marca en
   una factura manda sobre la regla y la regla sobre lo de la empresa. Todo lo decide la base (portal/sql/144, funciones
   cartera_*); esta página solo pinta y llama a esas funciones. ── */
const MOTIVOS=[['estrategia','Estrategia fiscal'],['rfc_generico','RFC genérico'],['no_deducible','No deducible'],['nomina','Nómina'],
  ['servicio','Servicio (agua, luz…)'],['ya_no_cliente','Ya no es cliente'],['otro','Otro']];
const motivoTxt=k=>(MOTIVOS.find(x=>x[0]===k)||[k,k||'—'])[1];
const ST_LAB={normal:'Normal',estrategia:'Estrategia fiscal',por_aprobar:'Fuera · por aprobar',fuera:'Fuera del reporte'};
const ST_CLS={estrategia:'p-est',por_aprobar:'p-pap',fuera:'p-fue',normal:'p-cl'};
const REGLAS_DEF={
  rfc_generico:{lab:'RFC genérico nacional',motivo:'rfc_generico',
    sub:'Todo lo que tiene como contraparte el RFC genérico XAXX010101000 (público en general). El genérico del extranjero (XEXX010101000) sí cuenta.',
    pasa:r=>String(D.cp[r.cp][0]||'').trim().toUpperCase()==='XAXX010101000'},
  nomina:{lab:'Nómina',motivo:'nomina',
    sub:'Lo que en su plantilla o su clasificación diga «nómina». Hoy Quo no manda recibos de nómina a la cartera; si llegan, salen solos.',
    pasa:r=>/N[OÓ]MINA/i.test((r.pl||'')+' '+(r.cl||''))}
};
const ESTC={ok:false,puede:{},reglas:{},marcas:[],firma:null,porUuid:new Map(),porRfc:new Map()};
let ABRE_PEND=null, EXC=null, VIG=null;
const yoMarco=()=>ESTC.ok&&!!ESTC.puede.marcar&&!(window.PORTAL&&window.PORTAL.consulta);
const yoApruebo=()=>yoMarco()&&!!ESTC.puede.aprobar;
const rfcDe=r=>D.cli[r.cli][2];
const viva=m=>m.estado==='aprobada'||m.estado==='por_aprobar';
const stDe=m=>m.estatus==='fuera'?(m.estado==='por_aprobar'?'por_aprobar':'fuera'):m.estatus==='estrategia'?'estrategia':'normal';
const cuando=x=>{ try{ return window.PROFASE_HORA?window.PROFASE_HORA.fechaHora(x):fmtD(String(x).slice(0,10)); }catch(e){ return ''; } };
const msgErr=e=>String((e&&(e.message||e.details||e.hint))||e||'No se pudo').replace(/^.*?ERROR:\s*/,'');
// ¿puede quitarle a esta marca su estatus? (la base lo vuelve a revisar)
const quitaMarca=m=>!!m&&yoMarco()&&(yoApruebo()||m.mia||m.estatus==='estrategia');

async function cargaMarcas(){
  let q; try{ q=await SB.rpc('cartera_marcas'); }catch(e){ q={error:e}; }
  if(!q||q.error||!q.data){ ESTC.ok=false; ESTC.reglas={}; ESTC.porUuid=new Map(); ESTC.porRfc=new Map(); return false; }
  const d=q.data; ESTC.ok=true; ESTC.puede=d.puede||{}; ESTC.reglas={}; (d.reglas||[]).forEach(r=>{ ESTC.reglas[r.clave]=r; });
  ESTC.marcas=d.marcas||[]; ESTC.firma=d.firma||null; ESTC.porUuid=new Map(); ESTC.porRfc=new Map();
  ESTC.marcas.filter(viva).forEach(m=>{
    if(m.uuid) ESTC.porUuid.set(m.rfc+'|'+String(m.uuid).toUpperCase()+'|'+m.parte,m);
    else if(!ESTC.porRfc.has(m.rfc)||m.parte==='k') ESTC.porRfc.set(m.rfc,m);
  });
  // para que las sumas salgan bien, los folios fiscales de las empresas que tienen facturas marcadas
  if(ROWS.length){
    const rs=[...new Set(ESTC.marcas.filter(m=>m.uuid&&viva(m)).map(m=>m.rfc))].filter(r=>!UUID_OK.has(r)&&(RANGO['k|'+r]||RANGO['p|'+r]));
    if(rs.length){ try{ await cargaUuids(rs); }catch(e){} }
  }
  return true;
}
function estatusDe(r){
  const rfc=rfcDe(r);
  const m=r.uuid?ESTC.porUuid.get(rfc+'|'+r.uuid.toUpperCase()+'|'+r.parte):null;
  if(m) return {st:stDe(m),m,por:'factura',mot:m.motivo};
  for(const k in REGLAS_DEF){ const g=ESTC.reglas[k]; if(g&&g.activa&&REGLAS_DEF[k].pasa(r)) return {st:'fuera',rg:k,por:'regla',mot:REGLAS_DEF[k].motivo}; }
  const e=ESTC.porRfc.get(rfc);
  if(e) return {st:stDe(e),m:e,por:'empresa',mot:e.motivo};
  return {st:'normal',por:null,mot:null};
}
function aplicaMarcas(){
  if(!ROWS) return;
  ROWS.forEach(r=>{ const x=estatusDe(r); r.st=x.st; r.mk=x.m||null; r.rg=x.rg||null; r.por=x.por; r.mot=x.mot; });
  aplLimpia();   // lo «Fuera del reporte» no se aplica: las relaciones se vuelven a armar
}
async function recargaMarcas(){
  await cargaMarcas(); aplicaMarcas(); render();
  if(EXC&&document.getElementById('exc')) pintaExcluidos();
}
// la huella cambia cuando alguien marca, aprueba, regresa o cambia una regla: cada minuto (y al volver a la pestaña)
function vigilaMarcas(){
  if(VIG) return;
  const revisa=async()=>{ if(document.hidden||!ESTC.ok) return;
    try{ const q=await SB.rpc('cartera_marcas_firma'); if(!q.error&&q.data&&q.data!==ESTC.firma) await recargaMarcas(); }catch(e){}
    // y lo que decidieron otros en las aplicaciones
    try{ const q=await SB.rpc('cartera_apl_firma'); if(!q.error&&q.data&&q.data!==APL.firma){ await cargaApl(); render(); } }catch(e){} };
  VIG=setInterval(revisa,60000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) revisa(); });
}

function boton(txt,cls,fn){ const b=el('button','btn'+(cls?' '+cls:''),txt); b.type='button'; b.onclick=fn; return b; }
// corre una acción con su botón ocupado; si falla, lo dice abajo
async function hazCon(b,fn,err){
  const t=b.textContent; b.disabled=true; b.textContent='Guardando…';
  try{ await fn(); return true; }
  catch(e){ if(err){ err.textContent=msgErr(e); err.hidden=false; } else avisaArriba(msgErr(e)); b.disabled=false; b.textContent=t; return false; }
}

/* ── marcar ── */
function hecho(d,est,n){
  if(!d) return;
  if(est==='normal') return avisaArriba(d.marcadas?'Listo: '+plural(d.marcadas,'factura cuenta','facturas cuentan')+' como siempre.':'Listo: se quitó el estatus.');
  if(est==='estrategia') return avisaArriba('Listo: '+plural(n,'factura marcada','facturas marcadas')+' como estrategia fiscal.');
  avisaArriba(d.estado==='por_aprobar'?'Listo: quedó «Por aprobar». Mientras lo aprueban, sigue sumando.':'Listo: ya no suma en los saldos ni en el IVA.');
}
async function marcaDocs(rows,estatus,motivo,comentario,cuenta){
  if(!rows.length) return;
  if(rows.some(r=>!r.uuid)) throw new Error('Todavía se están cargando los folios fiscales; intenta en un momento.');
  const items=rows.map(r=>({uuid:r.uuid,parte:r.parte,tipo:r.tipo,rfc_cp:D.cp[r.cp][0]||'',contraparte:D.cp[r.cp][1]||'',
    folio:[r.serie,r.folio].filter(Boolean).join(' '),fecha:r.fecha,mod:r.mod,cuenta:!!cuenta}));
  const q=await SB.rpc('cartera_marca',{p:{rfc:rfcDe(rows[0]),estatus,motivo:motivo||null,comentario:comentario||'',items}});
  if(q.error) throw q.error;
  S.sel=new Set(); await recargaMarcas(); hecho(q.data,estatus,rows.length);
  return q.data;
}
async function marcaEmpresa(ci,estatus,motivo,comentario){
  const q=await SB.rpc('cartera_marca',{p:{rfc:D.cli[ci][2],estatus,motivo:motivo||null,comentario:comentario||'',empresa_entera:true}});
  if(q.error) throw q.error;
  await recargaMarcas(); hecho(q.data,estatus,1);
  return q.data;
}

  { const nt=el('p','enota','¿Es estrategia fiscal? No la saques del reporte: usa el estatus «Estrategia fiscal», que sigue sumando y sale en el Excel.'); nt.style.margin='6px 0 14px'; body.appendChild(nt); }
  const c=el('label','fmot'); c.appendChild(el('span','k','Comentario (opcional; con «Otro», obligatorio)'));

// el estatus de un documento, en su detalle (y, en las facturas, para cambiarlo ahí mismo)
function bloqueEstatus(d){
  const b=el('div','estbox'); b.appendChild(el('div','k','Estatus en la cartera'));
  const t=el('div'); t.style.marginTop='6px'; t.appendChild(el('span','pill '+ST_CLS[d.st||'normal'],ST_LAB[d.st||'normal'])); b.appendChild(t);
  const l=x=>{ b.appendChild(el('div','l',x)); };
  if(d.por==='regla') l('Lo saca la regla automática «'+REGLAS_DEF[d.rg].lab+'». No suma en los saldos ni en el IVA.');
  else if(d.mk){
    const m=d.mk;
    if(d.por==='empresa') l('Por la empresa completa'+(m.estatus==='fuera'?' · '+motivoTxt(m.motivo):'')+'.');
    else if(m.estatus==='normal') l('Cuenta como siempre aunque su empresa o una regla lo sacara.');
    else if(m.estatus==='fuera') l('Motivo: '+motivoTxt(m.motivo)+(m.comentario?' · «'+m.comentario+'»':''));
    l('Lo marcó '+m.marco+' · '+cuando(m.marco_en)+(m.aprobo&&m.estado==='aprobada'&&m.aprobo!==m.marco?' · aprobó '+m.aprobo:''));
    if(m.estado==='por_aprobar') l('Mientras lo aprueban, sigue sumando.');
  } else l('Suma como siempre.');
  if(!(d.mod===0||d.mod===1)||!yoMarco()) return b;
  const a=el('div','acts'), err=el('p','eerr'); err.hidden=true;
  const listo=!!d.uuid;
  if(d.st!=='estrategia'){ const x=boton('Estrategia fiscal','o',()=>hazCon(x,()=>marcaDocs([d],'estrategia'),err)); x.disabled=!listo; a.appendChild(x); }
  if(d.st!=='fuera'&&d.st!=='por_aprobar'){ const x=boton('Fuera del reporte…','',()=>pideMotivo('Sacar del reporte',[d.serie,d.folio].filter(Boolean).join(' ')+' · '+(D.cp[d.cp][1]||''),'',
    (m,c)=>marcaDocs([d],'fuera',m,c))); x.disabled=!listo; a.appendChild(x); }
  if(d.por==='factura'&&d.mk&&d.mk.estatus!=='normal'&&quitaMarca(d.mk)){ const x=boton('Quitar estatus','l',()=>hazCon(x,()=>marcaDocs([d],'normal'),err)); a.appendChild(x); }
  if(yoApruebo()&&d.st==='fuera'&&d.por!=='factura'){ const x=boton('Que cuente','l',()=>hazCon(x,()=>marcaDocs([d],'normal','','',true),err)); x.disabled=!listo; a.appendChild(x); }
  if(!listo) l('Cargando su folio fiscal…');
  if(a.childNodes.length) b.appendChild(a);
  b.appendChild(err);
  return b;
}

/* ── Bitácora (3-nov-2026, pedido de Fernando Cadengo): quién marcó, aprobó, regresó o quitó cada estatus y quién
   prendió o apagó una regla, con cuándo y el antes y el después. Sale de lo que la base ya guarda (car_marcas nunca
   borra); quién ve qué lo decide cartera_bitacora() con la regla de siempre (lo que solo ve la dirección, solo a ella).
   La pantalla y el Excel son la pieza común js/bitacora.js (la misma de Variaciones y Activo fijo). ── */
function botonBitacora(){
  const b=el('button','xls','Bitácora'); b.type='button'; b.id='btn-bitacora';
  b.title='Quién cambió qué en los estatus de la cartera, y cuándo';
  b.onclick=()=>abreBitacora();
  return b;
}
const BIT_TIPOS=[{k:'estatus',t:'Estatus'},{k:'aprobo',t:'Aprobaciones'},{k:'regreso',t:'Regresos'},{k:'regla',t:'Reglas'},{k:'aplica',t:'Aplicaciones'}];
const APL_BIT={aplicada:'Aplicada',quitada:'Quitada',sugerida:'Lo que sugiere el CRM'};
const stTxt=k=>k==='normal'?'Que cuente':(ST_LAB[k]||k||'Sin estatus');
function filaBitacora(f){
  const obj=f.que==='regla'?'Regla automática: '+((REGLAS_DEF[f.regla]||{}).lab||f.regla)
    :f.uuid?((f.folio?'Factura '+f.folio:'Factura')+(f.contraparte?' · '+f.contraparte:'')):'Empresa completa';
  const base={id:f.id,hora:f.hora,quien:f.quien,cliente:f.empresa||'',rfc:f.rfc||'',objeto:obj};
  const mot=f.estatus==='fuera'&&f.motivo?'Motivo: '+f.motivo:'';
  // las aplicaciones de anticipos y notas de crédito (208): quién aplicó, quitó o regresó a lo sugerido
  if(f.que==='aplica') return Object.assign(base,{objeto:'Factura '+(f.folio||'')+' · '+(f.doc||'')+(f.contraparte?' · '+f.contraparte:''),
    tipo:'aplica',tipoTxt:f.despues==='aplicada'?'Aplicó':f.despues==='quitada'?'Quitó':'Regresó a lo sugerido',
    cambio:(APL_BIT[f.antes]||f.antes)+' → '+(APL_BIT[f.despues]||f.despues),detalle:'Demostrativo: no cambia saldos'});
  if(f.que==='regla') return Object.assign(base,{tipo:'regla',tipoTxt:f.activa?'Prendió regla':'Apagó regla',cambio:f.activa?'Apagada → Prendida':'Prendida → Apagada'});
  const ver=D.cli.some(c=>c[2]===f.rfc)?()=>verMarca({rfc:f.rfc,uuid:f.uuid,parte:f.parte||'k',estado:'regresada',estatus:'normal'}):null;
  if(f.que==='aprobo') return Object.assign(base,{tipo:'aprobo',tipoTxt:'Aprobó',cambio:'Fuera · por aprobar → Fuera del reporte',
    detalle:[mot,'Lo pidió '+f.pidio].filter(Boolean).join(' · '),abre:ver});
  if(f.que==='regreso') return Object.assign(base,{tipo:'regreso',tipoTxt:f.quito?'Quitó el estatus':'Regresó',cambio:stTxt(f.estatus)+' → Sin estatus',
    detalle:[f.nota&&!f.quito?'«'+f.nota+'»':'',f.pidio&&f.pidio!==f.quien?'Lo había puesto '+f.pidio:''].filter(Boolean).join(' · '),abre:ver});
  const por=f.estatus==='fuera'&&!f.aplicada;
  return Object.assign(base,{tipo:'estatus',tipoTxt:por?'Pidió sacar':f.antes?'Cambió el estatus':'Marcó',
    cambio:(f.antes?stTxt(f.antes):'Sin estatus')+' → '+(por?'Fuera · por aprobar':stTxt(f.estatus)),
    detalle:[mot,f.comentario?'«'+f.comentario+'»':''].filter(Boolean).join(' · '),abre:ver});
}
function abreBitacora(nota){
  if(S.cliente!=null) cierraOv();
  const body=el('div'); body.id='bit';
