/* ── «Agotar anticipos y notas» (5-nov-2026; pedido de Fernando Cadengo: «aplicarlo directamente hasta acabarme los mas de
   +70 cuidando las fechas de facturas y anticipos o notas»; a las reglas: «si asi es»; 263_cartera_agotar.sql). En la pestaña
   Aplicaciones de la ventana de una empresa: reparte, en centavos, lo que les queda a sus anticipos y notas de crédito a favor
   contra sus facturas vigentes con saldo del mismo cliente o proveedor, hasta acabarlos:
     1. lo que ya aceptó un contador se queda (con lo que le toca, como en la pestaña); lo decidido a mano no se toca;
     2. la nota o el anticipo con factura relacionada en su XML (Centauro) va solo contra esa factura; si ya no tiene saldo,
        está cancelada o se quitó esa relación, se queda sin aplicar y dice por qué (no se pasa a otra);
     3. las notas sin relación, contra facturas de su misma fecha o anteriores, de la más cercana hacia atrás;
     4. los anticipos sin relación, contra facturas de su misma fecha o posteriores, de la más vieja a la más nueva; en los
        grupos marcados «los anticipos son pagos parciales» (APL.pp, en la base), sin importar la fecha;
     5. nunca canceladas (en QUO o en el SAT), otro cliente o proveedor, ni más del saldo (esFacApl/esDocApl de siempre).
   Antes de guardar enseña el resumen por cliente o proveedor y por qué se queda algo sin aplicar. Guarda «Aceptada» con
   su monto y origen 'agotar' (de 300 en 300); «Deshacer lo de Agotar» regresa todo eso a lo sugerido. Demostrativo. ── */
const esNota=r=>r.mod===4||r.mod===5;
const fch=r=>r&&r.fecha?String(r.fecha).slice(0,10):'';
const AGO={lado:'2'};
function agotarPlan(ci,lado){
  const R=aplEmp(ci), rfc=D.cli[ci][2], pp=APL.pp.has(String(rfc).toUpperCase()), relX=SAT.rel.get(rfc)||null;
  const cen=v=>Math.round(v*100);
  const rF=new Map(), rD=new Map(), yaF=new Map(), yaD=new Map(), nuF=new Map(), nuD=new Map(), porque=new Map(), pares=[];
  R.fac.forEach((F2,f)=>{ if(lado==null||ladoFac(f)===lado) rF.set(f,cen(f.saldo)); });
  R.doc.forEach((X,d)=>{ if(lado==null||ladoDoc(d)===lado) rD.set(d,cen(-d.saldo)); });
  // 1. lo que ya aceptó un contador se queda
  R.fac.forEach(F2=>F2.apl.forEach(rl=>{ if(rl.dec!=='aplicada') return;
    rl.parte.forEach((m,d)=>{ const v=cen(m);
      if(rF.has(rl.fac)){ rF.set(rl.fac,Math.max(0,rF.get(rl.fac)-v)); yaF.set(rl.fac,(yaF.get(rl.fac)||0)+v); }
      if(rD.has(d)){ rD.set(d,Math.max(0,rD.get(d)-v)); yaD.set(d,(yaD.get(d)||0)+v); } }); }));
  const lleva=(d,f)=>f&&rF.get(f)>0&&!!f.uuid&&f.uuid.toUpperCase()!==d.uuid.toUpperCase()&&ladoFac(f)===ladoDoc(d)&&!aplDec(f,d);
  const da=(f,d,v)=>{ rF.set(f,rF.get(f)-v); rD.set(d,rD.get(d)-v); nuF.set(f,(nuF.get(f)||0)+v); nuD.set(d,(nuD.get(d)||0)+v); pares.push({f,d,m:v/100}); };
  const toma=(d,f)=>{ if(rD.get(d)>0&&lleva(d,f)) da(f,d,Math.min(rD.get(d),rF.get(f))); };
  const fOrd=(a,b)=>{ const x=fch(a)||'9999', y=fch(b)||'9999'; return x<y?-1:x>y?1:0; };
  const byU=new Map(); ROWS.forEach(r=>{ if(r.cli===ci&&r.uuid) byU.set(r.uuid.toUpperCase(),r); });
  const docs=[];
  [...rD.keys()].forEach(d=>{ if(rD.get(d)<=0) return; if(!d.uuid){ porque.set(d,'Sin folio fiscal (UUID)'); return; } docs.push(d); });
  docs.sort((a,b)=>fOrd(a,b)||rD.get(b)-rD.get(a));
  // 2. con factura relacionada en su XML: solo contra esa
  const conRel=new Set();
  docs.forEach(d=>{
    const us=relX?relX.get(d.uuid.toUpperCase()):null; if(!us||!us.size) return;
    const fs=[...us].map(u=>byU.get(u)||null).filter(r=>!r||r.mod===0||r.mod===1);
    if(!fs.length) return;
    conRel.add(d);
    const antes=rD.get(d);
    fs.filter(Boolean).sort(fOrd).forEach(f=>toma(d,f));
    if(rD.get(d)<=0) return;
    const ds=fs.filter(Boolean).map(f=>aplDec(f,d)).filter(Boolean);
    porque.set(d,rD.get(d)<antes||(yaD.get(d)||0)>0||ds.some(x=>x.e==='aplicada')?'Lo que sobra es de su factura relacionada (no se pasa a otra)'
      :fs.some(f=>f&&(f.est==='Cancelada'||f.satCan))?'Su factura relacionada está cancelada'
      :ds.some(x=>x.e==='quitada')?'Quitaron a mano su relación con su factura'
      :fs.some(f=>f&&f.st==='fuera')?'Su factura relacionada está fuera del reporte'
      :'Su factura relacionada ya no tiene saldo');
  });
  // el mismo cliente o proveedor (y lado): sus facturas con saldo, de la más vieja a la más nueva
  const gk=r=>(ladoFac(r)>=0?ladoFac(r):ladoDoc(r))+'#'+cpKey(r);
  const facsDe=new Map();
  rF.forEach((v,f)=>{ if(!f.uuid) return; const k=gk(f); let a=facsDe.get(k); if(!a) facsDe.set(k,a=[]); a.push(f); });
  facsDe.forEach(a=>a.sort((x,y)=>fOrd(x,y)||(x.uuid<y.uuid?-1:x.uuid>y.uuid?1:0)));
  const ini=new Map();   // por lista: la primera factura que todavía tiene saldo (las de antes ya se acabaron)
  const vivo=a=>{ let i=ini.get(a)||0; while(i<a.length&&!(rF.get(a[i])>0)) i++; ini.set(a,i); return i; };
  const conFecha=a=>{ let n=a.length; while(n>0&&!fch(a[n-1])) n--; return n; };   // las sin fecha van al final
  const primeroDesde=(a,fd,n)=>{ let lo=0, hi=n; while(lo<hi){ const m=(lo+hi)>>1; if(fch(a[m])<fd) lo=m+1; else hi=m; } return lo; };
  const sinFacturas='Este cliente o proveedor no tiene facturas con saldo';
  // 3. notas sin relación: contra facturas de su misma fecha o anteriores, de la más cercana hacia atrás
  docs.filter(d=>esNota(d)&&!conRel.has(d)).forEach(d=>{
    const a=facsDe.get(gk(d));
    if(!a||!a.length){ porque.set(d,sinFacturas); return; }
    const fd=fch(d); if(!fd){ porque.set(d,'La nota no tiene fecha'); return; }
    const n=conFecha(a), hasta=primeroDesde(a,fd+'~',n), desde=vivo(a);   // «~» va después de cualquier fecha: entra el mismo día
    for(let i=hasta-1;i>=desde&&rD.get(d)>0;i--) toma(d,a[i]);
    if(rD.get(d)>0) porque.set(d,hasta>0?'Ya no quedan facturas con saldo de su fecha o anteriores':'Sus facturas con saldo son posteriores a la nota');
  });
  // 4. anticipos sin relación: de su fecha en adelante (en un grupo de pagos parciales, sin importar la fecha)
  docs.filter(d=>!esNota(d)&&!conRel.has(d)).forEach(d=>{
    const a=facsDe.get(gk(d));
    if(!a||!a.length){ porque.set(d,sinFacturas); return; }
    if(pp){
      for(let i=vivo(a);i<a.length&&rD.get(d)>0;i++) toma(d,a[i]);
      if(rD.get(d)>0) porque.set(d,'Ya no quedan facturas con saldo de este cliente o proveedor');
      return;
    }
    const fd=fch(d); if(!fd){ porque.set(d,'El anticipo no tiene fecha'); return; }
    const n=conFecha(a), desde=Math.max(primeroDesde(a,fd,n),vivo(a));
    for(let i=desde;i<n&&rD.get(d)>0;i++) toma(d,a[i]);
    if(rD.get(d)>0) porque.set(d,primeroDesde(a,fd,n)<n?'Ya no quedan facturas con saldo de su fecha en adelante':'Sus facturas con saldo son anteriores al anticipo');
  });
  // el resumen por cliente o proveedor
  const G=new Map();
  const gr=r=>{ const k=gk(r); let x=G.get(k); if(!x) G.set(k,x={k,lado:ladoFac(r)>=0?ladoFac(r):ladoDoc(r),cp:r.cp,favor:0,ya:0,nuevo:0,queda:0,
    nd:0,cancela:0,reduce:0,mot:new Map()}); return x; };
  rD.forEach((v,d)=>{ const x=gr(d); x.favor+=cen(-d.saldo); x.ya+=yaD.get(d)||0; x.nuevo+=nuD.get(d)||0; x.queda+=Math.max(0,v); x.nd++;
    if(v>0){ const t=porque.get(d)||sinFacturas, m=x.mot.get(t)||{n:0,v:0}; m.n++; m.v+=v; x.mot.set(t,m); } });
  nuF.forEach((v,f)=>{ const x=gr(f); if(rF.get(f)<=0) x.cancela++; else x.reduce++; });
  const grupos=[...G.values()].filter(x=>x.favor>0).sort((a,b)=>b.favor-a.favor);
  const tot={favor:0,ya:0,nuevo:0,queda:0,cancela:0,reduce:0};
  G.forEach(x=>['favor','ya','nuevo','queda','cancela','reduce'].forEach(k=>{ tot[k]+=x[k]; }));
  return {pares,grupos,tot,pp,relOk:!!relX||SAT.ok,conRel:conRel.size};
}

async function guardaAgotar(ci,P,b,body,pie){
  if(!yoApl()||!P.pares.length) return;
  const rfc=D.cli[ci][2];
  const items=P.pares.map(x=>{ const cp=D.cp[x.f.cp]||['',''];
    return {parte:x.f.parte,tipo:x.f.tipo,rfc_cp:cp[0],contraparte:cp[1],fac:x.f.uuid,doc:x.d.uuid,folio_fac:folioDe(x.f),
      folio_doc:folioDe(x.d),accion:'aplicar',monto:x.m,origen:'agotar'}; });
  b.disabled=true; let hechos=0, err=null;
  for(let i=0;i<items.length;i+=300){
    b.textContent='Guardando… '+F.int.format(i)+' de '+F.int.format(items.length);
    let q; try{ q=await SB.rpc('cartera_apl_pon',{p:{rfc,items:items.slice(i,i+300)}}); }catch(e){ q={error:e}; }
    if(q.error){ err=q.error; break; }
    hechos+=Math.min(300,items.length-i);
  }
  if(!err){
    cierraOv2();
    await cargaApl(); render(); if(S.cliente!=null) pintaModal();
    avisaArriba('Listo: '+plural(items.length,'relación aceptada','relaciones aceptadas')+' (demostrativo). Se deshace con «Deshacer lo de Agotar».');
    return;
  }
  // si algo no se pudo, la ventana se queda abierta y lo dice arriba (cerrada, el mensaje quedaba atrás de la ventana de la
  // empresa y parecía que «no pasó nada»); el reparto se vuelve a calcular con lo que sí se guardó, para volver a intentar
  await cargaApl(); render(); if(S.cliente!=null) pintaModal();
  const txt=(hechos?'Se guardaron '+F.int.format(hechos)+' de '+F.int.format(items.length)+' relaciones; lo demás no se pudo'
    :'No se guardó ninguna relación')+': '+msgErr(err)+'.';
  if(body&&pie&&document.getElementById('ov2box').contains(body)){
    pintaAgotar(ci,body,pie);
    const m=el('div','actmsg err ago-err',txt); m.setAttribute('role','alert');
    body.insertBefore(m,body.firstChild);
    const sb=body.closest('.sheet-b'); if(sb) sb.scrollTop=0;
  } else avisaArriba(txt);
}

   clientes). Resultado positivo = a cargo; negativo = a favor. ── */
const IVA_MODS=[0,1,4,5];

  'IVA notas de crédito clientes','Saldo a favor periodos anteriores','Saldo IVA antes de estrategia','Estrategia fiscal',
  'Resultado IVA','IVA a cargo (en contra)','IVA a favor','Estatus','Observaciones',
  // el ISR retenido del saldo (3-nov-2026, pedido de Fernando): al final y solo informa; no entra en ninguna cuenta del IVA
  'ISR retenido por clientes (informativo)','ISR por retener a terceros (informativo)'];
const ivaEstatus=n=>n>0?'A CARGO':n<0?'A FAVOR':'SIN SALDO';

  const por=new Map();
  docs.forEach(r=>{ if(!IVA_MODS.includes(r.mod)) return; let l=por.get(r.cli); if(!l){ l=[]; por.set(r.cli,l); } l.push(r); });
  const rk=rangosPantalla(docs);
  return [...por.entries()].sort((a,b)=>rk.g(D.cli[a[0]][3])-rk.g(D.cli[b[0]][3])||rk.c(a[0])-rk.c(b[0])).map(([ci,l])=>{
    const c=D.cli[ci], o=sumaIva(l);

    const v=[o.tras,o.retC,o.acr,o.retP,o.ntcP,o.ntcC].map(cent);
    const antes=cent(v[0]-v[1]-v[2]+v[3]+v[4]-v[5]), res=cent(antes-est);
    return {g:c[3]||'Sin grupo',nom:c[1],rfc:c[2],cont:contDe(c),v,antes,est,res,isr:[cent(o.isrC),cent(o.isrP)]};
  });

  fl.font={name:fuente,italic:true,size:9,color:{argb:'FF808080'}};
  const n0=docs.filter(r=>IVA_MODS.includes(r.mod)).length;
  [['A'+R(3),'Alcance'],['B'+R(3),'Empresas'],['C'+R(3),'Fecha Corte'],['D'+R(3),'Documentos']].forEach(([a,v])=>{
    const x=ws.getCell(a); x.value=v; x.font={name:fuente,bold:true,size:10,color:{argb:azul}};
    x.fill={type:'pattern',pattern:'solid',fgColor:{argb:gris}}; x.border={bottom:{style:'thin',color:{argb:azul}}};
    x.alignment={horizontal:'center',vertical:'middle'};
  });
  [['A'+R(4),op.alcance||'Todos los clientes'],['B'+R(4),lista.length],['C'+R(4),corte],['D'+R(4),n0]].forEach(([a,v])=>{
    const x=ws.getCell(a); x.value=v; x.font={name:fuente,size:11};
    x.fill={type:'pattern',pattern:'solid',fgColor:{argb:gris}}; x.alignment={horizontal:'center',vertical:'middle'};
  });
  ws.getCell('C'+R(4)).numFmt='dd/mm/yyyy'; ws.getCell('D'+R(4)).numFmt='#,##0';
  ws.getRow(R(5)).height=5.1;
  for(let i=1;i<=nc;i++) ws.getCell(R(5),i).fill={type:'pattern',pattern:'solid',fgColor:{argb:MK.colores.naranja}};
  const nota=(fila,txt)=>{ ws.mergeCells('A'+fila+':'+colL(nc-1)+fila); const x=ws.getCell('A'+fila); x.value=txt;
    x.font={name:fuente,italic:true,size:9,color:{argb:'FF595959'}}; x.alignment={wrapText:true,vertical:'top'}; ws.getRow(fila).height=26; };
  nota(R(6),'El IVA del saldo: lo que falta por cobrar a clientes y por pagar a proveedores (el IVA de cada documento en '+
    'proporción a su saldo). Amarillo: se captura aquí (el saldo a favor de periodos anteriores no lo tiene el CRM). '+
    'Estrategia fiscal (naranja): el IVA de lo marcado «Estrategia fiscal», que no se considera y se resta. '+
    'Resultado positivo = a cargo (en contra); negativo = a favor; cada uno va en su columna como monto positivo.');
  nota(R(7),'Saldo antes de estrategia = Trasladado − Retenido por clientes − Acreditable + Retenido a terceros + '+
    'Notas de crédito proveedores − Notas de crédito clientes − Saldo a favor anterior · Resultado = Saldo antes de estrategia − Estrategia fiscal. '+
    'Las dos columnas de ISR retenido (al final) solo informan: no entran en el IVA.');
  const encab=(fila,cols)=>{ const h=ws.getRow(fila); h.height=40;
    cols.forEach((n,i)=>{ const x=h.getCell(i+1); x.value=n;
      x.font={name:fuente,bold:true,color:{argb:'FFFFFFFF'}}; x.fill={type:'pattern',pattern:'solid',fgColor:{argb:azul}};
      x.alignment={horizontal:'center',vertical:'middle',wrapText:true}; }); };
  const st=(n,col)=>'IF('+col+n+'>0,"A CARGO",IF('+col+n+'<0,"A FAVOR","SIN SALDO"))';
  const pinta=(x,arg)=>{ x.fill={type:'pattern',pattern:'solid',fgColor:{argb:arg}}; };
  // por cliente
  const lab=ws.getCell('A'+R(9)); lab.value='Por cliente'; lab.font={name:fuente,bold:true,size:12,color:{argb:azul}};
  const hdr=R(10), p1=hdr+1, p2=hdr+lista.length, ft=p2+1;
  encab(hdr,IVA_COLS);
  lista.forEach((x,k)=>{
    const n=p1+k, row=ws.getRow(n);
    const val=[x.g,x.nom,x.rfc,x.cont].concat(x.v,[null,
      {formula:'E'+n+'-F'+n+'-G'+n+'+H'+n+'+I'+n+'-J'+n+'-K'+n,result:x.antes},x.est,
      {formula:'L'+n+'-M'+n,result:x.res},{formula:'MAX(N'+n+',0)',result:Math.max(x.res,0)},
      {formula:'MAX(-N'+n+',0)',result:Math.max(-x.res,0)},{formula:st(n,'N'),result:ivaEstatus(x.res)},null].concat(x.isr));
    val.forEach((v,i)=>{ const c=row.getCell(i+1); c.value=v; c.font={name:fuente,size:10};
      if((i>=4&&i<=15)||i>=18) c.numFmt=RCX_MON; });
    pinta(row.getCell(11),AMA); pinta(row.getCell(18),AMA); pinta(row.getCell(13),NAR); pinta(row.getCell(14),VER);
    row.getCell(17).alignment={horizontal:'center'};
  });
  const tot=i=>cent(lista.reduce((a,x)=>a+[...x.v,0,x.antes,x.est,x.res,Math.max(x.res,0),Math.max(-x.res,0)][i-4],0));
  const rt=ws.getRow(ft); rt.getCell(1).value='TOTAL (respeta filtros)';
  for(let i=4;i<=15;i++) rt.getCell(i+1).value={formula:'SUBTOTAL(109,'+colL(i)+p1+':'+colL(i)+p2+')',result:tot(i)};
  rt.getCell(17).value={formula:st(ft,'N'),result:ivaEstatus(tot(13))};
  [18,19].forEach((i,j)=>{ rt.getCell(i+1).value={formula:'SUBTOTAL(109,'+colL(i)+p1+':'+colL(i)+p2+')',
    result:cent(lista.reduce((a,x)=>a+x.isr[j],0))}; });
  for(let i=1;i<=nc;i++){ const c=rt.getCell(i); c.font={name:fuente,size:10,bold:true,color:{argb:azul}};
    c.border={top:{style:'thin',color:{argb:azul}}}; if((i>=5&&i<=16)||i>=19) c.numFmt=RCX_MON; if(i===17) c.alignment={horizontal:'center'}; }
  ws.autoFilter={from:{row:hdr,column:1},to:{row:p2,column:nc}};
  // por grupo (solo en el Excel general): sale de la tabla de clientes, así que el saldo a favor capturado también suma
  if(op.grupos){
    const grupos=[]; lista.forEach(x=>{ if(!grupos.includes(x.g)) grupos.push(x.g); });
    const gl=ws.getCell('A'+(ft+3)); gl.value='Por grupo'; gl.font={name:fuente,bold:true,size:12,color:{argb:azul}};
    const gh=ft+4, gcols=['Grupo','Clientes'].concat(IVA_COLS.slice(4,17),IVA_COLS.slice(18)), rng=c=>'$'+c+'$'+p1+':$'+c+'$'+p2;
    encab(gh,gcols);
    grupos.forEach((g,k)=>{
      const n=gh+1+k, row=ws.getRow(n), mio=lista.filter(x=>x.g===g);
      const s=i=>cent(mio.reduce((a,x)=>a+[...x.v,0,x.antes,x.est,x.res,Math.max(x.res,0),Math.max(-x.res,0)][i-4],0));
      row.getCell(1).value=g;
      row.getCell(2).value={formula:'COUNTIF('+rng('A')+',A'+n+')',result:mio.length};
      for(let i=4;i<=15;i++) row.getCell(i-1).value={formula:'SUMIF('+rng('A')+',$A'+n+','+rng(colL(i))+')',result:s(i)};
      row.getCell(15).value={formula:st(n,'L'),result:ivaEstatus(s(13))};
      [18,19].forEach((i,j)=>{ row.getCell(i-2).value={formula:'SUMIF('+rng('A')+',$A'+n+','+rng(colL(i))+')',
        result:cent(mio.reduce((a,x)=>a+x.isr[j],0))}; });
      for(let i=1;i<=gcols.length;i++){ const c=row.getCell(i); c.font={name:fuente,size:10};
        if((i>=3&&i<=14)||i>=16) c.numFmt=RCX_MON; if(i===2) c.numFmt='#,##0'; if(i===15) c.alignment={horizontal:'center'}; }
    });
    const gf=gh+grupos.length+1, rg=ws.getRow(gf), g1=gh+1, g2=gh+grupos.length;
    rg.getCell(1).value='TOTAL';
    rg.getCell(2).value={formula:'SUM(B'+g1+':B'+g2+')',result:lista.length};
    for(let i=4;i<=15;i++) rg.getCell(i-1).value={formula:'SUM('+colL(i-2)+g1+':'+colL(i-2)+g2+')',result:tot(i)};
    rg.getCell(15).value={formula:st(gf,'L'),result:ivaEstatus(tot(13))};
    [16,17].forEach((i,j)=>{ rg.getCell(i).value={formula:'SUM('+colL(i-1)+g1+':'+colL(i-1)+g2+')',
      result:cent(lista.reduce((a,x)=>a+x.isr[j],0))}; });
    for(let i=1;i<=gcols.length;i++){ const c=rg.getCell(i); c.font={name:fuente,size:10,bold:true,color:{argb:azul}};
      c.border={top:{style:'thin',color:{argb:azul}}}; if((i>=3&&i<=14)||i>=16) c.numFmt=RCX_MON; if(i===2) c.numFmt='#,##0';
      if(i===15) c.alignment={horizontal:'center'}; }
  }
  ws.views=[{state:'frozen',ySplit:hdr,xSplit:2}];
  MK.impresion(ws,{repetir:hdr});
}
async function exportaGeneral(paso,modo){
  const espera=()=>new Promise(r=>setTimeout(r,30));
  paso('Preparando…'); await espera();
  const EX=await cargaExcelJS();
  let sel=seleccionGeneral(modo);
  if(!sel.docs.length||!sel.hojas.length) throw new Error(modo==='estrategia'?'No hay nada marcado como estrategia fiscal':'Ningún documento cumple con los filtros');
  paso('Bajando UUID…'); await espera();
  await cargaUuids([...new Set(sel.docs.map(r=>D.cli[r.cli][2]))]);
  sel=seleccionGeneral(modo);
  const corte=xd(M.generado||iso(TODAY));
  // grupos y clientes en el orden de la pantalla; dentro de cada cliente, por fecha
  const rk=rangosPantalla(sel.docs);
  const orden=(a,b)=>rk.g(D.cli[a.cli][3])-rk.g(D.cli[b.cli][3])||rk.c(a.cli)-rk.c(b.cli)
    ||(a.fecha||'').localeCompare(b.fecha||'')||String(a.quo).localeCompare(String(b.quo));
  const docs=sel.docs.slice().sort(orden);
  const empresas=new Set(docs.map(r=>r.cli)).size;
  const est=modo==='estrategia';
  const wb=window.PROFASE_MARCA.libro(EX,est?'Reporte de estrategia fiscal':'Reporte CXC CXP · general');
  paso('Armando resumen…'); await espera();
  hojaResumen(wb,docs,corte,{modo,mods:sel.mods,titulo:est?'REPORTE DE ESTRATEGIA FISCAL':null});
  paso('Armando saldos de IVA…'); await espera();
  hojaIva(wb,docs,corte,{modo,grupos:true});
  for(const h of sel.hojas){
    paso('Armando '+h.nombre+'…'); await espera();
    hojaRCX(wb,h,null,docs.filter(r=>h.mods.includes(r.mod)),corte,{empresas});
  }
  paso('Guardando archivo…'); await espera();
  const mm=String(TODAY.getMonth()+1).padStart(2,'0');
  const et=sel.hojas.map(h=>h.etq);
  const que=et.length>1?et.slice(0,-1).join(' ')+' y '+et[et.length-1]:et[0];
  return descargaXlsx(wb,(mm+(est?' Reporte estrategia fiscal':' Reporte '+que+' General')).replace(/[\\/:*?"<>|]+/g,' ').replace(/\s+/g,' ').trim()+'.xlsx');
}
