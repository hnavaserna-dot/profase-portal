<!doctype html><html lang="es" data-rol="todos" data-incrustada="1"><head><meta charset="utf-8"><script>/* Cierre temporal del portal (30-oct-2026, pedido de Daniel cuando la base se trabó: «cierra temporalmente crm»;
   «Saca a todos del CRM con ese aviso y cuando quede ya les avisamos»).
   construir.py lo pone escrito al principio del <head> de cada página que arma (y va a mano en index.html), antes de
   cualquier otro script. Lee cierre.json, que vive en la raíz de profase-portal (no pasa por la base), y si dice
   "cerrado": true detiene la página y lleva a cerrado.html, que avisa y regresa sola al portal en cuanto cierre.json
   diga false. Si la página va en un marco, se lleva a la de arriba. Guarda a dónde iba cada quien para regresarlo ahí.
   Solo en crmprofase.com.mx: en las pruebas locales no hace nada (salvo con window.__PRUEBA_CIERRE).
   Si cierre.json no llega, la página sigue normal. No lee ni escribe nada de la base. */
(function () {
  'use strict';
  if (!/(^|\.)crmprofase\.com\.mx$/.test(location.hostname) && !window.__PRUEBA_CIERRE) return;
  if (/\/cerrado\.html$/.test(location.pathname)) return;
  // la llamada del soporte de Quo (sala.html?marca=quo, Q Chat): nunca lleva a la pantalla de cierre de PROFASE (PROFASE no
  // sale en los sistemas Quo); si la base no contesta, la misma sala lo dice con la marca de Quo
  if (/\/sala\.html$/.test(location.pathname) && /[?&]marca=quo(?:&|$)/.test(location.search)) return;
  var j = null;
  try {
    var x = new XMLHttpRequest();
    x.open('GET', '/cierre.json?t=' + Date.now(), false);
    x.send(null);
    if (x.status === 200) j = JSON.parse(x.responseText);
  } catch (e) { j = null; }
  if (!j || j.cerrado !== true) return;
  // «hasta» (2-nov-2026, Daniel: «no dejes ingresar al sistema hasta las nueve A.M.»): a esa hora abre solo
  if (j.hasta && !isNaN(Date.parse(j.hasta)) && Date.now() >= Date.parse(j.hasta)) return;
  var w = window;
  try { if (window.top && window.top.location.host === location.host) w = window.top; } catch (e) { w = window; }
  try {
    var r = w.location.pathname + w.location.search + w.location.hash;
    if (!/cerrado\.html/.test(r)) sessionStorage.setItem('profase-regreso', r);
  } catch (e) { /* sin almacenamiento: regresa a la entrada */ }
  try { window.stop(); } catch (e) { /* navegador viejo */ }
  try { w.location.replace('/cerrado.html'); } catch (e) { location.replace('/cerrado.html'); }
})();</script><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Portal PROFASE · Depuración de CxC / CxP</title><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><script src="js/supabase.js?v=bb37eb706b"></script><script src="js/portal.js?v=001f58e6e8"></script><script src="js/marca.js?v=8eb6f0cb8f"></script><script src="js/bitacora.js?v=a62c64c724"></script><script src="js/seguimiento.js?v=a86447d818"></script><script src="js/buscador.js?v=514b1d6650"></script><script src="js/ocultos.js?v=6fbbeb4ec0"></script><script src="js/quo-al-dia.js?v=bc76e2910d"></script><script src="js/filtros.js?v=0836a918f4"></script><script src="js/pilas.js?v=d4504a5f5b"></script><script src="js/hallazgos.js?v=62d93270b0"></script><script src="js/paginas.js?v=6ea2a01361"></script><script src="js/cartera-datos.js?v=8bc48cd41e"></script></head><body>

.abre{background:var(--surface-2);border:none;border-radius:999px;width:28px;height:28px;cursor:pointer;color:var(--ink-2);font-size:15px}
.abre:hover{background:var(--line)}
td.ab{width:40px;padding-left:4px}

/* ── cuadros sobre fondo desenfocado ── */
.ov{position:fixed;inset:0;background:rgba(8,16,26,.42);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  z-index:60;display:grid;place-items:center;
  padding:max(14px,env(safe-area-inset-left,0px)) max(14px,env(safe-area-inset-right,0px))}
.ov[hidden]{display:none!important}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:16px;width:min(560px,100%);
  max-height:min(760px,88vh);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 64px rgba(6,14,24,.36)}
.sheet-h{display:flex;align-items:center;gap:12px;padding:16px 18px 13px;flex:none;border-bottom:1px solid var(--line-2)}
.sheet-h h3{font-size:16px;font-weight:700;letter-spacing:-.01em}
.sheet-h .sub{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.sheet-b{padding:15px 18px;overflow:auto;min-height:0;flex:1}
.sheet-f{display:flex;gap:9px;justify-content:space-between;align-items:center;padding:12px 18px;
  border-top:1px solid var(--line-2);flex:none;flex-wrap:wrap}
.mx{background:var(--surface-2);border:none;width:30px;height:30px;border-radius:9px;cursor:pointer;
  color:var(--ink-2);font-size:15px;line-height:1;flex:none;margin-left:auto}
.mx:hover{background:var(--line)}
.btn{background:var(--brand);color:#fff;border:none;border-radius:9px;padding:8px 16px;font-size:13px;
  font-weight:600;cursor:pointer}
.btn.g{background:var(--surface-2);color:var(--ink-2)}
.grp{margin-bottom:16px}
.grp:last-child{margin-bottom:0}
.grp .glab{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);font-weight:600;
  display:block;margin-bottom:7px}
.grp .chips{display:flex;gap:7px;flex-wrap:wrap}

/* calendario */
.cal{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:12px}
.cal-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
.cal-h .m{font-weight:600;font-size:13.5px}
.cal-h button{background:var(--surface-2);border:none;width:26px;height:26px;border-radius:7px;cursor:pointer;color:var(--ink-2)}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-g .wd{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);text-align:center;
  font-weight:600;padding-block:3px}
.cal-g button{background:none;border:none;border-radius:7px;padding:6px 0;font-size:12.5px;cursor:pointer;
  font-variant-numeric:tabular-nums}
.cal-g button:hover{background:var(--surface-2)}
.cal-g button.out{color:var(--ink-3);opacity:.45}
.cal-g button.in{background:color-mix(in srgb,var(--brand) 11%,transparent)}
.cal-g button.end{background:var(--brand);color:#fff;font-weight:600}
.cal-g button[disabled]{opacity:.25;cursor:default}
.dates{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.dates label{display:block}
.dates .k{font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.dates input{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;
  padding:7px 10px;margin-top:3px;font-family:var(--f-num);font-size:13px}

/* ── ventana de documentos ── */
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;width:min(1680px,calc(100vw - 28px));
  height:94vh;max-height:94vh;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 24px 64px rgba(6,14,24,.34)}
.wbtns{display:flex;gap:6px;margin-left:auto;flex:none}
.wbtns .mx{margin-left:0}
.mh{display:flex;gap:13px;align-items:flex-start;padding:18px 20px 15px;flex:none;flex-wrap:wrap}
.mh .av{width:38px;height:38px;border-radius:11px;font-size:13px}
.mh .eyebrow{font-size:9.5px;letter-spacing:.13em}
.mh h3{font-family:var(--f-dis);font-size:19px;font-weight:700;letter-spacing:-.015em;margin-top:2px}
.mh .rfc{font-family:var(--f-num);font-size:11.5px;color:var(--ink-3);margin-top:2px}
.mh .ct{margin-top:7px}
.mstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:1px;background:var(--line-2);
  border-top:1px solid var(--line-2);flex:none}
.mstat{background:var(--surface);padding:12px 20px;min-width:0}
.mstat .k{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.mstat .v{font-family:var(--f-dis);font-size:18px;font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums}
.mstat .ln{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--ink-2);margin-top:3px}
.mstat .ln b{font-family:var(--f-num);font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.mtabs .pend{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.tfil{display:flex;flex-wrap:wrap;gap:8px 18px;padding:10px 18px;border-bottom:1px solid var(--line-2);flex:none}
.tfil .fi{display:flex;flex-direction:column;gap:4px;min-width:0}
.tfil .fi>span{font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.tfil .chips{display:flex;gap:5px;flex-wrap:wrap}
.tfil .chip{padding:4px 10px;font-size:11.5px}
.tfil .chip small{opacity:.8;margin-left:4px;font-family:var(--f-num)}
.aplv{padding:34px 22px;text-align:center;color:var(--ink-2);max-width:62ch;margin:0 auto;font-size:13px}
.aplv .k{display:inline-block;margin-bottom:10px}
.mtabsrow{display:flex;align-items:center;gap:12px;padding:9px 18px 0;border-bottom:1px solid var(--line-2);
  flex:none;flex-wrap:wrap}
.mtabs{display:flex;gap:2px;overflow-x:auto}
.mtabs button{background:none;border:none;border-bottom:2px solid transparent;padding:7px 10px 9px;
  font-size:13px;color:var(--ink-2);cursor:pointer;display:inline-flex;gap:7px;align-items:center;white-space:nowrap}
.mtabs button[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
.mtabs .cnt{background:var(--surface-2);border-radius:999px;padding:1px 7px;font-size:10.5px;color:var(--ink-3)}
.mtabs button[aria-selected="true"] .cnt{background:color-mix(in srgb,var(--brand) 13%,transparent);color:var(--brand)}
.mbody{display:grid;grid-template-columns:minmax(0,1fr) 360px;min-height:0;flex:1 1 auto;overflow:hidden}
/* filtros dentro de la ventana del cliente */
.mfil{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:flex-end;padding:10px 18px;border-bottom:1px solid var(--line-2);
  background:var(--surface-3);flex:none}
.mfil .fi{display:flex;flex-direction:column;gap:3px;min-width:0}
.mfil .fi>span{font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.mfil input{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12.5px;min-width:0}
.mfil input.cpq{width:300px;max-width:62vw}
.mfil input.nn{width:96px;font-family:var(--f-num)}
.mfil .rng{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-3)}
.mfil .chips{display:flex;gap:5px;flex-wrap:wrap}
.mfil .chip{padding:4px 10px;font-size:11.5px}
.cpsel{display:inline-flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--brand) 9%,var(--surface));
  border:1px solid color-mix(in srgb,var(--brand) 30%,transparent);border-radius:999px;padding:3px 4px 3px 11px;font-size:12px}
.cpsel b{font-weight:600;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cpsel button{background:var(--surface);border:none;border-radius:999px;width:22px;height:22px;cursor:pointer;color:var(--ink-2)}
.minibtn{background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);border-radius:8px;padding:5px 10px;
  font-size:12px;cursor:pointer;margin-top:10px}
.minibtn:hover{border-color:var(--ink-3)}
.wbtns .xlbtn{margin-top:0;height:30px;white-space:nowrap;align-self:center}
.wbtns .xlbtn:disabled{opacity:.7;cursor:default}
.topacc{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.topacc .xlgen{margin-top:0;white-space:nowrap}
.topacc .xlgen:disabled{opacity:.7;cursor:default}
.mlist{overflow:auto;overscroll-behavior:contain;min-height:0}
/* lista de documentos: cada pestaña trae sus columnas (contraparte primero, que se estira); las demás tienen su ancho.
   Qué se esconde lo decide acomodaLista() con lo que suman las columnas de esa pestaña y lo que mide la lista (4-nov-2026,
   lo vio Fernando Barbosa en Facturas: con muchas columnas, «Cliente o proveedor» se quedaba sin ancho y el nombre salía
   letra por letra): primero las de prioridad baja (Plantilla, Tipo, Cuenta contable, Relación y las retenciones: p4 y
   rt), luego las de prioridad media (p3: Folio, Fecha, Total, Monto y Rol, que también trae el detalle); si aún no cabe,
   la tabla se desliza de lado dentro de su recuadro con el nombre (y la casilla) fijo a la izquierda. Solo en el celular
   (o una lista muy angosta) se esconden también las p2, para no deslizar la página.
   «Cliente o proveedor» nunca queda más angosto que --cpmin. */
.mlist{container-type:inline-size;container-name:dl}
.dhead,.drow{display:flex;align-items:center;gap:12px}
.dhead > *,.drow > *{flex:0 0 var(--w,90px);min-width:0}
.dhead > .g,.drow > .g{flex:1 1 auto}
.dhead > .ch,.drow > .ch{flex:0 0 14px}
.dc.r{text-align:right}
.dc.tx{font-size:12px;color:var(--ink-2);overflow-wrap:anywhere}
.dc.mo{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.dc.mo.b{font-weight:600}
.dhead .ordb{width:100%}
.dhead .r .ordb{justify-content:flex-end}
/* que «Contraparte» nunca quede tan angosta que su título se encime (con las casillas de Facturas, 2-nov-2026) */
.mlist :is(.dhead,.drow,.dtot) > .g{min-width:var(--cpmin,120px)}
.mlist:is([data-oc="1"],[data-oc="2"],[data-oc="3"]) :is(.dhead,.drow,.dtot) > :is(.p4,.rt),
.mlist:is([data-oc="2"],[data-oc="3"]) :is(.dhead,.drow,.dtot) > .p3,
.mlist[data-oc="3"] :is(.dhead,.drow,.dtot) > .p2{display:none}
/* cada título en su columna, en una línea: si no cupiera, se corta (el título completo sale al pasar el cursor) */
.dhead > :not(.ck){overflow:hidden}
/* los totales de abajo en una línea, alineados con sus columnas */
.dtot > .g{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* el nombre en negritas en 1 o 2 renglones (completo al pasar el cursor y en el detalle); abajo sus datos */
.mlist .dt1{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
/* cuando no caben: la tabla se desliza de lado dentro de su recuadro, con el nombre y la casilla fijos a la izquierda */
.mlist.ancha :is(.dhead,.dsel,.dtot),.mlist.ancha > .drow{min-width:var(--fila)}
.mlist.ancha,.ov .modal .mlist.ancha{overflow-x:auto}
.mlist.ancha .dtots{width:max-content;min-width:100%}
.mlist.ancha .dtot{background:var(--surface)}
.mlist.ancha :is(.dhead,.drow,.dtot) > .g{position:sticky;left:0;z-index:1;background:var(--surface);
  box-shadow:8px 0 10px -10px rgba(16,32,48,.35)}
.mlist.ancha .drow:hover > .g,.mlist.ancha .drow[aria-current="true"] > .g{background:var(--surface-3)}
.mlist.ancha .dsel > .ck,.mlist.ancha :is(.dhead,.dtot).consel > .ck{position:sticky;left:0;z-index:2;background:var(--surface);align-self:stretch}
.mlist.ancha :is(.dhead,.dtot).consel > .g,.mlist.ancha .dsel .drow > .g{left:38px}
/* el renglón TOTAL de la lista (2-nov-2026, pedido de Fernando): las mismas columnas que la lista, pegado abajo al
   deslizar y con lo que pasa los filtros; si hay clientes y proveedores, un renglón por lado (no se mezclan) */
.dtots{position:sticky;bottom:0;z-index:1;background:var(--surface);border-top:2px solid var(--line);
  box-shadow:0 -6px 16px rgba(6,14,24,.07)}
.dtots.suelto{position:static;box-shadow:none}
.dtot{display:flex;align-items:center;gap:12px;padding:10px 20px}
.dtot + .dtot{border-top:1px solid var(--line-2)}
.dtot > *{flex:0 0 var(--w,90px);min-width:0}
.dtot > .g{flex:1 1 auto}
.dtot > .ch{flex:0 0 14px}
.dtot.consel{padding-left:0}
.dtot.consel > .ck{flex:0 0 26px}
.dtot .k{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--ink-2)}
.dtot .k small{display:block;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink-3);font-size:11px;margin-top:1px}
.dtot .dc.mo{font-weight:700;color:var(--ink)}
.dhead{gap:12px;padding:9px 20px;
  font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600;
  border-bottom:1px solid var(--line-2);position:sticky;top:0;background:var(--surface);z-index:1}
.dhead .r{text-align:right}
.dhead > *{font:inherit;color:inherit;letter-spacing:inherit}
.c-tip .tp{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.03em;padding:2px 8px;border-radius:999px;white-space:nowrap}
.c-tip .mp{display:block;font-size:10.5px;color:var(--ink-3);margin-top:2px}
.c-fec{font-family:var(--f-num);font-weight:600;font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.c-dia{text-align:right;font-family:var(--f-num);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.c-dia small{display:block;font-family:var(--f-ui);font-size:10.5px;color:var(--ink-3)}
.c-sal,.c-tot{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.c-sal{font-weight:600}
.c-tot{color:var(--ink-2)}
.c-est{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.drow{
  width:100%;padding:11px 20px;border:none;border-bottom:1px solid var(--line-2);background:none;
  text-align:left;cursor:pointer;font:inherit;color:inherit}
.drow:hover{background:var(--surface-3)}
.drow[aria-current="true"]{background:var(--surface-3);box-shadow:inset 3px 0 0 var(--brand)}
.dmain{display:flex;align-items:center;gap:10px;min-width:0}
.dic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;
  font-family:var(--f-dis);font-size:11px;font-weight:700}
.dtx{min-width:0}
/* el nombre se lee completo: si no cabe pasa entero al siguiente renglón (3-nov-2026, con las columnas de retenciones) */
.dt1{font-weight:600;font-size:12.5px;overflow-wrap:break-word}
.dt2{font-size:11px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dnum{text-align:right}
.dnum .a{font-family:var(--f-num);font-weight:600;font-variant-numeric:tabular-nums}
.dnum .b{font-size:11px;color:var(--ink-3);font-family:var(--f-num)}
.dfec .a{font-weight:600} .dfec .b{font-size:11px;color:var(--ink-3)}
.chev{color:var(--ink-3);font-size:13px}
.mside{border-left:1px solid var(--line-2);background:var(--surface-3);overflow:auto;overscroll-behavior:contain;padding:16px 18px;min-height:0}   /* el lado de la ventana se desliza solo, sin llevarse la lista (11-nov-2026) */
.mside .hd{display:flex;align-items:flex-start;gap:10px;margin-bottom:13px}
.mside .hd .k{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.mside .hd h4{font-size:16px;font-weight:700;margin-top:2px}
.saldobox{background:color-mix(in srgb,var(--cli) 10%,var(--surface));
  border:1px solid color-mix(in srgb,var(--cli) 28%,transparent);border-radius:11px;padding:12px 14px;margin-bottom:14px}
.saldobox .k{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.saldobox .v{font-family:var(--f-dis);font-size:23px;font-weight:700;letter-spacing:-.025em;margin-top:3px;
  font-variant-numeric:tabular-nums}
.saldobox .u{font-size:11px;color:var(--ink-3);margin-left:5px;font-weight:500}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px 12px}
.sgrid .f{min-width:0}
.sgrid .f.w{grid-column:1/-1}
.sgrid .k{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.sgrid .v{margin-top:3px;font-size:13px;word-break:break-word}
.sgrid .v.num{font-family:var(--f-num);font-size:12px}
.sgrid .sep{grid-column:1/-1;height:1px;background:var(--line-2)}
.mside .vacio{color:var(--ink-3);font-size:13px;text-align:center;padding:40px 10px}
.conc{display:flex;flex-direction:column;gap:5px;margin-top:7px;padding:0}
.conc li{list-style:none;padding:6px 10px;background:var(--surface-2);border-radius:8px;font-size:12.5px}
.nodata{color:var(--ink-3);font-size:12.5px;margin-top:5px}

@media (max-width:820px){
  .mbody{grid-template-columns:1fr}
  .mside{border-left:none;border-top:1px solid var(--line-2)}
  .dates{grid-template-columns:1fr}
}
@media (max-width:860px){
  .main{padding-block:12px 26px}
  th:first-child,td:first-child{min-width:180px}
}
@container (max-width:1000px){
  .mbody{grid-template-columns:minmax(0,1fr) 300px}
}
@container (max-width:720px){
  .mbody{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .mside{border-left:none;border-top:1px solid var(--line-2);max-height:45%;overflow:auto}
}

/* portal */
.alc{font-size:11.5px;color:var(--ink-3)}
.foot2{font-size:11.5px;color:var(--ink-3);margin:2px 0 14px}

/* ── estatus de la cartera: «Estrategia fiscal» y «Fuera del reporte» (2-nov-2026) ── */
.p-est{background:color-mix(in srgb,var(--accent) 17%,transparent);color:color-mix(in srgb,var(--accent) 62%,var(--ink))}
.p-pap{background:color-mix(in srgb,var(--warn) 17%,transparent);color:var(--warn)}
.p-fue{background:color-mix(in srgb,var(--ink-3) 20%,transparent);color:var(--ink-2)}
.p-ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.drow.fuera .dt1,.drow.fuera .dc.mo{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--ink-3) 70%,transparent)}
.drow.fuera{opacity:.78}
.dsel{display:flex;align-items:stretch;border-bottom:1px solid var(--line-2)}
.dsel > .drow{border-bottom:none;flex:1 1 auto;min-width:0;padding-left:6px}
.ck{flex:0 0 32px;display:flex;align-items:center;justify-content:flex-end;cursor:pointer;margin:0}
.ck input{width:18px;height:18px;margin:0;accent-color:var(--brand);cursor:pointer}
.dhead.consel{padding-left:0}
.dhead.consel > .ck{flex:0 0 26px}
.selbar{position:sticky;bottom:0;z-index:2;display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 14px;
  background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 16px rgba(6,14,24,.08)}
.selbar .n{font-size:12.5px;font-weight:600;margin-right:auto;min-width:0}
.selbar .n small{display:block;font-weight:400;color:var(--ink-3);font-size:11px}
.selbar .btn{padding:7px 13px;font-size:12.5px}
.btn.o{background:var(--accent)}
.btn.l{background:none;color:var(--ink-2);border:1px solid var(--line)}
.btn[disabled]{opacity:.55;cursor:default}
.estbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:13px}
.estbox .k{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.estbox .l{font-size:12.5px;color:var(--ink-2);margin-top:6px;overflow-wrap:anywhere}
.estbox .acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}

   lista de empresas con cuatro columnas. La ventana de cada empresa pasó a ser una ficha de página completa (abajo). ══ */
.topbar{margin-bottom:0}

async function cargaCartera(avance,pre){

async function cargaUuids(rfcs){

  pre.uuids=async fs=>{
    const [qm,qa,qs]=await Promise.all([pre.marcas,pre.apl,pre.sat]);
    const ids=[]; CD.rfcsQueUsan(qm,qa,qs).forEach(r=>['k|','p|'].forEach(t=>{ if(fs[t+r]) ids.push(t+r); }));
    try{ await traeUuids(ids,id=>fs[id]); }catch(e){}
  };
  const r=await cargaCartera(avance,pre);
  if(!r){ v.innerHTML='<div class="empty">Todavía no hay datos de la cartera. Llegan con la próxima actualización del portal.</div>'; return; }
  if(recarga&&CARGADA===r.meta.id) return;
  const abierto=S.cliente!=null?D.cli[S.cliente][2]:null;
  // entre paso y paso se le deja respirar al navegador (todo ya llegó: sin esto, todo el armado era un solo bloque largo)
  const respira=()=>new Promise(res=>setTimeout(res,0));
  aplica(r.meta,r.filas,r.extra); prep(!!recarga); CARGADA=r.meta.id; TODOS_UUID=null;
  await respira(); await cargaMarcas(pre.marcas); aplicaMarcas();
  await respira(); await cargaApl(pre.apl);
  await cargaSat(pre.sat);
  await cargaCan(pre.can); await respira();
  if(!recarga) restauraFiltros();
  // con datos nuevos cambian los números de las contrapartes: el filtro de cliente o proveedor de la ventana se quita
  if(abierto){ const i=D.cli.findIndex(c=>c[2]===abierto); S.cliente=i>=0?i:null; S.doc=null; if(S.mf) S.mf.cps=new Set(); quitaVF();
    if(i<0) cierraOv(); else cargaUuids([abierto]).then(()=>pintaModal()); }
  render();
  precargaApl();
  if(recarga) avisaArriba('Llegaron datos nuevos de la cartera ('+fmtD(M.generado)+' '+M.hora+').');
  if(ABRE_PEND!=null){ const x=ABRE_PEND; ABRE_PEND=null; setTimeout(()=>abreDesdeAviso(x),60); }
}

/* ── Resumen de saldos (3-nov-2026: el concepto de Gabriel Cavazos; lo pidió Fernando). Arriba, el buscador, el botón
   FILTROS (js/filtros.js, con sus pestañas Cliente, Documento, Antigüedad, Personas y Estatus), Excel y PDF con lo
   filtrado y, debajo, solo las etiquetas de lo escogido. Luego el IVA (emitidas, recibidas y el neto), las tarjetas por
   rubro y las barras de antigüedad (las dos filtran al picarlas) y la lista por empresa, que se ordena con ▼▲. Lo que se
   escoge se recuerda en este navegador (por usuario). Todo sale de lo que la página ya recibe para cada quien. ── */
const AGE4=[{k:'0-30',lab:'0–30 días',ks:['0-30'],c:'--ok'},{k:'31-60',lab:'31–60',ks:['31-60'],c:'--cli'},
  {k:'61-90',lab:'61–90',ks:['61-90'],c:'--warn'},{k:'90+',lab:'Más de 90',ks:['91-180','181-365','>365'],c:'--crit'}];
const age4De=r=>r.age==null?null:(AGE4.find(a=>a.ks.includes(r.age))||AGE4[3]).k;
/* el estatus de cada documento en el resumen: dentro del reporte, revisar en el origen (su saldo pasa del total de su
   CFDI), fuera del reporte (el estatus de la cartera) o cancelado. Por omisión se ven y suman los dos primeros, como
   antes. En la ventana de cada empresa lo cancelado lo decide su propio filtro (Plantilla › Estatus). */
const EST_DEF=['dentro','origen'];
const EST_LAB={dentro:'Dentro del reporte',origen:'Revisar en el origen',fuera:'Fuera del reporte',sat:'Canceladas en el SAT',can:'Cancelados'};
// «Canceladas en el SAT» (214, de Centauro): vigentes en QUO pero canceladas en el SAT; por omisión no suman (como lo cancelado)
const catDe=(r,ven)=>(!ven&&r.est==='Cancelada')?'can':(!ven&&r.satCan)?'sat':r.st==='fuera'?'fuera':r.alerta?'origen':'dentro';
// persona física (RFC de 13) o moral (de 12), por el RFC de la empresa
const personaDe=rfc=>{ const n=String(rfc||'').trim().length; return n===13?'F':n===12?'M':'—'; };
const RUBRO_LAB=['Cuentas por cobrar','Cuentas por pagar','Anticipos de clientes','Anticipos a proveedores',
  'Notas de crédito a clientes','Notas de crédito de proveedores','Terceros'];
const mismoSet=(a,b)=>a.size===b.size&&[...a].every(x=>b.has(x));
const modBase=()=>mismoSet(S.mod,new Set(MODS_BASE));
const ICQ_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>';

/* ¿el documento pasa los filtros del resumen? sinMod: sin el rubro (las tarjetas); sinAge: sin la antigüedad (sus barras);
   sinEst: sin el estatus (sus números); ven: para la ventana de una empresa (sin rubro, sin los filtros de empresa y sin
   lo cancelado, que lo decide la ventana) */
function pasa(r,o){
  o=o||{};
  // «Mis clientes ocultos» (js/ocultos.js, 172 y 217): los que ocultó quien entró y los que se ocultan solos (sin
  // contabilidad activa) no salen en la lista ni en la búsqueda; la ventana de una empresa que se abre a propósito (como
  // «Ver su cartera» de «Inactivas») sí enseña lo suyo
  if(!o.ven&&OCU(D.cli[r.cli][2])) return false;
  if(!o.sinMod&&!o.ven&&!S.mod.has(r.mod)) return false;
  if(!o.sinEst){
    if(!S.estc.has(catDe(r,o.ven))) return false;
    if(S.marca.size&&!S.marca.has(r.st)) return false;
    if(S.motivo.size&&!S.motivo.has(r.mot||'—')) return false;
  }
  // Aplicaciones (FILTROS › Aplicaciones): las empresas con aplicaciones posibles y el estado de la relación
  if(!o.ven&&(S.aplE.size||S.aplT.size)&&!pasaApl(r)) return false;
  if(!o.sinAge&&S.age4.size&&r.age&&!S.age4.has(age4De(r))) return false;
  if(S.mon.size&&!S.mon.has(r.mon)) return false;
  if(S.anios.size&&!S.anios.has((r.fecha||'').slice(0,4))) return false;
  if(S.mp.size&&(r.mod===0||r.mod===1)&&!S.mp.has(r.mp)) return false;
  if(S.pl.size&&!S.pl.has(r.pl||'—')) return false;
  if(!o.ven){
    if(S.clis.size&&!S.clis.has(r.rfcCli)) return false;
    if(S.grupos.size&&!S.grupos.has(r.grupo||'Sin grupo')) return false;
    if(S.per.size&&!S.per.has(personaDe(r.rfcCli))) return false;
    if(S.reg.size&&!(r.reg&&S.reg.has(r.reg))) return false;
    if(S.cont.size&&!r.cont.some(c=>S.cont.has(c))) return false;
  }
  if(S.q){
    const cp=D.cp[r.cp], q=S.q;
    let ok=(cp[1]||'').toLowerCase().includes(q)||(cp[0]||'').toLowerCase().includes(q)
      ||r.uuid.toLowerCase().includes(q)||r.quo.includes(q)||r.cliNom.toLowerCase().includes(q)||r.rfcCli.toLowerCase().includes(q);
    if(!ok) ok=((r.serie||'')+(r.folio||'')).toLowerCase().includes(q)||(r.folio||'').toLowerCase().includes(q);
    if(!ok) ok=[r.cc,r.proy,r.cta].some(x=>x&&String(x).toLowerCase().includes(q));
    if(!ok) return false;
  }
  return true;
}

const OCU=rfc=>!!(window.PROFASE_OCULTOS&&window.PROFASE_OCULTOS.es(rfc));

/* lo escogido se recuerda en este navegador, por usuario (solo es comodidad: si no se puede, empieza limpio) */
const F_SETS=['clis','grupos','per','reg','mon','anios','mp','pl','age4','cont','estc','marca','motivo','aplE','aplT'];
const FKEY=()=>'cartera.filtros:'+((YO&&YO.id)||'');
function guardaFiltros(){
  try{ const o={mod:[...S.mod],sort:S.sort,dir:S.dir}; F_SETS.forEach(k=>{ o[k]=[...S[k]]; }); localStorage.setItem(FKEY(),JSON.stringify(o)); }catch(e){}
}
function restauraFiltros(){
  let o=null; try{ o=JSON.parse(localStorage.getItem(FKEY())||'null'); }catch(e){ o=null; }
  if(!o||typeof o!=='object') return;
  // solo lo que existe hoy en lo que ve esta persona
  const ok={clis:new Set(D.cli.map(c=>c[2])),grupos:new Set(D.cli.map(c=>c[3]||'Sin grupo')),per:new Set(['F','M','—']),
    reg:new Set(M.regimenes),mon:new Set(D.monedas),anios:new Set(ROWS.map(r=>(r.fecha||'').slice(0,4)).filter(Boolean)),
    mp:new Set(['PUE','PPD','—']),pl:new Set(ROWS.map(r=>r.pl||'—')),age4:new Set(AGE4.map(a=>a.k)),cont:new Set(M.contadores),
    estc:new Set(Object.keys(EST_LAB)),marca:new Set(['estrategia','por_aprobar']),motivo:new Set(MOTIVOS.map(x=>x[0]).concat('—')),
    aplE:new Set(APL_EMP.map(x=>x[0])),aplT:new Set(APL_EST.map(x=>x[0]))};
  F_SETS.forEach(k=>{ if(Array.isArray(o[k])) S[k]=new Set(o[k].map(String).filter(v=>ok[k].has(v))); });
  if(!S.estc.size) S.estc=new Set(EST_DEF);
  if(Array.isArray(o.mod)){ const m=o.mod.map(Number).filter(i=>Number.isInteger(i)&&i>=0&&i<=TER); if(m.length) S.mod=new Set(m); }
  if(COLS_EMP.some(c=>c[0]===o.sort)){ S.sort=o.sort; S.dir=o.dir===1?1:-1; }
}
function limpiaResumen(){
  S.mod=new Set(MODS_BASE); F_SETS.forEach(k=>{ S[k]=new Set(); }); S.estc=new Set(EST_DEF); S.q='';
  const i=document.getElementById('car-q'); if(i) i.value='';
}

/* las pestañas del botón FILTROS del resumen (js/filtros.js; una sola versión de los filtros del portal) */
const cuentaPor=(f,rows)=>{ const o={}; (rows||ROWS).forEach(r=>{ const k=f(r); if(k!=null) o[k]=(o[k]||0)+1; }); return o; };
const empPor=f=>{ const o={}; D.cli.forEach(c=>{ const k=f(c); if(k!=null) o[k]=(o[k]||0)+1; }); return o; };
// un campo de varios: con pocas opciones va en botones (con su número en el nombre); con muchas, lista con buscador
function campoVarios(k,t,opsFn,extra){
  extra=extra||{};
  const ops=()=>{ const o=opsFn(); const seg=o.length<=8&&!extra.buscar&&!extra.lista;
    return o.map(x=>({v:String(x.v),t:seg&&x.n!=null?x.t+' · '+x.n:x.t,n:seg?null:x.n,base:x.t})); };
  return Object.assign({k,t,tipo:'varios',opciones:ops,
    chip:vals=>{ if(vals.length>2) return F.int.format(vals.length); const o=ops(); return vals.map(v=>{ const x=o.find(y=>y.v===v); return x?x.base:v; }).join(', '); },
    valor:()=>[...S[k]].map(String),pon:v=>{ S[k]=new Set(v.map(String)); }},extra);
}
function gruposResumen(){
  const n=x=>F.int.format(x);
  const porNom=(o,lab)=>Object.keys(o).sort((a,b)=>String(lab?lab(a):a).localeCompare(String(lab?lab(b):b),'es')).map(k=>({v:k,t:lab?lab(k):k,n:n(o[k])}));
  const porNum=(o,lab)=>Object.keys(o).sort((a,b)=>o[b]-o[a]||String(a).localeCompare(String(b),'es')).map(k=>({v:k,t:lab?lab(k):k,n:n(o[k])}));
  const g=[
    {t:'Cliente',campos:[
      campoVarios('clis','Cliente',()=>{ const d=cuentaPor(r=>r.rfcCli); return D.cli.filter(c=>!OCU(c[2])).map(c=>({v:c[2],t:c[1]||c[2],n:n(d[c[2]]||0)})).sort((a,b)=>a.t.localeCompare(b.t,'es')); },{buscar:true}),
      campoVarios('grupos','Grupo',()=>porNom(empPor(c=>c[3]||'Sin grupo')),{buscar:true}),
      campoVarios('per','Persona',()=>{ const o=empPor(c=>personaDe(c[2])); return [['M','Moral'],['F','Física']].filter(x=>o[x[0]]).map(([v,t])=>({v,t,n:n(o[v])})); }),
      campoVarios('reg','Régimen',()=>porNum(empPor(c=>c[5]==null?null:M.regimenes[c[5]])),{lista:true})
    ]},
    {t:'Documento',campos:[
      campoVarios('mod','Rubro',()=>{ const o=cuentaPor(r=>r.mod); return RUBRO_LAB.map((t,i)=>({v:i,t,n:n(o[i]||0)})).filter(x=>o[x.v]); },
        {valor:()=>modBase()?[]:[...S.mod].map(String),pon:v=>{ S.mod=v.length?new Set(v.map(Number)):new Set(MODS_BASE); },lista:true}),
      campoVarios('mon','Moneda',()=>porNum(cuentaPor(r=>r.mon))),
      campoVarios('anios','Año del CFDI',()=>{ const o=cuentaPor(r=>r.fecha?r.fecha.slice(0,4):null); return Object.keys(o).sort().reverse().map(k=>({v:k,t:k,n:n(o[k])})); }),
      campoVarios('mp','Método de pago',()=>{ const o=cuentaPor(r=>(r.mod===0||r.mod===1)?r.mp:null); return ['PUE','PPD','—'].filter(k=>o[k]).map(k=>({v:k,t:k==='—'?'Sin dato':k,n:n(o[k])})); }),
      campoVarios('pl','Plantilla',()=>porNum(cuentaPor(r=>r.pl||'—'),k=>k==='—'?'Sin plantilla':k),{lista:true})
    ]},
    {t:'Antigüedad',campos:[
      campoVarios('age4','Antigüedad',()=>{ const o=cuentaPor(age4De); return AGE4.map(a=>({v:a.k,t:a.lab,n:n(o[a.k]||0)})); })
    ]},
    {t:'Personas',campos:[
      campoVarios('cont','Contador asignado',()=>{ const o={}; D.cli.forEach(c=>{ if(!OCU(c[2])) (c[4]||[]).forEach(i=>{ const x=M.contadores[i]; o[x]=(o[x]||0)+1; }); }); return porNum(o); },{buscar:true})
    ]},
    {t:'Estatus',campos:[
      campoVarios('estc','Estatus',()=>{ const o=cuentaPor(r=>catDe(r),ROWS.filter(r=>pasa(r,{sinEst:true})));
        return Object.keys(EST_LAB).map(k=>({v:k,t:EST_LAB[k],n:n(o[k]||0)})); },{defecto:EST_DEF})
    ]}
  ];
  // Aplicaciones de anticipos y notas de crédito (4-nov-2026): empresas con aplicaciones y el estado de la relación
  g.push({t:'Aplicaciones',campos:[
    campoVarios('aplE','Empresas',()=>{ const o=empPor(c=>{ const i=D.cli.indexOf(c); return OCU(c[2])?null:aplHay(i)?'con':'sin'; });
      return APL_EMP.filter(x=>o[x[0]]).map(([v,t])=>({v,t,n:n(o[v])})); }),
    campoVarios('aplT','Estado de la relación',()=>{ const o={}; ROWS.forEach(r=>{ if(ladoFac(r)<0) return; aplEstados(r).forEach(k=>{ o[k]=(o[k]||0)+1; }); });
      return APL_EST.filter(x=>o[x[0]]).map(([v,t])=>({v,t,n:n(o[v])})); })
  ]});
  if(ESTC.ok){
    const est=g[4].campos;
    est.push(campoVarios('marca','Marca',()=>{ const o=cuentaPor(r=>r.st==='estrategia'||r.st==='por_aprobar'?r.st:null);
      return ['estrategia','por_aprobar'].filter(k=>o[k]).map(k=>({v:k,t:ST_LAB[k],n:n(o[k])})); }));
    est.push(campoVarios('motivo','Motivo',()=>{ const o=cuentaPor(r=>r.mot||null); return MOTIVOS.map(x=>x[0]).filter(k=>o[k]).map(k=>({v:k,t:motivoTxt(k),n:n(o[k])})); }));
  }

   puestos al cambiar de pestaña o de empresa (menos el cliente o proveedor, que es de cada empresa) */
const nuevoMF=()=>({cps:new Set(),smin:'',smax:'',age:new Set(),desde:'',hasta:'',pl:new Set(),est:new Set(),
  trol:new Set(),tnat:new Set(),tcta:new Set(),q:''});

const MF_KEY=()=>'cartera.ventana:'+((YO&&YO.id)||'');
function guardaMF(){
  try{ const f=S.mf, o={smin:f.smin,smax:f.smax,desde:f.desde,hasta:f.hasta}; MF_SETS.forEach(k=>{ o[k]=[...f[k]]; });
    localStorage.setItem(MF_KEY(),JSON.stringify(o)); }catch(e){}
}
function mfGuardado(){
  const f=nuevoMF();
  try{ const o=JSON.parse(localStorage.getItem(MF_KEY())||'null');
    if(o&&typeof o==='object'){
      ['smin','smax'].forEach(k=>{ if(typeof o[k]==='string'&&o[k].length<24) f[k]=o[k]; });
      ['desde','hasta'].forEach(k=>{ if(typeof o[k]==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(o[k])) f[k]=o[k]; });
      MF_SETS.forEach(k=>{ if(Array.isArray(o[k])) f[k]=new Set(o[k].map(String).slice(0,500)); });
    } }catch(e){}
  return f;
}
function pasaMF(r,conSat){
  const f=S.mf; if(!f) return conSat===true||(!r.satCan&&!esCanQuo(r));
  if(r.satCan&&conSat!==true&&!f.est.has('SAT')) return false;   // no suma: solo en «Canceladas» o con su estatus
  if(esCanQuo(r)&&conSat!==true&&!f.est.has('Cancelada')) return false;   // igual las canceladas en QUO: solo en su pestaña o con su estatus
  if(f.cps.size&&!f.cps.has(r.cp)) return false;
  const a=Math.abs(r.saldo), s1=numMF(f.smin), s2=numMF(f.smax);
  if(s1!=null&&!(a>s1)) return false;
  if(s2!=null&&!(a<s2)) return false;
  if(f.age.size&&!(r.age&&f.age.has(r.age))) return false;
  if(f.desde&&(!r.fecha||r.fecha<f.desde)) return false;
  if(f.hasta&&(!r.fecha||r.fecha>f.hasta)) return false;
  if(f.pl.size&&!f.pl.has(r.pl||'—')) return false;
  if(f.est.size&&conSat!==true&&!f.est.has(r.est==='Cancelada'?'Cancelada':r.satCan?'SAT':'Vigente')) return false;
  if(r.mod===TER){
    if(f.trol.size&&!f.trol.has(rolGrupo(r))) return false;
    if(f.tnat.size&&!f.tnat.has(naturaleza(r))) return false;
    if(f.tcta.size&&!f.tcta.has(r.cta||'—')) return false;
  }
  if(f.q){
    const cp=D.cp[r.cp], q=f.q;
    const ok=[cp[1],cp[0],r.uuid,r.quo,[r.serie,r.folio].filter(Boolean).join(' '),r.folio].some(x=>x&&String(x).toLowerCase().includes(q));
    if(!ok) return false;
  }
  return true;
}

/* qué columnas caben en la lista de la ventana (4-nov-2026; ver el CSS de .mlist): se mide la lista y se suman los
   anchos de las columnas de esa pestaña (los mismos --w de cada celda). Primero se esconden las de prioridad baja (p4 y
   las retenciones), luego p3; si aún no cabe y la lista se desliza sola, se desliza de lado con el nombre fijo; si no
   (celular), se esconden también las p2. Se vuelve a medir cuando la lista cambia de ancho (ventana, detalle, zoom). */
let RO_LISTA=null;
function vigilaLista(lista){
  if(RO_LISTA){ RO_LISTA.disconnect(); RO_LISTA=null; }
  acomodaLista(lista);
  if(window.ResizeObserver){ let w0=lista.clientWidth; RO_LISTA=new ResizeObserver(()=>{ const w=lista.clientWidth; if(w!==w0){ w0=w; acomodaLista(lista); } }); RO_LISTA.observe(lista); }
}
function acomodaLista(lista){
  const hd=lista.querySelector('.dhead')||lista.querySelector('.drow'); if(!hd) return;
  const W=lista.clientWidth; if(!W) return;
  const cs=getComputedStyle(hd), gap=parseFloat(cs.columnGap)||12;
  const pad=(parseFloat(cs.paddingLeft)||0)+(parseFloat(cs.paddingRight)||0);
  const nivel=x=>x.classList.contains('p4')||x.classList.contains('rt')?1:x.classList.contains('p3')?2:x.classList.contains('p2')?3:9;
  const it=[...hd.children].map(x=>{ const g=x.classList.contains('g');
    const w=g?0:x.classList.contains('ch')?14:x.classList.contains('ck')?26:(parseFloat(x.style.getPropertyValue('--w'))||90);
    return {g,w,n:g?9:nivel(x)}; });
  const resto=L=>{ const v=it.filter(x=>x.n>L); return pad+v.reduce((a,x)=>a+x.w,0)+gap*Math.max(0,v.length-1); };
  // celular: la ventana completa se desliza hacia abajo (la lista no se desliza sola: si no cabe, se desliza de lado)
  const movil=matchMedia('(max-width:819px)').matches;
  const tope=movil||W<600?3:2, quiere=W<600?136:240;
  let L=0; while(L<tope&&resto(L)+quiere>W) L++;
  // en el celular el nombre cede hasta 120 antes de que la lista se deslice de lado
  const cp=movil?Math.max(120,Math.min(quiere,W-resto(L))):quiere, fila=resto(L)+cp;
  lista.dataset.oc=String(L);
  lista.style.setProperty('--cpmin',cp+'px');
  const ancha=fila>W+1;
  lista.classList.toggle('ancha',ancha);
  lista.classList.toggle('tablebox',ancha);   // se desliza de lado a propósito, como una tabla (la prueba de pantallas lo reconoce)
  if(ancha) lista.style.setProperty('--fila',Math.ceil(fila)+'px'); else lista.style.removeProperty('--fila');
}

/* ── Estatus de la cartera (2-nov-2026: petición de Fernando con la idea y los bocetos de Gabo; la autorizó Daniel a las
   13:43, «autorízala; ya me la enseñó Cadengo»). Cada factura, o la empresa entera, puede llevar un estatus:
   · «Estrategia fiscal»: sigue sumando; se filtra y tiene su reporte (Excel y PDF con la marca).
   · «Fuera del reporte»: con motivo de la lista; deja de sumar en los saldos y el IVA cuando está aprobado. Lo que pide
     quien no aprueba queda «Por aprobar» y, mientras, sigue sumando. Se ve con «Mostrar fuera del reporte».
   Marca quien ve la cartera de esa empresa; aprueban la dirección y quienes ven toda la cartera. Las reglas automáticas
   (RFC genérico nacional y nómina) sacan solas lo que les toca; se pueden apagar y nunca borran nada. Lo que se marca en
   una factura manda sobre la regla y la regla sobre lo de la empresa. Todo lo decide la base (portal/sql/144, funciones
   cartera_*); esta página solo pinta y llama a esas funciones. ── */
const MOTIVOS=[['estrategia','Estrategia fiscal'],['rfc_generico','RFC genérico'],['no_deducible','No deducible'],['nomina','Nómina'],
  ['servicio','Servicio (agua, luz…)'],['ya_no_cliente','Ya no es cliente'],['otro','Otro']];
const motivoTxt=k=>(MOTIVOS.find(x=>x[0]===k)||[k,k||'—'])[1];
const ST_LAB={normal:'Normal',estrategia:'Estrategia fiscal',por_aprobar:'Fuera · por aprobar',fuera:'Fuera del reporte'};
const ST_CLS={estrategia:'p-est',por_aprobar:'p-pap',fuera:'p-fue',normal:'p-cl'};
const REGLAS_DEF={
  rfc_generico:{lab:'RFC genérico nacional',motivo:'rfc_generico',
    sub:'Todo lo que tiene como contraparte el RFC genérico XAXX010101000 (público en general). El genérico del extranjero (XEXX010101000) sí cuenta.',
    pasa:r=>String(D.cp[r.cp][0]||'').trim().toUpperCase()==='XAXX010101000'},
  nomina:{lab:'Nómina',motivo:'nomina',
    sub:'Lo que en su plantilla o su clasificación diga «nómina». Hoy Quo no manda recibos de nómina a la cartera; si llegan, salen solos.',
    pasa:r=>/N[OÓ]MINA/i.test((r.pl||'')+' '+(r.cl||''))}
};
const ESTC={ok:false,puede:{},reglas:{},marcas:[],firma:null,porUuid:new Map(),porRfc:new Map()};
let ABRE_PEND=null, EXC=null, VIG=null;
const yoMarco=()=>ESTC.ok&&!!ESTC.puede.marcar&&!(window.PORTAL&&window.PORTAL.consulta);
const yoApruebo=()=>yoMarco()&&!!ESTC.puede.aprobar;
const rfcDe=r=>D.cli[r.cli][2];
const viva=CD.viva;
const stDe=m=>m.estatus==='fuera'?(m.estado==='por_aprobar'?'por_aprobar':'fuera'):m.estatus==='estrategia'?'estrategia':'normal';
const cuando=x=>{ try{ return window.PROFASE_HORA?window.PROFASE_HORA.fechaHora(x):fmtD(String(x).slice(0,10)); }catch(e){ return ''; } };
const msgErr=e=>String((e&&(e.message||e.details||e.hint))||e||'No se pudo').replace(/^.*?ERROR:\s*/,'');
// ¿puede quitarle a esta marca su estatus? (la base lo vuelve a revisar)
const quitaMarca=m=>!!m&&yoMarco()&&(yoApruebo()||m.mia||m.estatus==='estrategia'||m.motivo==='sin_estrategia');
/* «Sin estrategia fiscal (solo esta factura)» (359; ajuste de Gabo, Fernando Cadengo, 11-nov-2026): una marca «normal» de una
   factura que solo dice que no va en la estrategia fiscal de su empresa. Manda solo mientras su empresa esté en «Estrategia
   fiscal»; no le gana a una regla automática ni a «Fuera del reporte» (no es «Que cuente»). */
const sinEst=m=>!!m&&m.motivo==='sin_estrategia';
const empEst=rfc=>{ const e=ESTC.porRfc.get(rfc); return !!e&&e.estatus==='estrategia'; };
// ¿a esta factura se le puede quitar la «Estrategia fiscal»? (la suya o la de su empresa completa)
const quitaEst=r=>r.st==='estrategia'&&(r.por==='empresa'?yoMarco():r.por==='factura'&&quitaMarca(r.mk));

async function cargaMarcas(pq){
  let q; try{ q=await (pq||SB.rpc('cartera_marcas')); }catch(e){ q={error:e}; }
  if(!q||q.error||!q.data){ ESTC.ok=false; ESTC.reglas={}; ESTC.porUuid=new Map(); ESTC.porRfc=new Map(); return false; }
  const d=q.data; ESTC.ok=true; ESTC.puede=d.puede||{}; ESTC.reglas={}; (d.reglas||[]).forEach(r=>{ ESTC.reglas[r.clave]=r; });
  ESTC.marcas=d.marcas||[]; ESTC.firma=d.firma||null; ESTC.porUuid=new Map(); ESTC.porRfc=new Map();
  ESTC.marcas.filter(viva).forEach(m=>{
    if(m.uuid) ESTC.porUuid.set(m.rfc+'|'+String(m.uuid).toUpperCase()+'|'+m.parte,m);
    else if(!ESTC.porRfc.has(m.rfc)||m.parte==='k') ESTC.porRfc.set(m.rfc,m);
  });
  // para que las sumas salgan bien, los folios fiscales de las empresas que tienen facturas marcadas
  if(ROWS.length){
    const rs=[...new Set(ESTC.marcas.filter(m=>m.uuid&&viva(m)).map(m=>m.rfc))].filter(r=>!UUID_OK.has(r)&&(RANGO['k|'+r]||RANGO['p|'+r]));
    if(rs.length){ try{ await cargaUuids(rs); }catch(e){} }
  }
  return true;
}
function estatusDe(r){
  const rfc=rfcDe(r);
  const m=r.uuid?ESTC.porUuid.get(rfc+'|'+r.uuid.toUpperCase()+'|'+r.parte):null;
  if(m&&!sinEst(m)) return {st:stDe(m),m,por:'factura',mot:m.motivo};
  for(const k in REGLAS_DEF){ const g=ESTC.reglas[k]; if(g&&g.activa&&REGLAS_DEF[k].pasa(r)) return {st:'fuera',rg:k,por:'regla',mot:REGLAS_DEF[k].motivo}; }
  const e=ESTC.porRfc.get(rfc);
  if(e&&m&&e.estatus==='estrategia') return {st:'normal',m,por:'factura',mot:m.motivo};   // sin estrategia: solo esta factura
  if(e) return {st:stDe(e),m:e,por:'empresa',mot:e.motivo};
  return {st:'normal',por:null,mot:null};
}
function aplicaMarcas(){
  if(!ROWS) return;
  ROWS.forEach(r=>{ const x=estatusDe(r); r.st=x.st; r.mk=x.m||null; r.rg=x.rg||null; r.por=x.por; r.mot=x.mot; });
  aplLimpia();   // lo «Fuera del reporte» no se aplica: las relaciones se vuelven a armar
}
async function recargaMarcas(){
  await cargaMarcas(); aplicaMarcas(); render();
  if(SEG.cu) SEG.cu();
  if(EXC&&document.getElementById('exc')) pintaExcluidos();
}
// la huella cambia cuando alguien marca, aprueba, regresa o cambia una regla: cada minuto (y al volver a la pestaña)
function vigilaMarcas(){
  if(VIG) return;
  // con su marco escondido no pregunta (revisión de la noche del 10-nov-2026); al volver a enseñarse, al día
  const seVe=()=>window.PORTAL&&PORTAL.aLaVista?PORTAL.aLaVista():!document.hidden;
  let dormida=false;
  window.addEventListener('resize',()=>{ if(dormida&&seVe()){ dormida=false; revisa(); } });
  const revisa=async()=>{ if(!seVe()){ dormida=true; return; } if(!ESTC.ok) return;
    try{ const q=await SB.rpc('cartera_marcas_firma'); if(!q.error&&q.data&&q.data!==ESTC.firma) await recargaMarcas(); }catch(e){}
    // y lo que decidieron otros en las aplicaciones
    try{ const q=await SB.rpc('cartera_apl_firma'); if(!q.error&&q.data&&q.data!==APL.firma){ await cargaApl(); render(); } }catch(e){} };
  VIG=setInterval(revisa,60000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) revisa(); });
}

async function hazCon(b,fn,err){

/* ── marcar ── */
function hecho(d,est,n,sin){
  if(!d) return;
  if(est==='normal'&&sin) return avisaArriba('Listo: '+plural(sin,'factura ya no va','facturas ya no van')+' en la estrategia fiscal; las demás de la empresa siguen igual.');
  if(est==='normal') return avisaArriba(d.marcadas?'Listo: '+plural(d.marcadas,'factura cuenta','facturas cuentan')+' como siempre.':'Listo: se quitó el estatus.');
  if(est==='estrategia') return avisaArriba('Listo: '+plural(n,'factura marcada','facturas marcadas')+' como estrategia fiscal.');
  avisaArriba(d.estado==='por_aprobar'?'Listo: quedó «Por aprobar». Mientras lo aprueban, sigue sumando.':'Listo: ya no suma en los saldos ni en el IVA.');
}
async function marcaDocs(rows,estatus,motivo,comentario,cuenta){
  if(!rows.length) return;
  if(rows.some(r=>!r.uuid)) throw new Error('Todavía se están cargando los folios fiscales; intenta en un momento.');
  // «Quitar estatus» a una factura que está en estrategia por su empresa completa: solo esa factura deja la estrategia (359)
  const sin=r=>estatus==='normal'&&!cuenta&&r.st==='estrategia'&&empEst(rfcDe(r));
  const items=rows.map(r=>Object.assign({uuid:r.uuid,parte:r.parte,tipo:r.tipo,rfc_cp:D.cp[r.cp][0]||'',contraparte:D.cp[r.cp][1]||'',
    folio:[r.serie,r.folio].filter(Boolean).join(' '),fecha:r.fecha,mod:r.mod,cuenta:!!cuenta},sin(r)?{sin_estrategia:true}:{}));
  const nSin=items.filter(x=>x.sin_estrategia).length;
  const q=await SB.rpc('cartera_marca',{p:{rfc:rfcDe(rows[0]),estatus,motivo:motivo||null,comentario:comentario||'',items}});
  if(q.error) throw q.error;
  S.sel=new Set(); await recargaMarcas(); hecho(q.data,estatus,rows.length,nSin);
  return q.data;
}
async function marcaEmpresa(ci,estatus,motivo,comentario){
  const q=await SB.rpc('cartera_marca',{p:{rfc:D.cli[ci][2],estatus,motivo:motivo||null,comentario:comentario||'',empresa_entera:true}});
  if(q.error) throw q.error;
  await recargaMarcas(); hecho(q.data,estatus,1);

}

/* ── Seguimiento y comentarios (4-nov-2026, pedido de Fernando Cadengo: «hay que unificar una sola pantalla para
   comentarios y seguimiento»). La misma ventana de Variaciones y Activo fijo (js/seguimiento.js, PROFASE_SEG): los mismos
   cinco estatus de revisión con sus reglas y la misma plática, en cada factura y en la empresa completa. Es aparte de
   «¿Cuenta en el reporte?» (Suma normal / Estrategia fiscal / Fuera del reporte), que no cambia. Todo lo decide la base
   (230: cartera_seg, cartera_seg_guarda, cartera_seg_com): ve y comenta quien ve la cartera de la empresa; la parte que
   solo ve la dirección, solo la dirección; la Gerencia Contable recibe las consultas. ── */
const SEG={rfc:null,ok:false,puede:{},rev:new Map(),com:new Map(),cu:null};
const segK=(u,p)=>String(u||'').toUpperCase()+'|'+(p||'k');
async function cargaSeg(rfc){
  if(!window.PROFASE_SEG||!rfc) return false;
  let q; try{ q=await SB.rpc('cartera_seg',{p:{rfc}}); }catch(e){ q={error:e}; }
  if(SEG.rfc!==rfc&&S.cliente!=null&&D.cli[S.cliente][2]!==rfc) return false;
  if(!q||q.error||!q.data){ SEG.ok=false; return false; }
  const d=q.data; SEG.rfc=rfc; SEG.ok=true; SEG.puede=d.puede||{}; SEG.rev=new Map(); SEG.com=new Map();
  (d.rev||[]).forEach(r=>SEG.rev.set(segK(r.uuid,r.parte),r));
  (d.com||[]).forEach(c=>{ const k=segK(c.uuid,c.parte); if(!SEG.com.has(k)) SEG.com.set(k,[]); SEG.com.get(k).push(c); });
  revisadasDe(rfc);
  return true;
}
const segListo=d=>SEG.ok&&!!d&&SEG.rfc===rfcDe(d);
const segSe=d=>segListo(d)&&!!d.uuid&&d.mod!==TER;
const segDe=d=>segSe(d)?SEG.rev.get(segK(d.uuid,d.parte))||null:null;
const segComDe=d=>segSe(d)?SEG.com.get(segK(d.uuid,d.parte))||[]:[];
function segPill(id,txt){ const w=document.createElement('span'); w.innerHTML=PROFASE_SEG.pill(id,txt); return w.firstChild; }
// ¿cambia el estatus y comenta? (la base lo vuelve a revisar): quien ve la cartera de la empresa, nunca de solo consulta;
// lo que solo ve la dirección, solo la dirección
const segPuedo=parte=>SEG.ok&&!!SEG.puede.marca&&!SEG.puede.consulta&&!(window.PORTAL&&window.PORTAL.consulta)&&(parte!=='p'||!!SEG.puede.dir);
const segItem=d=>({uuid:d.uuid,tipo:d.tipo,rfc_cp:D.cp[d.cp][0]||'',contraparte:D.cp[d.cp][1]||'',folio:[d.serie,d.folio].filter(Boolean).join(' ')});
const segHilo=k=>(SEG.com.get(k)||[]).map(c=>({id:c.id,por:c.por||'',porNombre:c.porNombre||'',ts:c.ts||'',tsISO:c.tsISO||'',
  texto:c.texto||'',editado:!!c.editado,de:c.de,est:c.est}));
const segQuien=r=>!r||!r.quien?'Nadie la ha revisado todavía'
  :PROFASE_SEG.esc(r.quien)+(r.rol==='gc'?' (Gerencia Contable)':r.rol==='contador'?' (contador)':'')+(r.ts?' · '+PROFASE_SEG.esc(r.ts):'');

async function segGuarda(rfc,items,c){

  if(q.error) return msgErr(q.error);

function botonBitacora(){

const BIT_TIPOS=[{k:'estatus',t:'Estatus'},{k:'aprobo',t:'Aprobaciones'},{k:'regreso',t:'Regresos'},{k:'regla',t:'Reglas'},{k:'aplica',t:'Aplicaciones'},
  {k:'revision',t:'Revisión'},{k:'comentario',t:'Comentarios'}];
const APL_BIT={aplicada:'Aplicada',quitada:'Quitada',sugerida:'Lo que sugiere el CRM'};
const stTxt=k=>k==='normal'?'Que cuente':(ST_LAB[k]||k||'Sin estatus');
function filaBitacora(f){
  const obj=f.que==='regla'?'Regla automática: '+((REGLAS_DEF[f.regla]||{}).lab||f.regla)
    :f.uuid?((f.folio?'Factura '+f.folio:'Factura')+(f.contraparte?' · '+f.contraparte:'')):'Empresa completa';
  const base={id:f.id,hora:f.hora,quien:f.quien,cliente:f.empresa||'',rfc:f.rfc||'',objeto:obj};
  const mot=f.estatus==='fuera'&&f.motivo?'Motivo: '+f.motivo:'';
  // las aplicaciones de anticipos y notas de crédito (208): quién aplicó, quitó o regresó a lo sugerido
  if(f.que==='aplica') return Object.assign(base,{objeto:'Factura '+(f.folio||'')+' · '+(f.doc||'')+(f.contraparte?' · '+f.contraparte:''),
    tipo:'aplica',tipoTxt:f.despues==='aplicada'?'Aplicó':f.despues==='quitada'?'Quitó':'Regresó a lo sugerido',
    cambio:(APL_BIT[f.antes]||f.antes)+' → '+(APL_BIT[f.despues]||f.despues),detalle:'Demostrativo: no cambia saldos'});
  // la revisión y la plática (230): el estatus de revisión, cada comentario, su corrección y su borrado
  if(f.que==='revision'||/^comentario/.test(f.que)){
    const ab=D.cli.some(c=>c[2]===f.rfc)?()=>{ cierraOv(); abreDesdeAviso('seg:'+f.rfc+'|'+(f.uuid||'')+'|'+(f.parte||'k')); }:null;
    const cita=x=>'«'+String(x||'').slice(0,300)+(String(x||'').length>300?'…':'')+'»';
    if(f.que==='revision') return Object.assign(base,{tipo:'revision',tipoTxt:'Cambió la revisión',
      cambio:PROFASE_SEG.t(f.antes||'sin_respuesta')+' → '+PROFASE_SEG.t(f.despues),abre:ab});
    if(f.que==='comentario') return Object.assign(base,{tipo:'comentario',tipoTxt:'Comentó',cambio:'',detalle:cita(f.despues),abre:ab});
    if(f.que==='comentario_corregido') return Object.assign(base,{tipo:'comentario',tipoTxt:'Corrigió su comentario',cambio:'',
      detalle:cita(f.antes)+' → '+cita(f.despues),abre:ab});
    return Object.assign(base,{tipo:'comentario',tipoTxt:'Borró su comentario',cambio:'',detalle:cita(f.antes),abre:ab});
  }
  if(f.que==='regla') return Object.assign(base,{tipo:'regla',tipoTxt:f.activa?'Prendió regla':'Apagó regla',cambio:f.activa?'Apagada → Prendida':'Prendida → Apagada'});
  const ver=D.cli.some(c=>c[2]===f.rfc)?()=>verMarca({rfc:f.rfc,uuid:f.uuid,parte:f.parte||'k',estado:'regresada',estatus:'normal'}):null;
  if(f.que==='aprobo') return Object.assign(base,{tipo:'aprobo',tipoTxt:'Aprobó',cambio:'Fuera · por aprobar → Fuera del reporte',
    detalle:[mot,'Lo pidió '+f.pidio].filter(Boolean).join(' · '),abre:ver});
  if(f.que==='regreso') return Object.assign(base,{tipo:'regreso',tipoTxt:f.quito?'Quitó el estatus':'Regresó',cambio:stTxt(f.estatus)+' → Sin estatus',
    detalle:[f.nota&&!f.quito?'«'+f.nota+'»':'',f.pidio&&f.pidio!==f.quien?'Lo había puesto '+f.pidio:''].filter(Boolean).join(' · '),abre:ver});
  const por=f.estatus==='fuera'&&!f.aplicada;
  return Object.assign(base,{tipo:'estatus',tipoTxt:por?'Pidió sacar':f.antes?'Cambió el estatus':'Marcó',
    cambio:(f.antes?stTxt(f.antes):'Sin estatus')+' → '+(por?'Fuera · por aprobar':stTxt(f.estatus)),
    detalle:[mot,f.comentario?'«'+f.comentario+'»':''].filter(Boolean).join(' · '),abre:ver});
}

async function cargaRelSat(ci,soloApl){
  if(ci==null||!D.cli[ci]) return false;
  const rfc=D.cli[ci][2];
  const deCli=filasDe(ci).filter(r=>r.uuid&&r.mod!==TER);
  const llave=a=>{ const us=[...new Set(a.map(r=>r.uuid.toUpperCase()))].slice(0,20000); return {us,k:us.length+'|'+(us[0]||'')+'|'+(us[us.length-1]||'')}; };
  const todo=llave(deCli);
  if(soloApl&&todo.us.length&&SAT.relDe.get(rfc)===todo.k) return false;
  const pide=soloApl?llave(deCli.filter(r=>esFacApl(r)||esDocApl(r))):todo, us=pide.us, k=(soloApl?'a|':'')+pide.k;
  if(!us.length||SAT.relDe.get(rfc)===k) return false;
  // solo_con_algo (351): la respuesta trae solo los folios cancelados o con relaciones (los demás no cambian nada aquí)
  let q; try{ q=await SB.rpc('cartera_sat',{p:{rfc,uuids:us,solo_con_algo:true}}); }catch(e){ q={error:e}; }
  if(!q||q.error||!q.data) return false;
  const m=new Map(), sust=new Map(), add=(a,b)=>{ a=String(a||'').toUpperCase(); b=String(b||'').toUpperCase(); if(!a||!b) return;
    (m.get(a)||m.set(a,new Set()).get(a)).add(b); (m.get(b)||m.set(b,new Set()).get(b)).add(a); };
  let can=SAT.can.get(rfc);
  (q.data.docs||[]).forEach(d=>{
    (d.rel||[]).forEach(x=>{ if(REL_APL.has(x.tipo)) add(d.uuid,x.uuid); });
    (d.por||[]).forEach(x=>{ if(REL_APL.has(x.tipo)) add(d.uuid,x.uuid); else if(x.tipo==='04') sust.set(String(d.uuid).toUpperCase(),String(x.uuid).toUpperCase()); });
    if(d.estado==='cancelada'){ if(!can) SAT.can.set(rfc,can=new Map());
      if(!can.has(String(d.uuid).toUpperCase())) can.set(String(d.uuid).toUpperCase(),{rfc,uuid:d.uuid,cancelada_el:d.cancelada_el,detectada:d.detectada,sustituida_por:d.sustituida_por}); }
  });
  const antes=SAT.rel.get(rfc);
  SAT.rel.set(rfc,m); SAT.sust.set(rfc,sust); SAT.relDe.set(rfc,k);
  const n=soloApl?0:satAplica(); APL.cache.delete(ci);
  return n>0||m.size>0||!!(antes&&antes.size);
}
/* las relaciones de los XML de varias empresas, en tandas (4-nov-2026, pedido de Fernando: que la tarjeta «Se puede
   aplicar» y el Excel de aplicaciones traigan lo «Confirmado (CFDI)» de todas las empresas, aunque no se haya abierto
   su ventana). Primero sus folios fiscales (de 24 en 24) y luego 4 empresas a la vez. Una empresa que ya se está
   trayendo no se vuelve a pedir: quien llega después espera la misma. avance(n,total) dice cómo va. */
const REL_PEND=new Map();   // empresa → su promesa mientras se trae
function relApl(ci){
  let p=REL_PEND.get(ci);
  if(!p){ p=cargaRelSat(ci,true).catch(()=>false); REL_PEND.set(ci,p); p.then(()=>{ if(REL_PEND.get(ci)===p) REL_PEND.delete(ci); }); }
  return p;
}
// par: cuántas empresas a la vez (4; 2 cuando se trae de fondo con la pantalla en uso: ver precargaApl)
async function cargaRelApl(cis,avance,par){
  const tot=cis.length; let n=0, cambio=false;
  const di=()=>{ if(avance) avance(n,tot); };
  di();
  if(!SAT.ok){ n=tot; di(); return false; }
  for(let i=0;i<cis.length;i+=24){
    const tanda=cis.slice(i,i+24);
    try{ await cargaUuids(tanda.map(ci=>D.cli[ci][2])); }catch(e){}
    let j=0;
    const trabaja=async()=>{ while(j<tanda.length){ const ci=tanda[j++]; if(await relApl(ci)) cambio=true; n++; di(); } };
    await Promise.all(Array.from({length:Math.max(1,par||4)},trabaja));
  }
  if(cambio){ satAplica(); aplLimpia(); }
  return cambio;
}
// las empresas donde lo «Confirmado (CFDI)» puede cambiar algo: una factura con saldo y un anticipo o nota a favor del
// mismo lado (clientes o proveedores)
function aplCandidatas(cis){
  const out=[], I=aplIdx();
  (cis||[...I.keys()]).forEach(ci=>{ const rs=I.get(ci); if(!rs) return;
    const f=[0,0], d=[0,0]; rs.forEach(r=>{ if(esFacApl(r)) f[ladoFac(r)]=1; else d[ladoDoc(r)]=1; });
    if((f[0]&&d[0])||(f[1]&&d[1])) out.push(ci); });
  return out;
}
/* al abrir la Cartera (ya con la pantalla a la vista): las de las empresas que se ven; al terminar, la tarjeta se pone al día.
   Con muchas empresas, solo cuando algo lo usa (10-nov-2026, revisión nocturna; Héctor Daniel Nava, 10-nov-2026, 06:5x:
   «Si autorizo cartera de dirección de crm», a la propuesta de la revisión). Como la dirección o un gerente (todas las
   empresas: más de APL_PRE_MAX que pueden tener algo «Confirmado (CFDI)»), traer lo de todas al abrir bajaba ~18 MB, hacía
   ~117 llamadas y trababa la página y la pantalla siguiente. Ahora se trae solo cuando se usa: la tarjeta «Se puede
   aplicar» a la vista («Ver más del resumen»), la columna «Por aplicar», FILTROS › Aplicaciones, la pila «Se pueden
   aplicar» de «Por depurar» o el Excel de aplicaciones (que ya trae lo suyo); y entonces de fondo, 2 empresas a la vez,
   con la pantalla en uso y la tarjeta diciendo cuánto lleva. Al terminar los números son los mismos de antes. Con pocas
   (un contador), como siempre: al abrir. */
let APL_PRE_MAX=30;   // let: la prueba de pantallas lo baja para probar el camino de muchas empresas
let APL_PRE=null, APL_ESPERA=false, APL_AV=null;
const aplHaceFalta=()=>!!(PV.res||PV.cols||S.aplE.size||S.aplT.size||S.pend==='apl');
function precargaApl(){
  const cis=aplCandidatas().filter(ci=>!OCU(D.cli[ci][2]));
  const grande=cis.length>APL_PRE_MAX;
  if(grande&&!aplHaceFalta()){ APL_ESPERA=true; return null; }
  APL_ESPERA=false;
  if(grande){ APL_AV={n:0,tot:cis.length}; pintaAplAv(); }
  const av=grande?(n,t)=>{ APL_AV={n,tot:t}; pintaAplAv(); }:null;
  const p=APL_PRE=cargaRelApl(cis,av,grande?2:4)
    .then(c=>{ if(APL_PRE===p){ const ya=!!APL_AV; APL_AV=null; if((c||ya)&&S.vista==='res') render(); } return c; })
    .catch(()=>{ if(APL_PRE===p&&APL_AV){ APL_AV=null; if(S.vista==='res') render(); } return false; });
  return p;
}

async function cargaCan(pq){
  let q; try{ q=await (pq||SB.rpc('cartera_can',{p:{}})); }catch(e){ q={error:e}; }
  if(!q||q.error||!q.data){ CAN.ok=false; return false; }

// lo de una empresa (sus documentos): una sola vez por empresa mientras no lleguen datos nuevos de la cartera
function canTrae(rfc){
  if(!CAN.ok||!rfc) return Promise.resolve(null);
  if(CAN.det.has(rfc)) return Promise.resolve(CAN.det.get(rfc));
  let p=CAN.pide.get(rfc);
  if(!p){
    p=SB.rpc('cartera_can',{p:{rfc}}).then(q=>{ CAN.pide.delete(rfc);
        if(!q||q.error||!q.data){ CAN.err.add(rfc); return null; }
        CAN.err.delete(rfc); CAN.det.set(rfc,q.data); return q.data; })
      .catch(()=>{ CAN.pide.delete(rfc); CAN.err.add(rfc); return null; });
    CAN.pide.set(rfc,p);
  }
  return p;
}

// lo de la barra de la ventana que sí aplica aquí: la búsqueda, el saldo, la fecha y el lado (Clientes / Proveedores)
function cnPasaVentana(d){
  if(S.lado==='cli'&&d.lado!=='cli') return false;
  if(S.lado==='prov'&&d.lado!=='prov') return false;
  const f=S.mf; if(!f) return true;
  if(f.q){ const t=[cnFolio(d),d.serie,d.folio,d.cp_nombre,d.cp_rfc,d.uuid,d.sus_folio].filter(Boolean).join(' ').toLowerCase();
    if(!f.q.split(/\s+/).every(w=>t.includes(w))) return false; }
  const a=Math.abs(+d.saldo||0), s1=numMF(f.smin), s2=numMF(f.smax);
  if(s1!=null&&!(a>s1)) return false;
  if(s2!=null&&!(a<s2)) return false;
  if(f.desde&&(!d.fecha||d.fecha<f.desde)) return false;
  if(f.hasta&&(!d.fecha||d.fecha>f.hasta)) return false;
  return true;
}
// lo que se sabe de una cancelada (en su detalle; y, si está en la cartera, arriba del detalle de siempre)
function bloqueCan(cd){
  const box=el('div','aplbox satbox cnbox'); box.id='canbox';
  box.appendChild(el('div','k','Cancelada · sigue en el Tablero QUO'));

  l('En QUO',cd.cq?'Cancelada':'Activa');

  const ls=l('Sustituida',s==='si'?'Sí'+(cd.sus_folio?' · '+cd.sus_folio:''):s==='no'?'No':'Sin revisar');

    if(cnDup(cd)) box.appendChild(el('div','l cndupt','La vieja y la nueva están activas en QUO: las dos suman a la vez.'));

     · primero el cliente o proveedor (por RFC; con el RFC genérico del extranjero o nacional, por el nombre sin «Inc»,
       «LLC», «SA de CV»…), luego la fecha más cercana y luego el saldo;
     · Aceptada (la aplicó el contador), Automática (mismo importe exacto: queda puesta sola), Sugerida (el importe más
       parecido y la fecha más cercana, o 2 o 3 que juntos suman el saldo) y Revisar (otro nombre con el mismo RFC
       genérico, solo con importe exacto). Lo «Quitado» por el contador no se aplica;
     · solo a facturas vigentes con saldo; lo aplicado nunca pasa del saldo del anticipo o de la nota.
   Lo que decide el contador (aplicar, quitar, «Solo esta») lo guarda la base (208_cartera_aplicaciones.sql) con quién y
   cuándo, y sale en la Bitácora. «Confirmada (CFDI)» y las canceladas en el SAT salen de Centauro por la puerta cartera_sat
   (213 y 214; petición 20261103-1755-cartera-centauro, Héctor Daniel: «Sí, la arma CENTAURO (b)»; la pantalla, 19:28: «nosotros
   publicamos la pantalla de cartera»): ver «Lo de Centauro», abajo. ── */
const APL={ok:false,puede:{},dec:new Map(),firma:null,cache:new Map(),pp:new Set(),porRfc:new Map()};
let APL_IDX=null;
const APL_T={conf:'Confirmada (CFDI)',acep:'Aceptada',auto:'Automática',sug:'Sugerida',suma:'Sugerida · suma',rev:'Revisar · otro nombre',quit:'Quitada'};
const APL_C={conf:'p-pue',acep:'p-ok',auto:'p-me',sug:'p-pap',suma:'p-pap',rev:'p-can',quit:'p-fue'};
const APL_ORD={conf:0,acep:1,auto:2,suma:3,sug:4,rev:5,quit:9};
// el estado de la relación en FILTROS (la suma va con las sugeridas)
const APL_EST=[['conf','Confirmada (CFDI)'],['acep','Aceptada'],['auto','Automática'],['sug','Sugerida'],['rev','Revisar · otro nombre'],['quit','Quitada']];
const APL_EMP=[['con','Con aplicaciones posibles'],['sin','Sin aplicaciones']];
const RFC_GEN=new Set(['XEXX010101000','XAXX010101000']);
const SUF_NOM=new Set(['inc','llc','ltd','ltda','limited','corp','corporation','co','company','plc','gmbh','sas','sa','sab','sapi','de','cv',
  'srl','rl','sc','s','a','c','v','r','l','the','y','and']);
const nomLimpio=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()
  .split(' ').filter(w=>w&&!SUF_NOM.has(w)).join(' ');
const ladoFac=r=>r.mod===0?0:r.mod===1?1:-1;            // 0: clientes; 1: proveedores
const ladoDoc=r=>(r.mod===2||r.mod===4)?0:(r.mod===3||r.mod===5)?1:-1;
const aplVig=r=>r.est!=='Cancelada'&&r.st!=='fuera'&&!r.satCan;
const esFacApl=r=>ladoFac(r)>=0&&aplVig(r)&&r.saldo>0.005;
const esDocApl=r=>ladoDoc(r)>=0&&aplVig(r)&&r.saldo<-0.005;
const cpRfc=r=>String((D.cp[r.cp]||[])[0]||'').toUpperCase().trim();
const cpKey=r=>{ const rfc=cpRfc(r); return RFC_GEN.has(rfc)||!rfc?rfc+'|'+nomLimpio((D.cp[r.cp]||[])[1]):rfc; };
const diasEntre=(a,b)=>(!a||!b)?99999:Math.abs((xd(a)-xd(b))/864e5);
const relTipo=rl=>rl.dec==='quitada'?'quit':rl.dec==='aplicada'?'acep':rl.tipo;
const relFiltro=rl=>{ const t=relTipo(rl); return t==='suma'?'sug':t; };
const relsOrden=a=>a.slice().sort((x,y)=>(y.on-x.on)||APL_ORD[relTipo(x)]-APL_ORD[relTipo(y)]||x.dif-y.dif||x.dias-y.dias);
const folioDe=r=>[r.serie,r.folio].filter(Boolean).join(' ')||(r.quo?'QUO '+r.quo:'s/folio');
const docNom=r=>r.mod===2||r.mod===3?'anticipo':r.mod===4||r.mod===5?'nota de crédito':'factura';
const elDoc=r=>(docNom(r)==='anticipo'?'el ':'la ')+docNom(r);   // «el anticipo», «la nota de crédito»
function aplDec(f,d){
  if(!f.uuid||!d.uuid) return null;
  return APL.dec.get(rfcDe(f)+'|'+f.parte+'|'+f.uuid.toUpperCase()+'|'+d.uuid.toUpperCase())||null;
}
function aplLimpia(){ APL.cache=new Map(); APL_IDX=null; }
function aplIdx(){
  if(APL_IDX) return APL_IDX;
  APL_IDX=new Map();
  ROWS.forEach(r=>{ if(!esFacApl(r)&&!esDocApl(r)) return; let a=APL_IDX.get(r.cli); if(!a) APL_IDX.set(r.cli,a=[]); a.push(r); });
  return APL_IDX;
}
// 2 o 3 anticipos o notas que juntos suman el saldo de la factura (al centavo); los 30 de fecha más cercana, hasta 2 sumas
function aplSumas(f,c){
  const obj=Math.round(f.saldo*100), out=[];
  const ds=c.filter(x=>-x.d.saldo<f.saldo-0.01).sort((a,b)=>a.dias-b.dias).slice(0,30).map(x=>({d:x.d,v:Math.round(-x.d.saldo*100)}));
  const idx=new Map(); ds.forEach((x,i)=>{ const a=idx.get(x.v)||[]; a.push(i); idx.set(x.v,a); });
  const busca=(v,mayor)=>{ for(const w of [v,v-1,v+1]){ const a=idx.get(w); if(a){ const j=a.find(j=>j>mayor); if(j!=null) return j; } } return -1; };
  for(let i=0;i<ds.length&&out.length<2;i++){ const j=busca(obj-ds[i].v,i); if(j>=0) out.push([ds[i].d,ds[j].d]); }
  for(let i=0;i<ds.length&&out.length<2;i++) for(let j=i+1;j<ds.length&&out.length<2;j++){
    const k=busca(obj-ds[i].v-ds[j].v,j); if(k>=0) out.push([ds[i].d,ds[j].d,ds[k].d]); }
  return out;
}
/* las relaciones de una empresa: por cada factura y cada anticipo o nota, las posibles y lo que se aplicaría */
function aplEmp(ci){
  let R=APL.cache.get(ci); if(R) return R;
  R={fac:new Map(),doc:new Map()};
  const G=new Map();
  (aplIdx().get(ci)||[]).forEach(r=>{
    const fac=esFacApl(r), lado=fac?ladoFac(r):ladoDoc(r), key=cpKey(r), k=lado+'#'+key;
    let g=G.get(k); if(!g) G.set(k,g={lado,key,rfc:cpRfc(r),f:[],d:[]});
    (fac?g.f:g.d).push(r);
    if(fac) R.fac.set(r,{r,rels:[],apl:[],aplicado:0,queda:r.saldo});
    else R.doc.set(r,{r,rels:[],usado:0,queda:-r.saldo});
  });
  const rels=[]; let nid=0;
  const nueva=(f,docs,tipo)=>{
    const tot=docs.reduce((a,d)=>a-d.saldo,0);
    const rl={id:++nid,fac:f,docs,tipo,tot,dif:Math.abs(tot-f.saldo),dias:Math.max(...docs.map(d=>diasEntre(f.fecha,d.fecha))),
      parte:new Map(),monto:0,on:false,dec:null,quien:null};
    // lo que decidió el contador: aplicada si todas sus parejas lo están; quitada si alguna lo está
    const ds=docs.map(d=>aplDec(f,d));
    if(ds.some(x=>x&&x.e==='quitada')){ rl.dec='quitada'; rl.quien=ds.find(x=>x&&x.e==='quitada'); }
    else if(ds.every(x=>x&&x.e==='aplicada')){ rl.dec='aplicada'; rl.quien=ds[0]; }
    rels.push(rl); R.fac.get(f).rels.push(rl); docs.forEach(d=>R.doc.get(d).rels.push(rl));
    return rl;
  };
  // Confirmada (CFDI) (214, de Centauro): el XML de la nota de crédito o del anticipo relaciona esta factura (o al revés)
  const conf=new Map(), relX=SAT.rel.get(D.cli[ci][2]), yaConf=(f,d)=>!!(conf.get(f)&&conf.get(f).has(d));
  if(relX) R.fac.forEach((F2,f)=>{ const rs=f.uuid?relX.get(f.uuid.toUpperCase()):null; if(!rs) return;
    R.doc.forEach((X,d)=>{ if(d.uuid&&ladoDoc(d)===ladoFac(f)&&rs.has(d.uuid.toUpperCase())){
      nueva(f,[d],'conf'); (conf.get(f)||conf.set(f,new Set()).get(f)).add(d); } }); });
  G.forEach(g=>{
    if(!g.f.length||!g.d.length) return;
    g.f.forEach(f=>{
      const c=g.d.filter(d=>!yaConf(f,d)).map(d=>({d,dif:Math.abs(-d.saldo-f.saldo),dias:diasEntre(f.fecha,d.fecha)}));
      const ex=c.filter(x=>x.dif<=0.01).sort((a,b)=>a.dias-b.dias);
      ex.forEach(x=>nueva(f,[x.d],'auto'));
      const ot=c.filter(x=>x.dif>0.01).sort((a,b)=>a.dif-b.dif||a.dias-b.dias);
      // las 5 más parecidas y, además, las que el contador ya decidió
      ot.forEach((x,i)=>{ if(i<5||aplDec(f,x.d)) nueva(f,[x.d],'sug'); });
      if(!ex.length) aplSumas(f,c).forEach(ds=>nueva(f,ds,'suma'));
    });
  });
  // otro nombre con el mismo RFC genérico: solo con importe exacto, para revisar
  const gen=[...G.values()].filter(g=>RFC_GEN.has(g.rfc));
  gen.forEach(g=>g.f.forEach(f=>gen.forEach(h=>{ if(h===g||h.lado!==g.lado||h.rfc!==g.rfc) return;
    h.d.forEach(d=>{ if(!yaConf(f,d)&&Math.abs(-d.saldo-f.saldo)<=0.01) nueva(f,[d],'rev'); }); })));
  // lo aceptado que ninguna de las de arriba trae (lo que repartió «Agotar» con su factura relacionada de otro nombre, o si
  // el XML todavía no llega): su propia relación, para que se vea y cuente igual que en la ventana de «Agotar»
  const yaAcep=APL.porRfc.get(D.cli[ci][2]);
  if(yaAcep&&yaAcep.length){
    const uF=new Map(), uD=new Map(), hay=new Map();
    R.fac.forEach((x,f)=>{ if(f.uuid) uF.set(f.uuid.toUpperCase(),f); });
    R.doc.forEach((x,d)=>{ if(d.uuid) uD.set(d.uuid.toUpperCase(),d); });
    rels.forEach(rl=>{ let s=hay.get(rl.fac); if(!s) hay.set(rl.fac,s=new Set()); rl.docs.forEach(d=>s.add(d)); });
    yaAcep.forEach(([parte,fu,du])=>{ const f=uF.get(fu), d=uD.get(du);
      if(!f||!d||f.parte!==parte||ladoFac(f)!==ladoDoc(d)) return;
      let s=hay.get(f); if(!s) hay.set(f,s=new Set()); if(s.has(d)) return;
      s.add(d); nueva(f,[d],'sug'); });
  }
  // lo que se aplicaría: lo aceptado, luego lo exacto (uno a uno, por fecha), luego una sugerida por factura y lo de revisar
  const qF=f=>R.fac.get(f), qD=d=>R.doc.get(d), libre=d=>qD(d).usado<0.005, tocada=f=>qF(f).apl.length>0;
  const usaPar=new Map();   // por factura y anticipo o nota: cuánto ya se aplicó entre todas sus relaciones
  const pon=rl=>{
    let resta=qF(rl.fac).queda;
    let up=usaPar.get(rl.fac); if(!up) usaPar.set(rl.fac,up=new Map());
    rl.docs.forEach(d=>{ const x=qD(d), dc=rl.dec==='aplicada'?aplDec(rl.fac,d):null;
      // con monto guardado (263), esa pareja nunca pasa de su monto aunque salga en dos relaciones (una suma y la suya)
      const m=Math.min(x.queda,resta,dc&&dc.m!=null?dc.m-(up.get(d)||0):Infinity); if(m<=0.005) return;
      up.set(d,(up.get(d)||0)+m);
      rl.parte.set(d,m); x.queda-=m; x.usado+=m; resta-=m; rl.monto+=m; });
    if(rl.monto>0.005){ rl.on=true; const F2=qF(rl.fac); F2.apl.push(rl); F2.aplicado+=rl.monto; F2.queda-=rl.monto; }
  };
  // lo aceptado: primero lo de a mano (lo que alcance, como siempre) y luego lo que trae su monto («Agotar», 263)
  const conM=rl=>rl.docs.some(d=>{ const x=aplDec(rl.fac,d); return !!(x&&x.m!=null); });
  const acep=rels.filter(x=>x.dec==='aplicada').sort((a,b)=>a.dias-b.dias);
  acep.filter(x=>!conM(x)).forEach(pon); acep.filter(conM).forEach(pon);
  // lo que dice el XML va antes que lo que sugiere la Cartera (una factura puede llevar varias notas confirmadas)
  rels.filter(x=>!x.dec&&x.tipo==='conf').sort((a,b)=>a.dias-b.dias).forEach(x=>{ if(x.docs.every(libre)) pon(x); });
  rels.filter(x=>!x.dec&&x.tipo==='auto').sort((a,b)=>a.dias-b.dias).forEach(x=>{ if(!tocada(x.fac)&&x.docs.every(libre)) pon(x); });
  ['sug','rev'].forEach(fase=>R.fac.forEach(F2=>{
    if(F2.apl.length) return;
    const op=F2.rels.filter(x=>!x.dec&&(fase==='rev'?x.tipo==='rev':(x.tipo==='suma'||x.tipo==='sug'))&&x.docs.every(libre))
      .sort((a,b)=>APL_ORD[a.tipo]-APL_ORD[b.tipo]||a.dif-b.dif||a.dias-b.dias);
    if(op.length) pon(op[0]);
  }));
  /* lo que ya no se puede aplicar (5-nov-2026, Fernando Cadengo: «ya se aplicó 1 nota pero la sigue dando como sugerencia en
     otro, no debería desaparecer la sugerencia?»; escogió la A: «sí, así es»): una sugerencia del CRM (automática, sugerida o
     para revisar, sin decisión del contador; lo «Confirmado (CFDI)» no, porque lo dice el XML) con un anticipo o nota que ya
     se usa completo en otra factura (le queda $0) deja de contar: sale de «rels» (las listas, el Excel, los conteos, los
     filtros y el «+N más») y queda en «usadas», que solo enseña el detalle, en gris, con «✓ Aplicar» por si el contador la
     prefiere aquí. Si al anticipo o nota todavía le queda algo, se sigue sugiriendo como antes. «todas» trae las dos. */
  rels.forEach(rl=>{ if(rl.on||rl.dec||rl.tipo==='conf') return;
    const por=[];
    rl.docs.forEach(d=>{ const X=qD(d); if(X.queda>0.01) return;
      X.rels.forEach(o=>{ if(o!==rl&&o.on&&o.parte.has(d)&&o.fac!==rl.fac&&!por.includes(o)) por.push(o); }); });
    if(por.length) rl.usadaEn=por; });
  /* lo aceptado por el contador es lo fijo (se acomoda antes que cualquier sugerencia): con eso se calcula lo que se aplicaría
     al aceptar otra relación (11-nov-2026, Fernando Cadengo con el caso de la factura F 15833: «se le aplicó un anticipo por
     23664 y … sale otra vez disponible para aplicar con su saldo completo»; «sí, así es, en gris y fuera de los conteos») */
  R.fac.forEach(F2=>{ F2.acep=F2.apl.filter(rl=>rl.dec==='aplicada').reduce((a,rl)=>a+rl.monto,0); });
  R.doc.forEach(X=>{ X.acep=X.rels.filter(rl=>rl.on&&rl.dec==='aplicada').reduce((a,rl)=>a+(rl.parte.get(X.r)||0),0); });
  /* y la factura que ya queda cubierta por lo que se le aplica: sus demás sugerencias (sin decisión; lo «Confirmado (CFDI)» no)
     dejan de contar, como las de un anticipo o nota ya usado completo (5-nov): van a «usadas», en gris, con quién la cubre */
  rels.forEach(rl=>{ if(rl.on||rl.dec||rl.tipo==='conf') return;
    const F2=qF(rl.fac); if(F2.queda>0.01) return;
    const por=F2.apl.filter(o=>o!==rl); if(por.length) rl.cubiertaPor=por; });
  const separa=X=>{ X.todas=X.rels; X.usadas=relsOrden(X.rels.filter(rl=>rl.usadaEn||rl.cubiertaPor)); X.rels=X.rels.filter(rl=>!rl.usadaEn&&!rl.cubiertaPor); };

const aplF=r=>esFacApl(r)?(aplEmp(r.cli).fac.get(r)||null):null;
const aplD=r=>esDocApl(r)?(aplEmp(r.cli).doc.get(r)||null):null;
const aplX=r=>aplF(r)||aplD(r);
const aplHay=ci=>{ const R=aplEmp(ci); for(const F2 of R.fac.values()) if(F2.rels.length) return true; return false; };
// los estados de las relaciones en que está un documento (para FILTROS › Aplicaciones)
function aplEstados(r){ const X=aplX(r), s=new Set(); if(X) X.rels.forEach(rl=>s.add(relFiltro(rl))); return s; }
function pasaApl(r){
  if(S.aplE.size&&!S.aplE.has(aplHay(r.cli)?'con':'sin')) return false;
  if(S.aplT.size){ const s=aplEstados(r); if(![...s].some(x=>S.aplT.has(x))) return false; }
  return true;
}
/* lo que se puede aplicar en un conjunto de documentos: el monto, por lado y cuántas relaciones de cada tipo */
function aplSuma(rows){
  const o={tot:0,c:0,p:0,nf:0,n:{conf:0,acep:0,auto:0,sug:0,rev:0}};
  rows.forEach(r=>{ const F2=aplF(r); if(!F2||F2.aplicado<0.005) return;
    o.tot+=F2.aplicado; if(r.mod===0) o.c+=F2.aplicado; else o.p+=F2.aplicado; o.nf++;
    F2.apl.forEach(rl=>{ o.n[relFiltro(rl)]=(o.n[relFiltro(rl)]||0)+1; }); });
  return o;
}
const yoApl=()=>APL.ok&&!!APL.puede.cambiar&&!(window.PORTAL&&window.PORTAL.consulta);
async function cargaApl(pq){
  let q; try{ q=await (pq||SB.rpc('cartera_apl')); }catch(e){ q={error:e}; }
  if(!q||q.error||!q.data){ APL.ok=false; APL.dec=new Map(); APL.pp=new Set(); APL.porRfc=new Map(); aplLimpia(); return false; }
  const d=q.data; APL.ok=true; APL.puede=d.puede||{}; APL.firma=d.firma||null; APL.dec=new Map(); APL.porRfc=new Map();
  // 263: m = cuánto se aplica en esa relación (lo guardó «Agotar»; sin m, lo que alcance) y o = 'agotar'; pp = las empresas
  // de los grupos cuyos anticipos son pagos parciales (sin regla de fecha)
  APL.pp=new Set((d.pp||[]).map(x=>String(x).toUpperCase()));
  (d.rel||[]).forEach(x=>{ const fu=String(x.f).toUpperCase(), du=String(x.d).toUpperCase();
    APL.dec.set(x.rfc+'|'+x.parte+'|'+fu+'|'+du,{e:x.e,por:x.por,en:x.en,m:x.m!=null?+x.m:null,o:x.o||null});
    if(x.e==='aplicada'){ let a=APL.porRfc.get(x.rfc); if(!a) APL.porRfc.set(x.rfc,a=[]); a.push([x.parte,fu,du]); } });
  // para reconocer lo que ya se decidió, los folios fiscales de esas empresas
  if(ROWS.length){
    const rs=[...new Set((d.rel||[]).map(x=>x.rfc))].filter(r=>!UUID_OK.has(r)&&(RANGO['k|'+r]||RANGO['p|'+r]));
    if(rs.length){ try{ await cargaUuids(rs); }catch(e){} }
  }
  aplLimpia();
  return true;
}
/* guarda lo que decide el contador. items: [{rl, d, accion}] (d: el anticipo o nota de esa relación) */
async function aplPon(items,txt){

    return {parte:x.rl.fac.parte,tipo:x.rl.fac.tipo,rfc_cp:cp[0],contraparte:cp[1],
      fac:x.rl.fac.uuid,doc:x.d.uuid,folio_fac:folioDe(x.rl.fac),folio_doc:folioDe(x.d),accion:x.accion,

// la tarjeta de una relación (en el detalle de una factura, de un anticipo o de una nota)
function tarjetaRel(rl,desde){

  const cub=!us&&rl.cubiertaPor||null;

  const h=el('div','t');

  if(us) h.appendChild(el('span','pill p-cl','Ya se usa en la factura '+usEn));
  else if(cub) h.appendChild(el('span','pill p-cl','La factura ya está cubierta'));
  else if(t!=='quit') h.appendChild(el('span','pill '+(rl.on?'p-ok':'p-cl'),rl.on?'Se aplica':'No se aplica'));
