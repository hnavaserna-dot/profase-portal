<!doctype html><html lang="es" data-rol="todos" data-incrustada="1"><head><meta charset="utf-8"><script>/* Cierre temporal del portal (30-oct-2026, pedido de Daniel cuando la base se trabó: «cierra temporalmente crm»;
   «Saca a todos del CRM con ese aviso y cuando quede ya les avisamos»).
   construir.py lo pone escrito al principio del <head> de cada página que arma (y va a mano en index.html), antes de
   cualquier otro script. Lee cierre.json, que vive en la raíz de profase-portal (no pasa por la base), y si dice
   "cerrado": true detiene la página y lleva a cerrado.html, que avisa y regresa sola al portal en cuanto cierre.json
   diga false. Si la página va en un marco, se lleva a la de arriba. Guarda a dónde iba cada quien para regresarlo ahí.
   Solo en crmprofase.com.mx: en las pruebas locales no hace nada (salvo con window.__PRUEBA_CIERRE).
   Si cierre.json no llega, la página sigue normal. No lee ni escribe nada de la base. */
(function () {
  'use strict';
  if (!/(^|\.)crmprofase\.com\.mx$/.test(location.hostname) && !window.__PRUEBA_CIERRE) return;
  if (/\/cerrado\.html$/.test(location.pathname)) return;
  // la llamada del soporte de Quo (sala.html?marca=quo, Q Chat): nunca lleva a la pantalla de cierre de PROFASE (PROFASE no
  // sale en los sistemas Quo); si la base no contesta, la misma sala lo dice con la marca de Quo
  if (/\/sala\.html$/.test(location.pathname) && /[?&]marca=quo(?:&|$)/.test(location.search)) return;
  var j = null;
  try {
    var x = new XMLHttpRequest();
    x.open('GET', '/cierre.json?t=' + Date.now(), false);
    x.send(null);
    if (x.status === 200) j = JSON.parse(x.responseText);
  } catch (e) { j = null; }
  if (!j || j.cerrado !== true) return;
  // «hasta» (2-nov-2026, Daniel: «no dejes ingresar al sistema hasta las nueve A.M.»): a esa hora abre solo
  if (j.hasta && !isNaN(Date.parse(j.hasta)) && Date.now() >= Date.parse(j.hasta)) return;
  var w = window;
  try { if (window.top && window.top.location.host === location.host) w = window.top; } catch (e) { w = window; }
  try {
    var r = w.location.pathname + w.location.search + w.location.hash;
    if (!/cerrado\.html/.test(r)) sessionStorage.setItem('profase-regreso', r);
  } catch (e) { /* sin almacenamiento: regresa a la entrada */ }
  try { window.stop(); } catch (e) { /* navegador viejo */ }
  try { w.location.replace('/cerrado.html'); } catch (e) { location.replace('/cerrado.html'); }
})();</script><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Portal PROFASE · Cambios al portal</title>

<script>

  var GFX = '', PPX = '', COLA = [], PCOLA = [], GVISTA = [], PVISTA = [], PGG = null, PGC = null, FIRG = '', FIRC = '';
  var QUIEN = 'gab', PCAD = null, PFILAS = [], PFILTRO = 'pend', PABIERTA = null, PDET = null, pcargando = false, SUB = {}, LEER_GAB = '', pFiltroAuto = true;

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  // Texto de PROPUESTA.md: párrafos, listas, **negritas** y `código`; siempre escapado (nunca se pinta como HTML)

    if (window.PROFASE_PILAS) {
      PROFASE_PILAS.barra($('pc-bar'), { caja: true, buscar: $('q-pc') });

    if (window.PROFASE_PAGINAS) {
      PGC = PROFASE_PAGINAS.crea({ donde: $('pc-pag'), clave: 'cambios-pcad', nombre: 'Peticiones', arriba: $('plista'), cambio: function () { pintaPcad(); } });

  /* --- Filtro «Cadengo» / «Gabo» --- */

  function quienDecide() { return papel() !== 'decide'; }   // los textos hablan de H\u00e9ctor Daniel Nava, no de «tú»
  function ponQuien(q) {

  /* --- Peticiones de Cadengo (pcad_*) --- */
  var ESTP = { por_decidir: ['Por decidir', 'amarillo'], si: ['Autorizada', 'verde'], no: ['No autorizada', 'rojo'], otro: ['Decidida', 'gris'] };

  async function cargaPcad(callado) {

    if (!refresco) { var c = $('conv'); if (c && MSJS.length > 6) c.lastElementChild && c.lastElementChild.scrollIntoView({ block: 'nearest' }); }
  }

  function estado(p) {
    var aut = ROL === 'autoriza' && puedeEscribir(), rev = p.revision || {}, b = [];
    // quien la mandó la puede retirar mientras no esté publicada (2-nov-2026, pedido de Gabriel)
    if (ROL === 'propone' && puedeEscribir() && p.proponente === YO && ['por_autorizar', 'choca', 'error', 'rechazada'].indexOf(p.estado) >= 0)
      b.push('<button class="btn mal" type="button" data-a="retirar">Retirar propuesta</button>');
    var sqlTxt = (p.sql_archivos || []).length ? '<p>Trae cambios para la base: <code>' + (p.sql_archivos || []).map(esc).join('</code>, <code>') + '</code>. '
      + (p.estado === 'publicada'
        ? (p.sql_listo_en ? 'Ya se corrieron (' + esc(nombre(p.sql_listo_por)) + ', ' + esc(hora(p.sql_listo_en)) + ').'
          : '<b>Falta correrlos en la base:</b> pídele a tu Claude «corre el SQL de la propuesta #' + p.id + '» y, cuando quede, márcalo aquí.')
        : 'No se corren solos: después de publicarla, tu Claude los revisa y los corre.') + '</p>' : '';
    switch (p.estado) {
      case 'por_autorizar':
        if (p.semaforo === 'bloqueada') {
          if (aut) b.push('<button class="btn mal" type="button" data-a="rechazar">Rechazar</button>');
          return caja('rojo', '<b>Bloqueada.</b> ' + esc(SEM_TXT.bloqueada) + (ROL === 'propone' ? ' Si hace falta, pídeselo a Daniel o a Fernando.' : ''), b);
        }
        if (rev.pruebas_ok === false) {
          if (aut) b.push('<button class="btn mal" type="button" data-a="rechazar">Rechazar</button>');
          return caja('rojo', '<b>No pasa las revisiones automáticas del portal.</b> No se puede autorizar hasta que Gabo la corrija (el detalle está abajo, en «Revisión automática»).', b);
        }
        if (p.semaforo === 'rojo' && !(p.revisada_ok && p.revisada_sha === p.sha)) {
          if (aut) b.push('<button class="btn mal" type="button" data-a="rechazar">Rechazar</button>');
          var vieja = p.revisada_en && p.revisada_sha !== p.sha;
          return caja('amarillo', ROL === 'autoriza'
            ? '<b>Delicada: antes de autorizarla, pídele a tu Claude «revisa la propuesta #' + p.id + '».</b> ' + (p.revisada_en && !vieja && !p.revisada_ok ? 'Tu Claude ya la revisó y no recomienda autorizarla (abajo está por qué).' : vieja ? 'La revisión que había era de una versión anterior.' : 'Cuando la revise, su dictamen aparece aquí y se habilita «Autorizar».')
            : '<b>Delicada:</b> espera la revisión técnica del Claude de Daniel o de Fernando.', b, sqlTxt);
        }
        if (aut) { b.push('<button class="btn pri" type="button" data-a="autorizar">Autorizar y publicar</button>'); b.push('<button class="btn mal" type="button" data-a="rechazar">Rechazar</button>'); }
        return caja(p.semaforo === 'rojo' ? 'amarillo' : '', ROL === 'autoriza' ? (RESP.respaldo ? '<b>Espera la revisión de ' + esc(encargados()) + '.</b> Si hace falta, tú también puedes autorizarla o regresarla. ' : '<b>Espera tu revisión.</b> ') + esc(SEM_TXT[p.semaforo] || '') + ' Si la autorizas, se publica sola en alrededor de un minuto.'
          : '<b>Espera a que Daniel o Fernando la revisen.</b>', b, sqlTxt);
      case 'choca':
        if (aut) b.push('<button class="btn mal" type="button" data-a="rechazar">Rechazar</button>');
        return caja('amarillo', '<b>Choca con cambios que se hicieron después en el portal</b> (' + esc((rev.choques || []).join(', ')) + '). Gabo tiene que pedirle a su Claude que traiga lo último y la vuelva a mandar.', b);
      case 'autorizada':
        return caja('amarillo', '<b>Autorizada por ' + esc(nombre(p.autorizada_por)) + '.</b> Se está publicando; tarda alrededor de un minuto.', b);
      case 'publicada':
        if (aut && (p.sql_archivos || []).length && !p.sql_listo_en) b.push('<button class="btn ok" type="button" data-a="sql">Ya corrí el SQL</button>');
        if (aut) b.push('<button class="btn mal" type="button" data-a="deshacer">Deshacer</button>');
        return caja('verde', '<b>Publicada</b> ' + esc(hora(p.publicada_en)) + '. La autorizó ' + esc(nombre(p.autorizada_por)) + '.' + (p.resultado ? ' ' + esc(p.resultado) : ''), b, sqlTxt);
      case 'rechazada':
        return caja('rojo', '<b>Rechazada por ' + esc(nombre(p.rechazada_por)) + '</b> (' + esc(hora(p.rechazada_en)) + '): ' + esc(p.motivo || ''), b);
      case 'error':
        if (aut && p.semaforo !== 'bloqueada' && rev.pruebas_ok !== false && (p.semaforo !== 'rojo' || (p.revisada_ok && p.revisada_sha === p.sha))) b.push('<button class="btn pri" type="button" data-a="autorizar">Volver a intentar</button>');
        if (aut) b.push('<button class="btn mal" type="button" data-a="rechazar">Rechazar</button>');
        return caja('rojo', '<b>No se pudo publicar.</b> ' + esc(p.resultado || ''), b);
      case 'deshaciendo':
        return caja('amarillo', '<b>Se está deshaciendo</b> (lo pidió ' + esc(nombre(p.deshecha_por)) + ').', b);
      case 'deshecha':
        return caja('', '<b>Se deshizo</b> ' + esc(hora(p.deshecha_en)) + ' (lo pidió ' + esc(nombre(p.deshecha_por)) + '): el portal quedó como estaba antes de esta propuesta.', b);
      case 'retirada':
        return caja('', '<b>Retirada.</b> ' + esc(p.resultado || ''), b);
    }
    return '';
  }
  function caja(cls, html, botones, extra) {
    return '<div class="estado ' + cls + '"><div>' + html + '</div>' + (extra || '') + (botones.length ? '<div class="botones">' + botones.join('') + '</div>' : '') + '</div>';
  }

  function revision(p, rev) {
    var av = (rev.avisos || []).map(function (a) { return '<div class="aviso ' + esc(a.nivel) + '">' + esc(a.texto) + '</div>'; }).join('');
    var pr = (rev.pruebas || []).map(function (t) {
      return '<div class="prueba' + (t.ok ? '' : ' no') + '"><span class="i">' + (t.ok ? '✓' : '✕') + '</span><div>' + esc(t.nombre)
        + (t.ok ? '' : '<pre>' + esc(t.detalle || '') + '</pre>') + '</div></div>';
    }).join('');
    return '<section class="card"><header><h3>Revisión automática</h3><span class="chip ' + esc(p.semaforo) + '">' + esc(SEM[p.semaforo] || '') + '</span></header><div class="cuerpo">'
      + '<p style="margin:0 0 10px">' + esc(SEM_TXT[p.semaforo] || '') + '</p>'
      + (av ? '<div class="avisos">' + av + '</div>' : '<div class="aviso verde">Sin avisos.</div>') + pr + '</div></section>';
  }
  function dictamen(p) {
    if (!p.revisada_en) return '';
    var vigente = p.revisada_sha === p.sha;
    return '<section class="card"><header><h3>Revisión técnica de Claude</h3><span class="chip ' + (p.revisada_ok ? 'verde' : 'rojo') + '">' + (p.revisada_ok ? 'Se puede autorizar' : 'No conviene autorizarla') + '</span></header><div class="cuerpo">'
      + '<div class="m" style="color:var(--muted);font-size:12.5px;margin-bottom:6px">' + esc(p.revisada_por || 'Claude') + ' · ' + esc(hora(p.revisada_en)) + (vigente ? '' : ' · <b>era de una versión anterior</b>') + '</div>'
      + '<div class="texto">' + texto(p.dictamen) + '</div></div></section>';
  }
  function archivos(rev) {
    var a = rev.areas || [];
    if (!a.length) return '';
    return '<section class="card"><header><h3>Qué cambia</h3><span class="m" style="color:var(--muted);font-size:12.5px">' + a.length + (a.length === 1 ? ' archivo' : ' archivos') + '</span></header><div class="cuerpo"><ul class="archivos">'
      + a.map(function (x) {
        return '<li><span class="punto ' + esc(x.nivel) + '" title="' + esc(SEM[x.nivel] || '') + '"></span><span class="que">' + esc(x.que) + ' <span style="font-weight:400;color:var(--muted)">(' + esc(x.accion) + ')</span></span>'
          + '<span class="n">+' + (x.mas || 0) + ' −' + (x.menos || 0) + '</span><span class="ruta">' + esc(x.archivo) + '</span></li>';
      }).join('') + '</ul></div></section>';
  }
  function fotos(p) {
    if (!(p.fotos || []).length) return '<section class="card"><header><h3>Cómo se ve</h3></header><div class="cuerpo m" style="color:var(--muted)">No mandó fotos.</div></section>';
    return '<section class="card"><header><h3>Cómo se ve</h3><span style="color:var(--muted);font-size:12.5px">Fotos que mandó con datos de prueba</span></header><div class="cuerpo"><div class="fotos" id="fotos">'
      + p.fotos.map(function (f, i) { return '<a data-i="' + i + '" role="button" tabindex="0"><img alt="' + esc(f.nombre) + '"><span>' + esc(f.nombre) + '</span></a>'; }).join('') + '</div></div></section>';
  }
  // Vista de fotos aquí mismo, sin abrir otra pestaña (2-nov-2026, pedido de Gabriel): ‹ › para pasar, clic para acercar, Esc cierra
  function foto(p, i) {
    var L = (p.fotos || []).map(function (f, k) { var a = document.querySelector('#fotos a[data-i="' + k + '"]'); return { n: f.nombre, u: a && a.dataset.url }; }).filter(function (x) { return x.u; });
    if (!L.length) return;
    var k = Math.max(0, L.findIndex(function (x) { return x.n === (p.fotos[i] || {}).nombre; }));
    var v = $('fv'); if (!v) { v = document.createElement('div'); v.id = 'fv'; v.className = 'fv'; v.setAttribute('role', 'dialog'); v.setAttribute('aria-modal', 'true'); document.body.appendChild(v); }
    function pinta() {
      v.innerHTML = '<div class="fv-cab"><b>' + esc(L[k].n) + '</b><span>' + (k + 1) + ' de ' + L.length + '</span><button type="button" class="btn" data-f="-1" aria-label="Anterior">‹</button><button type="button" class="btn" data-f="1" aria-label="Siguiente">›</button><button type="button" class="btn" data-f="x" aria-label="Cerrar">Cerrar</button></div>'
        + '<div class="fv-img"><img alt="' + esc(L[k].n) + '" src="' + esc(L[k].u) + '"></div>';
      v.querySelector('.fv-img img').onclick = function () { this.classList.toggle('cerca'); };
    }
    function cierra() { v.hidden = true; document.removeEventListener('keydown', tecla); }
    function tecla(ev) { if (ev.key === 'Escape') cierra(); else if (ev.key === 'ArrowRight') { k = (k + 1) % L.length; pinta(); } else if (ev.key === 'ArrowLeft') { k = (k - 1 + L.length) % L.length; pinta(); } }
    v.onclick = function (ev) { var b = ev.target.closest('[data-f]'); if (ev.target === v) { cierra(); return; } if (!b) return; if (b.dataset.f === 'x') cierra(); else { k = (k + (+b.dataset.f) + L.length) % L.length; pinta(); } };
    pinta(); v.hidden = false; document.addEventListener('keydown', tecla);
    var c = v.querySelector('[data-f="x"]'); if (c) c.focus();
  }
  async function cargaFotos(p) {
    (p.fotos || []).forEach(async function (f, i) {
      try {
        var u = URLS[f.ruta];
        if (!u || u.hasta < Date.now()) {
          var r = await sb.storage.from('propuestas').createSignedUrl(f.ruta, 3600);
          if (r.error) return;
          u = URLS[f.ruta] = { url: r.data.signedUrl, hasta: Date.now() + 50 * 60000 };
        }
        var a = document.querySelector('#fotos a[data-i="' + i + '"]');
        if (a) {
          a.dataset.url = u.url; a.querySelector('img').src = u.url;
          a.onclick = function (ev) { ev.preventDefault(); foto(p, i); };
          a.onkeydown = function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); foto(p, i); } };
        }
      } catch (e) {}
    });
  }
  async function cambio(p) {
    var pre = $('diff');
    if (CAMBIO[p.id] && CAMBIO[p.id].sha === p.sha) { pre.innerHTML = CAMBIO[p.id].html; return; }
    var r = await sb.from('propuestas').select('cambio').eq('id', p.id).single();
    var t = r.error ? '' : (r.data.cambio || '');
    var html = t ? t.split('\n').map(function (l) {
      var c = /^diff --git/.test(l) ? 'f' : /^@@/.test(l) ? 'h' : /^\+(?!\+\+)/.test(l) ? 'a' : /^-(?!--)/.test(l) ? 'd' : '';
      return '<span' + (c ? ' class="' + c + '"' : '') + '>' + esc(l) + '</span>';
    }).join('') : '<span>Sin cambio técnico guardado.</span>';
    CAMBIO[p.id] = { sha: p.sha, html: html };
    pre.innerHTML = html;
  }
  function conversacion(p) {
    var puede = puedeEscribir() && (ROL === 'autoriza' || (ROL === 'propone' && p.proponente === YO));
    var c = MSJS.map(function (m) {
      if (!m.usuario) return '<div class="msg sis"><div class="x">' + esc(m.texto) + '</div><div class="q">' + esc(hora(m.creado)) + '</div></div>';
      return '<div class="msg' + (m.usuario === YO ? ' mio' : '') + '"><div class="q">' + esc(m.nombre || nombre(m.usuario)) + ' · ' + esc(hora(m.creado)) + '</div><div class="x">' + esc(m.texto) + '</div></div>';
    }).join('');
    return '<section class="card"><header><h3>Conversación</h3></header><div class="cuerpo"><div class="conv" id="conv">' + (c || '<div class="m" style="color:var(--muted)">Sin mensajes todavía.</div>') + '</div>'
      + (puede ? '<div class="escribe"><textarea id="m-txt" rows="2" maxlength="4000" placeholder="' + (ROL === 'autoriza' ? 'Escríbele a Gabo (por ejemplo, qué cambiar)…' : 'Escríbeles a Daniel y a Fernando…') + '"></textarea><button class="btn pri" type="button" id="m-env">Enviar</button></div>' : '')
      + '</div></section>';
  }

  function enlaza(p) {
    document.querySelectorAll('#v-det [data-a]').forEach(function (b) { b.onclick = function () { accion(b.dataset.a, p, b); }; });
    if ($('m-env')) $('m-env').onclick = async function () {
      var t = $('m-txt').value.trim(); if (!t) return;
      this.disabled = true;
      var r = await sb.rpc('cambios_comentar', { p_id: p.id, p_texto: t });
      this.disabled = false;
      if (r.error) { aviso(r.error.message, 'mal'); return; }
      $('m-txt').value = '';
      await carga(true); avisaArriba();
    };
  }

  function pregunta(titulo, html, ok, conTexto, opcional) {
    return new Promise(function (res) {
      var d = $('dlg');
      $('dlg-t').textContent = titulo;
      $('dlg-c').innerHTML = html + (conTexto ? '<textarea id="dlg-x" maxlength="4000" placeholder="' + esc(conTexto) + '"></textarea>' : '');
      $('dlg-ok').textContent = ok;
      d.returnValue = '';
      d.onclose = function () {
        if (d.returnValue !== 'si') { res(null); return; }
        var x = conTexto ? ($('dlg-x').value || '').trim() : true;
        var m = d.querySelector('input[name="dlg-mot"]:checked');   // retirar: el motivo escogido va primero
        res(m ? m.value + (x && x !== true ? ': ' + x : '') : x);
      };
      $('dlg-f').onsubmit = function (e) { if (e.submitter && e.submitter.value === 'si' && conTexto && !opcional && !$('dlg-x').value.trim()) { e.preventDefault(); $('dlg-x').focus(); } };
      if (d.showModal) d.showModal(); else res(window.confirm(titulo) ? (conTexto ? (window.prompt(conTexto) || '').trim() || null : true) : null);
    });
  }

  async function accion(a, p, boton) {
    var r;
    if (a === 'autorizar') {
      var rojo = p.semaforo === 'rojo';
      if (!await pregunta('¿Autorizar y publicar?', '<p>«' + esc(p.titulo) + '» de ' + esc(nombre(p.proponente) || 'Gabo') + '. Se publica en el portal en alrededor de un minuto, exactamente como la revisaste.</p>'
        + (rojo ? '<p><b>Tiene avisos delicados.</b> Si tienes duda, pídele antes a tu Claude: «revisa la propuesta #' + p.id + '».</p>' : '')
        + ((p.sql_archivos || []).length ? '<p>Trae cambios para la base: no se corren solos; después tu Claude los corre.</p>' : '') + '<p>Si algo sale mal, la puedes deshacer.</p>', 'Autorizar y publicar')) return;
      boton.disabled = true;
      r = await sb.rpc('cambios_autorizar', { p_id: p.id, p_sha: p.sha });
    } else if (a === 'rechazar') {
      var motivo = await pregunta('¿Rechazar la propuesta?', '<p>Escribe por qué, para que Gabo sepa qué corregir. Lo verá en la conversación.</p>', 'Rechazar', 'Motivo…');
      if (!motivo) return;
      boton.disabled = true;
      r = await sb.rpc('cambios_rechazar', { p_id: p.id, p_motivo: motivo });
    } else if (a === 'deshacer') {
      if (!await pregunta('¿Deshacer esta propuesta?', '<p>El portal regresa a como estaba antes de «' + esc(p.titulo) + '». Tarda alrededor de un minuto.</p>'
        + ((p.sql_archivos || []).length && p.sql_listo_en ? '<p><b>Su SQL ya se corrió en Supabase:</b> eso no se deshace solo; pídeselo a tu Claude.</p>' : ''), 'Deshacer')) return;
      boton.disabled = true;
      r = await sb.rpc('cambios_deshacer', { p_id: p.id });
    } else if (a === 'retirar') {
      var MOT = ['Me arrepentí', 'No me gustó cómo quedó', 'La corregí y la mandé en otra propuesta', 'Otro'];
      var por = await pregunta('¿Retirar tu propuesta?', '<p>«' + esc(p.titulo) + '» deja de esperar autorización y queda como «Retirada», con su conversación. Nada se publica.</p>'
        + '<p>¿Por qué?</p><div class="mot">' + MOT.map(function (m, i) { return '<label><input type="radio" name="dlg-mot" value="' + esc(m) + '"' + (i ? '' : ' checked') + '> ' + esc(m) + '</label>'; }).join('') + '</div>', 'Retirar', 'Algo más (opcional)…', true);
      if (por === null) return;
      boton.disabled = true;
      r = await sb.rpc('cambios_retirar', { p_id: p.id, p_motivo: por });
    } else if (a === 'sql') {
      if (!await pregunta('¿Ya se corrió el SQL?', '<p>Márcalo solo si ya se corrió en Supabase <code>' + (p.sql_archivos || []).map(esc).join('</code>, <code>') + '</code> y salió bien.</p>', 'Sí, ya se corrió')) return;
      boton.disabled = true;
      r = await sb.rpc('cambios_sql_listo', { p_id: p.id });
    }
    if (r && r.error) { boton.disabled = false; aviso(r.error.message, 'mal'); window.scrollTo(0, 0); return; }
    aviso(a === 'autorizar' ? 'Autorizada. Se está publicando; en alrededor de un minuto queda en el portal.' : a === 'rechazar' ? 'Rechazada. Gabo verá el motivo.'
      : a === 'deshacer' ? 'Se está deshaciendo; tarda alrededor de un minuto.' : a === 'retirar' ? 'Retirada. Ya no espera autorización.' : 'Listo.', 'ok');
    await carga(true); avisaArriba();
  }

  document.querySelectorAll('#v-lista .tabs button').forEach(function (b) {
    b.onclick = function () {
      FILTRO = b.dataset.f; GFX = '';
      document.querySelectorAll('#v-lista .tabs button').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
      pintaLista();
    };
  });
  document.querySelectorAll('#v-pcad .tabs button').forEach(function (b) {
    b.onclick = function () {
      PFILTRO = b.dataset.g; pFiltroAuto = false; PPX = '';
      document.querySelectorAll('#v-pcad .tabs button').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
      pintaPcad();
    };
  });
  document.querySelectorAll('#quien [data-q]').forEach(function (b) {
    b.onclick = function () {
      if (b.dataset.q === QUIEN) { if (QUIEN === 'cad' && PABIERTA) cierraPet(); else if (QUIEN === 'gab' && ABIERTA) cierra(); return; }
      ponQuien(b.dataset.q);
      try { history.replaceState(null, '', location.pathname + location.search + (QUIEN === 'gab' ? (ABIERTA ? '#p' + ABIERTA : '#gabo') : (PABIERTA ? '#c' + PABIERTA : ''))); } catch (e) {}
      if (QUIEN === 'cad') cargaPcad(true); else carga(true);
    };
  });
  $('lista').addEventListener('click', function (e) { var it = e.target.closest('.item'); if (it) { COLA = GVISTA.map(function (p) { return p.id; }); abre(+it.dataset.id); } });
  $('plista').addEventListener('click', function (e) { var it = e.target.closest('.item'); if (it) { PCOLA = PVISTA.map(function (p) { return p.archivo; }); abrePet(it.dataset.a); } });
  $('recargar').onclick = function () { if (QUIEN === 'cad') cargaPcad(); else carga(); };
  $('leer').onclick = async function () {
    var b = this;
    if (QUIEN === 'cad') {
      b.disabled = true;
      var rp = await sb.rpc('pcad_leer_todo');
      b.disabled = false;
      if (rp.error) { aviso(rp.error.message, 'mal'); return; }
      PFILAS.forEach(function (p) { p.nueva = false; });
      pintaPcad(); avisaArriba();
      aviso(papel() === 'pide' ? 'Listo: ya no te salen como nuevas ni en la campanita.' : 'Listo: ya no te salen como nuevas ni en la campanita. Las que esperan tu decisión siguen en «Por decidir».', 'ok');
      return;
    }
    b.disabled = true;
    var r = await sb.rpc('cambios_leer_todo');
    b.disabled = false;
    if (r.error) { aviso(r.error.message, 'mal'); return; }
    var ahora = new Date().toISOString();
    FILAS.forEach(function (p) { VISTO[p.id] = ahora; });
    pintaLista(); avisaArriba();
    aviso('Listo: ya no te salen los avisos de estas propuestas. Si llega una nueva, te vuelve a salir; puedes seguir autorizándolas o regresándolas cuando haga falta.', 'ok');
  };
  $('mandar').onclick = async function () {
    var b = this; b.disabled = true;
    var r = await sb.rpc('cambios_mandar');
    b.disabled = false;
    if (r.error) { aviso(r.error.message, 'mal'); return; }
    aviso(r.data && r.data.yaEnCurso ? 'Ya se están revisando; en uno o dos minutos aparecen aquí.'
      : 'Listo: en uno o dos minutos aparecen aquí las propuestas nuevas, ya revisadas.', 'ok');
    setTimeout(function () { carga(true); }, 60000);
    setTimeout(function () { carga(true); }, 120000);
  };
  arranca();
})();
</script>
</body></html>
