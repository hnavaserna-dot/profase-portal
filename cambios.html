<!doctype html><html lang="es" data-rol="todos" data-incrustada="1"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Portal PROFASE · Cambios al portal</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Portal PROFASE · Cambios al portal (29-oct-2026, pedido de Daniel). Gabo (Gabriel Cavazos) propone cambios desde su
   Claude; Daniel o Fernando Cadengo los revisan aquí y, con «Autorizar», se publican solos. Quién ve y hace qué lo
   decide la base (portal/sql/21_propuestas.sql); la publicación la hace la acción «Propuestas» (nube/propuestas.py).
   Las horas siempre en hora de Monterrey. */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --surface-2:#EEF2F7; --ink:#132036; --muted:#5A6577; --line:#DCE2EB; --line-strong:#C4CDDA;
  --navy:#1F3864; --navy-ink:#FFFFFF; --navy-soft:#E6ECF6; --band-dim:#B9C7DE;
  --accent:#F07A1E; --accent-soft:#FDEBDC; --accent-ink:#A64B0A;
  --red:#B42318; --red-soft:#FDECEA; --ok:#1D7A4F; --ok-soft:#E2F1E8; --amber:#9A6700; --amber-soft:#FFF4D6;
  --add:#E6F4EA; --add-ink:#1D5E36; --del:#FDECEA; --del-ink:#8A1C14;
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif;
  --f-body:"Public Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1320; --surface:#141C2B; --surface-2:#1A2436; --ink:#E5EAF2; --muted:#98A3B5; --line:#243049; --line-strong:#33415E;
  --navy:#16284A; --navy-ink:#E5EAF2; --navy-soft:#1C2A44; --band-dim:#8FA3C4;
  --accent:#FF8F3F; --accent-soft:#3A2516; --accent-ink:#FFB27A;
  --red:#F2867B; --red-soft:#3A1C1A; --ok:#4CAF7D; --ok-soft:#173022; --amber:#E9B949; --amber-soft:#33280F;
  --add:#16301F; --add-ink:#8FD3A6; --del:#3A1C1A; --del-ink:#F4A49B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1320; --surface:#141C2B; --surface-2:#1A2436; --ink:#E5EAF2; --muted:#98A3B5; --line:#243049; --line-strong:#33415E;
  --navy:#16284A; --navy-ink:#E5EAF2; --navy-soft:#1C2A44; --band-dim:#8FA3C4;
  --accent:#FF8F3F; --accent-soft:#3A2516; --accent-ink:#FFB27A;
  --red:#F2867B; --red-soft:#3A1C1A; --ok:#4CAF7D; --ok-soft:#173022; --amber:#E9B949; --amber-soft:#33280F;
  --add:#16301F; --add-ink:#8FD3A6; --del:#3A1C1A; --del-ink:#F4A49B; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);font-stretch:85%;margin:0;line-height:1.15}
button,select,input,textarea{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
[hidden]{display:none!important}

.band{background:var(--navy);color:var(--navy-ink);border-bottom:4px solid var(--accent)}
.band .wrap{padding-top:18px;padding-bottom:18px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.band h1{font-size:26px;font-weight:750}
.band p{margin:4px 0 0;color:var(--band-dim);font-size:13px;max-width:62ch}
.band .acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12.5px;color:var(--band-dim)}
.btn{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 13px;font-weight:600;font-size:13.5px;cursor:pointer;min-height:38px}
.btn:hover{border-color:var(--navy)}
.btn:disabled{opacity:.55;cursor:default}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.05)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.mal{background:transparent;border-color:var(--red);color:var(--red)}
.band .btn{background:transparent;color:var(--navy-ink);border-color:rgba(255,255,255,.35)}
.band .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.band .btn:hover{border-color:var(--accent)}
.btn:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,.item:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.nota{background:var(--amber-soft);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:16px 0;font-size:13.5px}
.nota.ok{background:var(--ok-soft)}
.nota.mal{background:var(--red-soft)}

.tabs{display:flex;gap:6px;margin:16px 0 12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:13px;cursor:pointer;min-height:36px}
.tabs button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
:root[data-theme="dark"] .tabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.lista{display:grid;gap:10px;margin:0 0 24px}
.item{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--line-strong);border-radius:12px;padding:12px 14px;cursor:pointer}
.item:hover{border-color:var(--navy);border-left-color:inherit}
.item.verde{border-left-color:var(--ok)}.item.amarillo{border-left-color:var(--accent)}.item.rojo,.item.bloqueada{border-left-color:var(--red)}
.item .t{display:flex;gap:8px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.item .h{font-family:var(--f-display);font-stretch:85%;font-size:17px;font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.item .m{color:var(--muted);font-size:12.5px;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--navy-soft);color:var(--ink)}
.chip.verde{background:var(--ok-soft);color:var(--ok)}
.chip.amarillo{background:var(--accent-soft);color:var(--accent-ink)}
.chip.rojo,.chip.bloqueada{background:var(--red-soft);color:var(--red)}
.chip.nuevo{background:var(--accent);color:#fff}
.chip.gris{background:var(--surface-2);color:var(--muted)}
.vacio{background:var(--surface);border:1px dashed var(--line-strong);border-radius:12px;padding:22px 16px;color:var(--muted)}

/* Detalle */
.volver{margin:16px 0 0;border:0;background:none;color:var(--accent-ink);font-weight:600;cursor:pointer;padding:6px 0;min-height:36px}
:root[data-theme="dark"] .volver{color:var(--accent)}
.det h2{font-size:23px;font-weight:750;margin:6px 0 4px;overflow-wrap:anywhere}
.det .m{color:var(--muted);font-size:13px}
.estado{border-radius:12px;padding:14px;margin:14px 0;border:1px solid var(--line);background:var(--surface)}
.estado.verde{background:var(--ok-soft);border-color:transparent}
.estado.amarillo{background:var(--amber-soft);border-color:transparent}
.estado.rojo{background:var(--red-soft);border-color:transparent}
.estado b{font-weight:700}
.estado .botones{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:0 0 14px;overflow:hidden}
.card>header{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.card h3{font-size:17px;font-weight:700}
.card .cuerpo{padding:12px 14px}
.texto p{margin:0 0 8px}.texto ul{margin:0 0 8px;padding-left:20px}.texto code{font-family:var(--f-mono);font-size:12.5px;background:var(--surface-2);padding:1px 5px;border-radius:5px;overflow-wrap:anywhere}
.texto h4{font-size:14.5px;margin:10px 0 4px}
.avisos{display:grid;gap:8px}
.aviso{border-left:4px solid var(--accent);background:var(--surface-2);border-radius:8px;padding:9px 12px;font-size:13.5px}
.aviso.rojo,.aviso.bloqueada{border-left-color:var(--red);background:var(--red-soft)}
.aviso.verde{border-left-color:var(--ok)}
.prueba{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;margin-top:8px}
.prueba .i{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;background:var(--ok)}
.prueba.no .i{background:var(--red)}
.prueba pre{white-space:pre-wrap;font-family:var(--f-mono);font-size:12px;background:var(--surface-2);padding:8px;border-radius:8px;margin:6px 0 0;overflow-wrap:anywhere}
.archivos{list-style:none;margin:0;padding:0}
.archivos li{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:4px 10px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line)}
.archivos li:first-child{border-top:0}
.punto{width:10px;height:10px;border-radius:50%;background:var(--ok);align-self:center}
.punto.amarillo{background:var(--accent)}.punto.rojo,.punto.bloqueada{background:var(--red)}
.archivos .que{font-weight:600}
.archivos .ruta{grid-column:2/4;font-family:var(--f-mono);font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.archivos .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.fotos a{display:block;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface-2);text-decoration:none;color:var(--muted);font-size:12px}
.fotos img{display:block;width:100%;height:150px;object-fit:cover;object-position:top}
.fotos span{display:block;padding:6px 8px;overflow-wrap:anywhere}
details.tec summary{cursor:pointer;padding:12px 14px;font-weight:600;list-style:none}
details.tec summary::-webkit-details-marker{display:none}
details.tec summary::before{content:"▸ ";color:var(--muted)}
details.tec[open] summary::before{content:"▾ "}
.diff{margin:0;padding:10px 0;font-family:var(--f-mono);font-size:12px;line-height:1.5;overflow-x:auto;border-top:1px solid var(--line);max-height:70vh}
.diff span{display:block;padding:0 14px;white-space:pre;min-width:max-content}
.diff .a{background:var(--add);color:var(--add-ink)}.diff .d{background:var(--del);color:var(--del-ink)}.diff .h{color:var(--accent-ink);font-weight:700;margin-top:6px}
.diff .f{color:var(--ink);font-weight:700;background:var(--surface-2);margin-top:10px}
.conv{display:grid;gap:10px}
.msg{max-width:min(620px,92%);background:var(--surface-2);border-radius:12px;padding:9px 12px}
.msg.mio{justify-self:end;background:var(--navy-soft)}
.msg.sis{justify-self:center;max-width:100%;background:transparent;border:1px dashed var(--line-strong);color:var(--muted);font-size:13px;text-align:center}
.msg .q{font-size:12px;color:var(--muted);margin-bottom:2px}
.msg .x{white-space:pre-wrap;overflow-wrap:anywhere}
.escribe{display:flex;gap:8px;align-items:flex-end;margin-top:12px}
.escribe textarea{flex:1;min-height:44px;max-height:180px;resize:vertical;border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:9px 11px;font-size:14.5px}
dialog{border:0;border-radius:14px;padding:0;max-width:min(480px,calc(100vw - 24px));width:100%;background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,18,32,.5)}
dialog form{padding:18px}
dialog h3{font-size:19px;margin-bottom:8px}
dialog p{margin:0 0 10px;font-size:14px}
dialog textarea{width:100%;min-height:110px;border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:9px 11px;font-size:14.5px}
dialog .botones{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:12px}
.pie{color:var(--muted);font-size:12px;margin:0 0 24px}
@media (max-width:640px){
  .band h1{font-size:22px}
  .band .acts{width:100%}
  .band .acts .btn{flex:1}
  #hora{flex-basis:100%}
  input,select,textarea{font-size:16px!important}
  .estado .botones .btn{flex:1 1 140px}
  .escribe{flex-direction:column;align-items:stretch}
  .fotos{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style></head><body>
<div class="band"><div class="wrap">
  <div>
    <h1>Cambios al portal</h1>
    <p id="sub">Cargando…</p>
  </div>
  <div class="acts">
    <span id="hora" aria-live="polite"></span>
    <button class="btn pri" type="button" id="mandar" hidden>Mandar a autorizar</button>
    <button class="btn" type="button" id="recargar">Actualizar</button>
  </div>
</div></div>

<div class="wrap">
  <div class="nota" id="aviso" hidden></div>
  <div class="nota" id="sin-acceso" hidden>Esta sección es para quien propone o autoriza cambios al portal.</div>

  <section id="v-lista" hidden>
    <div class="tabs" role="group" aria-label="Qué propuestas ver">
      <button type="button" data-f="pend" aria-pressed="true">Pendientes</button>
      <button type="button" data-f="hist" aria-pressed="false">Historial</button>
    </div>
    <div class="lista" id="lista"></div>
    <p class="pie" id="pie"></p>
  </section>

  <section id="v-det" class="det" hidden></section>
</div>

<dialog id="dlg"><form method="dialog" id="dlg-f">
  <h3 id="dlg-t"></h3>
  <div id="dlg-c"></div>
  <div class="botones"><button class="btn" value="no" type="submit">Cancelar</button><button class="btn pri" id="dlg-ok" value="si" type="submit"></button></div>
</form></dialog>

<script>
(function(){
  'use strict';
  var P = window.PORTAL, sb = P.sb, $ = function (id) { return document.getElementById(id); };
  var ZONA = 'America/Monterrey';
  var ROL = null, YO = null, FILTRO = 'pend', FILAS = [], VISTO = {}, NOMBRES = {}, ABIERTA = null, CAMBIO = {}, MSJS = [], FIRMA = '', URLS = {}, cargando = false;
  var PEND = ['por_autorizar', 'choca', 'error', 'autorizada', 'deshaciendo'];
  var ESTADO = { por_autorizar: 'Por autorizar', autorizada: 'Publicándose', publicada: 'Publicada', rechazada: 'Rechazada',
    retirada: 'Retirada', choca: 'Choca con cambios recientes', error: 'No se pudo publicar', deshaciendo: 'Deshaciéndose', deshecha: 'Deshecha' };
  var SEM = { verde: 'Revisión: sencilla', amarillo: 'Revisión: con cuidado', rojo: 'Revisión: delicada', bloqueada: 'Bloqueada' };
  var SEM_TXT = { verde: 'Solo cambia páginas o textos: nada delicado.', amarillo: 'Toca algo que comparten varias pestañas o un proceso automático: revisa con cuidado.',
    rojo: 'Toca algo delicado (la base, la seguridad, código que corre con las llaves o lo que solo ve la dirección): no se puede autorizar hasta que tu Claude la revise.',
    bloqueada: 'Toca usuarios, permisos o procesos con llaves: eso no se cambia por propuesta y nadie la puede autorizar.' };

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  var fHora = new Intl.DateTimeFormat('es-MX', { timeZone: ZONA, day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit', hour12: true });
  function hora(t) { return t ? fHora.format(new Date(t)).replace(/\./g, '') : ''; }
  function hace(t) {
    if (!t) return '';
    var m = Math.round((Date.now() - Date.parse(t)) / 60000);
    if (m < 1) return 'hace un momento';
    if (m < 60) return 'hace ' + m + ' min';
    var h = Math.round(m / 60); if (h < 24) return 'hace ' + h + (h === 1 ? ' hora' : ' horas');
    var d = Math.round(h / 24); return 'hace ' + d + (d === 1 ? ' día' : ' días');
  }
  function nombre(u) { return u ? (NOMBRES[u] || u) : ''; }
  function puedeEscribir() { return !P.consulta && ROL !== 'consulta'; }
  function aviso(t, cls) { var a = $('aviso'); a.className = 'nota' + (cls ? ' ' + cls : ''); a.textContent = t; a.hidden = !t; }
  function avisaArriba() { try { window.parent.postMessage({ tipo: 'cambios-avisos' }, location.origin); } catch (e) { /* abierta sola */ } }
  function nuevo(p) {
    if (ROL === 'consulta') return false;
    var v = VISTO[p.id];
    return p.ultimo_por !== YO && p.estado !== 'retirada' && (!v || Date.parse(p.actualizada) > Date.parse(v));
  }

  // Texto de PROPUESTA.md: párrafos, listas, **negritas** y `código`; siempre escapado (nunca se pinta como HTML)
  function texto(md) {
    var out = [], lista = false;
    String(md || '').split(/\r?\n/).forEach(function (l) {
      var t = esc(l.trim()).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>');
      if (/^[-*]\s+/.test(l.trim())) { if (!lista) { out.push('<ul>'); lista = true; } out.push('<li>' + t.replace(/^[-*]\s+/, '') + '</li>'); return; }
      if (lista) { out.push('</ul>'); lista = false; }
      if (!t) return;
      if (/^#{2,4}\s+/.test(l.trim())) out.push('<h4>' + t.replace(/^#{2,4}\s+/, '') + '</h4>');
      else out.push('<p>' + t + '</p>');
    });
    if (lista) out.push('</ul>');
    return out.join('') || '<p class="m">Sin explicación.</p>';
  }

  async function arranca() {
    try { await P.listo; } catch (e) { return; }
    YO = P.perfil && P.perfil.usuario;
    var r = await sb.rpc('cambios_rol');
    ROL = r.error ? null : r.data;
    if (!ROL) { $('sub').textContent = 'Sin acceso'; $('sin-acceso').hidden = false; return; }
    $('sub').textContent = ROL === 'autoriza' ? 'Lo que propone Gabo desde su Claude. Basta que uno de ustedes dos lo autorice para que se publique solo.'
      : ROL === 'propone' ? 'Tus propuestas de cambio. Cuando Daniel o Fernando Cadengo la autorizan, se publica sola en el portal.'
      : 'Propuestas de cambio al portal. Puedes verlas; no cambiar nada.';
    if (puedeEscribir()) {
      $('mandar').hidden = false;
      $('mandar').textContent = ROL === 'autoriza' ? 'Buscar nuevas' : 'Mandar a autorizar';
      $('mandar').title = ROL === 'autoriza' ? 'Revisa en este momento si Gabo subió propuestas nuevas' : 'Manda a revisar las propuestas que tu Claude ya subió';
    }
    try { var n = await sb.rpc('cambios_nombres'); (n.data || []).forEach(function (x) { NOMBRES[x.usuario] = x.nombre; }); } catch (e) {}
    $('v-lista').hidden = false;
    await carga();
    var id = +(location.hash.match(/^#p(\d+)$/) || [])[1];
    if (id) abre(id);
    setInterval(function () { if (!document.hidden) carga(true); }, 20000);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) carga(true); });
  }

  async function carga(callado) {
    if (cargando) return;
    cargando = true; $('recargar').disabled = true;
    try {
      var r = await sb.from('propuestas').select('id,rama,sha,titulo,descripcion,proponente,github,estado,semaforo,revision,fotos,sql_archivos,sql_listo_por,sql_listo_en,creada,actualizada,ultimo_por,autorizada_por,autorizada_en,rechazada_por,rechazada_en,motivo,publicada_en,deshecha_por,deshecha_en,resultado,revisada_por,revisada_sha,revisada_en,revisada_ok,dictamen').order('id', { ascending: false }).limit(300);
      if (r.error) throw r.error;
      FILAS = r.data || [];
      if (ROL !== 'consulta') {
        var v = await sb.from('propuestas_visto').select('propuesta,at');
        VISTO = {}; (v.data || []).forEach(function (x) { VISTO[x.propuesta] = x.at; });
      }
      $('hora').textContent = 'Al momento · ' + hora(new Date()).replace(/^.*?, /, '');
      pintaLista();
      if (ABIERTA) await pintaDetalle(ABIERTA, true);
      if (!callado) aviso('');
    } catch (e) {
      var m = (e && (e.message || e.code)) || String(e);
      if (/propuestas|does not exist|PGRST205|42P01/i.test(m)) aviso('La sección todavía no está activa en la base: falta correr portal/sql/21_propuestas.sql en Supabase.');
      else if (!callado) aviso('No se pudo leer. Vuelve a intentar en un momento.', 'mal');
    } finally { cargando = false; $('recargar').disabled = false; }
  }

  function pintaLista() {
    var pend = FILAS.filter(function (p) { return PEND.indexOf(p.estado) >= 0; });
    var hist = FILAS.filter(function (p) { return PEND.indexOf(p.estado) < 0; });
    var porAut = pend.filter(function (p) { return p.estado === 'por_autorizar'; }).length;
    document.querySelector('.tabs [data-f="pend"]').textContent = 'Pendientes' + (pend.length ? ' (' + pend.length + ')' : '');
    document.querySelector('.tabs [data-f="hist"]').textContent = 'Historial' + (hist.length ? ' (' + hist.length + ')' : '');
    var l = FILTRO === 'pend' ? pend : hist;
    if (!l.length) {
      $('lista').innerHTML = '<div class="vacio">' + (FILTRO === 'pend'
        ? (ROL === 'propone' ? 'No tienes propuestas pendientes. Pídele a tu Claude un cambio del portal; cuando lo suba, pica «Mandar a autorizar».'
          : 'No hay propuestas pendientes. Cuando Gabo mande una, aparece aquí y te sale el aviso en el menú.')
        : 'Todavía no hay propuestas publicadas, rechazadas ni retiradas.') + '</div>';
    } else {
      $('lista').innerHTML = l.map(function (p) {
        var rev = p.revision || {}, n = (rev.areas || []).length, li = rev.lineas || {};
        return '<button type="button" class="item ' + esc(p.semaforo) + '" data-id="' + p.id + '">'
          + '<div class="t"><span class="h">#' + p.id + ' · ' + esc(p.titulo || p.rama) + '</span>' + (nuevo(p) ? '<span class="chip nuevo">Nuevo</span>' : '') + '</div>'
          + '<div class="m">' + esc(nombre(p.proponente) || p.github || 'Sin reconocer') + ' · ' + esc(hace(p.actualizada)) + ' · ' + n + (n === 1 ? ' archivo' : ' archivos')
          + (li.mas || li.menos ? ' · +' + (li.mas || 0) + ' −' + (li.menos || 0) : '') + '</div>'
          + '<div class="chips"><span class="chip ' + chipEstado(p) + '">' + esc(ESTADO[p.estado] || p.estado) + '</span>'
          + '<span class="chip ' + esc(p.semaforo) + '">' + esc(SEM[p.semaforo] || p.semaforo) + '</span>'
          + (p.revision && p.revision.pruebas_ok === false ? '<span class="chip rojo">No pasa las revisiones</span>' : '')
          + ((p.sql_archivos || []).length ? '<span class="chip ' + (p.sql_listo_en ? 'gris' : 'amarillo') + '">' + (p.sql_listo_en ? 'Base al día' : 'Cambia la base') + '</span>' : '')
          + '</div></button>';
      }).join('');
    }
    $('pie').textContent = ROL === 'autoriza' ? (porAut ? porAut + (porAut === 1 ? ' propuesta espera' : ' propuestas esperan') + ' tu revisión.' : '') : '';
  }
  function chipEstado(p) {
    return { por_autorizar: 'amarillo', autorizada: 'amarillo', publicada: 'verde', rechazada: 'rojo', choca: 'amarillo', error: 'rojo', deshaciendo: 'amarillo', deshecha: 'gris', retirada: 'gris' }[p.estado] || '';
  }

  async function abre(id) {
    ABIERTA = id; FIRMA = '';
    try { history.replaceState(null, '', '#p' + id); } catch (e) {}
    $('v-lista').hidden = true; $('v-det').hidden = false;
    window.scrollTo(0, 0);
    await pintaDetalle(id, false);
    if (ROL !== 'consulta' && !P.consulta) {
      try { await sb.rpc('cambios_visto', { p_id: id }); VISTO[id] = new Date().toISOString(); avisaArriba(); } catch (e) {}
    }
  }
  function cierra() {
    ABIERTA = null;
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    $('v-det').hidden = true; $('v-lista').hidden = false;
    pintaLista();
  }

  async function pintaDetalle(id, refresco) {
    var p = FILAS.find(function (x) { return x.id === id; });
    if (!p) { $('v-det').innerHTML = '<button type="button" class="volver" id="volver">← Regresar</button><div class="vacio">Esa propuesta no existe o no te toca verla.</div>'; $('volver').onclick = cierra; return; }
    var m = await sb.from('propuestas_mensajes').select('id,usuario,nombre,texto,creado').eq('propuesta', id).order('id');
    MSJS = m.error ? [] : (m.data || []);
    // al refrescar solo se vuelve a pintar si algo cambió (para no mover la pantalla ni lo que se está escribiendo)
    var firma = [p.id, p.actualizada, p.estado, p.sha, MSJS.length ? MSJS[MSJS.length - 1].id : 0].join('|');
    if (refresco && firma === FIRMA) return;
    FIRMA = firma;
    var abiertoTec = document.querySelector('#v-det details.tec[open]');
    var borrador = $('m-txt') ? $('m-txt').value : '';
    var rev = p.revision || {};
    var h = '<button type="button" class="volver" id="volver">← Todas las propuestas</button>'
      + '<h2>#' + p.id + ' · ' + esc(p.titulo || p.rama) + '</h2>'
      + '<div class="m">De ' + esc(nombre(p.proponente) || p.github || 'alguien sin reconocer') + ' · llegó ' + esc(hora(p.creada)) + (p.actualizada !== p.creada ? ' · último movimiento ' + esc(hace(p.actualizada)) : '')
      + ' · rama <code>' + esc(p.rama) + '</code></div>'
      + '<div class="chips"><span class="chip ' + chipEstado(p) + '">' + esc(ESTADO[p.estado] || p.estado) + '</span><span class="chip ' + esc(p.semaforo) + '">' + esc(SEM[p.semaforo] || p.semaforo) + '</span></div>'
      + estado(p)
      + '<section class="card"><header><h3>Qué pide</h3></header><div class="cuerpo texto">' + texto(p.descripcion) + '</div></section>'
      + dictamen(p)
      + revision(p, rev)
      + archivos(rev)
      + fotos(p)
      + '<section class="card"><details class="tec" id="tec"' + (abiertoTec ? ' open' : '') + '><summary>Ver el cambio técnico (para tu Claude o quien lo quiera revisar línea por línea)</summary><pre class="diff" id="diff">Cargando…</pre></details></section>'
      + conversacion(p);
    $('v-det').innerHTML = h;
    $('volver').onclick = cierra;
    var tec = $('tec');
    tec.addEventListener('toggle', function () { if (tec.open) cambio(p); });
    if (tec.open) cambio(p);
    enlaza(p);
    cargaFotos(p);
    if ($('m-txt')) $('m-txt').value = borrador;
    if (!refresco) { var c = $('conv'); if (c && MSJS.length > 6) c.lastElementChild && c.lastElementChild.scrollIntoView({ block: 'nearest' }); }
  }

  function estado(p) {
    var aut = ROL === 'autoriza' && puedeEscribir(), rev = p.revision || {}, b = [];
    var sqlTxt = (p.sql_archivos || []).length ? '<p>Trae cambios para la base: <code>' + (p.sql_archivos || []).map(esc).join('</code>, <code>') + '</code>. '
      + (p.estado === 'publicada'
        ? (p.sql_listo_en ? 'Ya se corrieron (' + esc(nombre(p.sql_listo_por)) + ', ' + esc(hora(p.sql_listo_en)) + ').'
          : '<b>Falta correrlos en la base:</b> pídele a tu Claude «corre el SQL de la propuesta #' + p.id + '» y, cuando quede, márcalo aquí.')
        : 'No se corren solos: después de publicarla, tu Claude los revisa y los corre.') + '</p>' : '';
    switch (p.estado) {
      case 'por_autorizar':
        if (p.semaforo === 'bloqueada') {
          if (aut) b.push('<button class="btn mal" type="button" data-a="rechazar">Rechazar</button>');
          return caja('rojo', '<b>Bloqueada.</b> ' + esc(SEM_TXT.bloqueada) + (ROL === 'propone' ? ' Si hace falta, pídeselo a Daniel o a Fernando.' : ''), b);
        }
        if (rev.pruebas_ok === false) {
          if (aut) b.push('<button class="btn mal" type="button" data-a="rechazar">Rechazar</button>');
          return caja('rojo', '<b>No pasa las revisiones automáticas del portal.</b> No se puede autorizar hasta que Gabo la corrija (el detalle está abajo, en «Revisión automática»).', b);
        }
        if (p.semaforo === 'rojo' && !(p.revisada_ok && p.revisada_sha === p.sha)) {
          if (aut) b.push('<button class="btn mal" type="button" data-a="rechazar">Rechazar</button>');
          var vieja = p.revisada_en && p.revisada_sha !== p.sha;
          return caja('amarillo', ROL === 'autoriza'
            ? '<b>Delicada: antes de autorizarla, pídele a tu Claude «revisa la propuesta #' + p.id + '».</b> ' + (p.revisada_en && !vieja && !p.revisada_ok ? 'Tu Claude ya la revisó y no recomienda autorizarla (abajo está por qué).' : vieja ? 'La revisión que había era de una versión anterior.' : 'Cuando la revise, su dictamen aparece aquí y se habilita «Autorizar».')
            : '<b>Delicada:</b> espera la revisión técnica del Claude de Daniel o de Fernando.', b, sqlTxt);
        }
        if (aut) { b.push('<button class="btn pri" type="button" data-a="autorizar">Autorizar y publicar</button>'); b.push('<button class="btn mal" type="button" data-a="rechazar">Rechazar</button>'); }
        return caja(p.semaforo === 'rojo' ? 'amarillo' : '', ROL === 'autoriza' ? '<b>Espera tu revisión.</b> ' + esc(SEM_TXT[p.semaforo] || '') + ' Si la autorizas, se publica sola en alrededor de un minuto.'
          : '<b>Espera a que Daniel o Fernando la revisen.</b>', b, sqlTxt);
      case 'choca':
        if (aut) b.push('<button class="btn mal" type="button" data-a="rechazar">Rechazar</button>');
        return caja('amarillo', '<b>Choca con cambios que se hicieron después en el portal</b> (' + esc((rev.choques || []).join(', ')) + '). Gabo tiene que pedirle a su Claude que traiga lo último y la vuelva a mandar.', b);
      case 'autorizada':
        return caja('amarillo', '<b>Autorizada por ' + esc(nombre(p.autorizada_por)) + '.</b> Se está publicando; tarda alrededor de un minuto.', b);
      case 'publicada':
        if (aut && (p.sql_archivos || []).length && !p.sql_listo_en) b.push('<button class="btn ok" type="button" data-a="sql">Ya corrí el SQL</button>');
        if (aut) b.push('<button class="btn mal" type="button" data-a="deshacer">Deshacer</button>');
        return caja('verde', '<b>Publicada</b> ' + esc(hora(p.publicada_en)) + '. La autorizó ' + esc(nombre(p.autorizada_por)) + '.' + (p.resultado ? ' ' + esc(p.resultado) : ''), b, sqlTxt);
      case 'rechazada':
        return caja('rojo', '<b>Rechazada por ' + esc(nombre(p.rechazada_por)) + '</b> (' + esc(hora(p.rechazada_en)) + '): ' + esc(p.motivo || ''), b);
      case 'error':
        if (aut && p.semaforo !== 'bloqueada' && rev.pruebas_ok !== false && (p.semaforo !== 'rojo' || (p.revisada_ok && p.revisada_sha === p.sha))) b.push('<button class="btn pri" type="button" data-a="autorizar">Volver a intentar</button>');
        if (aut) b.push('<button class="btn mal" type="button" data-a="rechazar">Rechazar</button>');
        return caja('rojo', '<b>No se pudo publicar.</b> ' + esc(p.resultado || ''), b);
      case 'deshaciendo':
        return caja('amarillo', '<b>Se está deshaciendo</b> (lo pidió ' + esc(nombre(p.deshecha_por)) + ').', b);
      case 'deshecha':
        return caja('', '<b>Se deshizo</b> ' + esc(hora(p.deshecha_en)) + ' (lo pidió ' + esc(nombre(p.deshecha_por)) + '): el portal quedó como estaba antes de esta propuesta.', b);
      case 'retirada':
        return caja('', '<b>Retirada.</b> ' + esc(p.resultado || ''), b);
    }
    return '';
  }
  function caja(cls, html, botones, extra) {
    return '<div class="estado ' + cls + '"><div>' + html + '</div>' + (extra || '') + (botones.length ? '<div class="botones">' + botones.join('') + '</div>' : '') + '</div>';
  }

  function revision(p, rev) {
    var av = (rev.avisos || []).map(function (a) { return '<div class="aviso ' + esc(a.nivel) + '">' + esc(a.texto) + '</div>'; }).join('');
    var pr = (rev.pruebas || []).map(function (t) {
      return '<div class="prueba' + (t.ok ? '' : ' no') + '"><span class="i">' + (t.ok ? '✓' : '✕') + '</span><div>' + esc(t.nombre)
        + (t.ok ? '' : '<pre>' + esc(t.detalle || '') + '</pre>') + '</div></div>';
    }).join('');
    return '<section class="card"><header><h3>Revisión automática</h3><span class="chip ' + esc(p.semaforo) + '">' + esc(SEM[p.semaforo] || '') + '</span></header><div class="cuerpo">'
      + '<p style="margin:0 0 10px">' + esc(SEM_TXT[p.semaforo] || '') + '</p>'
      + (av ? '<div class="avisos">' + av + '</div>' : '<div class="aviso verde">Sin avisos.</div>') + pr + '</div></section>';
  }
  function dictamen(p) {
    if (!p.revisada_en) return '';
    var vigente = p.revisada_sha === p.sha;
    return '<section class="card"><header><h3>Revisión técnica de Claude</h3><span class="chip ' + (p.revisada_ok ? 'verde' : 'rojo') + '">' + (p.revisada_ok ? 'Se puede autorizar' : 'No conviene autorizarla') + '</span></header><div class="cuerpo">'
      + '<div class="m" style="color:var(--muted);font-size:12.5px;margin-bottom:6px">' + esc(p.revisada_por || 'Claude') + ' · ' + esc(hora(p.revisada_en)) + (vigente ? '' : ' · <b>era de una versión anterior</b>') + '</div>'
      + '<div class="texto">' + texto(p.dictamen) + '</div></div></section>';
  }
  function archivos(rev) {
    var a = rev.areas || [];
    if (!a.length) return '';
    return '<section class="card"><header><h3>Qué cambia</h3><span class="m" style="color:var(--muted);font-size:12.5px">' + a.length + (a.length === 1 ? ' archivo' : ' archivos') + '</span></header><div class="cuerpo"><ul class="archivos">'
      + a.map(function (x) {
        return '<li><span class="punto ' + esc(x.nivel) + '" title="' + esc(SEM[x.nivel] || '') + '"></span><span class="que">' + esc(x.que) + ' <span style="font-weight:400;color:var(--muted)">(' + esc(x.accion) + ')</span></span>'
          + '<span class="n">+' + (x.mas || 0) + ' −' + (x.menos || 0) + '</span><span class="ruta">' + esc(x.archivo) + '</span></li>';
      }).join('') + '</ul></div></section>';
  }
  function fotos(p) {
    if (!(p.fotos || []).length) return '<section class="card"><header><h3>Cómo se ve</h3></header><div class="cuerpo m" style="color:var(--muted)">No mandó fotos.</div></section>';
    return '<section class="card"><header><h3>Cómo se ve</h3><span style="color:var(--muted);font-size:12.5px">Fotos que mandó con datos de prueba</span></header><div class="cuerpo"><div class="fotos" id="fotos">'
      + p.fotos.map(function (f, i) { return '<a data-i="' + i + '" target="_blank" rel="noopener"><img alt="' + esc(f.nombre) + '"><span>' + esc(f.nombre) + '</span></a>'; }).join('') + '</div></div></section>';
  }
  async function cargaFotos(p) {
    (p.fotos || []).forEach(async function (f, i) {
      try {
        var u = URLS[f.ruta];
        if (!u || u.hasta < Date.now()) {
          var r = await sb.storage.from('propuestas').createSignedUrl(f.ruta, 3600);
          if (r.error) return;
          u = URLS[f.ruta] = { url: r.data.signedUrl, hasta: Date.now() + 50 * 60000 };
        }
        var a = document.querySelector('#fotos a[data-i="' + i + '"]');
        if (a) { a.href = u.url; a.querySelector('img').src = u.url; }
      } catch (e) {}
    });
  }
  async function cambio(p) {
    var pre = $('diff');
    if (CAMBIO[p.id] && CAMBIO[p.id].sha === p.sha) { pre.innerHTML = CAMBIO[p.id].html; return; }
    var r = await sb.from('propuestas').select('cambio').eq('id', p.id).single();
    var t = r.error ? '' : (r.data.cambio || '');
    var html = t ? t.split('\n').map(function (l) {
      var c = /^diff --git/.test(l) ? 'f' : /^@@/.test(l) ? 'h' : /^\+(?!\+\+)/.test(l) ? 'a' : /^-(?!--)/.test(l) ? 'd' : '';
      return '<span' + (c ? ' class="' + c + '"' : '') + '>' + esc(l) + '</span>';
    }).join('') : '<span>Sin cambio técnico guardado.</span>';
    CAMBIO[p.id] = { sha: p.sha, html: html };
    pre.innerHTML = html;
  }
  function conversacion(p) {
    var puede = puedeEscribir() && (ROL === 'autoriza' || (ROL === 'propone' && p.proponente === YO));
    var c = MSJS.map(function (m) {
      if (!m.usuario) return '<div class="msg sis"><div class="x">' + esc(m.texto) + '</div><div class="q">' + esc(hora(m.creado)) + '</div></div>';
      return '<div class="msg' + (m.usuario === YO ? ' mio' : '') + '"><div class="q">' + esc(m.nombre || nombre(m.usuario)) + ' · ' + esc(hora(m.creado)) + '</div><div class="x">' + esc(m.texto) + '</div></div>';
    }).join('');
    return '<section class="card"><header><h3>Conversación</h3></header><div class="cuerpo"><div class="conv" id="conv">' + (c || '<div class="m" style="color:var(--muted)">Sin mensajes todavía.</div>') + '</div>'
      + (puede ? '<div class="escribe"><textarea id="m-txt" rows="2" maxlength="4000" placeholder="' + (ROL === 'autoriza' ? 'Escríbele a Gabo (por ejemplo, qué cambiar)…' : 'Escríbeles a Daniel y a Fernando…') + '"></textarea><button class="btn pri" type="button" id="m-env">Enviar</button></div>' : '')
      + '</div></section>';
  }

  function enlaza(p) {
    document.querySelectorAll('#v-det [data-a]').forEach(function (b) { b.onclick = function () { accion(b.dataset.a, p, b); }; });
    if ($('m-env')) $('m-env').onclick = async function () {
      var t = $('m-txt').value.trim(); if (!t) return;
      this.disabled = true;
      var r = await sb.rpc('cambios_comentar', { p_id: p.id, p_texto: t });
      this.disabled = false;
      if (r.error) { aviso(r.error.message, 'mal'); return; }
      $('m-txt').value = '';
      await carga(true); avisaArriba();
    };
  }

  function pregunta(titulo, html, ok, conTexto) {
    return new Promise(function (res) {
      var d = $('dlg');
      $('dlg-t').textContent = titulo;
      $('dlg-c').innerHTML = html + (conTexto ? '<textarea id="dlg-x" maxlength="4000" placeholder="' + esc(conTexto) + '"></textarea>' : '');
      $('dlg-ok').textContent = ok;
      d.returnValue = '';
      d.onclose = function () { res(d.returnValue === 'si' ? (conTexto ? ($('dlg-x').value || '').trim() : true) : null); };
      $('dlg-f').onsubmit = function (e) { if (e.submitter && e.submitter.value === 'si' && conTexto && !$('dlg-x').value.trim()) { e.preventDefault(); $('dlg-x').focus(); } };
      if (d.showModal) d.showModal(); else res(window.confirm(titulo) ? (conTexto ? (window.prompt(conTexto) || '').trim() || null : true) : null);
    });
  }

  async function accion(a, p, boton) {
    var r;
    if (a === 'autorizar') {
      var rojo = p.semaforo === 'rojo';
      if (!await pregunta('¿Autorizar y publicar?', '<p>«' + esc(p.titulo) + '» de ' + esc(nombre(p.proponente) || 'Gabo') + '. Se publica en el portal en alrededor de un minuto, exactamente como la revisaste.</p>'
        + (rojo ? '<p><b>Tiene avisos delicados.</b> Si tienes duda, pídele antes a tu Claude: «revisa la propuesta #' + p.id + '».</p>' : '')
        + ((p.sql_archivos || []).length ? '<p>Trae cambios para la base: no se corren solos; después tu Claude los corre.</p>' : '') + '<p>Si algo sale mal, la puedes deshacer.</p>', 'Autorizar y publicar')) return;
      boton.disabled = true;
      r = await sb.rpc('cambios_autorizar', { p_id: p.id, p_sha: p.sha });
    } else if (a === 'rechazar') {
      var motivo = await pregunta('¿Rechazar la propuesta?', '<p>Escribe por qué, para que Gabo sepa qué corregir. Lo verá en la conversación.</p>', 'Rechazar', 'Motivo…');
      if (!motivo) return;
      boton.disabled = true;
      r = await sb.rpc('cambios_rechazar', { p_id: p.id, p_motivo: motivo });
    } else if (a === 'deshacer') {
      if (!await pregunta('¿Deshacer esta propuesta?', '<p>El portal regresa a como estaba antes de «' + esc(p.titulo) + '». Tarda alrededor de un minuto.</p>'
        + ((p.sql_archivos || []).length && p.sql_listo_en ? '<p><b>Su SQL ya se corrió en Supabase:</b> eso no se deshace solo; pídeselo a tu Claude.</p>' : ''), 'Deshacer')) return;
      boton.disabled = true;
      r = await sb.rpc('cambios_deshacer', { p_id: p.id });
    } else if (a === 'sql') {
      if (!await pregunta('¿Ya se corrió el SQL?', '<p>Márcalo solo si ya se corrió en Supabase <code>' + (p.sql_archivos || []).map(esc).join('</code>, <code>') + '</code> y salió bien.</p>', 'Sí, ya se corrió')) return;
      boton.disabled = true;
      r = await sb.rpc('cambios_sql_listo', { p_id: p.id });
    }
    if (r && r.error) { boton.disabled = false; aviso(r.error.message, 'mal'); window.scrollTo(0, 0); return; }
    aviso(a === 'autorizar' ? 'Autorizada. Se está publicando; en alrededor de un minuto queda en el portal.' : a === 'rechazar' ? 'Rechazada. Gabo verá el motivo.'
      : a === 'deshacer' ? 'Se está deshaciendo; tarda alrededor de un minuto.' : 'Listo.', 'ok');
    await carga(true); avisaArriba();
  }

  document.querySelectorAll('.tabs button').forEach(function (b) {
    b.onclick = function () {
      FILTRO = b.dataset.f;
      document.querySelectorAll('.tabs button').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
      pintaLista();
    };
  });
  $('lista').addEventListener('click', function (e) { var it = e.target.closest('.item'); if (it) abre(+it.dataset.id); });
  $('recargar').onclick = function () { carga(); };
  $('mandar').onclick = async function () {
    var b = this; b.disabled = true;
    var r = await sb.rpc('cambios_mandar');
    b.disabled = false;
    if (r.error) { aviso(r.error.message, 'mal'); return; }
    aviso(r.data && r.data.yaEnCurso ? 'Ya se están revisando; en uno o dos minutos aparecen aquí.'
      : 'Listo: en uno o dos minutos aparecen aquí las propuestas nuevas, ya revisadas.', 'ok');
    setTimeout(function () { carga(true); }, 60000);
    setTimeout(function () { carga(true); }, 120000);
  };
  arranca();
})();
</script>
</body></html>
