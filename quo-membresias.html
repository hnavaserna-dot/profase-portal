/** Ancho útil del lienzo, descontando el relleno. */
function anchoLienzo(){
  const l=document.getElementById('lienzo-visor');
  return l ? Math.max(260, l.clientWidth-26) : 700;
}
async function abrirMarco(id, nom, tipo){
  let url='/_blob/'+id;
  try{ url=await window.QUO_URL(id); }catch(e){}
  const lienzo=document.getElementById('lienzo-visor'); if(!lienzo) return;
  zEstado={ url:url, nom:nom, esPdf:esPdf(nom,tipo), zoom:1, natural:0, doc:null, lib:null };
  try{
    if(zEstado.esPdf){
      const lib=await cargarPdfJs();
      const r=await fetch(url);
      if(!r.ok) throw new Error('El archivo no respondió ('+r.status+')');
      const doc=await lib.getDocument({data:await r.arrayBuffer(), isEvalSupported:false}).promise;
      zEstado.lib=lib; zEstado.doc=doc;
      const v1=(await doc.getPage(1)).getViewport({scale:1});
      zEstado.natural=v1.width;                    // puntos del PDF = 100 %
      zEstado.zoom=Math.min(anchoLienzo()/v1.width, 2);
      document.getElementById('z-meta').textContent=doc.numPages+(doc.numPages===1?' página':' páginas');
      await pintarMarco();
    } else {
      const img=new Image();
      await new Promise(function(ok,err){ img.onload=ok; img.onerror=err; img.src=url; });
      zEstado.img=img; zEstado.natural=img.naturalWidth;
      zEstado.zoom=Math.min(anchoLienzo()/img.naturalWidth, 1);   // nunca estirar de entrada
      document.getElementById('z-meta').textContent=img.naturalWidth+' × '+img.naturalHeight+' px';
      await pintarMarco();
    }
  }catch(e){
    const m=document.getElementById('marco-visor');
    if(m) m.outerHTML='<div class="sin-vista"><div class="ext">'+extDe(nom)+'</div>'+
      '<div style="color:var(--muted);font-size:.72rem">No se pudo abrir el archivo aquí'+
      (e&&e.message?' ('+esc(e.message)+')':'')+'. Ábrelo en una pestaña aparte.</div>'+
      '<a class="btn primary" href="'+esc(url)+'" target="_blank" rel="noopener">Abrir el archivo</a></div>';
  }
}
/** Dibuja al zoom actual. El PDF se vuelve a trazar, así que nunca se pixela. */
async function pintarMarco(){
  if(!zEstado) return;
  const lienzo=document.getElementById('lienzo-visor'); if(!lienzo) return;
  const pct=document.getElementById('z-pct');
  if(pct) pct.textContent=Math.round(zEstado.zoom*100)+' %';
  const dpr=Math.min(window.devicePixelRatio||1, 3);

  if(zEstado.esPdf){
    lienzo.innerHTML='';
    for(let i=1;i<=zEstado.doc.numPages;i++){
      const pg=await zEstado.doc.getPage(i);
      const vista=pg.getViewport({scale:zEstado.zoom*dpr});
      const cv=document.createElement('canvas');
      cv.width=Math.floor(vista.width); cv.height=Math.floor(vista.height);
      cv.style.width=Math.floor(vista.width/dpr)+'px';
      cv.setAttribute('aria-label','Página '+i+' de '+zEstado.nom);
      lienzo.appendChild(cv);
      await pg.render({canvasContext:cv.getContext('2d'), viewport:vista}).promise;
    }
  } else {
    const ancho=Math.round(zEstado.natural*zEstado.zoom);
    let img=lienzo.querySelector('img');
    if(!img){ lienzo.innerHTML=''; img=zEstado.img; lienzo.appendChild(img); }
    img.style.width=ancho+'px';
    const av=document.getElementById('z-aviso');
    if(zEstado.zoom>1.02){
      if(!av){
        const sp=document.createElement('span');
        sp.className='aviso-z'; sp.id='z-aviso';
        sp.textContent='Más allá del 100 % la foto se agranda, no gana detalle';
        document.querySelector('.zbarra .meta').after(sp);
      }
    } else if(av) av.remove();
  }
}
function moverZoom(accion){
  if(!zEstado) return;
  const pasos=[.25,.4,.55,.7,.85,1,1.25,1.5,2,2.5,3,4];
  if(accion==='ajustar'){
    zEstado.zoom = zEstado.esPdf
      ? Math.min(anchoLienzo()/zEstado.natural, 2)
      : Math.min(anchoLienzo()/zEstado.natural, 1);
  } else if(accion==='natural'){
    zEstado.zoom = 1;
  } else if(accion==='mas'){
    zEstado.zoom = pasos.find(function(p){ return p > zEstado.zoom+.01; }) || pasos[pasos.length-1];
  } else {
    const menores=pasos.filter(function(p){ return p < zEstado.zoom-.01; });
    zEstado.zoom = menores.length ? menores[menores.length-1] : pasos[0];
  }
  pintarMarco();
}

  b+='<div class="row total"><span>Importe</span><span>'+money(p.monto)+'</span></div>';
  b+='</div>';

  const pie='<button class="btn" data-cerrar>Cerrar</button>'+
     (id?'<a class="btn" href="/_blob/'+esc(id)+'" target="_blank" rel="noopener">Abrir en pestaña nueva</a>':'')+
     (soloLectura()?'':'<button class="btn accent" data-editpago="'+esc(p.id)+'">Editar el pago</button>');
  abrirModal(esFac?'Factura del periodo':'Comprobante del pago',
    (c?esc(c.nombre):'')+' · '+fechaLarga(p.fecha), b, pie, esFac?'Factura':'Comprobante');
  const m=document.querySelector('.modal');
  if(m) m.classList.add(document.getElementById('marco-visor')?'visor-ancho':'ancho');

    const v=img.closest('.visor');
    if(v) v.outerHTML='<div class="sin-vista"><div class="ext">'+extDe(nom)+'</div>'+
      '<div style="color:var(--bad);font-size:.72rem">El archivo ya no está en el almacén de la página. '+
      'Vuélvelo a subir desde «Editar el pago».</div></div>';

}


/* =========================================================
   INGRESOS — qué se vendió y cómo se reparte
   La tabla mensual sale de los pagos (que son los depósitos del estado de
   cuenta). La dona reparte ese mismo dinero por producto, bajando nivel a
   nivel. Los gastos salen de la colección de movimientos del banco.
   ========================================================= */
let ing={ nivel:'raiz', linea:'', anio:'' };   // dónde va parado el desglose

/** Los pagos del año que se está viendo. */
function pagosDelAnio(){
  const a=ing.anio;
  return pagos.filter(function(p){ return !a || String(p.fecha||'').slice(0,4)===a; });
}
function aniosConPago(){
  const m={};
  pagos.forEach(function(p){ const a=String(p.fecha||'').slice(0,4); if(a) m[a]=1; });
  return Object.keys(m).sort().reverse();
}

/** Un nivel del desglose: lista de rebanadas {clave, nombre, monto, n, hijo}. */
function rebanadas(){
  const ps=pagosDelAnio();
  const acum={};
  function suma(clave, nombre, p, hijo){
    if(!acum[clave]) acum[clave]={clave:clave, nombre:nombre, monto:0, n:0, hijo:hijo||''};
    acum[clave].monto+=Number(p.monto||0); acum[clave].n++;
  }

  if(ing.nivel==='raiz'){
    ps.forEach(function(p){
      const f=familiaDePago(p);
      if(f==='contabilita')     suma('contabilita','CONTABILITA',p,'contabilita');
      else if(f==='facturita')  suma('facturita','FACTURITA',p,'facturita');
      else if(f==='extra')      suma('extra','Complementos',p,'');
      else                      suma('','Por clasificar',p,'');
    });
  } else if(ing.nivel==='contabilita'){
    ps.forEach(function(p){
      if(familiaDePago(p)!=='contabilita') return;
      const q=planDePago(p);
      if(q.linea) suma(q.linea, (TARIFAS[q.linea]||{etiqueta:q.linea}).etiqueta, p, 'linea');
      else        suma('', 'Sin línea identificada', p, '');
    });
  } else if(ing.nivel==='linea'){
    ps.forEach(function(p){
      if(familiaDePago(p)!=='contabilita') return;
      const q=planDePago(p);
      if(q.linea!==ing.linea) return;
      suma(q.plan||'', q.plan ? ('Plan '+q.plan) : 'Sin plan identificado', p, '');
    });
  } else if(ing.nivel==='facturita'){
    ps.forEach(function(p){
      if(familiaDePago(p)!=='facturita') return;
      const k=paqueteDePago(p);
      suma(k||'', k ? (FACTURITA[k].timbres+' timbres') : 'Paquete no identificado', p, '');
    });
  }
  const l=Object.keys(acum).map(function(k){ return acum[k]; });
  l.sort(function(a,b){ return b.monto-a.monto; });
  return l;
}

/** Las cuentas que más han pagado dentro del corte que se está viendo. */
function clientesDelCorte(){
  const ps=pagosDelAnio().filter(function(p){
    if(ing.nivel==='raiz') return true;
    const f=familiaDePago(p);
    if(ing.nivel==='facturita') return f==='facturita';
    if(f!=='contabilita') return false;
    if(ing.nivel==='contabilita') return true;
    return planDePago(p).linea===ing.linea;
  });
  const m={};
  ps.forEach(function(p){
    const c=cliente(p.clienteId);
    if(!c) return;
    if(!m[c.id]) m[c.id]={c:c, monto:0, n:0};
    m[c.id].monto+=Number(p.monto||0); m[c.id].n++;
  });
  const l=Object.keys(m).map(function(k){ return m[k]; });
  l.sort(function(a,b){ return b.monto-a.monto; });
  return l;
}

/** Dona en SVG. Sin librerías: el artifact no sale a dominios externos. */
function dona(rb, total){
  const R=92, r=58, cx=110, cy=110, hueco=0.012;   // hueco = separación entre rebanadas
  if(!total) return '<div class="sin-datos">Todavía no hay importes que repartir.</div>';
  let ang=-Math.PI/2, h='';
  h+='<svg class="dona" viewBox="0 0 220 220" role="img" aria-label="Reparto del ingreso">';
  rb.forEach(function(x,i){
    const frac=x.monto/total;
    let a0=ang+ (rb.length>1?hueco:0), a1=ang+frac*Math.PI*2 - (rb.length>1?hueco:0);
    if(a1<a0) a1=a0;
    ang+=frac*Math.PI*2;
    const col='var(--s'+((i%4)+1)+')';
    const grande = (a1-a0) > Math.PI ? 1 : 0;
    const p=[ cx+R*Math.cos(a0), cy+R*Math.sin(a0),
              cx+R*Math.cos(a1), cy+R*Math.sin(a1),
              cx+r*Math.cos(a1), cy+r*Math.sin(a1),
              cx+r*Math.cos(a0), cy+r*Math.sin(a0) ].map(function(v){ return v.toFixed(2); });
    const d='M'+p[0]+' '+p[1]+' A'+R+' '+R+' 0 '+grande+' 1 '+p[2]+' '+p[3]+
            ' L'+p[4]+' '+p[5]+' A'+r+' '+r+' 0 '+grande+' 0 '+p[6]+' '+p[7]+' Z';
    const pct=Math.round(frac*1000)/10;
    h+='<path class="reb'+(x.hijo?'':' inerte')+'" d="'+d+'" fill="'+col+'"'+
       (x.hijo?' data-rebanada="'+esc(x.clave)+'|'+x.hijo+'"':'')+
       ' tabindex="0"><title>'+esc(x.nombre)+' — '+money(x.monto)+' · '+pct+'%</title></path>';
    if(frac>=0.08){
      const am=(a0+a1)/2, rm=(R+r)/2;
      h+='<text class="etq" x="'+(cx+rm*Math.cos(am)).toFixed(1)+'" y="'+(cy+rm*Math.sin(am)+4).toFixed(1)+
         '" text-anchor="middle">'+pct+'%</text>';
    }
  });
  h+='<text class="centro-t" x="110" y="102" text-anchor="middle">TOTAL</text>';
  h+='<text class="centro-n" x="110" y="124" text-anchor="middle">'+esc(moneyCorto(total))+'</text>';
  h+='</svg>';
  return h;
}

async function guardarGasto(){
  if(guardando) return;
  const fecha=document.getElementById('gs-fecha').value;
  const monto=parseFloat(document.getElementById('gs-monto').value||'0');
  const concepto=(document.getElementById('gs-concepto').value||'').trim();
  if(!fecha){ avisar('Captura la fecha'); return; }
  if(!(monto>0)){ avisar('Captura un importe mayor a cero'); return; }
  guardando=true;
  const ok=await guardarDoc('movimientos/'+nuevoId('mv'),
    {tipo:'gasto', fecha:fecha, monto:Math.round(monto*100)/100,
     concepto:concepto||'Gasto capturado a mano', desc:'', origen:'captura manual'}, false);
  guardando=false;
  if(ok){ cerrarOverlay(); avisar('Gasto guardado'); }
}
async function borrarGasto(id){
  const x=(movimientos||[]).find(function(y){ return y.id===id; });
  if(!x) return;
  if(!confirmarBorrado('Quitar el gasto de '+money(x.monto)+' del '+fechaLarga(x.fecha)+
      (x.concepto?' («'+x.concepto+'»)':'')+'?')) return;
  try{ await db.doc('movimientos/'+id).delete(); }
  catch(e){ avisar(errorBonito(e)); return; }
  avisar('Gasto quitado');
}
/** Una confirmación sencilla; si el navegador la bloquea, no se borra nada. */
function confirmarBorrado(txt){
  try{ return window.confirm(txt); }catch(e){ return false; }
}

/** La tabla de ingreso mes a mes, con el gasto del banco al lado. */
function tablaMensual(ps){
  const m={};
  ps.forEach(function(p){
    const k=mesClave(p.fecha); if(!k) return;
    if(!m[k]) m[k]={ing:0, n:0, fact:0, cont:0};
    m[k].ing+=Number(p.monto||0); m[k].n++;
    const f=familiaDePago(p);
    if(f==='facturita') m[k].fact+=Number(p.monto||0);
    if(f==='contabilita') m[k].cont+=Number(p.monto||0);
  });
  const g=gastosPorMes();
  Object.keys(g).forEach(function(k){
    if(!ing.anio || k.slice(0,4)===ing.anio){ if(!m[k]) m[k]={ing:0,n:0,fact:0,cont:0}; }
  });
  const meses=Object.keys(m).sort();
  if(!meses.length) return '';
  const tope=Math.max.apply(null, meses.map(function(k){ return m[k].ing; }).concat([1]));
  let h='<div class="card"><div class="card-head"><h2>Mes a mes</h2>'+
        '<span class="hint">Ingreso de los pagos · gasto del estado de cuenta</span></div>';
  h+='<div class="tablescroll"><table style="min-width:780px"><thead><tr>'+
     '<th>Mes</th><th class="c">Pagos</th><th class="r">CONTABILITA</th><th class="r">FACTURITA</th>'+
     '<th class="r">Ingreso</th><th class="r">Gasto</th><th class="r">Neto</th><th>Peso</th>'+
     '</tr></thead><tbody>';
  let ti=0, tg=0, tn=0, tc=0, tf=0;
  meses.forEach(function(k){
    const x=m[k], ga=g[k]||0, neto=x.ing-ga;
    ti+=x.ing; tg+=ga; tn+=x.n; tc+=x.cont; tf+=x.fact;
    h+='<tr><td class="mes-cell">'+esc(etiquetaMes(k).replace(/^\w/,function(c){return c.toUpperCase();}))+'</td>'+
       '<td class="c num">'+x.n+'</td>'+
       '<td class="r num">'+(x.cont?money(x.cont):'—')+'</td>'+
       '<td class="r num">'+(x.fact?money(x.fact):'—')+'</td>'+
       '<td class="r num" style="font-weight:650;color:var(--ok)">'+money(x.ing)+'</td>'+
       '<td class="r num"'+(ga?' style="color:var(--bad)"':'')+'>'+(ga?money(ga):'—')+'</td>'+
       '<td class="r num" style="font-weight:650;color:var(--'+(neto<0?'bad':'ink')+')">'+money(neto)+'</td>'+
       '<td><div class="barra-mini"><i style="width:'+Math.round(x.ing/tope*100)+'%"></i></div></td>'+
       '</tr>';
  });
  h+='<tr class="total-row"><td>Total</td><td class="c num">'+tn+'</td>'+
     '<td class="r num">'+money(tc)+'</td><td class="r num">'+money(tf)+'</td>'+
     '<td class="r num">'+money(ti)+'</td><td class="r num">'+(tg?money(tg):'—')+'</td>'+
     '<td class="r num">'+money(ti-tg)+'</td><td></td></tr>';
  h+='</tbody></table></div></div>';
  return h;
}

/* ---------- Gastos: vienen de los movimientos del banco ---------- */
function gastosPorMes(){
  const m={};
  (movimientos||[]).forEach(function(x){
    if(x.tipo!=='gasto') return;
    const k=mesClave(x.fecha); if(!k) return;
    m[k]=(m[k]||0)+Number(x.monto||0);
  });
  return m;
}
function gastoDelAnio(){
  if(!movimientos || !movimientos.length) return null;
  const g=gastosPorMes();
  return Object.keys(g).reduce(function(a,k){
    return (!ing.anio || k.slice(0,4)===ing.anio) ? a+g[k] : a; },0);
}

/* ---------- PRECIOS ---------- */
function ventasFacturita(k,soloFacturadas){
  return facturitas.filter(function(v){
    if(v.plan!==k) return false;
    return soloFacturadas ? v.facturado===true : true;
  }).length;
}
function pendDe(k){
  if(!ajustesPend) return pctAj(k);
  const v=Number(ajustesPend[k]); return isNaN(v)?0:v;
}
function hayPendientes(){
  if(!ajustesPend) return false;
  const m=mapaAjustes();
  return Object.keys(ajustesPend).some(function(k){
    return Number(ajustesPend[k]||0) !== (Number(m[k])||0); });
}
function clavesAjustables(){
  const out=[];
  ['PRO','LITE'].forEach(function(l){ ['1.0','2.0','3.0','4.0'].forEach(function(p){ out.push(clavePlan(l,p)); }); });
  return out;
}
function iniciarPendientes(){
  if(ajustesPend) return;
  ajustesPend={};
  clavesAjustables().forEach(function(k){ ajustesPend[k]=pctAj(k); });
}
function pintaPct(k, etiqueta){

         '<span class="sig">%</span></div>';

function diffAjustes(antes,despues){
  const a=antes||{}, b=despues||{};
  const ks={}; Object.keys(a).forEach(function(k){ks[k]=1;}); Object.keys(b).forEach(function(k){ks[k]=1;});
  const out=[];
  Object.keys(ks).forEach(function(k){
    const v1=Number(a[k])||0, v2=Number(b[k])||0;
    if(v1!==v2) out.push({k:k, a:v1, b:v2});
  });
  return out;
}

/* ---------- Repintado en vivo de una tarjeta ---------- */
function repintarPlan(k){
  const pct=pendDe(k);
  const p=k.split('|');
  const esFact = p[0]==='FACT';
  const base1 = esFact ? precioTimbresBase(p[1]) : precioPlanBase(p[0],p[1],'mensual');
  const base2 = esFact ? null : precioPlanBase(p[0],p[1],'anual');
  const nuevo1 = conPct(base1,pct);
  const el=function(id){ return document.getElementById(id); };
  if(el('px|'+k+'|m')) el('px|'+k+'|m').textContent=money(nuevo1);
  if(esFact){
    if(el('px|'+k+'|a')) el('px|'+k+'|a').textContent=money(conIva(nuevo1));
  } else {
    const nuevo2=conPct(base2,pct);
    if(el('px|'+k+'|a')) el('px|'+k+'|a').textContent=money(nuevo2);
    if(el('ah|'+k)) el('ah|'+k).textContent=moneyCorto(dosDec(nuevo1*12-nuevo2));
    if(el('ant|'+k+'|a')) el('ant|'+k+'|a').hidden = !pct;
  }
  if(el('ant|'+k+'|m')) el('ant|'+k+'|m').hidden = !pct;
}

  render();   // repinta también las pastillas de las filas cerradas
  const caja=document.getElementById('aj-todos'); if(caja) caja.value=n;
  avisar(n===0?'Todos los planes quedaron en 0%':'Aplicado '+signoPct(n)+' a todos los planes');

async function guardarAjustes(tipo){
  const antes=Object.assign({},mapaAjustes());
  const ivaAntes=ivaPct();
  let despues, ivaDespues;
  if(tipo==='restablecer'){
    despues={}; clavesAjustables().forEach(function(k){ despues[k]=0; });
    ivaDespues=IVA_BASE;
  } else {
    iniciarPendientes();
    despues=Object.assign({},ajustesPend);
    const iv=parseFloat((document.getElementById('aj-iva')||{}).value);
    ivaDespues=isNaN(iv)?ivaPct():dosDec(iv);
  }
  const nuevo=Object.assign({},config,{precios:{ajustes:despues, iva:ivaDespues, actualizado:HOY}});
  if(!await guardarDoc('config/general', nuevo, false)) return;
  const cambios=diffAjustes(antes,despues);
  if(cambios.length || ivaAntes!==ivaDespues){
    await guardarDoc('historialPrecios/'+nuevoId('hp'), {
      fecha:HOY, momento:new Date().toISOString(), tipo:tipo||'ajuste',
      antes:antes, despues:despues, ivaAntes:ivaAntes, ivaDespues:ivaDespues
    }, false);
  }
  ajustesPend=null;
  avisar(tipo==='restablecer'?'Todos los planes quedaron en su precio de lista':'Ajustes guardados');
  render();
}
function revertirA(id){
  const x=historial.find(function(h2){ return h2.id===id; });
  if(!x||!x.despues) return;
  iniciarPendientes();
  clavesAjustables().forEach(function(k){ ajustesPend[k]=Number(x.despues[k])||0; });
  render();
  avisar('Valores cargados. Revísalos y dale «Guardar ajustes».');
}

function listaCategoria(cat){
  const t=catBusca.trim().toLowerCase();

  if(!t) return todas;
  return todas.filter(function(o){
    return String(o.buscable||(o.titulo+' '+(o.sub||''))).toLowerCase().includes(t);
  });

function aplicarCategoria(){
  const cat=catActual(catAbierta); if(!cat) return;
  if(catEsPago){
    if(cat.id==='mes')           filtroPagos.meses    = catSel.slice();
    else if(cat.id==='anio')     filtroPagos.anios    = catSel.slice();
    else if(cat.id==='folio')    filtroPagos.folios   = catSel.slice();
    else if(cat.id==='asignacion') filtroPagos.asignacion = catSel[0]||'todos';
    else if(cat.id==='cartera')  filtroPagos.tipo     = catSel[0]||'todos';
    else if(cat.id==='factura')  filtroPagos.factura  = catSel[0]||'todos';
    else if(cat.id==='servicio') filtroPagos.servicio = catSel[0]||'todos';
    catAbierta=''; catSel=[]; catBusca=''; catEsPago=false;
    cerrarOverlay(); render(); return;
  }
  if(cat.id==='clientes')      filtro.sel=catSel.slice();
  else if(cat.id==='grupos')   filtro.grupos=catSel.slice();
  else if(cat.id==='acceso')   filtro.acceso=catSel.slice();
  else if(cat.id==='contacto') filtro.contacto=catSel.slice();
  else if(cat.id==='servicio') filtro.servicio = catSel[0]||'todos';
  else if(cat.id==='cartera')  filtro.tipo    = catSel[0]||'todos';
  else if(cat.id==='vigencia') filtro.estado  = catSel[0]||'todos';
  else if(cat.id==='factura')  filtro.factura = catSel[0]||'todos';
  catAbierta=''; catSel=[]; catBusca='';
  podarSeleccion(); cerrarOverlay(); render();
}

/* ---------- Combinar pagos ----------
   Un cliente abona una parte y después el complemento. Son dos depósitos en el
   banco, pero una sola mensualidad. Al combinarlos, el importe suma y recién
   entonces empata con una tarifa.
   ========================================================= */
function modalCombinar(){
  const ps=pagosMarcados();
  if(ps.length<2){ avisar('Marca al menos dos movimientos para combinarlos.'); return; }

  const cuentas={};
  ps.forEach(function(p){ if(p.clienteId) cuentas[p.clienteId]=1; });
  const ids=Object.keys(cuentas);
  if(ids.length>1){
    avisar('Esos movimientos son de cuentas distintas. Combina sólo los que sean del mismo pago.');
    return;
  }
  const c = ids.length ? cliente(ids[0]) : null;

  const orden=ps.slice().sort(function(a,b){ return a.fecha<b.fecha?-1:1; });
  const suma=Math.round(orden.reduce(function(a,p){ return a+Number(p.monto||0); },0)*100)/100;
  const fechaFinal=orden[orden.length-1].fecha;
  const meses={}; orden.forEach(function(p){ meses[mesClave(p.fecha)]=1; });
  const r=clasificarMonto(suma);
  const f=FAMILIAS[r.familia]||FAMILIAS[''];

  let b='<div class="desglose">';
  orden.forEach(function(p){
    b+='<div class="row"><span>'+fechaLarga(p.fecha)+(p.comentario?' · '+esc(p.comentario.slice(0,46)):'')+
       '</span><span>'+money(p.monto)+'</span></div>';
  });
  b+='<div class="row total"><span>Queda un solo pago de</span><span>'+money(suma)+'</span></div>';
  b+='</div>';

  b+='<div class="desglose" style="margin-top:10px">';
  b+='<div class="row"><span>Cuenta</span><span>'+(c?esc(c.nombre):'Sin asignar')+'</span></div>';
  b+='<div class="row"><span>Fecha que queda</span><span>'+fechaLarga(fechaFinal)+'</span></div>';
  b+='<div class="row total"><span>Con ese importe parece</span><span style="color:var(--'+
     (f.chip==='morado'?'t-morado':f.chip==='azul'?'t-azul':f.chip==='warn'?'warn':'bad')+')">'+
     esc(f.texto)+'</span></div>';
  if(r.candidatos.length)
    b+='<div class="row"><span>Tarifa que empata</span><span>'+esc(r.candidatos[0].etiqueta)+
       (r.candidatos.length>1?' (+'+(r.candidatos.length-1)+')':'')+'</span></div>';
  b+='</div>';

  if(Object.keys(meses).length>1)
    b+='<div class="note" style="margin-top:10px"><b>Ojo:</b> los abonos caen en meses distintos. '+
       'Al combinarlos, todo el importe se va al mes de '+esc(etiquetaMes(mesClave(fechaFinal)))+
       ', así que la tabla mes a mes dejará de cuadrar contra el banco en esos dos meses.</div>';

  b+='<div class="field wide" style="margin-top:12px"><label>Comentario</label>'+
     '<textarea id="cb-coment" rows="2" placeholder="Por qué se combinan">'+
     esc('Pago en '+orden.length+' abonos: '+orden.map(function(p){ return money(p.monto); }).join(' + '))+
     '</textarea></div>';
  b+='<div class="note" style="margin-top:10px">Los '+orden.length+' movimientos se vuelven uno solo. '+
     'Los importes y las fechas de cada abono quedan guardados dentro del pago, así que no se pierde '+
     'el rastro contra el estado de cuenta.</div>';

  const pie='<button class="btn" data-cerrar>Cancelar</button>'+
            '<button class="btn primary" id="cb-guardar">Combinar los '+orden.length+'</button>';
  abrirModal('Combinar pagos','Para cuando un cliente abona una parte y después el complemento.',
             b, pie, 'Pagos');
}

async function guardarCombinacion(){
  if(guardando) return;
  const ps=pagosMarcados();
  if(ps.length<2) return;
  const orden=ps.slice().sort(function(a,b){ return a.fecha<b.fecha?-1:1; });
  const base=orden[orden.length-1];          // el último abono es el que se queda
  const resto=orden.slice(0,-1);
  const suma=Math.round(orden.reduce(function(a,p){ return a+Number(p.monto||0); },0)*100)/100;

  guardando=true;
  const btn=document.getElementById('cb-guardar');
  if(btn){ btn.disabled=true; btn.textContent='Combinando…'; }

  // Cada abono queda registrado dentro del pago que los absorbe
  const partes=[];
  orden.forEach(function(p){
    if(Array.isArray(p.partes) && p.partes.length) partes.push.apply(partes, p.partes);
    else partes.push({fecha:p.fecha, monto:Number(p.monto||0), nota:(p.comentario||'').slice(0,120)});
  });
  const cId = orden.map(function(p){ return p.clienteId; }).filter(Boolean)[0] || '';
  const datos={
    clienteId:cId, fecha:base.fecha, monto:suma, partes:partes,
    comentario:(document.getElementById('cb-coment').value||'').trim(),
    metodo:base.metodo||'Transferencia', periodo:base.periodo||'', dias:base.dias||30,
    servicio:base.servicio||'',
    facturaFolio:base.facturaFolio||'', facturaFecha:base.facturaFecha||'',
    comprobanteId:base.comprobanteId||'', comprobanteNombre:base.comprobanteNombre||'',
    comprobanteBytes:base.comprobanteBytes||0, comprobanteTipo:base.comprobanteTipo||'',
    cubreGrupo:base.cubreGrupo===true, ampara:Array.isArray(base.ampara)?base.ampara:[]
  };

  if(!(await guardarDoc('pagos/'+base.id, datos, false))){
    guardando=false; if(btn){ btn.disabled=false; btn.textContent='Combinar los '+orden.length; }
    return;
  }
  let fallos=0;
  for(let i=0;i<resto.length;i++){
    try{ await db.doc('pagos/'+resto[i].id).delete(); }
    catch(e){ fallos++; }
  }
  guardando=false; cerrarOverlay();
  const c=cliente(cId);
  if(c) await recalcularVigencias(c, pagos.filter(function(x){
    return resto.every(function(y){ return y.id!==x.id; }); }));
  selPagos=[]; modoSel=false;
  avisar(fallos
    ? ('Se combinaron, pero '+fallos+' movimiento(s) no se pudieron borrar. Revísalos.')
    : ('Quedó un solo pago de '+money(suma)+'.'));
  render();
}

async function guardarFacturaGeneral(){
  if(guardando) return;
  const ps=pagosMarcados();
  if(!ps.length) return;
  const folio=(document.getElementById('fg-folio').value||'').trim();
  if(!folio){ avisar('Captura el folio de la factura'); return; }
  const fecha=document.getElementById('fg-fecha').value||'';

  guardando=true;
  const btn=document.getElementById('fg-guardar');
  if(btn){ btn.disabled=true; btn.textContent='Guardando…'; }

  let adj=null;
  if(facturaPendiente){
    if(!assets){
      avisar('No se pudo conectar el almacén de archivos. Vuelve a cargar la página.');
      guardando=false; if(btn){ btn.disabled=false; btn.textContent='Relacionar los '+ps.length; }
      return;
    }
    const tipo=tipoDeArchivo(facturaPendiente);
    if(btn) btn.textContent='Subiendo el PDF…';
    try{
      const r=await assets.upload(facturaPendiente,{type:tipo});
      adj={id:r.id, nombre:facturaPendiente.name, bytes:r.sizeBytes, tipo:tipo};
    }catch(e){
      avisar(errorBonito(e));
      guardando=false; if(btn){ btn.disabled=false; btn.textContent='Relacionar los '+ps.length; }
      return;
    }
  }

  let ok=0;
  for(let i=0;i<ps.length;i++){
    if(btn) btn.textContent='Guardando '+(i+1)+' de '+ps.length+'…';
    const datos={facturaFolio:folio, facturaFecha:fecha};
    if(adj){
      datos.facturaArchivoId=adj.id; datos.facturaArchivoNombre=adj.nombre;
      datos.facturaArchivoBytes=adj.bytes; datos.facturaArchivoTipo=adj.tipo;
    }
    if(await guardarDoc('pagos/'+ps[i].id, datos, true)) ok++;
  }
  guardando=false; facturaPendiente=null;
  cerrarOverlay();
  if(ok===ps.length){
    avisar(ok+' movimiento'+(ok===1?'':'s')+' quedaron en la factura '+folio+'.');
    selPagos=[]; modoSel=false;
  } else {
    avisar('Se guardaron '+ok+' de '+ps.length+'. Revisa los que faltaron.');
  }
  render();
}

async function guardarPago(){
  if(guardando) return;
  const c=cliente(document.getElementById('f-cliente').value)||null;
  const fecha=document.getElementById('f-fecha').value;
  const monto=parseFloat(document.getElementById('f-monto').value||'0');
  if(!fecha){ avisar('Captura la fecha del comprobante'); return; }
  if(!(monto>0)){ avisar('Captura un monto mayor a cero'); return; }

  guardando=true;
  const btn=document.getElementById('f-guardar');
  if(btn){ btn.disabled=true; btn.textContent='Guardando…'; }

  const datos={
    clienteId:c?c.id:'', fecha, monto:Math.round(monto*100)/100,
    metodo:document.getElementById('f-metodo').value,

    comentario:document.getElementById('f-coment').value.trim(),

    facturaFolio:document.getElementById('f-fac').value.trim(),


    cubreGrupo: c ? cubreGrupoMarcado(c) : false,
    servicio: servicioSeleccionado(),
    ampara: c ? amparaSeleccionado() : [],
    dias: plazoSeleccionado(c),
    periodo: servicioSeleccionado()==='facturita' ? periodoMes(fecha)
           : (plazoSeleccionado(c)>=180 ? 'Anual '+partes(fecha).a : periodoMes(fecha))
  };

  // Subir los archivos nuevos
  async function subir(file){
    const tipo=tipoDeArchivo(file);
    if(!tipo){ avisar('Sólo se aceptan PDF, PNG, JPG, GIF y WEBP.'); return null; }
    if(file.size>LIMITE_ARCHIVO){ avisar('«'+file.name+'» pasa de 20 MB. Comprímelo antes de subirlo.'); return null; }
    if(btn) btn.textContent='Subiendo '+file.name.slice(0,18)+'…';
    try{ const r=await assets.upload(file,{type:tipo}); return {r:r, tipo:tipo}; }
    catch(e){ avisar(errorBonito(e)); return null; }
  }
  if((archivoPendiente||facturaPendiente) && !assets){
    avisar('No se pudo conectar el almacén de archivos: el pago se guardaría sin el adjunto. Vuelve a cargar la página.');
    terminarGuardado(); return;
  }
  let subido=null, subidoFac=null;
  if(archivoPendiente && assets){
    subido=await subir(archivoPendiente);
    if(!subido){ terminarGuardado(); return; }
  }
  if(facturaPendiente && assets){
    subidoFac=await subir(facturaPendiente);
    if(!subidoFac){ terminarGuardado(); return; }
  }

  const existente = pagoEditando ? pagos.find(function(x){ return x.id===pagoEditando; }) : null;

  // Campos que ya no se capturan: si el movimiento los traía de la carga inicial, se conservan.
  if(existente){
    ['referencia','pagadoPor','facturaRazon','facturaFecha'].forEach(function(k){
      if(existente[k]) datos[k]=existente[k];
    });
    if(existente.etiquetas && existente.etiquetas.length) datos.etiquetas=existente.etiquetas;
  }

  if(subido){
    datos.comprobanteId=subido.r.id;
    datos.comprobanteNombre=archivoPendiente.name;
    datos.comprobanteBytes=subido.r.sizeBytes;
    datos.comprobanteTipo=subido.tipo;
  } else if(existente && !existente.__quitarComp){
    datos.comprobanteId=existente.comprobanteId||'';
    datos.comprobanteNombre=existente.comprobanteNombre||'';
    datos.comprobanteBytes=existente.comprobanteBytes||0;
    datos.comprobanteTipo=existente.comprobanteTipo||'';
  } else {
    datos.comprobanteId=''; datos.comprobanteNombre=''; datos.comprobanteBytes=0; datos.comprobanteTipo='';
  }

  if(subidoFac){
    datos.facturaArchivoId=subidoFac.r.id;
    datos.facturaArchivoNombre=facturaPendiente.name;
    datos.facturaArchivoBytes=subidoFac.r.sizeBytes;
    datos.facturaArchivoTipo=subidoFac.tipo;
  } else if(existente && !existente.__quitarFac){
    datos.facturaArchivoId=existente.facturaArchivoId||'';
    datos.facturaArchivoNombre=existente.facturaArchivoNombre||'';
    datos.facturaArchivoBytes=existente.facturaArchivoBytes||0;
    datos.facturaArchivoTipo=existente.facturaArchivoTipo||'';
  } else {
    datos.facturaArchivoId=''; datos.facturaArchivoNombre=''; datos.facturaArchivoBytes=0; datos.facturaArchivoTipo='';
  }

  const id = pagoEditando || nuevoId('pg');
  const ok = await guardarDoc('pagos/'+id, datos, false);
  if(!ok){ terminarGuardado(); return; }

  // La vigencia se recalcula desde cero con la lista completa de pagos: nunca se acumula.
  // Un pago sin cuenta no mueve ninguna vigencia: todavía no se sabe a quién cubre.
  let nueva='';
  if(c) nueva=await recalcularVigencias(c, pagosCon(id, Object.assign({clienteId:c.id}, datos)));
  terminarGuardado(); cerrarOverlay();
  if(!c){
    const r2=clasificarMonto(datos.monto);
    avisar('Pago guardado sin cuenta' +
      (r2.candidatos.length ? ' · por el importe parece '+(FAMILIAS[r2.familia]||FAMILIAS['']).texto : '') +
      '. Lo encuentras con el filtro «Sin asignar».');
  } else {
    avisar(nueva ? (c.nombre+' · vigencia hasta '+fechaLarga(nueva))
                 : (pagoEditando?'Pago actualizado':'Pago registrado'));
  }
  pagoEditando=null;
  refrescarAlmacen();
}
function terminarGuardado(){
  guardando=false;
  const btn=document.getElementById('f-guardar');
  if(btn){ btn.disabled=false; btn.textContent=pagoEditando?'Guardar cambios':'Guardar pago y extender vigencia'; }
}

async function borrarPago(idPago){
  const p=pagos.find(x=>x.id===idPago);
  if(p && assets){
    if(p.comprobanteId){ try{ await assets.delete(p.comprobanteId); }catch(e){} }
    if(p.facturaArchivoId){ try{ await assets.delete(p.facturaArchivoId); }catch(e){} }
  }
  try{ await db.doc('pagos/'+idPago).delete(); }
  catch(e){ avisar(errorBonito(e)); return; }
  const c=p?cliente(p.clienteId):null;
  if(c) await recalcularVigencias(c, pagos.filter(function(x){ return x.id!==idPago; }));
  pagoEditando=null; cerrarOverlay(); avisar('Pago eliminado'); refrescarAlmacen();
}

    const a=t.getAttribute('data-rebanada').split('|');
    if(a[1]==='linea'){ ing.nivel='linea'; ing.linea=a[0]; }
    else { ing.nivel=a[1]; ing.linea=''; }
    render(); return;
  }
  if(t.hasAttribute('data-ingvolver')){
    ing.nivel=t.getAttribute('data-ingvolver'); ing.linea=''; render(); return;
  }
  if(t.hasAttribute('data-inganio')){
    ing.anio=t.getAttribute('data-inganio'); render(); return;
  }

  /* ---- Ida y vuelta entre Clientes y Pagos y vigencia ---- */
  if(t.hasAttribute('data-verpagos')){
    const id=t.getAttribute('data-verpagos');
    const c=cliente(id);
    filtroPagos={q:'',tipo:'todos',factura:'todos',meses:[],servicio:'todos',
                 anios:[],folios:[],desde:'',hasta:'',comprador:id,asignacion:'todos'};
    pagoAbierto=''; vista='pagos'; render();
    avisar('Mostrando sólo lo que paga '+(c?c.nombre:'esa cuenta')+'.');
    return;
  }
  if(t.hasAttribute('data-vercubiertas')){
    const id=t.getAttribute('data-vercubiertas');
    const c=cliente(id);
    const ids=[id].concat(amparadasPor(c).map(function(x){ return x.id; }));
    filtro={ q:'', estado:'todos', tipo:'todos', factura:'todos', servicio:'todos',
             grupos:[], sel:ids, acceso:[], contacto:[] };
    modoClientes='lista'; vista='clientes'; render();
    avisar(ids.length+' cuentas quedan cubiertas con lo que paga '+(c?c.nombre:'esa cuenta')+'.');
    return;
  }
  if(t.hasAttribute('data-verampara')){
    const p=pagos.find(function(x){ return x.id===t.getAttribute('data-verampara'); });
    if(!p) return;
    const ids=cuentasDelPago(p).map(function(x){ return x.id; });
    filtro={ q:'', estado:'todos', tipo:'todos', factura:'todos', servicio:'todos',
             grupos:[], sel:ids, acceso:[], contacto:[] };
    modoClientes='lista'; vista='clientes'; render();
    avisar('Este movimiento ampara '+ids.length+' cuenta'+(ids.length===1?'':'s')+'.');
    return;
  }
  /* ---- Selección múltiple para la factura general ---- */
  if(t.id==='sel-modo'){
    modoSel=!modoSel; if(!modoSel) selPagos=[];
    render(); return;
  }
  if(t.hasAttribute('data-selpago')){
    const id=t.getAttribute('data-selpago');
    const i=selPagos.indexOf(id);
    if(i>=0) selPagos.splice(i,1); else selPagos.push(id);
    render(); return;
  }
  if(t.id==='sel-todos'){
    const vis=pagosVisibles().map(function(x){ return x.p.id; });
    const todos=vis.length>0 && vis.every(function(id){ return selPagos.indexOf(id)>=0; });
    if(todos) selPagos=selPagos.filter(function(id){ return vis.indexOf(id)<0; });
    else vis.forEach(function(id){ if(selPagos.indexOf(id)<0) selPagos.push(id); });
    render(); return;
  }
  if(t.id==='sel-ninguno'){ selPagos=[]; render(); return; }
  if(t.id==='gasto-nuevo'){ modalGasto(); return; }
  if(t.id==='gs-guardar'){ guardarGasto(); return; }
  if(t.hasAttribute('data-borragasto')){ borrarGasto(t.getAttribute('data-borragasto')); return; }
  if(t.id==='sel-combinar'){ modalCombinar(); return; }
  if(t.id==='cb-guardar'){ guardarCombinacion(); return; }
  if(t.id==='sel-facturar'){ modalFacturaGeneral(); return; }
  if(t.id==='fg-guardar'){ guardarFacturaGeneral(); return; }
  if(t.id==='rg-limpiar'){ filtroPagos.desde=''; filtroPagos.hasta=''; render(); return; }
  if(t.hasAttribute('data-abrepago')){
    const id=t.getAttribute('data-abrepago');
    pagoAbierto = (pagoAbierto===id) ? '' : id;
    render(); return;
  }
  if(t.id==='qp-limpiar'){
    filtroPagos.q=''; render();
    const n=document.getElementById('qp-global'); if(n) n.focus();
    return;
  }
  if(t.id==='limpiar-pagos'){
    filtroPagos={q:'',tipo:'todos',factura:'todos',meses:[],servicio:'todos',
                 anios:[],folios:[],desde:'',hasta:'',comprador:'',asignacion:'todos'};
    render(); avisar('Filtros de movimientos quitados'); return;
  }
  if(t.hasAttribute('data-opt')){
    const v=t.getAttribute('data-opt');
    const cat=catActual(catAbierta); if(!cat) return;
    if(cat.multi){
      const i=catSel.indexOf(v);
      if(i<0) catSel.push(v); else catSel.splice(i,1);
    } else {
      catSel = catSel[0]===v ? [] : [v];
    }
    pintarCategoria(); return;
  }
  if(t.id==='cat-todos'){
    const cat=catActual(catAbierta); if(!cat) return;
    const vis=listaCategoria(cat).map(function(o){ return o.valor; });
    const todos=vis.length && vis.every(function(v){ return catSel.includes(v); });
    if(todos) catSel=catSel.filter(function(v){ return !vis.includes(v); });
    else vis.forEach(function(v){ if(!catSel.includes(v)) catSel.push(v); });
    pintarCategoria(); return;
  }
  if(t.id==='cat-aplicar'){ aplicarCategoria(); return; }
  if(t.id==='q-limpiar'){
    filtro.q=''; render();
    const n=document.getElementById('q-global'); if(n) n.focus();
    return;
  }
  if(t.hasAttribute('data-planabre')){
    const k=t.getAttribute('data-planabre');
    planAbierto = (planAbierto===k) ? '' : k;
    render(); return;
  }
  if(t.hasAttribute('data-grupoabre')){
    const g=t.getAttribute('data-grupoabre');
    grupoAbierto = (grupoAbierto===g) ? '' : g;
    render(); return;
  }
  if(t.id==='aj-restablecer'){ guardarAjustes('restablecer'); return; }
  if(t.id==='aj-guardar'){ guardarAjustes('ajuste'); return; }
  if(t.id==='aj-descartar'){ ajustesPend=null; render(); avisar('Cambios descartados'); return; }
  if(t.id==='aj-aplicar-todos'){ aplicarPctATodos(); return; }
  if(t.id==='fact-nueva'){ facturitaEditando=null; modalFacturita(null); return; }
  if(t.id==='chk-todos'){ filtro.sel=clientesVisibles().map(function(c){ return c.id; }); render(); return; }
  if(t.id==='chk-ninguno'){ filtro.sel=[]; render(); return; }
  if(t.id==='limpiar-filtros'){ filtro={q:'',estado:'todos',tipo:'todos',factura:'todos',servicio:'todos',grupos:[],sel:[],acceso:[],contacto:[]}; render(); avisar('Filtros de cartera quitados'); return; }
  if(t.id==='fk-guardar'){ guardarFacturita(); return; }
  if(t.hasAttribute('data-factedit')){ modalFacturita(t.getAttribute('data-factedit')); return; }
  if(t.hasAttribute('data-factborrar')){ borrarFacturita(t.getAttribute('data-factborrar')); return; }
  if(t.hasAttribute('data-revertir')){ revertirA(t.getAttribute('data-revertir')); return; }


  if(t.hasAttribute('data-scrim')){ if(ev.target===t){ pagoEditando=null; cerrarOverlay(); } return; }
  if(t.hasAttribute('data-cerrar')){ pagoEditando=null; cerrarOverlay(); return; }

  if(t.id==='nuevo-cliente'){ nuevoCliente(); return; }
  if(t.id==='f-guardar'){ guardarPago(); return; }
  if(t.id==='e-guardar'){ guardarFicha(seleccion); return; }
  if(t.id==='etq-crear'){ crearEtiquetaInline(); return; }
  if(t.id==='refrescar-almacen'){ refrescarAlmacen(); avisar('Consultando espacio…'); return; }
  if(t.id==='tema'){ window.PORTAL.cambiaTema(temaActual()==='claro'?'dark':'light'); return; }
  if(t.hasAttribute('data-subir')){
    cerrarOverlay(); modalPago(null, t.getAttribute('data-subir'));
    setTimeout(function(){
      const c=document.getElementById('caja-f-archivo');
      if(c){ c.scrollIntoView({block:'center'}); c.focus&&c.focus(); }
    }, 90);
    return;
  }
  if(t.hasAttribute('data-ver')){
    const a=t.getAttribute('data-ver').split('|');
    cerrarOverlay(); modalArchivo(a[0],a[1]); return;
  }
  if(t.id==='quitar-fac'){
    const p=pagos.find(function(x){ return x.id===pagoEditando; });
    if(p) p.__quitarFac=true;
    const fila=t.closest('.archivo-fila'); if(fila) fila.remove();
    facturaPendiente=null;
    avisar('El archivo de la factura se quitará al guardar');
    return;
  }
  if(t.id==='quitar-comp'){
    const p=pagos.find(function(x){ return x.id===pagoEditando; });
    if(p) p.__quitarComp=true;
    const fila=t.closest('.archivo-fila'); if(fila) fila.remove();
    archivoPendiente=null;
    avisar('El comprobante se quitará al guardar');
    return;
  }

  if(t.hasAttribute('data-tog')){ t.setAttribute('aria-pressed', t.getAttribute('aria-pressed')!=='true'); return; }

  if(t.hasAttribute('data-vista')){ vista=t.getAttribute('data-vista'); render(); return; }
  if(t.hasAttribute('data-estado')){ filtro.estado=t.getAttribute('data-estado'); podarSeleccion(); render(); return; }
  if(t.hasAttribute('data-tipo')){ filtro.tipo=t.getAttribute('data-tipo'); podarSeleccion(); render(); return; }
  if(t.hasAttribute('data-factura')){ filtro.factura=t.getAttribute('data-factura'); podarSeleccion(); render(); return; }
  if(t.hasAttribute('data-chk')){
    const id=t.getAttribute('data-chk');
    const i=filtro.sel.indexOf(id);
    if(i<0) filtro.sel.push(id); else filtro.sel.splice(i,1);
    render(); return;
  }
  if(t.hasAttribute('data-paneltipo')){ panelTipo=t.getAttribute('data-paneltipo'); render(); return; }
  if(t.hasAttribute('data-kpi')){
    const a=t.getAttribute('data-kpi').split('|');
    if(a[0]==='serv'){
      filtroPagos.servicio = filtroPagos.servicio===a[1] ? 'todos' : a[1];
      render(); return;
    }
    if(a[0]==='fac'){
      filtroPagos.factura = filtroPagos.factura===a[1] ? 'todos' : a[1];
      render(); return;
    }
    if(a[0]==='asig'){
      filtroPagos.asignacion = filtroPagos.asignacion===a[1] ? 'todos' : a[1];
      render(); return;
    }
    if(a[0]==='pagos'){
      filtroPagos={ q:'', tipo:'todos', factura:'todos', servicio:'todos', asignacion:'todos',
                    anios:[], folios:[], desde:'', hasta:'', comprador:'',
                    meses: a[1]==='mes' ? [mesClave(HOY)] : [] };
      vista='pagos'; render(); return;
    }
    filtro={q:'', estado:a[1], tipo:a[0], factura:'todos', servicio:'todos', grupos:[], sel:[], acceso:[], contacto:[]};
    vista='clientes'; modoClientes='lista'; render(); return;
  }
  if(t.hasAttribute('data-ira')){
    const a=t.getAttribute('data-ira').split('|');
    filtro={q:'', estado:a[1], tipo:a[0], factura:'todos', servicio:'todos', grupos:[], sel:[], acceso:[], contacto:[]};
    vista='clientes'; render(); return;
  }
  if(t.hasAttribute('data-ficha')){ seleccion=t.getAttribute('data-ficha'); pagoEditando=null; modalFicha(seleccion); return; }
  if(t.hasAttribute('data-editpago')){ cerrarOverlay(); modalPago(null, t.getAttribute('data-editpago')); return; }
  if(t.hasAttribute('data-borrarpago')){ borrarPago(t.getAttribute('data-borrarpago')); return; }
  if(t.hasAttribute('data-pago')){
    const id=t.getAttribute('data-pago');
    // Sin id, el formulario abre «Sin asignar»: así se captura un depósito suelto.
    pagoEditando=null; cerrarOverlay(); modalPago(id||null, null); return;
  }
});



/** Al cambiar un segmento, los clientes marcados que ya no aparecen dejan de contar. */
function podarSeleccion(){
  if(!filtro.sel.length) return;
  const v=new Set(clientesVisibles().map(function(c){ return c.id; }));
  filtro.sel=filtro.sel.filter(function(id){ return v.has(id); });
}

/* Ctrl + rueda hace zoom dentro del lienzo; arrastrar lo pasea. */
document.addEventListener('wheel', function(ev){
  if(!zEstado) return;
  const l=ev.target.closest && ev.target.closest('#lienzo-visor');
  if(!l || !(ev.ctrlKey||ev.metaKey)) return;
  ev.preventDefault();
  moverZoom(ev.deltaY<0 ? 'mas' : 'menos');
}, {passive:false});
(function(){
  let arrastra=false, x0=0, y0=0, sx=0, sy=0;
  document.addEventListener('pointerdown', function(ev){
    const l=ev.target.closest && ev.target.closest('#lienzo-visor');
    if(!l) return;
    arrastra=true; x0=ev.clientX; y0=ev.clientY; sx=l.scrollLeft; sy=l.scrollTop;
    l.classList.add('arrastrando');
  });
  document.addEventListener('pointermove', function(ev){
    if(!arrastra) return;
    const l=document.getElementById('lienzo-visor'); if(!l) return;
    l.scrollLeft = sx-(ev.clientX-x0);
    l.scrollTop  = sy-(ev.clientY-y0);
  });
  document.addEventListener('pointerup', function(){
    arrastra=false;
    const l=document.getElementById('lienzo-visor'); if(l) l.classList.remove('arrastrando');
  });
})();

document.addEventListener('input', function(ev){
  if(ev.target.id==='cat-buscar'){ catBusca=ev.target.value; pintarCategoria(); return; }
  if(ev.target.id==='qp-global'){
    const pos=ev.target.selectionStart;
    filtroPagos.q=ev.target.value;
    render();
    const n=document.getElementById('qp-global');
    if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(e){} }
    return;
  }
  if(ev.target.id==='q-global'){
    const pos=ev.target.selectionStart;
    filtro.q=ev.target.value;
    podarSeleccion(); render();
    const n=document.getElementById('q-global');
    if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(e){} }
    return;
  }
  if(ev.target.hasAttribute && ev.target.hasAttribute('data-aj')){
    const k=ev.target.getAttribute('data-aj');
    const v=parseFloat(ev.target.value);
    iniciarPendientes();
    ajustesPend[k]=isNaN(v)?0:v;
    repintarPlan(k); refrescarBotonesAjuste();
    return;
  }
  if(['f-cliente','f-fecha','f-monto'].includes(ev.target.id)){
    if(ev.target.id==='f-cliente' && !pagoEditando){
      const c=cliente(ev.target.value);
      if(c) document.getElementById('f-monto').value=tarifaEsperada(c).total.toFixed(2);
    }
    actualizarPreview();
  }
});
document.addEventListener('change', function(ev){
  if(ev.target.id==='fk-cliente'){
    const c=cliente(ev.target.value);
    if(c) document.getElementById('fk-nombre').value=c.nombre||'';
    return;
  }
  if(ev.target.id==='fk-plan'){
    const el=document.getElementById('fk-monto');
    if(el) el.value=precioTimbresVista(ev.target.value,true).toFixed(2);
    return;
  }
  if(ev.target.id==='f-archivo' || ev.target.id==='f-archivo-fac'){
    const esFac=ev.target.id==='f-archivo-fac';
    const f=ev.target.files&&ev.target.files[0];
    if(!f){ if(esFac) facturaPendiente=null; else archivoPendiente=null; return; }
    if(!tipoDeArchivo(f)){ avisar('Sólo se aceptan PDF, PNG, JPG, GIF y WEBP.'); ev.target.value=''; return; }
    if(f.size>LIMITE_ARCHIVO){ avisar('El archivo pesa '+pesoArchivo(f.size)+'. El límite por archivo es 20 MB.'); ev.target.value=''; return; }
    if(esFac) facturaPendiente=f; else archivoPendiente=f;
    const caja=document.getElementById('caja-'+ev.target.id);
    const nom=document.getElementById('nom-'+ev.target.id);
    if(caja) caja.classList.add('cargado');
    if(nom) nom.textContent=f.name+' · '+pesoArchivo(f.size);
    avisar('Listo para subir: '+f.name+'. Dale «Guardar» para que quede en la nube.');
    return;
  }
  if(ev.target.id==='rg-desde' || ev.target.id==='rg-hasta'){
    if(ev.target.id==='rg-desde') filtroPagos.desde=ev.target.value||'';
    else                          filtroPagos.hasta=ev.target.value||'';
    if(filtroPagos.desde && filtroPagos.hasta && filtroPagos.desde>filtroPagos.hasta){
      const t2=filtroPagos.desde; filtroPagos.desde=filtroPagos.hasta; filtroPagos.hasta=t2;
      avisar('Volteé el rango: la fecha de inicio iba después de la de fin.');
    }
    render(); return;
  }
  if(['f-cliente','f-fecha','f-monto'].includes(ev.target.id)) actualizarPreview();
});

document.addEventListener('submit', async function(ev){
  if(ev.target.id==='form-cuenta'){
    ev.preventDefault();
    const nuevo=Object.assign({},config,{cuentaCobro:{
      banco:document.getElementById('cc-banco').value.trim(),
      titular:document.getElementById('cc-titular').value.trim(),
      clabe:document.getElementById('cc-clabe').value.trim(),
      cuenta:document.getElementById('cc-cuenta').value.trim()
    }});
    if(await guardarDoc('config/general', nuevo, false)) avisar('Datos de cobro guardados');
    return;
  }
});
document.addEventListener('keydown', function(ev){ if(ev.key==='Escape'){ pagoEditando=null; cerrarOverlay(); } });
document.addEventListener('click', function(ev){
  const a=ev.target.closest&&ev.target.closest('[data-cotizador]'); if(!a) return;
  ev.preventDefault();
  try{ window.parent.postMessage({quoSub:'cot'}, location.origin); }catch(e){}
});

render();
window.QUO_ACCESO().then(function(ok){
  if(ok){ iniciar(); return; }
  document.getElementById('view').innerHTML='<div class="arranque"><h2>Sin acceso</h2>'+
    '<p>Esta sección es solo para quienes llevan Quo Contabilita.</p></div>';
});
</script>
