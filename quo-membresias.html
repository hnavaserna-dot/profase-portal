<!doctype html><html lang="es" data-rol="todos"><head><meta charset="utf-8"><script>/* Cierre temporal del portal (30-oct-2026, pedido de Daniel cuando la base se trabó: «cierra temporalmente crm»;
   «Saca a todos del CRM con ese aviso y cuando quede ya les avisamos»).
   construir.py lo pone escrito al principio del <head> de cada página que arma (y va a mano en index.html), antes de
   cualquier otro script. Lee cierre.json, que vive en la raíz de profase-portal (no pasa por la base), y si dice
   "cerrado": true detiene la página y lleva a cerrado.html, que avisa y regresa sola al portal en cuanto cierre.json
   diga false. Si la página va en un marco, se lleva a la de arriba. Guarda a dónde iba cada quien para regresarlo ahí.
   Solo en crmprofase.com.mx: en las pruebas locales no hace nada (salvo con window.__PRUEBA_CIERRE).
   Si cierre.json no llega, la página sigue normal. No lee ni escribe nada de la base. */
(function () {
  'use strict';
  if (!/(^|\.)crmprofase\.com\.mx$/.test(location.hostname) && !window.__PRUEBA_CIERRE) return;
  if (/\/cerrado\.html$/.test(location.pathname)) return;
  var j = null;
  try {
    var x = new XMLHttpRequest();
    x.open('GET', '/cierre.json?t=' + Date.now(), false);
    x.send(null);
    if (x.status === 200) j = JSON.parse(x.responseText);
  } catch (e) { j = null; }
  if (!j || j.cerrado !== true) return;
  var w = window;
  try { if (window.top && window.top.location.host === location.host) w = window.top; } catch (e) { w = window; }
  try {
    var r = w.location.pathname + w.location.search + w.location.hash;
    if (!/cerrado\.html/.test(r)) sessionStorage.setItem('profase-regreso', r);
  } catch (e) { /* sin almacenamiento: regresa a la entrada */ }
  try { window.stop(); } catch (e) { /* navegador viejo */ }
  try { w.location.replace('/cerrado.html'); } catch (e) { location.replace('/cerrado.html'); }
})();</script><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Portal PROFASE · Control de membresías</title><script src="js/supabase.js?v=bb37eb706b"></script><script src="js/portal.js?v=07c4fddab8"></script>
<script>
/* Portal PROFASE · Quo Contabilita: lo que esta página pedía a Claude, sobre el portal.
   db: las mismas colecciones con prefijo quo_ (la sección de la compañía QUO en la base).
   assets: comprobantes y facturas en Supabase Storage (cubeta privada «quo»); la base deja entrar solo a Daniel,
   Cadengo y Gabriel. user: quienes entran aquí capturan y administran (la base ya los limita a ellos). */
(function(){
  var C = window.claude; if (!C || !window.PORTAL) return;
  var P = window.PORTAL, base = C.use.bind(C);
  var MAPA = { clientes:'quo_clientes', pagos:'quo_pagos', cotizaciones:'quo_cotizaciones', movimientos:'quo_movimientos',
               gruposBase:'quo_grupos', facturita:'quo_facturita', historialPrecios:'quo_historial_precios', config:'quo_config' };
  function col(c){ return MAPA[c] || ('quo_' + c); }
  function ruta(p){ var i = String(p).indexOf('/'); return i < 0 ? col(p) : col(p.slice(0, i)) + p.slice(i); }
  function prefijado(db){ return { collection: function(c){ return db.collection(col(c)); }, doc: function(p){ return db.doc(ruta(p)); } }; }
  var CUBETA = 'quo', MAX_BYTES = 1024 * 1024 * 1024, MAX_ARCHIVOS = 5000;
  function err(code, m){ var e = new Error(m || code); e.code = code; return e; }
  function hex(n){ var a = new Uint8Array(n); crypto.getRandomValues(a); return Array.prototype.map.call(a, function(b){ return ('0' + b.toString(16)).slice(-2); }).join(''); }
  var urls = {};
  window.QUO_URL = async function(id){
    var u = urls[id]; if (u && u.hasta > Date.now()) return u.url;
    var r = await P.sb.storage.from(CUBETA).createSignedUrl(id, 3600);
    if (r.error || !r.data) throw err('unavailable', 'No se encontró el archivo');
    urls[id] = { url: r.data.signedUrl, hasta: Date.now() + 50 * 60000 };
    return r.data.signedUrl;
  };
  var ASSETS = {
    upload: async function(file, o){
      var tipo = (o && o.type) || file.type || 'application/octet-stream';
      if (file.size > 20 * 1024 * 1024) throw err('too_large');
      if (!/^(application\/pdf|image\/(png|jpeg|gif|webp))$/.test(tipo)) throw err('unsupported_type');
      var id = hex(16);
      var r = await P.sb.storage.from(CUBETA).upload(id, file, { contentType: tipo, upsert: false });
      if (r.error) throw err(/exceed|quota|size/i.test(r.error.message || '') ? 'quota_or_state' : 'unavailable', r.error.message);
      return { id: id, sizeBytes: file.size };
    },
    delete: async function(id){
      var r = await P.sb.storage.from(CUBETA).remove([id]);
      if (r.error) throw err('unavailable', r.error.message);
      delete urls[id];
    },
    list: async function(){
      var files = 0, bytes = 0, desde = 0;
      for (;;){
        var r = await P.sb.storage.from(CUBETA).list('', { limit: 1000, offset: desde });
        if (r.error) throw err('unavailable', r.error.message);
        var l = (r.data || []).filter(function(x){ return x.id; });
        l.forEach(function(x){ files++; bytes += (x.metadata && x.metadata.size) || 0; });
        if ((r.data || []).length < 1000) break;
        desde += 1000;
      }
      return { usage: { files: files, bytes: bytes, maxFiles: MAX_ARCHIVOS, maxBytes: MAX_BYTES } };
    }
  };
  C.use = async function(cap){
    if (cap === 'assets') { await P.listo; return ASSETS; }
    var r = await base(cap);
    if (cap === 'db') return prefijado(r);
    // el usuario de solo consulta (P.consulta) entra en el modo «Sólo lectura» de la página
    if (cap === 'user') return Object.assign({}, r, { canEdit: async function(){ return !P.consulta; }, isOwner: async function(){ return !P.consulta; } });
    return r;
  };
  /* los enlaces a archivos (/_blob/<id>) se abren con su liga firmada */
  document.addEventListener('click', function(ev){
    var a = ev.target.closest && ev.target.closest('a[href^="/_blob/"]'); if (!a) return;
    ev.preventDefault();
    var w = window.open('', '_blank');
    window.QUO_URL(a.getAttribute('href').slice(7)).then(function(u){ if (w) w.location = u; else location.href = u; })
      .catch(function(){ if (w) w.close(); });
  }, true);
  window.QUO_ACCESO = function(){
    return P.listo.then(function(p){
      if (!p) return false;
      if (p.rol === 'director') return true;
      return P.sb.rpc('es_quo').then(function(r){ return r.data === true; });
    }).catch(function(){ return false; });
  };
})();
</script>

/* ---------- Chips y etiquetas ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;

.tipo{display:inline-flex;align-items:center;padding:.2rem .4rem;border-radius:.35rem;
  font-size:.55rem;font-weight:650;white-space:nowrap}
.tipo.interno{color:#7DD3FC;background:rgba(56,189,248,.08);border:1px solid rgba(56,189,248,.2)}
.tipo.externo{color:#FDBA74;background:rgba(251,146,60,.08);border:1px solid rgba(251,146,60,.2)}

/* ---------- Barras ---------- */
.barra{display:flex;align-items:center;gap:8px;min-width:140px}
.barra .track{flex:1;height:4px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;min-width:40px}
.barra .fill{height:100%;border-radius:3px;transition:.2s}
.barra .d{font-family:var(--mono);font-size:.62rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.medidor .track{height:7px}

/* ---------- Correos ---------- */
.mails{display:grid;gap:3px;min-width:0}
.mails div{display:flex;gap:6px;align-items:baseline;min-width:0}
.mails .tag{font-size:.48rem;font-weight:750;letter-spacing:.1em;text-transform:uppercase;flex:none;padding:0;border:0;background:none}
.tag.contacto{color:var(--tenue)}
.tag.plataforma{color:var(--azul-claro)}
.mails .addr{font-family:var(--mono);font-size:.6rem;overflow-wrap:anywhere;min-width:0;color:var(--muted)}
.mails .same{color:var(--tenue);font-size:.58rem}

/* ---------- Filtros y campos ---------- */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
input[type=text],input[type=url],input[type=date],input[type=number],select,textarea{
  font:inherit;font-size:.72rem;color:var(--ink);
  background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.09);border-radius:.55rem;
  padding:.55rem .65rem;min-width:0;transition:.16s;
}
input::placeholder,textarea::placeholder{color:var(--tenue)}
input:focus,select:focus,textarea:focus{border-color:rgba(22,132,189,.6);box-shadow:0 0 0 3px rgba(22,132,189,.08);outline:none}
input[type=text],input[type=url]{min-width:200px}
input[type=file]{font-size:.66rem;color:var(--muted);background:none;border:0;padding:0}
textarea{resize:vertical;font-family:var(--body)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
  background-position:calc(100% - 15px) 52%, calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
option{background:#0B2632;color:var(--ink)}

.seg{display:flex;overflow-x:auto;border:1px solid rgba(255,255,255,.08);border-radius:.5rem;background:rgba(0,0,0,.1);padding:4px;gap:2px}
.seg button{background:transparent;border:0;cursor:pointer;color:var(--dim);
  padding:.4rem .6rem;border-radius:.4rem;font-size:.62rem;font-weight:650;white-space:nowrap;transition:.15s}
.seg button:hover{color:#CBD5E1}
.seg button[aria-pressed="true"]{color:var(--ink);background:rgba(255,255,255,.07);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.seg.alt button[aria-pressed="true"]{color:#fff;background:var(--azul)}

.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}
.field{display:grid;gap:7px;min-width:0}
.field label{font-size:.6rem;font-weight:750;letter-spacing:.11em;text-transform:uppercase;color:var(--dim)}
.field .help{font-size:.62rem;color:var(--tenue);line-height:1.5}
.field.wide{grid-column:1/-1}
.picker{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.picker button{border:1px solid rgba(255,255,255,.1);background:var(--velo);border-radius:.5rem;
  padding:.35rem .6rem;cursor:pointer;font-size:.62rem;font-weight:650;color:var(--dim);transition:.15s}
.picker button:hover{color:#fff;border-color:rgba(255,255,255,.18)}
.picker button[aria-pressed="true"]{background:color-mix(in srgb, var(--c) 14%, transparent);color:var(--c);
  border-color:color-mix(in srgb, var(--c) 40%, transparent)}
.nueva-etq{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.nueva-etq input{min-width:150px;padding:.35rem .55rem;font-size:.66rem}
.nueva-etq select{padding:.35rem .55rem;font-size:.66rem}

/* ---------- Panel lateral de captura ---------- */
.scrim{position:fixed;inset:0;background:rgba(2,10,16,.72);z-index:50;display:flex;justify-content:flex-end;padding:0}
.modal{
  background:#071E29;border-left:1px solid var(--line);border-radius:0;
  width:min(470px,100%);height:100%;max-height:100%;overflow:auto;
  box-shadow:-30px 0 70px rgba(0,0,0,.45);
  display:flex;flex-direction:column;
}
@media (prefers-reduced-motion: no-preference){
  .modal{animation:entrar .22s ease-out}
  @keyframes entrar{from{opacity:0;transform:translateX(24px)}}
}
.modal header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  padding:1.25rem;border-bottom:1px solid var(--line);position:sticky;top:0;background:#071E29;z-index:1}
.modal header h2{font-size:18px;font-weight:600;color:#fff;letter-spacing:-.02em}
.modal header p{margin:8px 0 0;color:var(--muted);font-size:.65rem;line-height:1.6}
.modal header > div:first-child::before{
  content:var(--modal-eyebrow, "Captura");display:block;
  font-size:.55rem;font-weight:750;letter-spacing:.16em;text-transform:uppercase;color:var(--azul-claro);margin-bottom:6px;
}
.modal .body{padding:1.25rem;display:grid;gap:1.25rem;flex:1}
.modal footer{display:flex;gap:10px;justify-content:flex-end;padding:1rem 1.25rem;
  border-top:1px solid var(--line);position:sticky;bottom:0;background:#071E29;flex-wrap:wrap}
.x{background:var(--velo);border:1px solid rgba(255,255,255,.1);border-radius:.5rem;
  width:32px;height:32px;cursor:pointer;flex:none;line-height:1;color:var(--dim);transition:.16s}
.x:hover{color:#fff;background:rgba(255,255,255,.07)}

/* ---------- Bloques de detalle ---------- */
.desglose{background:rgba(0,0,0,.18);border:1px solid var(--line);border-radius:.75rem;padding:1rem}
.desglose .row{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:.7rem;color:var(--muted)}
.desglose .row.total{border-top:1px solid var(--line);margin-top:8px;padding-top:10px;font-weight:650;color:var(--ink)}
.desglose .row span:last-child{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}

.ruta{font-family:var(--mono);font-size:.62rem;background:rgba(0,0,0,.2);border:1px solid var(--line);
  border-radius:.55rem;padding:.6rem .7rem;overflow-wrap:anywhere;display:block;color:var(--muted)}
.ruta .sep{color:var(--tenue)}

.coment{background:rgba(242,122,43,.06);border-left:2px solid var(--naranja);border-radius:0 .4rem .4rem 0;
  padding:.5rem .65rem;font-size:.62rem;margin-top:.45rem;color:var(--muted);line-height:1.55}
.coment b{display:block;font-size:.48rem;letter-spacing:.12em;text-transform:uppercase;color:var(--naranja);font-weight:750;margin-bottom:3px}

.hist-row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:baseline;
  padding:.7rem 0;border-bottom:1px solid var(--line-2)}
.hist-row:last-child{border-bottom:0}
.hist-row .f{font-family:var(--mono);font-size:.65rem;white-space:nowrap;color:var(--dim)}
.hist-row .m{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:650;white-space:nowrap;color:var(--ink)}
.hist-row small{color:var(--tenue);display:block;font-size:.6rem;margin-top:3px}

.empty{padding:2.5rem 1rem;text-align:center;color:var(--tenue);font-size:.7rem}
.arranque{background:linear-gradient(145deg, rgba(255,255,255,.03), rgba(255,255,255,.016));
  border:1px dashed rgba(255,255,255,.12);border-radius:1rem;padding:3rem 1.5rem;text-align:center;box-shadow:var(--shadow)}
.arranque h2{font-size:20px;font-weight:600;color:#fff;margin-bottom:10px}
.arranque p{color:var(--muted);font-size:.72rem;max-width:52ch;margin:0 auto 20px;line-height:1.7}
.note{font-size:.66rem;color:var(--tenue);display:flex;gap:8px;align-items:flex-start;line-height:1.6}
.note b{color:var(--muted);font-weight:650}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));
  z-index:80;background:#0E3445;color:var(--ink);border:1px solid rgba(22,132,189,.4);
  padding:.7rem 1.1rem;border-radius:.75rem;font-size:.7rem;font-weight:600;
  box-shadow:0 18px 44px rgba(0,0,0,.5);max-width:min(90vw,440px);text-align:center}
@media (prefers-reduced-motion: no-preference){
  .toast{animation:pop .18s ease-out}
  @keyframes pop{from{opacity:0;transform:translate(-50%,8px)}}
}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.62rem;color:var(--tenue);margin-top:14px}
.legend i{width:7px;height:7px;border-radius:2px;display:inline-block;margin-right:6px}

/* ---------- Tarjetas de plan ---------- */
.precio-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.plan{border:1px solid var(--line);border-left:2px solid var(--azul);border-radius:.75rem;
  padding:1.1rem;background:rgba(255,255,255,.022);transition:.18s}
.plan:hover{background:rgba(13,49,65,.6);border-color:rgba(22,132,189,.3);border-left-color:var(--azul)}
.plan h3{font-size:14px;font-weight:650;color:#fff}
.plan .inc{color:var(--tenue);font-size:.6rem;margin:5px 0 14px;line-height:1.5}
.plan .pr{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:.5rem 0;border-top:1px solid var(--line-2)}
.plan .pr > span:first-child{font-size:.55rem;letter-spacing:.12em;text-transform:uppercase;color:var(--tenue);font-weight:750}
.plan .pr b{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:15px;font-weight:600;color:#fff}
.plan.pro{border-left-color:var(--azul)}
.plan.lite{border-left-color:var(--naranja)}
.plan.fact{border-left-color:#C4B5FD}
.plan .uso{display:inline-flex;align-items:center;padding:.2rem .45rem;border-radius:.35rem;font-size:.55rem;font-weight:650;
  background:rgba(52,211,153,.08);color:var(--ok);border:1px solid rgba(52,211,153,.2)}
.plan .uso.cero{background:var(--velo);color:var(--tenue);border-color:rgba(255,255,255,.1)}
.plan .pr .dup{display:block;font-size:.55rem;color:var(--tenue);font-weight:400;letter-spacing:0;text-transform:none;margin-top:3px}
.plan .antes{text-decoration:line-through;color:var(--tenue);font-size:.65rem;font-family:var(--mono);margin-right:7px;font-weight:400}
.plan .incluye{list-style:none;margin:12px 0 0;padding:0;font-size:.58rem;color:var(--tenue);display:grid;gap:4px}
.plan .incluye li{display:flex;justify-content:space-between;gap:8px}
.plan .incluye b{color:var(--ok);font-weight:650}

/* ---------- Ajuste de precios ---------- */
.ajuste-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.pct{display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.pct label{font-size:.55rem;letter-spacing:.11em;text-transform:uppercase;color:var(--tenue);font-weight:750;flex:1}
.pct input{width:72px;padding:.3rem .5rem;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.7rem}
.pct .sig{font-size:.65rem;color:var(--dim);font-weight:650}
.barra-todos{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;padding:1rem 1.25rem;
  border-bottom:1px solid var(--line);background:rgba(0,0,0,.12)}
.barra-todos .field{max-width:150px}
.sucio{display:inline-flex;align-items:center;gap:6px;font-size:.62rem;font-weight:650;padding:4px 10px;border-radius:999px;
  background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-bd)}
.vigente{display:inline-flex;align-items:center;gap:6px;font-size:.62rem;font-weight:650;padding:4px 10px;border-radius:999px;
  background:rgba(242,122,43,.1);color:var(--naranja);border:1px solid rgba(242,122,43,.26)}
.cambio{display:inline-flex;align-items:center;gap:5px;padding:.2rem .45rem;border-radius:.35rem;font-size:.55rem;font-weight:650;
  white-space:nowrap;background:var(--velo);border:1px solid rgba(255,255,255,.08);margin:2px 4px 2px 0;color:var(--dim)}
.cambio b{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sube{color:var(--bad)} .baja{color:var(--ok)}
.conteo{background:none;border:0;cursor:pointer;font-size:.66rem;font-weight:650;
  padding:.25rem .45rem;border-radius:.35rem;transition:.15s;white-space:nowrap}
.conteo span{font-weight:400;opacity:.72}
.conteo:hover{background:rgba(255,255,255,.06)}

/* ---------- Checklist de clientes ---------- */
.chk-barra{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chk-barra .cuenta{font-size:.62rem;color:var(--tenue);font-weight:650;letter-spacing:.06em;text-transform:uppercase}
.checklist{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:8px;
  max-height:330px;overflow:auto;padding:2px}
.chk{display:flex;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;min-width:0;
  padding:.55rem .7rem;border:1px solid var(--line);border-radius:.6rem;
  background:rgba(255,255,255,.02);transition:.15s}
.chk:hover{background:rgba(22,132,189,.08);border-color:rgba(22,132,189,.26)}
.chk[aria-pressed="true"]{background:rgba(22,132,189,.14);border-color:rgba(22,132,189,.45)}
.chk .box{width:15px;height:15px;flex:none;border-radius:.25rem;border:1.5px solid var(--dim);
  display:grid;place-items:center;font-size:9px;color:transparent;transition:.15s;line-height:1}
.chk[aria-pressed="true"] .box{background:var(--azul);border-color:var(--azul);color:#fff}
.chk .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:.7rem;font-weight:600;color:var(--ink)}
.chk .mini{flex:none;display:flex;gap:4px;align-items:center}
.pt{width:6px;height:6px;border-radius:50%;flex:none;display:inline-block}

/* ---------- Clasificaciones ---------- */
.chip.azul{color:var(--t-azul);background:rgba(125,211,252,.1);border-color:rgba(125,211,252,.24)}
.chip.azul .dot{background:var(--t-azul)}
.chip.morado{color:var(--t-morado);background:rgba(196,181,253,.1);border-color:rgba(196,181,253,.24)}
.chip.morado .dot{background:var(--t-morado)}
button.chip.vinculo{cursor:pointer}
button.chip.vinculo:hover{filter:brightness(1.25);text-decoration:underline}
.chip.clase{cursor:help}
.chip.clase:focus-visible{outline:2px solid var(--azul);outline-offset:2px}
.clases{display:inline-flex;gap:4px;flex-wrap:wrap;align-items:center}
.leyenda-clases{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:12px;
  padding-top:12px;border-top:1px solid var(--line)}
.leyenda-clases > span{display:inline-flex;gap:6px;align-items:center;font-size:.6rem;color:var(--tenue)}
.leyenda-clases i{height:8px;width:8px;border-radius:999px;display:block}

/* ---------- Historial que se despliega ---------- */
tr.fila-pago{cursor:pointer}
tr.fila-pago:hover > td{background:rgba(22,132,189,.06)}
tr.fila-pago.abierta > td{background:rgba(22,132,189,.09)}
.cel-fl{width:30px;padding-right:0!important;color:var(--tenue)}
.cel-fl .flecha{display:inline-block;font-size:.58rem;transition:transform .15s}
tr.fila-pago.abierta .cel-fl .flecha{transform:rotate(90deg);color:var(--azul-claro)}
td.f-pago{white-space:nowrap;font-weight:700;color:var(--ink)}
tr.detalle-pago > td{padding:0!important;background:rgba(0,0,0,.14)}
:root[data-tema="claro"] tr.detalle-pago > td{background:rgba(15,42,58,.04)}
.pago-detalle{padding:16px 18px 18px;border-top:1px solid var(--line)}
.pago-detalle .bloques{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.pago-detalle .dato > span{display:block;font-size:.52rem;letter-spacing:.13em;text-transform:uppercase;
  color:var(--tenue);font-weight:750}
.pago-detalle .dato > b{display:block;margin-top:6px;font-size:.78rem;font-weight:600;color:var(--ink)}
.chip.folio{font-family:var(--mono);letter-spacing:.01em}

/* ---------- Cargador de archivos ---------- */
label.soltar,label.soltar b,label.soltar small,label.soltar span{
  text-transform:none;letter-spacing:normal}
.soltar{display:flex;align-items:center;gap:13px;width:100%;cursor:pointer;font-weight:400;color:var(--ink);
  border:1.5px dashed rgba(255,255,255,.17);border-radius:.75rem;padding:15px 16px;
  background:rgba(255,255,255,.015);transition:.15s;text-align:left}
.soltar:hover{border-color:rgba(22,132,189,.55);background:rgba(13,49,65,.6)}
.soltar.cargado{border-style:solid;border-color:rgba(110,231,183,.4);background:rgba(110,231,183,.06)}
.soltar .ic{display:grid;place-items:center;flex:none;height:36px;width:36px;border-radius:.6rem;
  background:rgba(22,132,189,.16);color:var(--azul-claro)}
.soltar.cargado .ic{background:rgba(110,231,183,.14);color:var(--ok)}
.soltar .ic svg{height:18px;width:18px}
.soltar .tx{min-width:0;flex:1}
.soltar .tx b{display:block;font-size:.74rem;font-weight:600;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.soltar .tx small{display:block;margin-top:3px;font-size:.62rem;color:var(--tenue);line-height:1.5}
.soltar .ac{flex:none;font-size:.65rem;font-weight:650;color:var(--azul-claro)}
.soltar input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.archivo-guardado{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:9px;
  border:1px solid rgba(110,231,183,.26);background:rgba(110,231,183,.06);border-radius:.6rem;padding:10px 12px}
.archivo-guardado .nb{font-size:.65rem;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- Búsqueda general ---------- */
.lupa{position:relative;display:flex;align-items:center;margin-bottom:12px}
.lupa > svg{position:absolute;left:14px;height:16px;width:16px;color:var(--dim);pointer-events:none}
.lupa input{width:100%;height:2.85rem;padding-left:40px;padding-right:112px;font-size:.78rem}
.lupa input::placeholder{color:var(--tenue)}
.lupa .x-q{position:absolute;right:76px;background:none;border:0;cursor:pointer;color:var(--dim);
  font-size:1rem;line-height:1;padding:4px 6px;border-radius:.4rem}
.lupa .x-q:hover{color:#fff;background:var(--velo)}
.lupa .n-q{position:absolute;right:14px;font-size:.6rem;color:var(--azul-claro);font-weight:650;
  font-variant-numeric:tabular-nums;pointer-events:none}
.lupa-pie{margin:-4px 0 14px;font-size:.6rem;color:var(--tenue);line-height:1.6}

/* ---------- Explorar información ---------- */
.explora{display:grid;grid-template-columns:repeat(auto-fit,minmax(318px,1fr));gap:10px}
.cat{display:flex;align-items:center;gap:13px;width:100%;text-align:left;cursor:pointer;font:inherit;color:inherit;
  background:rgba(255,255,255,.015);border:1px solid var(--line);border-radius:.75rem;padding:14px 15px;transition:.15s;min-width:0}
.cat:hover{background:rgba(13,49,65,.66);border-color:rgba(22,132,189,.3);transform:translateY(-1px)}
.cat.puesto{border-color:rgba(22,132,189,.42);background:rgba(13,49,65,.5)}
.cat .ico{display:grid;place-items:center;flex:none;height:34px;width:34px;border-radius:.6rem;
  background:rgba(22,132,189,.14);color:var(--azul-claro)}
.cat .ico svg{height:17px;width:17px}
.cat .tx{min-width:0;flex:1}
.cat .tx .et{display:flex;align-items:center;gap:6px;font-size:.52rem;letter-spacing:.13em;
  text-transform:uppercase;color:var(--tenue);font-weight:750}
.cat .tx .vl{display:block;margin-top:5px;font-size:.76rem;font-weight:600;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat.puesto .tx .vl{color:var(--azul-claro)}
.cat .fl{flex:none;color:var(--tenue);font-size:.62rem}
.nuevo{font-size:.46rem;letter-spacing:.1em;font-weight:800;text-transform:uppercase;
  color:var(--naranja);background:rgba(242,122,43,.14);border:1px solid rgba(242,122,43,.3);
  border-radius:999px;padding:2px 6px;line-height:1.3}
.interactivo{font-size:.46rem;letter-spacing:.1em;font-weight:800;text-transform:uppercase;
  color:var(--azul-claro);background:rgba(22,132,189,.14);border:1px solid rgba(22,132,189,.3);
  border-radius:999px;padding:2px 6px;margin-left:8px;line-height:1.3}

/* ---------- Selector de categoría ---------- */
.cat-caja{display:grid;gap:12px;align-content:start}
.cat-caja > input{height:2.5rem}
.cat-barra{display:flex;align-items:center;gap:12px;padding:0 2px 11px;border-bottom:1px solid var(--line)}

const IVA_BASE = 16;

/* ---------------------------------------------------------------
   AJUSTES DE PRECIO — un porcentaje por plan, positivo o negativo.
   Claves: 'PRO|2.0', 'LITE|1.0', 'FACT|204'.
   Los de Precios son SÓLO DE VISUALIZACIÓN: cambian el tarifario que
   se muestra, no el monto sugerido al registrar un pago.
   El cotizador lleva su propio ajuste, capturado por cotización.
   --------------------------------------------------------------- */
function clavePlan(linea,plan){ return linea+'|'+plan; }
function claveTimbres(k){ return 'FACT|'+k; }
function mapaAjustes(){ return (config.precios||{}).ajustes||{}; }
function pctAj(k){ const v=Number(mapaAjustes()[k]); return isNaN(v)?0:v; }
function ivaPct(){ const v=(config.precios||{}).iva; return v==null?IVA_BASE:Number(v); }
function hayAjuste(){ const m=mapaAjustes(); return Object.keys(m).some(function(k){ return Number(m[k])!==0; }); }
function dosDec(v){ return Math.round(v*100)/100; }
function conPct(v,p){ const n=Number(p); return dosDec(v*(1+(isNaN(n)?0:n)/100)); }

/* --- precios de lista: el tarifario base, sin ajustes --- */
function precioPlanBase(linea,plan,per){
  const L=TARIFAS[linea]||TARIFAS.PRO, P=L.planes[plan]||L.planes['1.0'];
  return per==='anual'?P.anual:P.mensual;
}
function precioXml(k,per){
  const v=(PAQUETES_XML[k||'0']||PAQUETES_XML['0']).anual;
  return per==='anual'?v:dosDec(v/12);
}
function precioUsuario(per){
  return per==='anual'?USUARIO_ADICIONAL_ANUAL:dosDec(USUARIO_ADICIONAL_ANUAL/12);
}
function precioTimbresBase(k){ return (FACTURITA[k]||{anual:0}).anual; }
function conIva(v){ return dosDec(v*(1+ivaPct()/100)); }

/* --- precios con el ajuste de Precios aplicado (sólo para mostrar) --- */
function precioPlanVista(linea,plan,per,pctOverride){
  const p = pctOverride==null ? pctAj(clavePlan(linea,plan)) : pctOverride;
  return conPct(precioPlanBase(linea,plan,per), p);
}
function precioTimbresVista(k,conIvaFlag,pctOverride){
  const p = pctOverride==null ? pctAj(claveTimbres(k)) : pctOverride;
  const v = conPct(precioTimbresBase(k), p);
  return conIvaFlag ? conIva(v) : v;
}
function nombreClaveAj(k){
  const p=String(k).split('|');
  if(p[0]==='FACT') return 'Facturita '+(FACTURITA[p[1]]?FACTURITA[p[1]].timbres+' timbres':p[1]);
  return ((TARIFAS[p[0]]||{}).etiqueta||p[0])+' '+p[1];
}

/* =========================================================
   2. FECHAS  (todo 'YYYY-MM-DD', sin zona horaria)
   ========================================================= */
const HOY = (function(){ const d=new Date();
  return [d.getFullYear(), String(d.getMonth()+1).padStart(2,'0'), String(d.getDate()).padStart(2,'0')].join('-'); })();
function partes(iso){ const p=String(iso).split('-'); return {a:+p[0], m:+p[1], d:+p[2]}; }
function aNum(iso){ const p=partes(iso); return Date.UTC(p.a,p.m-1,p.d); }
function diasEntre(desde,hasta){ return Math.round((aNum(hasta)-aNum(desde))/86400000); }
function diasDelMes(a,m){ return new Date(Date.UTC(a,m,0)).getUTCDate(); }
function sumarDiasISO(iso,n){
  const t=new Date(aNum(iso)+n*86400000);
  return [t.getUTCFullYear(),String(t.getUTCMonth()+1).padStart(2,'0'),String(t.getUTCDate()).padStart(2,'0')].join('-');
}
function sumarMeses(iso,n){
  const p=partes(iso); const total=(p.a*12+(p.m-1))+n;
  const a=Math.floor(total/12), m=(total%12)+1, d=Math.min(p.d,diasDelMes(a,m));
  return [a,String(m).padStart(2,'0'),String(d).padStart(2,'0')].join('-');
}
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MESES_C=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
function fechaLarga(iso){
  if(!iso) return '—';
  const p=partes(iso);
  return String(p.d).padStart(2,'0')+'/'+String(p.m).padStart(2,'0')+'/'+p.a;
}
function periodoMes(iso){ const p=partes(iso); return MESES[p.m-1]+' '+p.a; }
function mesClave(iso){ return String(iso).slice(0,7); }
function money(n){ return '$'+Number(n||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function moneyCorto(n){ return '$'+Math.round(Number(n||0)).toLocaleString('es-MX'); }
function pesoArchivo(b){
  b=Number(b||0);
  if(b<1024) return b+' B';
  if(b<1048576) return (b/1024).toFixed(0)+' KB';
  return (b/1048576).toFixed(1)+' MB';
}

/* =========================================================
   3. REGLAS DEL NEGOCIO
   ========================================================= */
function tarifaEsperada(c){
  if(sinPlan(c)) return { base:0, xml:0, usr:0, total:0 };
  const per=c.periodicidad==='anual'?'anual':'mensual';
  const base=precioPlanBase(c.linea,c.plan,per);
  const xml=(c.xmlExtra&&c.xmlExtra!=='0')?precioXml(c.xmlExtra,per):0;
  const usr=(Number(c.usuariosExtra)||0)?dosDec(precioUsuario(per)*(Number(c.usuariosExtra)||0)):0;
  return { base, xml, usr, total:dosDec(base+xml+usr) };
}
/** Cuentas vigentes y pagando en un plan: excluye vencidas, en pausa y bajas. */
function cuentasEnPlan(linea,plan,per){
  return clientes.filter(function(c){
    if(sinPlan(c)) return false;
    if(c.linea!==linea||c.plan!==plan) return false;
    if(per && c.periodicidad!==per) return false;
    const e=estadoVigencia(c).clave;
    return e==='activo'||e==='porvencer';
  }).length;
}
/** Internos: el ciclo arranca el día 1 del mes que se está pagando. Externos: el día del depósito. */
function inicioDeCiclo(c, fechaPago){
  if(!fechaPago) return '';
  if(c && c.tipo==='interno') return mesClave(fechaPago)+'-01';
  return fechaPago;
}
/** Cuentas que comparten grupo. Sin grupo, la cuenta va sola. */
function cuentasDelGrupo(c){
  if(!c) return [];
  const g=String(c.grupo||'').trim();
  if(!g) return [c];
  const l=clientes.filter(function(x){ return String(x.grupo||'').trim()===g; });
  return l.length?l:[c];
}
/** Pagos que alimentan la vigencia: los propios y los del grupo marcados «cubre al grupo». */
function pagosQueCubren(c, lista){
  if(!c) return [];
  const g=String(c.grupo||'').trim();
  const delGrupo={};
  if(g) clientes.forEach(function(x){ if(String(x.grupo||'').trim()===g) delGrupo[x.id]=1; });
  return (lista||pagos).filter(function(p){
    if(esFacturita(p)) return false;            // los timbres no suman vigencia
    if(p.clienteId===c.id) return true;
    return !!(p.cubreGrupo && delGrupo[p.clienteId]);
  });
}
/** Vigencia recalculada desde cero con todos los pagos de la cuenta.
 *  Es idempotente: guardar dos veces no acumula días, porque varios movimientos
 *  que arrancan el mismo día cuentan como un solo ciclo. */
function vigenciaDesdePagos(c, lista){
  const ps=pagosQueCubren(c, lista);
  if(!ps.length) return '';
  // Cada ciclo se mide con la cuenta que lo pagó: si una cuenta del grupo paga por
  // todas, las demás quedan con exactamente su mismo corte.
  const ciclos=[];
  ps.forEach(function(p){
    const duenio = (p.clienteId===c.id) ? c
      : (clientes.find(function(x){ return x.id===p.clienteId; }) || c);
    const ini=inicioDeCiclo(duenio, p.fecha);
    if(!ini) return;
    // El plazo capturado en el pago manda; si no lo trae, se usa el del plan.
    const dias=Number(p.dias)>0 ? Number(p.dias) : diasDelCiclo(duenio);
    const k=ini+'|'+dias;
    if(ciclos.some(function(x){ return x.k===k; })) return;
    ciclos.push({ k:k, ini:ini, dias:dias });
  });
  if(!ciclos.length) return '';
  ciclos.sort(function(a,b){ return a.ini<b.ini?-1:(a.ini>b.ini?1:0); });
  let corte='';
  ciclos.forEach(function(x){
    const arranque=(corte && diasEntre(x.ini,corte)>0)?corte:x.ini;
    corte=sumarDiasISO(arranque,x.dias);
  });
  return corte;
}
/** La lista de pagos tal como quedaría con un movimiento agregado o sustituido. */
function pagosCon(id, datos){
  return pagos.filter(function(p){ return p.id!==id; }).concat([Object.assign({id:id}, datos)]);
}
/** Reescribe la vigencia de la cuenta y de las demás de su grupo a partir de los pagos. */
async function recalcularVigencias(c, lista){
  const afectadas=cuentasDelGrupo(c).slice();
  if(!afectadas.some(function(x){ return x.id===c.id; })) afectadas.push(c);
  for(let i=0;i<afectadas.length;i++){
    const x=afectadas[i];
    const nueva=vigenciaDesdePagos(x, lista);
    const patch={};
    if(String(x.vigenciaHasta||'')!==String(nueva||'')) patch.vigenciaHasta=nueva;
    if(x.estatus==='baja' && nueva) patch.estatus='activo';
    if(Object.keys(patch).length){
      if(!await guardarDoc('clientes/'+x.id, patch, true)) return null;
    }
  }
  return vigenciaDesdePagos(c, lista);
}
function diasDelCiclo(c){ return c.periodicidad==='anual'?DIAS_VIGENCIA.anual:DIAS_VIGENCIA.mensual; }
function estadoVigencia(c){
  if(c.estatus==='baja')  return {clave:'baja',  chip:'neutral', texto:'Baja',     dias:null};
  if(c.estatus==='pausa') return {clave:'pausa', chip:'neutral', texto:'En pausa', dias:null};
  if(!c.vigenciaHasta)    return {clave:'sinfecha', chip:'neutral', texto:'Sin fecha de pago', dias:null};
  const dias=diasEntre(HOY,c.vigenciaHasta);
  if(dias<0)                   return {clave:'vencido',  chip:'bad',  texto:'Vencido',    dias};
  if(dias<=UMBRAL_POR_VENCER)  return {clave:'porvencer',chip:'warn', texto:'Por vencer', dias};
  return {clave:'activo', chip:'ok', texto:'Al corriente', dias};
}
/** Cuenta sin línea ni plan asignado en el padrón. */
function sinPlan(c){ return !c.linea || c.linea==='SIN PLAN' || !c.plan; }
/** Facturación de la cuenta: no aplica, todo facturado, o le faltan folios. */
function estadoFactura(c){
  if(c.requiereFactura==='no') return 'naplica';
  const ps=pagosDe(c.id);
  if(ps.length && ps.every(function(p){ return !!p.facturaFolio; })) return 'facturado';
  return 'pendiente';
}
const FACTURA_CHIP={ facturado:['ok','Facturado'], pendiente:['warn','Falta factura'], naplica:['neutral','No aplica'] };
function chipFactura(c){
  const f=FACTURA_CHIP[estadoFactura(c)];
  return '<span class="chip '+f[0]+'"><span class="dot"></span>'+f[1]+'</span>';
}
function chipFacturaPago(p,c){
  if(p.facturaFolio) return '<span class="chip ok"><span class="dot"></span>'+esc(p.facturaFolio)+'</span>'+
    (p.facturaFecha?'<br><small style="color:var(--tenue);font-size:.57rem">'+fechaLarga(p.facturaFecha)+'</small>':'');
  if(c && c.requiereFactura==='no') return '<span class="chip neutral"><span class="dot"></span>No aplica</span>';
  return '<span class="chip warn"><span class="dot"></span>Pendiente</span>';
}
function servicioTexto(c){
  if(sinPlan(c)) return 'Sin plan asignado';
  return (TARIFAS[c.linea]||TARIFAS.PRO).etiqueta+' '+c.plan+' · '+(c.periodicidad==='anual'?'Anual':'Mensual');
}
function tipoTexto(c){ return c.tipo==='interno'?'Interno':'Externo'; }
function tipoDeArchivo(file){
  const ext=(file.name.split('.').pop()||'').toLowerCase();
  return TIPOS_COMPROBANTE[ext] || (Object.values(TIPOS_COMPROBANTE).includes(file.type)?file.type:null);
}

function temaActual(){ return document.documentElement.getAttribute('data-tema')==='claro'?'claro':'oscuro'; }
function ponerTema(t){
  const claro = t==='claro';

/* ---------- Conexión a la nube ---------- */
async function iniciar(){
  try{ db = await claude.use('db'); }catch(e){ db=null; }
  if(!db){ conexion='sin-db'; render(); return; }
  try{ usuario = await claude.use('user'); }catch(e){ usuario=null; }
  try{ assets = await claude.use('assets'); }catch(e){ assets=null; }
  if(usuario){
    try{ puedeEscribir = await usuario.can('data.write'); }catch(e){ puedeEscribir=null; }
    try{ puedeAdmin = await usuario.canEdit(); }catch(e){ puedeAdmin=null; }
  }

  const alErrar = e => { conexion='sin-db'; render(); avisar('Se perdió la conexión con la base ('+e.code+'). Recarga la página.'); };

  db.collection('clientes').onSnapshot(s=>{
    clientes=s.docs.map(d=>Object.assign({}, d.data(), {id:d.id}));
    conexion='lista'; render();
  }, alErrar);

  db.collection('pagos').onSnapshot(s=>{
    pagos=s.docs.map(d=>Object.assign({}, d.data(), {id:d.id}));
    render();
  }, alErrar);

  db.collection('cotizaciones').onSnapshot(s=>{
    cotizaciones=s.docs.map(d=>Object.assign({}, d.data(), {id:d.id}));
    if(vista==='cotizaciones') render();
  }, alErrar);

  db.collection('movimientos').onSnapshot(s=>{
    movimientos=s.docs.map(d=>Object.assign({}, d.data(), {id:d.id}));
    if(vista==='ingresos') render();
  }, alErrar);

  db.collection('gruposBase').onSnapshot(s=>{
    gruposBase=s.docs.map(d=>Object.assign({}, d.data(), {id:d.id}));
    if(vista==='clientes') render();
  }, alErrar);

  db.collection('facturita').onSnapshot(s=>{
    facturitas=s.docs.map(d=>Object.assign({}, d.data(), {id:d.id}));
    if(vista==='precios') render();
  }, alErrar);

  db.collection('historialPrecios').onSnapshot(s=>{
    historial=s.docs.map(d=>Object.assign({}, d.data(), {id:d.id}));
    if(vista==='precios') render();
  }, alErrar);

  db.doc('config/general').onSnapshot(s=>{
    const d=s.exists?s.data():{};
    config={
      cuentaCobro:Object.assign({banco:'',titular:'',clabe:'',cuenta:''}, d.cuentaCobro||{}),
      cotizador:Object.assign({url:'',nombre:''}, d.cotizador||{}),
      precios:Object.assign({ajustes:{}, iva:IVA_BASE, actualizado:''}, d.precios||{}),
      etiquetas:(d.etiquetas&&d.etiquetas.length)?d.etiquetas:ETIQUETAS_INICIALES
    };
    render();
  }, alErrar);

  refrescarAlmacen();
  setTimeout(()=>{ if(conexion==='cargando'){ conexion='lista'; render(); } }, 4000);
}
async function refrescarAlmacen(){
  if(!assets) return;
  try{ const r=await assets.list(); almacen=r.usage; render(); }
  catch(e){ almacen=null; }
}
function errorBonito(e){
  const c=e&&e.code;
  if(c==='invalid_argument'||c==='not_granted') return sinAdmin()
    ? 'Los precios y la configuración sólo los cambia quien administra la página.'
    : 'No tienes permiso de escritura en esta página, o el dato no es válido.';
  if(c==='quota_exceeded')   return 'Se llenó el espacio de la base. Hay que depurar registros antes de guardar más.';
  if(c==='quota_or_state')   return 'Se llenó el almacenamiento de archivos. Libera comprobantes viejos o muévelos a Drive.';
  if(c==='too_large')        return 'El archivo pasa de 20 MB. Comprímelo antes de subirlo.';
  if(c==='unsupported_type') return 'Sólo se aceptan PDF, PNG, JPG, GIF y WEBP.';
  if(c==='rate_limited')     return 'Demasiadas operaciones seguidas. Espera unos segundos.';
  if(c==='unavailable' || c==='store_unavailable') return 'La nube no respondió. Vuelve a intentar en un momento.';
  return 'No se pudo guardar'+(c?' ('+c+')':'')+'.';
}
async function guardarDoc(ruta, datos, merge){
  try{
    if(merge) await db.doc(ruta).update(datos);
    else await db.doc(ruta).set(datos);
    return true;
  }catch(e){
    if(e&&(e.code==='invalid_argument'||e.code==='not_granted')) puedeEscribir=false;
    avisar(errorBonito(e)); return false;
  }
}

function chipEstado(c){ const e=estadoVigencia(c); return '<span class="chip '+e.chip+'"><span class="dot"></span>'+e.texto+'</span>'; }
function chipTipo(c){ return '<span class="tipo '+(c.tipo==='interno'?'interno':'externo')+'">'+tipoTexto(c)+'</span>'; }
function barraVigencia(c){
  const e=estadoVigencia(c);
  if(e.dias===null) return '<span style="color:var(--tenue);font-size:.65rem">—</span>';
  const ciclo=diasDelCiclo(c);
  const pct=Math.max(0,Math.min(100,Math.round((e.dias/ciclo)*100)));
  const color=e.clave==='vencido'?'var(--bad)':e.clave==='porvencer'?'var(--warn)':e.clave==='activo'?'var(--ok)':'var(--muted)';
  const txt=e.dias<0?Math.abs(e.dias)+' d vencido':e.dias+' d';
  return '<div class="barra"><div class="track"><div class="fill" style="width:'+pct+'%;background:'+color+'"></div></div>'+
         '<span class="d" style="color:'+color+'">'+txt+'</span></div>';
}

}
const MES_INICIO = '2026-01';
/** Meses con pago, de enero 2026 al mes en curso, del más reciente al más antiguo. */
function etiquetaMes(clave){
  if(!clave) return '';
  const a=clave.slice(0,4), m=+clave.slice(5)-1;
  return MESES[m].charAt(0).toUpperCase()+MESES[m].slice(1)+' '+a;
}
function mesesDePago(){
  const fin=mesClave(HOY);
  const vistos={};
  pagos.forEach(function(p){ const m=mesClave(p.fecha); if(m) vistos[m]=(vistos[m]||0)+1; });
  const out=[];
  let a=2026, m=1;
  while(true){
    const k=a+'-'+String(m).padStart(2,'0');
    out.push({clave:k, etiqueta:MESES[m-1]+' '+a, n:vistos[k]||0});
    if(k>=fin && k>=Object.keys(vistos).sort().pop()) break;
    m++; if(m>12){ m=1; a++; }
    if(a>2040) break;
  }
  return out.reverse();
}
function esPdf(nombre,tipo){
  if(tipo==='application/pdf') return true;
  if(tipo && tipo.indexOf('image/')===0) return false;
  return /\.pdf$/i.test(String(nombre||''));
}
function esImagen(nombre,tipo){
  if(tipo && tipo.indexOf('image/')===0) return true;
  if(tipo==='application/pdf') return false;
  return /\.(png|jpe?g|gif|webp)$/i.test(String(nombre||''));
}
function extDe(nombre){
  const m=/\.([a-z0-9]+)$/i.exec(String(nombre||''));
  return m?m[1].toUpperCase():'ARCHIVO';
}
/** Pastilla que abre el visor del archivo adjunto a un pago. */
function chipArchivo(p, cual){

  const nom = esFac ? p.facturaArchivoNombre : p.comprobanteNombre;
  if(id) return '<button class="chip ok" data-ver="'+esc(p.id)+'|'+cual+'"><span class="dot"></span>Ver '+(esFac?'factura':'comprobante')+'</button>';
  if(soloLectura()){
    if(!esFac && nom) return '<span class="chip neutral" title="'+esc(nom)+'"><span class="dot"></span>Sólo el nombre</span>';
    return '<span class="chip bad"><span class="dot"></span>Falta</span>';
  }
  if(!esFac && nom)
    return '<button class="chip neutral" data-subir="'+esc(p.id)+'" title="'+esc(nom)+' — el archivo todavía no está guardado aquí">'+
           '<span class="dot"></span>Sólo el nombre</button>';
  return '<button class="chip bad" data-subir="'+esc(p.id)+'"><span class="dot"></span>Subir</button>';
}
function chipComprobante(p){
  if(!p.comprobanteId){
    if(p.comprobanteNombre) return '<span class="chip neutral"><span class="dot"></span>Referenciado</span>';
    return '<span class="chip bad"><span class="dot"></span>Falta</span>';

         '<span class="dot"></span>Ver archivo</a>';

/* ---------- Tarjeta de almacenamiento ---------- */
function tarjetaAlmacen(){
  let h='<div class="card"><div class="card-head"><h2>Almacenamiento en la nube</h2>'+
        '<button class="btn sm" id="refrescar-almacen">Actualizar</button></div><div class="card-body" style="display:grid;gap:14px">';

  if(!assets){
    h+='<div class="note"><b>Carga de archivos no disponible en esta vista.</b> Los comprobantes se suben desde la cuenta que tiene permiso de escritura sobre la página.</div>';
  } else if(!almacen){
    h+='<div class="note">Consultando el espacio ocupado…</div>';
  } else {
    const pctB=almacen.maxBytes?Math.min(100,(almacen.bytes/almacen.maxBytes)*100):0;
    const pctF=almacen.maxFiles?Math.min(100,(almacen.files/almacen.maxFiles)*100):0;
    const col=p=>p>=90?'var(--bad)':p>=70?'var(--warn)':'var(--ok)';
    h+='<div style="display:grid;gap:12px">';
    h+='<div><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px"><span style="color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:11px">Espacio usado</span>'+
       '<span class="num">'+pesoArchivo(almacen.bytes)+' de '+pesoArchivo(almacen.maxBytes)+'</span></div>'+
       '<div class="barra medidor"><div class="track"><div class="fill" style="width:'+pctB.toFixed(1)+'%;background:'+col(pctB)+'"></div></div>'+
       '<span class="d" style="color:'+col(pctB)+'">'+pctB.toFixed(1)+'%</span></div></div>';
    h+='<div><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px"><span style="color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:11px">Archivos guardados</span>'+
       '<span class="num">'+almacen.files.toLocaleString('es-MX')+' de '+almacen.maxFiles.toLocaleString('es-MX')+'</span></div>'+
       '<div class="barra medidor"><div class="track"><div class="fill" style="width:'+pctF.toFixed(1)+'%;background:'+col(pctF)+'"></div></div>'+
       '<span class="d" style="color:'+col(pctF)+'">'+pctF.toFixed(1)+'%</span></div></div>';
    h+='</div>';
    if(pctB>=70||pctF>=70){
      h+='<div class="note" style="color:var(--warn)"><b>Ya vas arriba del 70%.</b> Conviene empezar a bajar los comprobantes más viejos a Drive y borrarlos de aquí, dejando la referencia en el comentario del pago.</div>';
    }
  }

  const docs=clientes.length+pagos.length+cotizaciones.length+facturitas.length+historial.length+1;
  const pctD=Math.min(100,(docs/LIMITE_DOCS_DB)*100);
  h+='<div><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px"><span style="color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:11px">Registros en la base</span>'+
     '<span class="num">'+docs.toLocaleString('es-MX')+' de '+LIMITE_DOCS_DB.toLocaleString('es-MX')+'</span></div>'+
     '<div class="barra medidor"><div class="track"><div class="fill" style="width:'+Math.max(0.5,pctD).toFixed(2)+'%;background:var(--ok)"></div></div>'+
     '<span class="d" style="color:var(--ok)">'+(pctD<0.1?'<0.1':pctD.toFixed(1))+'%</span></div></div>';

  h+='<div class="note"><b>Qué cabe:</b> cada comprobante puede pesar hasta 20 MB y se aceptan PDF, PNG, JPG, GIF y WEBP. '+
     'Una foto de transferencia pesa entre 100 KB y 1 MB, así que el espacio alcanza para miles de comprobantes. '+
     'Los clientes y los pagos son registros de texto y prácticamente no consumen espacio.</div>';
  h+='<div class="note"><b>Si algún día se llena:</b> el archivo más viejo se baja a la carpeta de Drive, se borra de aquí y en el comentario del pago se deja anotado dónde quedó. '+
     'El registro del pago no se pierde — sólo deja de tener el archivo adjunto.</div>';
  h+='</div></div>';
  return h;
}

/** Todo lo que se puede escribir en la lupa para encontrar una cuenta. */
/** Datos propios de la cuenta, sin los de sus pagos. */
function textoCliente(c){
  const e=estadoVigencia(c);
  return [c.nombre, c.rfc, c.grupo, c.correoPlataforma, c.correoContacto,
          c.contacto, c.tel, c.responsable, c.notas,
          c.linea, c.plan, servicioTexto(c), c.periodicidad, e.texto,
          (c.tipo==='interno'?'interno despacho':'externo cliente de fuera'),
          c.vigenciaHasta, fechaLarga(c.vigenciaHasta)]
    .filter(Boolean).join(' ').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
}
function textoBuscable(c){
  const e=estadoVigencia(c);
  const partes=[c.nombre, c.rfc, c.grupo, c.correoPlataforma, c.correoContacto,
                c.contacto, c.tel, c.responsable, c.notas,
                c.linea, c.plan, servicioTexto(c), c.periodicidad, e.texto,
                (c.tipo==='interno'?'interno despacho':'externo cliente de fuera'),
                c.vigenciaHasta, fechaLarga(c.vigenciaHasta)];
  pagosDe(c.id).forEach(function(p){
    partes.push(p.facturaRazon, p.pagadoPor, p.facturaFolio, p.referencia,
                p.comentario, p.periodo, p.metodo, p.comprobanteNombre);
  });
  return partes.filter(Boolean).join(' ')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
}
function normTexto(t){
  return String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
}
/** Cada palabra escrita debe aparecer en algún campo de la cuenta. */
function pasaLupa(c){
  const q=normTexto(filtro.q);
  if(!q) return true;
  const t=textoBuscable(c);
  return q.split(/\s+/).every(function(w){ return t.includes(w); });
}

/** Clientes que pasan los segmentos, antes de aplicar la selección del checklist. */
function clientesVisibles(){
  return clientes.filter(function(c){
    if(!pasaLupa(c)) return false;
    if(filtro.tipo!=='todos' && (c.tipo||'externo')!==filtro.tipo) return false;
    const e=estadoVigencia(c).clave;
    if(filtro.estado==='pausa'){ if(e!=='pausa'&&e!=='baja') return false; }
    else if(filtro.estado!=='todos' && e!==filtro.estado) return false;
    if(filtro.factura!=='todos' && estadoFactura(c)!==filtro.factura) return false;
    if(filtro.servicio==='facturita' && !usaFacturita(c)) return false;
    if(filtro.servicio==='membresia' && usaFacturita(c)) return false;
    if(filtro.grupos.length && !filtro.grupos.includes(String(c.grupo||'').trim())) return false;
    if(filtro.acceso.length && !filtro.acceso.includes(String(c.correoPlataforma||'').trim() || SIN_CORREO)) return false;
    if(filtro.contacto.length && !filtro.contacto.includes(String(c.correoContacto||'').trim() || SIN_CORREO)) return false;
    return true;
  }).sort(function(a,b){ return String(a.nombre).localeCompare(String(b.nombre),'es'); });
}
/** Lo anterior, más los clientes marcados en el checklist (vacío = todos). */
function filtrarClientes(){
  const v=clientesVisibles();
  if(!filtro.sel.length) return v;
  const s=new Set(filtro.sel);
  return v.filter(function(c){ return s.has(c.id); });
}
function hayFiltroCartera(){
  return filtro.tipo!=='todos' || filtro.estado!=='todos' || filtro.factura!=='todos'
      || filtro.grupos.length>0 || filtro.sel.length>0
      || filtro.acceso.length>0 || filtro.contacto.length>0 || !!filtro.q.trim()
      || filtro.servicio!=='todos';
}

const CLASES={

  porfactura: {chip:'warn',    texto:'Falta facturar',   ayuda:'El pago ya entró pero todavía no se le emite o no se le captura la factura.'},

/* =========================================================
   CLASIFICADOR POR PRECIO
   Un pago puede entrar sin cliente. Lo que sí se puede saber desde el
   primer momento es QUÉ se pagó, porque el importe casi siempre coincide
   con una tarifa del catálogo. Esto no adivina a quién: sólo qué.
   ========================================================= */

/** Todas las tarifas conocidas, con su etiqueta y de qué familia son. */
function catalogoPrecios(){
  const cat=[];
  Object.keys(TARIFAS).forEach(function(linea){
    const T=TARIFAS[linea];
    Object.keys(T.planes).forEach(function(plan){
      const pl=T.planes[plan];
      cat.push({familia:'contabilita', monto:pl.mensual, periodo:'mensual',
                linea:linea, plan:plan, etiqueta:T.etiqueta+' '+plan+' · mensual'});
      cat.push({familia:'contabilita', monto:pl.anual, periodo:'anual',
                linea:linea, plan:plan, etiqueta:T.etiqueta+' '+plan+' · anual'});
    });
  });
  Object.keys(FACTURITA).forEach(function(k){
    const f=FACTURITA[k];
    cat.push({familia:'facturita', monto:f.anual, periodo:'anual',
              paquete:k, etiqueta:f.timbres+' timbres · sin IVA'});
    cat.push({familia:'facturita', monto:Math.round(f.anual*(1+IVA_BASE/100)*100)/100,
              periodo:'anual', paquete:k, etiqueta:f.timbres+' timbres · con IVA'});
  });
  Object.keys(PAQUETES_XML).forEach(function(k){
    if(k==='0') return;
    cat.push({familia:'extra', monto:PAQUETES_XML[k].anual, periodo:'anual',
              etiqueta:PAQUETES_XML[k].etiqueta});
  });
  cat.push({familia:'extra', monto:USUARIO_ADICIONAL_ANUAL, periodo:'anual',
            etiqueta:'Usuario adicional · anual'});
  return cat;
}
let _catalogo=null;
function catalogo(){ if(!_catalogo) _catalogo=catalogoPrecios(); return _catalogo; }

/** ¿Dos importes son el mismo? Un peso de holgura, o medio por ciento. */
function mismoImporte(a,b){
  const d=Math.abs(a-b);
  return d<=1 || d<=Math.abs(b)*0.005;
}

/** Qué se pagó, deducido del importe.
 *  Devuelve familia ('contabilita' | 'facturita' | 'extra' | 'mixto' | ''),
 *  la confianza y los candidatos que empataron. */
function clasificarMonto(monto){
  const m=Number(monto||0);
  const vacio={familia:'', confianza:'ninguna', candidatos:[]};
  if(!(m>0)) return vacio;

  // 1. Coincidencia directa con una tarifa
  const directos=catalogo().filter(function(x){ return mismoImporte(m, x.monto); })
    .map(function(x){ return {etiqueta:x.etiqueta, familia:x.familia, monto:x.monto,
                              linea:x.linea||'', plan:x.plan||'', paquete:x.paquete||''}; });
  if(directos.length) return resolver(directos, directos.length===1?'alta':'media');

  // Los clientes pagan una mensualidad a la vez, nunca varias juntas, así que
  // un importe que no empata con una tarifa se deja sin identificar en vez de
  // inventarle un múltiplo.
  return vacio;

  function resolver(lista, confianza){
    const familias={};
    lista.forEach(function(x){ familias[x.familia]=1; });
    const f=Object.keys(familias);
    return { familia: f.length===1 ? f[0] : 'mixto',
             confianza: f.length===1 ? confianza : 'ninguna',
             candidatos: lista };
  }
}

/** La familia de un pago: lo capturado manda; si no, lo que diga el importe. */
function familiaDePago(p){
  if(p && p.servicio==='facturita') return 'facturita';
  if(p && p.servicio==='membresia') return 'contabilita';
  const r=clasificarMonto(p?p.monto:0);
  return r.familia;
}
function sinAsignar(p){ return !p.clienteId || !cliente(p.clienteId); }

/** Qué línea y qué plan ampara un pago.
 *  Si tiene cuenta, manda la cuenta. Si no, se deduce del importe, y sólo
 *  cuando una sola tarifa empata: con dos candidatos no se inventa. */
function planDePago(p){
  const c=cliente(p.clienteId);
  if(c && !sinPlan(c)) return {linea:c.linea, plan:c.plan, cierto:true};
  const r=clasificarMonto(p.monto);
  const con=r.candidatos.filter(function(x){ return x.linea; });
  const unicos={};
  con.forEach(function(x){ unicos[x.linea+'|'+x.plan]=x; });
  const k=Object.keys(unicos);
  if(k.length===1) return {linea:unicos[k[0]].linea, plan:unicos[k[0]].plan, cierto:false};
  return {linea:'', plan:'', cierto:false};
}
/** Qué paquete de timbres ampara un pago de FACTURITA. */
function paqueteDePago(p){
  const r=clasificarMonto(p.monto);
  const con=r.candidatos.filter(function(x){ return x.paquete; });
  const unicos={};
  con.forEach(function(x){ unicos[x.paquete]=1; });
  const k=Object.keys(unicos);
  return k.length===1 ? k[0] : '';
}

const FAMILIAS={
  contabilita:{texto:'CONTABILITA', chip:'morado'},
  facturita  :{texto:'FACTURITA',   chip:'azul'},
  extra      :{texto:'Complemento', chip:'neutral'},
  mixto      :{texto:'Importe ambiguo', chip:'warn'},
  ''         :{texto:'Sin identificar', chip:'bad'}
};

/** Las clasificaciones que le tocan a un movimiento, en orden de importancia. */
function clasesDePago(p,c){
  const out=[];
  const fam=familiaDePago(p);
  out.push(fam==='facturita' ? 'facturita' : fam==='contabilita' ? 'contabilita' : 'indefinido');
  if(p.facturaFolio) out.push('facturado');
  else if(c && c.requiereFactura==='no') out.push('naplica');
  else out.push('porfactura');
  if(!p.comprobanteId) out.push('sincomp');
  return out;
}
function pintaClases(p,c,compacto){
  return clasesDePago(p,c).map(function(k){
    const x=CLASES[k];
    return '<span class="chip '+x.chip+' clase" title="'+esc(x.ayuda)+'" tabindex="0">'+
           '<span class="dot"></span>'+(compacto?'':esc(x.texto))+'</span>';
  }).join('');
}
function esFacturita(p){ return p && p.servicio==='facturita'; }
/** Una cuenta «usa Facturita» cuando tiene al menos una compra de timbres. */
function usaFacturita(c){
  return pagos.some(function(p){ return p.clienteId===c.id && esFacturita(p); });
}
/** Timbres comprados por una cuenta en un mes (o en todo el año si no se pasa mes). */
function comprasFacturita(c, mes){
  return pagos.filter(function(p){
    return p.clienteId===c.id && esFacturita(p) && (!mes || mesClave(p.fecha)===mes);
  });
}
/* ---------- Quién le paga a quién ----------
   La cuenta que registra el pago es el COMPRADOR. Las demás cuentas del grupo
   que ese pago cubre son las AMPARADAS. Estas tres funciones son las que
   alimentan los botones de ida y vuelta entre Clientes y Pagos y vigencia. */

/** La cuenta que paga la membresía de ésta. Devuelve la misma cuenta si se paga sola. */
function compradorDe(c){
  if(!c) return null;
  if(pagos.some(function(p){ return p.clienteId===c.id && !esFacturita(p); })) return c;
  const ajenos=pagosQueCubren(c, pagos).filter(function(p){ return p.clienteId!==c.id; });
  if(!ajenos.length) return null;
  ajenos.sort(function(a,b){ return a.fecha<b.fecha?1:-1; });
  return cliente(ajenos[0].clienteId) || null;
}
/** Las otras cuentas que quedan cubiertas por lo que paga ésta. */
function amparadasPor(c){
  if(!c) return [];
  const cubre=pagos.some(function(p){
    return p.clienteId===c.id && !esFacturita(p) && p.cubreGrupo!==false; });
  if(!cubre) return [];
  return cuentasDelGrupo(c).filter(function(x){ return x.id!==c.id; });
}
/** Las cuentas que ampara un movimiento en concreto. */
function cuentasDelPago(p){
  const c=cliente(p.clienteId);
  if(!c) return [];
  if(Array.isArray(p.ampara) && p.ampara.length){
    const l=p.ampara.map(cliente).filter(Boolean);
    if(l.length) return l;
  }
  if(p.cubreGrupo!==false && !esFacturita(p)) return cuentasDelGrupo(c);
  return [c];
}
/** Pastilla de «quién paga» para el tablero de Clientes. */
function pastillaComprador(c){
  const amp=amparadasPor(c);
  if(amp.length)
    return '<button class="chip morado vinculo" data-vercubiertas="'+esc(c.id)+'" '+
           'title="Ver las '+amp.length+' cuentas que quedan cubiertas con lo que paga esta cuenta">'+
           '<span class="dot"></span>Ampara '+amp.length+' cuenta'+(amp.length===1?'':'s')+' &rsaquo;</button>';
  const cp=compradorDe(c);
  if(!cp) return '<span class="chip bad" title="Nadie ha registrado un pago que cubra esta cuenta"><span class="dot"></span>Sin pago</span>';
  if(cp.id===c.id)
    return '<button class="chip neutral vinculo" data-verpagos="'+esc(c.id)+'" '+
           'title="Ver los movimientos de esta cuenta en Pagos y vigencia">'+
           '<span class="dot"></span>Paga lo suyo &rsaquo;</button>';
  return '<button class="chip azul vinculo" data-verpagos="'+esc(cp.id)+'" '+
         'title="Se la paga '+esc(cp.nombre)+'. Ir a sus movimientos en Pagos y vigencia">'+
         '<span class="dot"></span>Se la paga '+esc(cp.nombre)+' &rsaquo;</button>';
}
/** Pastilla de «a quién ampara» para el tablero de Pagos y vigencia. */
function pastillaAmparadas(p){
  const l=cuentasDelPago(p).filter(function(x){ return x.id!==p.clienteId; });
  if(!l.length) return '<span class="chip neutral" title="Este movimiento sólo cubre a la cuenta que lo pagó"><span class="dot"></span>Sólo esta cuenta</span>';
  return '<button class="chip azul vinculo" data-verampara="'+esc(p.id)+'" '+
         'title="'+esc(l.map(function(x){ return x.nombre; }).join(' · '))+'">'+
         '<span class="dot"></span>Ampara '+l.length+' m&aacute;s &rsaquo;</button>';
}

/** Folio más reciente de la cuenta, para verlo en el tablero. */
function ultimoFolio(c){
  const ps=pagosDe(c.id).filter(function(p){ return p.facturaFolio; });
  return ps.length ? ps[0].facturaFolio : '';
}

/** Clientes que pasan todos los filtros MENOS el de la categoría dada, para contar sus opciones. */
function baseSin(cat){
  return clientes.filter(function(c){
    if(!pasaLupa(c)) return false;
    if(cat!=='cartera'  && filtro.tipo!=='todos' && (c.tipo||'externo')!==filtro.tipo) return false;
    if(cat!=='vigencia'){
      const e=estadoVigencia(c).clave;
      if(filtro.estado==='pausa'){ if(e!=='pausa'&&e!=='baja') return false; }
      else if(filtro.estado!=='todos' && e!==filtro.estado) return false;
    }
    if(cat!=='factura'  && filtro.factura!=='todos' && estadoFactura(c)!==filtro.factura) return false;
    if(cat!=='servicio' && filtro.servicio==='facturita' && !usaFacturita(c)) return false;
    if(cat!=='servicio' && filtro.servicio==='membresia' && usaFacturita(c)) return false;
    if(cat!=='grupos'   && filtro.grupos.length && !filtro.grupos.includes(String(c.grupo||'').trim())) return false;
    if(cat!=='acceso'   && filtro.acceso.length  && !filtro.acceso.includes(String(c.correoPlataforma||'').trim()||SIN_CORREO)) return false;
    if(cat!=='contacto' && filtro.contacto.length&& !filtro.contacto.includes(String(c.correoContacto||'').trim()||SIN_CORREO)) return false;
    return true;
  });
}

    const k=String(c[campo]||'').trim() || SIN_CORREO;
    (m[k]=m[k]||[]).push(c);
  });
  return Object.keys(m).sort(function(a,b){
    if(a===SIN_CORREO) return 1;
    if(b===SIN_CORREO) return -1;
    return a.localeCompare(b,'es');
  }).map(function(k){
    return { valor:k, titulo:k, sub:m[k].map(function(c){ return c.nombre; }).join(' · '),

/** Movimientos que pasan todos los filtros de Pagos MENOS el de la categoría dada. */
function pasaServicio(x,cat){
  if(cat==='servicio' || filtroPagos.servicio==='todos') return true;
  return filtroPagos.servicio==='facturita'
    ? familiaDePago(x.p)==='facturita' : familiaDePago(x.p)==='contabilita';
}
function pasaFactura(x,cat){
  if(cat==='factura' || filtroPagos.factura==='todos') return true;
  return filtroPagos.factura==='con' ? !!x.p.facturaFolio : !x.p.facturaFolio;
}
function pagosSin(cat){
  return pagos.map(function(p){ return {p:p, c:cliente(p.clienteId)||null}; })
    .filter(function(x){
      if(!pasaLupaPago(x)) return false;
      if(cat!=='anio' && !pasaFechas(x)) return false;
      if(!pasaComprador(x)) return false;
      if(cat!=='folio' && !pasaFolio(x)) return false;
      if(cat!=='mes' && filtroPagos.meses.length && filtroPagos.meses.indexOf(mesClave(x.p.fecha))<0) return false;
      if(cat!=='cartera' && filtroPagos.tipo!=='todos' && ((x.c&&x.c.tipo)||'externo')!==filtroPagos.tipo) return false;
      if(!pasaFactura(x,cat)) return false;
      if(!pasaServicio(x,cat)) return false;
      if(cat!=='asignacion'){
        if(filtroPagos.asignacion==='sin' && !sinAsignar(x.p)) return false;
        if(filtroPagos.asignacion==='con' &&  sinAsignar(x.p)) return false;
      }
      return true;
    });
}

/** La lupa de Pagos busca en todo el cliente y en el movimiento. */
function pasaLupaPago(x){
  const q=normTexto(filtroPagos.q);
  if(!q) return true;
  const p=x.p;
  const t=((x.c?textoCliente(x.c):'sin asignar')+' '+[p.facturaFolio,p.metodo,p.periodo,p.comentario,
            p.referencia,p.pagadoPor,p.facturaRazon,p.comprobanteNombre,
            fechaLarga(p.fecha),money(p.monto)].filter(Boolean).join(' '))
          .normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  return q.split(/\s+/).every(function(w){ return t.includes(w); });
}
/** Rango de fechas: los años marcados y, encima, el desde/hasta libre. */
/** Todos los movimientos, del más nuevo al más viejo, con su cuenta resuelta. */
function pagosTodos(){
  // `c` puede venir en null: un pago se captura sin cuenta y se asigna después.
  return pagos.slice().sort(function(a,b){ return a.fecha<b.fecha?1:-1; })
    .map(function(p){ return {p:p, c:cliente(p.clienteId)||null}; });
}
/** Los que pasan todos los filtros puestos. Es la lista que se ve en pantalla. */
function pagosVisibles(){
  return pagosTodos().filter(function(x){
    if(!pasaLupaPago(x)) return false;
    if(!pasaFechas(x)) return false;
    if(!pasaComprador(x)) return false;
    if(!pasaFolio(x)) return false;
    if(filtroPagos.meses.length && filtroPagos.meses.indexOf(mesClave(x.p.fecha))<0) return false;
    if(filtroPagos.tipo!=='todos' && ((x.c&&x.c.tipo)||'externo')!==filtroPagos.tipo) return false;
    if(filtroPagos.factura==='con' && !x.p.facturaFolio) return false;
    if(filtroPagos.factura==='sin' &&  x.p.facturaFolio) return false;
    if(filtroPagos.servicio==='facturita' && familiaDePago(x.p)!=='facturita') return false;
    if(filtroPagos.servicio==='membresia' && familiaDePago(x.p)!=='contabilita') return false;
    if(filtroPagos.asignacion==='sin' && !sinAsignar(x.p)) return false;
    if(filtroPagos.asignacion==='con' &&  sinAsignar(x.p)) return false;
    return true;
  });
}
function pasaFechas(x){
  const f=x.p.fecha||'';
  if(filtroPagos.anios.length && filtroPagos.anios.indexOf(f.slice(0,4))<0) return false;
  if(filtroPagos.desde && f < filtroPagos.desde) return false;
  if(filtroPagos.hasta && f > filtroPagos.hasta) return false;
  return true;
}
/** Sólo los movimientos de un comprador (lo pone el botón que viene de Clientes). */
function pasaComprador(x){
  return !filtroPagos.comprador || x.p.clienteId===filtroPagos.comprador;
}
/** Folios de factura marcados. El valor '(sin factura)' agrupa los que no traen folio. */
const SIN_FOLIO='(sin factura)';
function pasaFolio(x){
  if(!filtroPagos.folios.length) return true;
  return filtroPagos.folios.indexOf(x.p.facturaFolio ? x.p.facturaFolio : SIN_FOLIO)>=0;
}
/** Todos los folios capturados, con cuántos movimientos trae cada uno. */
function foliosDePago(){
  const m={};
  pagos.forEach(function(p){
    const k=p.facturaFolio ? String(p.facturaFolio).trim() : SIN_FOLIO;
    if(!m[k]) m[k]={clave:k, n:0, suma:0};
    m[k].n++; m[k].suma+=Number(p.monto||0);
  });
  const l=Object.keys(m).map(function(k){ return m[k]; });
  l.sort(function(a,b){
    if(a.clave===SIN_FOLIO) return 1;
    if(b.clave===SIN_FOLIO) return -1;
    return a.clave<b.clave?1:-1;
  });
  return l;
}
/** Los años que aparecen en el historial. */
function aniosDePago(){
  const m={};
  pagos.forEach(function(p){ const a=(p.fecha||'').slice(0,4); if(a) m[a]=(m[a]||0)+1; });
  return Object.keys(m).sort().reverse().map(function(a){ return {clave:a, n:m[a]}; });
}
function hayFiltroPagos(){
  return !!filtroPagos.q.trim() || filtroPagos.meses.length>0
      || filtroPagos.tipo!=='todos' || filtroPagos.factura!=='todos'
      || filtroPagos.asignacion!=='todos'
      || filtroPagos.servicio!=='todos' || filtroPagos.anios.length>0
      || filtroPagos.folios.length>0 || !!filtroPagos.desde || !!filtroPagos.hasta
      || !!filtroPagos.comprador;
}
/** Texto que muestra la tarjeta de la categoría. */
function resumenCat(cat){
  const v=cat.valores;
  if(!v.length) return cat.unidadTodo;
  if(cat.id==='clientes') return v.length+' cliente'+(v.length===1?'':'s')+' seleccionado'+(v.length===1?'':'s');
  if(!cat.multi){
    const o=cat.opciones().find(function(x){ return x.valor===v[0]; });
    return o?o.titulo:v[0];
  }
  if(v.length===1){
    const o=cat.opciones().find(function(x){ return x.valor===v[0]; });
    return o?o.titulo:v[0];
  }
  return v.length+' seleccionados';
}

/** Las empresas del despacho que quedan cubiertas por la compra de un grupo. */
function beneficiariosDe(nombreGrupo){
  const g=String(nombreGrupo||'').trim().toUpperCase();
  const d=gruposBase.find(function(x){ return String(x.alias||'').trim().toUpperCase()===g; });
  return d && Array.isArray(d.miembros) ? d.miembros : [];
}
function responsableDe(nombreGrupo){
  const g=String(nombreGrupo||'').trim().toUpperCase();
  const d=gruposBase.find(function(x){ return String(x.alias||'').trim().toUpperCase()===g; });
  return d ? (d.responsable||'') : '';
}

/** Un grupo con su corte, quién lo paga y sus cuentas. */
function resumenGrupo(nombre, miembros){
  const ordenadas=miembros.slice().sort(function(a,b){
    return String(a.nombre).localeCompare(String(b.nombre),'es'); });
  let corte='', peor=null;
  ordenadas.forEach(function(c){
    if(c.vigenciaHasta && (!corte || c.vigenciaHasta>corte)) corte=c.vigenciaHasta;
    const e=estadoVigencia(c);
    const rank={vencido:0,sinfecha:1,porvencer:2,pausa:3,baja:3,activo:4};
    if(peor===null || rank[e.clave]<rank[peor.clave]) peor=e;
  });
  const ids={}; ordenadas.forEach(function(c){ ids[c.id]=1; });
  const suyos=pagos.filter(function(p){ return ids[p.clienteId]; });
  const cubren=suyos.filter(function(p){ return p.cubreGrupo; });
  const quien={};
  (cubren.length?cubren:suyos).forEach(function(p){
    const c=cliente(p.clienteId); if(c) quien[c.nombre]=1;
  });
  return { nombre:nombre, miembros:ordenadas, corte:corte, peor:peor,
           nPagos:suyos.length, enBloque:cubren.length>0,
           pagadores:Object.keys(quien).sort(),
           cobrado:suyos.reduce(function(a,p){ return a+(Number(p.monto)||0); },0) };
}
/** Los grupos que resultan del filtro vigente, más las cuentas sueltas. */
function gruposFiltrados(){
  const lista=filtrarClientes(), m={}, sueltas=[];
  lista.forEach(function(c){
    const g=String(c.grupo||'').trim();
    if(g){ (m[g]=m[g]||[]).push(c); } else sueltas.push(c);
  });
  const gs=Object.keys(m).sort(function(a,b){ return a.localeCompare(b,'es'); })
    .map(function(g){ return resumenGrupo(g, m[g]); });
  return { grupos:gs, sueltas:sueltas };
}
/** Grupos presentes en la cartera, con cuántas cuentas tiene cada uno. */
function gruposDeCartera(){
  const m={};
  clientes.forEach(function(c){ const g=String(c.grupo||'').trim(); if(g) m[g]=(m[g]||0)+1; });
  return Object.keys(m).sort(function(a,b){ return a.localeCompare(b,'es'); })
    .map(function(g){ return {nombre:g, n:m[g]}; });
}
const ETQ_TIPO={todos:'Todas',interno:'Internos',externo:'Externos'};
const ETQ_ESTADO={todos:'Todos',activo:'Al corriente',porvencer:'Por vencer',vencido:'Vencidos',sinfecha:'Sin fecha de pago',pausa:'Pausa o baja'};
const ETQ_FACTURA={todos:'Todas',facturado:'Facturados',pendiente:'Falta factura',naplica:'No aplica'};
function marcasFiltro(){
  const m=[];
  if(filtro.q.trim())          m.push(['Búsqueda', filtro.q.trim()]);
  if(filtro.tipo!=='todos')    m.push(['Cartera', ETQ_TIPO[filtro.tipo]]);
  if(filtro.estado!=='todos')  m.push(['Estado', ETQ_ESTADO[filtro.estado]]);
  if(filtro.factura!=='todos') m.push(['Facturación', ETQ_FACTURA[filtro.factura]]);
  if(filtro.servicio!=='todos') m.push(['Servicio', filtro.servicio==='facturita'?'FACTURITA':'CONTABILITA']);
  if(filtro.grupos.length)     m.push(['Grupos', filtro.grupos.length===1?filtro.grupos[0]:filtro.grupos.length+' grupos']);
  if(filtro.acceso.length)     m.push(['Correo de acceso', filtro.acceso.length===1?filtro.acceso[0]:filtro.acceso.length+' correos']);
  if(filtro.contacto.length)   m.push(['Correo de comunicación', filtro.contacto.length===1?filtro.contacto[0]:filtro.contacto.length+' correos']);
  if(filtro.sel.length)        m.push(['Selección', filtro.sel.length+' cliente(s)']);
  return m;
}
function barraHeredada(){
  const m=marcasFiltro();
  let h='<div class="heredado"><span class="et">Filtros de cartera</span>';

}

/* =========================================================
   COTIZACIONES (29-oct-2026, propuesta de Gabriel)
   Las que se guardan en el Cotizador QUO (la misma colección), con sus estatus: Enviada, En seguimiento, Aprobada y
   Rechazada («Aceptada», el nombre anterior, cuenta como Aprobada). Al aprobarla, «Dar de alta como cliente» crea el
   cliente con lo que trae la cotización (o actualiza el que ya tiene ese RFC) y abre su ficha para revisarlo.
   ========================================================= */
const COT_EST=['Enviada','En seguimiento','Aprobada','Rechazada'];
const COT_COLOR={'Enviada':'var(--azul-claro)','En seguimiento':'var(--t-ambar)','Aprobada':'var(--t-verde)','Rechazada':'var(--t-rojo)'};
let cotFiltro='';
function estCot(c){ const e=c.estatus||'Enviada'; return e==='Aceptada'?'Aprobada':e; }
function chipCot(e){ return '<span class="chip" style="color:'+COT_COLOR[e]+';border-color:currentColor"><span class="dot"></span>'+esc(e)+'</span>'; }
function paqueteCot(c){
  if(c.linea==='TIMBRES') return 'Solo timbres'+(c.timbres?' · '+Number(c.timbres).toLocaleString('es-MX'):'');
  return [c.linea, c.plan?'Plan '+c.plan:'', c.periodo].filter(Boolean).join(' · ');
}
function vistaCotizaciones(){
  const lista=cotizaciones.slice().sort((a,b)=>String(b.fecha||'').localeCompare(String(a.fecha||'')));
  const kp=COT_EST.map(e=>{ const l=lista.filter(c=>estCot(c)===e), tot=l.reduce((t,c)=>t+(Number(c.total)||0),0);
    return '<button class="kpi" data-cotf="'+esc(e)+'" aria-pressed="'+(cotFiltro===e)+'">'+chipCot(e)
      +'<b style="display:block;font-size:22px;margin-top:6px">'+l.length+'</b><span style="font-size:12px;opacity:.75">'+moneyCorto(tot)+'</span></button>'; }).join('');

  const filas=vis.map(c=>{
    const e=estCot(c);
    const sel=ro?chipCot(e):'<select data-cotest="'+esc(c.id)+'" aria-label="Estatus de la cotización '+esc(c.folio||c.id)+'">'
      +COT_EST.map(x=>'<option'+(x===e?' selected':'')+'>'+x+'</option>').join('')+'</select>';

    +'<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;min-width:720px">'
    +'<thead><tr><th style="text-align:left">Folio</th><th style="text-align:left">Fecha</th><th style="text-align:left">Cliente</th><th style="text-align:left">Paquete</th><th style="text-align:right">Total</th><th style="text-align:left">Estatus</th><th style="text-align:left">Asesor</th><th></th></tr></thead>'
    +'<tbody>'+(filas||'<tr><td colspan="8" style="padding:24px;text-align:center;opacity:.7">'+(cotFiltro?'Ninguna cotización '+esc(cotFiltro.toLowerCase())+'.':'Todavía no hay cotizaciones: se guardan desde el Cotizador QUO.')+'</td></tr>')+'</tbody></table></div>';
}
async function altaDesdeCotizacion(id){
  const c=cotizaciones.find(x=>x.id===id); if(!c) return;
  const e=c.estado||{}, timbres=c.linea==='TIMBRES';
  const anual=(e.periodo||c.periodo)!=='mensual';
  const vig=new Date(); if(anual) vig.setFullYear(vig.getFullYear()+1); else vig.setMonth(vig.getMonth()+1);
  const paquete={ linea:timbres?'':(c.linea||''), plan:timbres?'':((typeof e.plan==='number'?e.plan+1:(parseInt(c.plan,10)||1))+'.0'),
    periodicidad:anual?'anual':'mensual' };
  const rfc=String(c.rfc||'').trim().toUpperCase();
  const ya=rfc?clientes.find(x=>String(x.rfc||'').trim().toUpperCase()===rfc):null;
  let id2;
  if(ya && confirm('Ya hay un cliente con el RFC '+rfc+' ('+(ya.nombre||'')+').\n\nAceptar: actualizarlo con el paquete de la cotización '+(c.folio||id)+'.\nCancelar: crear un cliente nuevo.')){
    const ok=await guardarDoc('clientes/'+ya.id, Object.assign({}, paquete, {notas:((ya.notas||'')+'\nPaquete de la cotización '+(c.folio||id)+'.').trim()}), true);
    if(!ok) return; id2=ya.id; Object.assign(ya, paquete);
  }else{
    id2=nuevoId('cl');
    const datos={ nombre:c.cliente||'Cliente nuevo', rfc:rfc, tipo:'externo', contacto:c.atencion||'', tel:'',
      correoContacto:c.correo||'', correoPlataforma:'', linea:paquete.linea, plan:paquete.plan, periodicidad:paquete.periodicidad,
      xmlExtra:'0', usuariosExtra:0, responsable:c.asesor||'', estatus:'activo', notas:'Alta desde la cotización '+(c.folio||id)+'.',
      requiereFactura:'si', vigenciaHasta:vig.toISOString().slice(0,10) };
    const ok=await guardarDoc('clientes/'+id2, datos, false);
    if(!ok) return;
    clientes.push(Object.assign({id:id2},datos));
  }
  await guardarDoc('cotizaciones/'+id, {clienteId:id2, estatus:'Aprobada'}, true);
  avisar('Cliente listo: revisa su ficha.');
  seleccion=id2; modalFicha(id2);
}

/** La columna Factura: sólo el folio. Si hay PDF adjunto, el folio lo abre. */
function chipFolio(p,c){

    return '<span class="chip warn"><span class="dot"></span>Pendiente</span>';

           'title="Abrir el PDF de la factura"><span class="dot"></span>'+esc(p.facturaFolio)+'</button>';
  return '<span class="chip neutral folio" title="Sin PDF adjunto"><span class="dot"></span>'+esc(p.facturaFolio)+'</span>';
}

/* ---------- Dibujar un PDF dentro de la página ---------- */
let pdfLib=null, pdfCargando=null;
/** Carga pdf.js una sola vez; si el worker no arranca, sigue en el hilo principal. */
function cargarPdfJs(){
  if(pdfLib) return Promise.resolve(pdfLib);
  if(pdfCargando) return pdfCargando;
  pdfCargando = import(PDFJS_LIB).then(function(lib){
    try{ lib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER; }catch(e){}
    pdfLib=lib; return lib;
  });
  return pdfCargando;
}
/* ---------- Marco con zoom ---------- */
let zEstado=null;   // {tipo, url, nom, zoom, ajuste, natural, doc, lib}
function marcoVisor(id, nom, esPdf){
  return '<div class="marco" id="marco-visor">'+
    '<div class="lienzo" id="lienzo-visor">'+
      '<div class="pdf-cargando"><div class="giro"></div><div>Abriendo '+(esPdf?'el PDF':'la imagen')+'…</div></div>'+
    '</div>'+
    '<div class="zbarra">'+
      '<button class="zbtn" data-zoom="menos" title="Alejar" aria-label="Alejar">&minus;</button>'+
      '<span class="pct" id="z-pct">—</span>'+
      '<button class="zbtn" data-zoom="mas" title="Acercar" aria-label="Acercar">+</button>'+
      '<button class="zbtn" data-zoom="ajustar" title="Ajustar al ancho">Ajustar</button>'+
      '<button class="zbtn" data-zoom="natural" title="Tamaño real del archivo">1:1</button>'+
      '<span class="meta" id="z-meta"></span>'+
      '<span class="dr"><a class="btn sm" href="/_blob/'+esc(id)+'" target="_blank" rel="noopener">Abrir aparte</a></span>'+
    '</div></div>';
