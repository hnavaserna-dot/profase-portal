<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Portal PROFASE</title>
<link rel="icon" href="img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Public+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --ink:#132036; --muted:#5A6577; --line:#DCE2EB; --line-strong:#C4CDDA;
  --navy:#1F3864; --navy-ink:#FFFFFF; --navy-soft:#E6ECF6; --accent:#F07A1E; --accent-soft:#FDEBDC; --brand-ink:#1F3864;
  --red:#B42318; --red-soft:#FDECEA; --amber-soft:#FFF4D6;
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif;
  --f-body:"Public Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1320; --surface:#141C2B; --ink:#E5EAF2; --muted:#98A3B5; --line:#243049; --line-strong:#33415E;
  --navy:#8FB0E8; --navy-ink:#0D1320; --navy-soft:#1C2A44; --accent:#FF8F3F; --accent-soft:#3A2516; --brand-ink:#D6E1F3;
  --red:#F2867B; --red-soft:#3A1C1A; --amber-soft:#33280F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1320; --surface:#141C2B; --ink:#E5EAF2; --muted:#98A3B5; --line:#243049; --line-strong:#33415E;
  --navy:#8FB0E8; --navy-ink:#0D1320; --navy-soft:#1C2A44; --accent:#FF8F3F; --accent-soft:#3A2516; --brand-ink:#D6E1F3;
  --red:#F2867B; --red-soft:#3A1C1A; --amber-soft:#33280F; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  display:flex;flex-direction:column;min-height:100vh;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 0}
.card{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--navy);border-radius:14px;
  box-shadow:0 14px 44px rgba(19,32,54,.10);padding:26px 26px 22px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.brand img{width:34px;height:auto;display:block}
.wm{font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;font-weight:700;letter-spacing:.16em;color:var(--brand-ink);font-size:19px;line-height:1}
.tag{font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;font-size:11px;font-style:italic;color:var(--muted);margin-top:4px}
h1{font-family:var(--f-display);font-stretch:85%;font-weight:750;font-size:24px;margin:0 0 4px;line-height:1.1}
.sub{color:var(--muted);font-size:13.5px;margin:0 0 16px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line-strong);margin-bottom:16px}
.tabs button{font-family:var(--f-display);font-stretch:85%;font-weight:650;font-size:15px;background:none;border:0;border-bottom:3px solid transparent;
  color:var(--muted);padding:9px 12px 8px;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
form{display:grid;gap:12px}
form[hidden]{display:none}
label{display:grid;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted)}
input{font:inherit;font-size:15px;padding:10px 12px;border-radius:9px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);width:100%}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{font-size:12.5px;color:var(--muted);margin:-4px 0 0}
.go{font:inherit;font-weight:600;font-size:15px;border:0;border-radius:9px;padding:11px 14px;background:var(--navy);color:var(--navy-ink);cursor:pointer;margin-top:4px}
.go:hover{filter:brightness(1.08)}
.go[disabled]{opacity:.6;cursor:default}
.msg{font-size:13.5px;padding:10px 12px;border-radius:8px;background:var(--navy-soft)}
.msg.bad{background:var(--red-soft)}
.msg.warn{background:var(--amber-soft)}
.msg:empty{display:none}
footer{text-align:center;color:var(--muted);font-size:12px}
.acc{color:var(--accent);font-weight:600}
</style>
</head>
<body>
<main>
  <section class="card" aria-labelledby="t">
    <div class="brand"><img src="img/logo.png" alt="" width="34" height="38"><div><div class="wm">PROFASE</div><div class="tag">Asesoría Contable, Legal y Fiscal</div></div></div>
    <h1 id="t">Portal del equipo</h1>
    <p class="sub">WorkFlow y reportes de DECOMSA.</p>
    <div class="tabs" role="tablist" aria-label="Acceso">
      <button type="button" role="tab" id="tab-in" aria-selected="true" aria-controls="f-in">Entrar</button>
      <button type="button" role="tab" id="tab-alta" aria-selected="false" aria-controls="f-alta">Crear mi contraseña</button>
    </div>

    <form id="f-in" role="tabpanel" aria-labelledby="tab-in" novalidate>
      <label>Usuario<input id="in-u" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="nombre.apellido" required></label>
      <label>Contraseña<input id="in-p" type="password" autocomplete="current-password" required></label>
      <div class="msg" id="in-msg" role="status"></div>
      <button class="go" type="submit" id="in-go">Entrar</button>
    </form>

    <form id="f-alta" role="tabpanel" aria-labelledby="tab-alta" hidden novalidate>
      <p class="hint">Solo la primera vez: con el código que te dio Daniel creas tu contraseña. El código sirve una sola vez; después entras siempre en «Entrar».</p>
      <label>Usuario<input id="al-u" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="nombre.apellido" required></label>
      <label>Código<input id="al-c" autocapitalize="characters" autocomplete="one-time-code" spellcheck="false" placeholder="XXXX-XXXX-XXXX" required></label>
      <label>Contraseña nueva<input id="al-p1" type="password" autocomplete="new-password" minlength="8" required></label>
      <label>Repite la contraseña<input id="al-p2" type="password" autocomplete="new-password" minlength="8" required></label>
      <p class="hint">Mínimo 8 caracteres.</p>
      <div class="msg" id="al-msg" role="status"></div>
      <button class="go" type="submit" id="al-go">Crear mi acceso</button>
    </form>
  </section>
</main>
<footer>PROFASE · <span class="acc">San Pedro Garza García</span></footer>

<script src="js/supabase.js"></script>
<script src="js/portal.js"></script>
<script>
(function(){
  var P=window.PORTAL,sb=P.sb,$=function(id){return document.getElementById(id)};
  function tab(cual){
    var alta=cual==='alta';
    $('tab-in').setAttribute('aria-selected',String(!alta));$('tab-alta').setAttribute('aria-selected',String(alta));
    $('f-in').hidden=alta;$('f-alta').hidden=!alta;
    (alta?$('al-u'):$('in-u')).focus();
  }
  $('tab-in').onclick=function(){tab('in')};
  $('tab-alta').onclick=function(){tab('alta')};
  function aviso(id,txt,tipo){var m=$(id);m.className='msg'+(tipo?' '+tipo:'');m.textContent=txt||''}
  async function entrar(uid){
    var p=null;try{p=await P.perfilDe(uid)}catch(e){p=null}
    if(!p){await sb.auth.signOut();return false}
    location.replace(P.paginaDe(p.rol));return true;
  }
  if(/[?&]e=perfil/.test(location.search))aviso('in-msg','Tu usuario no tiene un perfil asignado. Avísale a Daniel.','warn');
  sb.auth.getSession().then(function(r){var s=r.data.session;if(s)entrar(s.user.id)});

  $('f-in').addEventListener('submit',async function(e){
    e.preventDefault();
    var u=P.usuarioLimpio($('in-u').value),pw=$('in-p').value;
    if(!u||!pw){aviso('in-msg','Escribe tu usuario y tu contraseña.','warn');return}
    var b=$('in-go');b.disabled=true;b.textContent='Entrando…';aviso('in-msg','');
    var r=await sb.auth.signInWithPassword({email:P.correoDe(u),password:pw});
    if(r.error||!r.data.session){
      b.disabled=false;b.textContent='Entrar';
      var m=r.error&&r.error.message||'';
      aviso('in-msg',/invalid login|credentials/i.test(m)?'Usuario o contraseña incorrectos. Si todavía no tienes contraseña, créala en «Crear mi contraseña».':/fetch|network/i.test(m)?'Sin conexión. Revisa tu internet y vuelve a intentar.':'No se pudo entrar. Vuelve a intentar en un momento.','bad');
      return;
    }
    if(!(await entrar(r.data.session.user.id))){b.disabled=false;b.textContent='Entrar';aviso('in-msg','Tu usuario no tiene un perfil asignado. Avísale a Daniel.','warn')}
  });

  $('f-alta').addEventListener('submit',async function(e){
    e.preventDefault();
    var u=P.usuarioLimpio($('al-u').value);
    var c=$('al-c').value.toUpperCase().replace(/[^A-Z0-9]/g,'');
    if(c.length===12)c=c.slice(0,4)+'-'+c.slice(4,8)+'-'+c.slice(8);
    var p1=$('al-p1').value,p2=$('al-p2').value;
    if(!u||!c){aviso('al-msg','Escribe tu usuario y el código que te dio Daniel.','warn');return}
    if(p1.length<8){aviso('al-msg','La contraseña debe tener al menos 8 caracteres.','warn');return}
    if(p1!==p2){aviso('al-msg','Las dos contraseñas no coinciden.','warn');return}
    var b=$('al-go');b.disabled=true;b.textContent='Creando…';aviso('al-msg','');
    var r=await sb.auth.signUp({email:P.correoDe(u),password:p1,options:{data:{usuario:u,codigo:c}}});
    if(r.error||!r.data.session){
      b.disabled=false;b.textContent='Crear mi acceso';
      var m=r.error&&r.error.message||'';
      aviso('al-msg',/already|registered|exists/i.test(m)?'Ese usuario ya tiene acceso. Entra con tu contraseña en «Entrar».'
        :/password/i.test(m)?'Esa contraseña no se acepta. Usa una más larga o distinta.'
        :/fetch|network/i.test(m)?'Sin conexión. Revisa tu internet y vuelve a intentar.'
        :'El usuario o el código no son válidos, o el código ya se usó. Revísalos con Daniel.','bad');
      return;
    }
    if(!(await entrar(r.data.session.user.id))){b.disabled=false;b.textContent='Crear mi acceso';aviso('al-msg','Se creó tu acceso pero no encontré tu perfil. Avísale a Daniel.','warn')}
  });
})();
</script>
</body>
</html>
