# Revisar lo publicado (Héctor Daniel, 4-nov-2026, 13:12: «Si, para lo nuevo y lo anterior porfa»).
# Con cada publicación, una vez al día y a mano: espera a que crmprofase.com.mx traiga la versión de este repositorio,
# revisa que cada archivo publicado sea idéntico y abre cada página en un navegador (iPhone y laptop) para ver que no
# truene. Sin llaves ni contraseñas: solo lo que cualquiera ve sin sesión. Explicación en .github/revisa_publicado.py.
name: Revisar lo publicado

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 12 * * *"   # 06:17 de Monterrey: todo lo publicado, también lo de antes
  workflow_dispatch:

concurrency:
  group: revisa-publicado
  cancel-in-progress: true   # si se publica otra vez, se revisa solo lo más nuevo

permissions:
  contents: read

jobs:
  revisa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Navegador de la revisión
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Revisar lo publicado
        run: python .github/revisa_publicado.py
