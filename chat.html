<!doctype html><html lang="es" data-rol="todos" data-incrustada="1"><head><meta charset="utf-8"><script>/* Cierre temporal del portal (30-oct-2026, pedido de Daniel cuando la base se trabó: «cierra temporalmente crm»;
   «Saca a todos del CRM con ese aviso y cuando quede ya les avisamos»).
   construir.py lo pone escrito al principio del <head> de cada página que arma (y va a mano en index.html), antes de
   cualquier otro script. Lee cierre.json, que vive en la raíz de profase-portal (no pasa por la base), y si dice
   "cerrado": true detiene la página y lleva a cerrado.html, que avisa y regresa sola al portal en cuanto cierre.json
   diga false. Si la página va en un marco, se lleva a la de arriba. Guarda a dónde iba cada quien para regresarlo ahí.
   Solo en crmprofase.com.mx: en las pruebas locales no hace nada (salvo con window.__PRUEBA_CIERRE).
   Si cierre.json no llega, la página sigue normal. No lee ni escribe nada de la base. */
(function () {
  'use strict';
  if (!/(^|\.)crmprofase\.com\.mx$/.test(location.hostname) && !window.__PRUEBA_CIERRE) return;
  if (/\/cerrado\.html$/.test(location.pathname)) return;
  var j = null;
  try {
    var x = new XMLHttpRequest();
    x.open('GET', '/cierre.json?t=' + Date.now(), false);
    x.send(null);
    if (x.status === 200) j = JSON.parse(x.responseText);
  } catch (e) { j = null; }
  if (!j || j.cerrado !== true) return;
  var w = window;
  try { if (window.top && window.top.location.host === location.host) w = window.top; } catch (e) { w = window; }
  try {
    var r = w.location.pathname + w.location.search + w.location.hash;
    if (!/cerrado\.html/.test(r)) sessionStorage.setItem('profase-regreso', r);
  } catch (e) { /* sin almacenamiento: regresa a la entrada */ }
  try { window.stop(); } catch (e) { /* navegador viejo */ }
  try { w.location.replace('/cerrado.html'); } catch (e) { location.replace('/cerrado.html'); }
})();</script><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Portal PROFASE · Chat</title>

   - Su papá (hnava, de solo consulta) chatea normal: el chat no esconde nada por «solo consulta».

   - Cualquiera crea grupos; los administradores de cada grupo agregan o sacan personas.

.m-borr{font-style:italic;color:var(--muted);display:flex;gap:6px;align-items:center}
.m.yo .m-borr{color:var(--mio-sub)}
.m-reenv{display:flex;align-items:center;gap:4px;font-size:12px;font-style:italic;color:var(--muted);margin:0 0 3px}
.m-reenv .ic{width:14px;height:14px;flex:none}
.m.yo .m-reenv{color:var(--mio-sub)}
.m.stk .m-reenv{background:var(--surface);color:var(--muted);border-radius:999px;padding:2px 8px;width:max-content}
.m.yo.stk .m-reenv{margin-left:auto}
.rv-prev{display:block;border-left:3px solid var(--accent);background:var(--surface-2);border-radius:8px;padding:7px 10px;margin:2px 0 12px;font-size:13.5px;min-width:0}
.rv-prev b{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);margin-bottom:2px}
.rv-prev b .ic{width:14px;height:14px}
.rv-prev span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rv-l h4{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:10px 0 2px}
.rv-l h4:first-child{margin-top:0}
.bt .ic{width:16px;height:16px}
.m-meta{display:flex;justify-content:flex-end;align-items:center;gap:4px;font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap}
.m.yo .m-meta{color:var(--mio-sub)}
.tk{width:16px;height:12px;display:inline-block;flex:none}
.tk.leido{color:var(--leido)}
.m-cita{display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--accent);background:rgba(127,140,160,.14);border-radius:6px;padding:5px 8px;margin:2px 0 5px;color:inherit;font-size:13px}
.m-cita b{display:block;font-size:12px}
.m-cita span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
.m-op{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.18);display:grid;place-items:center;opacity:0;transition:opacity .12s;padding:0}
.m-op .ic{width:16px;height:16px}
.m:hover .m-op,.m-op:focus-visible,.m-op[aria-expanded="true"]{opacity:1}
@media (hover:none){.m-op{display:none}}
.m-reac{display:flex;flex-wrap:wrap;gap:4px;margin-top:-4px;position:relative;z-index:1}
.m.yo .m-reac{justify-content:flex-end}
.m-col{display:flex;flex-direction:column;min-width:0;max-width:min(620px,78%)}
.m.yo .m-col{align-items:flex-end}
.rc{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:1px 7px;font-size:13px;display:inline-flex;gap:4px;align-items:center;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.rc.mia{border-color:var(--accent);background:var(--accent-soft)}
.rc small{font-size:11.5px;font-weight:700}
.temp .m-meta .ic{width:12px;height:12px}
.temp.falla .bur{box-shadow:0 0 0 2px var(--red)}
.falla-tx{font-size:12px;color:var(--red);margin-top:3px;display:flex;gap:8px;align-items:center;justify-content:flex-end}
.falla-tx button{border:0;background:none;color:var(--red);font-weight:700;text-decoration:underline;padding:0;font-size:12px}

/* archivos dentro del mensaje */
.ads{display:flex;flex-direction:column;gap:5px;margin:2px 0 4px}
.ad-imgs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
.ad-imgs.uno{grid-template-columns:1fr}
.ad-img{border:0;padding:0;background:var(--surface-3);border-radius:8px;overflow:hidden;display:block;width:100%;max-width:340px;cursor:zoom-in}
.ad-img img{display:block;width:100%;height:auto;max-height:340px;object-fit:cover;background:var(--surface-3)}
.ad-f{display:flex;align-items:center;gap:10px;background:rgba(127,140,160,.13);border-radius:10px;padding:8px 10px;min-width:0}
.ad-f .tipo{flex:none;width:38px;height:38px;border-radius:8px;display:grid;place-items:center;font-size:10.5px;font-weight:800;letter-spacing:.02em;color:#fff;background:#5A6577}
.ad-f .tipo.pdf{background:#C4321A}.ad-f .tipo.xls{background:#1D6F42}.ad-f .tipo.doc{background:#2B5797}.ad-f .tipo.xml{background:#7A4CC2}.ad-f .tipo.zip{background:#8A6D1F}.ad-f .tipo.img{background:#0E7C86}
.ad-f .tx{flex:1;min-width:0}
.ad-f .tx b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ad-f .tx small{font-size:12px;opacity:.8;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ad-f .acc{display:flex;gap:4px;flex:none}
.ad-f .acc button{border:1px solid currentColor;background:none;color:inherit;border-radius:8px;padding:3px 8px;font-size:12px;font-weight:600;opacity:.9}
.ad-f .acc button:hover{opacity:1}
.ad-med{max-width:100%;border-radius:8px;display:block}
audio.ad-med{width:280px;max-width:100%}

.abajo{position:absolute;right:16px;bottom:84px;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);box-shadow:0 4px 14px rgba(0,0,0,.18);display:grid;place-items:center;z-index:5;padding:0}
.abajo i{position:absolute;top:-6px;right:-4px;min-width:19px;height:19px;border-radius:10px;background:var(--accent);color:#fff;font-size:11px;font-style:normal;font-weight:700;line-height:19px;padding:0 5px}

/* lo de abajo: donde se escribe */
.barra-x{flex:none;display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--line);background:var(--surface-2)}
.barra-x .tx{flex:1;min-width:0;border-left:3px solid var(--accent);padding-left:9px;font-size:13px}
.barra-x .tx b{display:block;font-size:12.5px;color:var(--accent-ink)}
.barra-x .tx span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.pend{flex:none;display:flex;gap:8px;overflow-x:auto;padding:8px 12px;border-top:1px solid var(--line);background:var(--surface-2)}
.pd{flex:none;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 6px 6px 8px;max-width:240px}
.pd img{width:36px;height:36px;border-radius:6px;object-fit:cover;flex:none}
.pd .tx{min-width:0}
.pd .tx b{display:block;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.pd .tx small{font-size:11.5px;color:var(--muted)}
.pd .tx small.err{color:var(--red)}
.pd button{width:26px;height:26px;border-radius:50%;border:0;background:var(--surface-2);color:var(--muted);display:grid;place-items:center;flex:none;padding:0}
.gira{width:14px;height:14px;border-radius:50%;border:2px solid var(--line-strong);border-top-color:var(--accent);display:inline-block;animation:gira .8s linear infinite;vertical-align:-2px}
@keyframes gira{to{transform:rotate(360deg)}}
.caja{flex:none;border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:8px;align-items:flex-end;background:var(--surface)}
.caja textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line-strong);border-radius:20px;padding:10px 14px;font-size:15px;line-height:1.35;background:var(--surface-2);color:var(--ink);min-height:44px;max-height:150px;display:block}
.caja textarea::placeholder{color:var(--muted)}
.caja .bi{width:44px;height:44px;border-radius:50%}
.caja .manda[hidden]{display:none}
.caja .graba{display:none;flex:1;align-items:center;gap:10px;min-height:44px;font-size:15px}
.caja.grabando > :not(.graba){display:none!important}.caja.grabando .graba{display:flex}
.graba .gr-p{width:12px;height:12px;border-radius:50%;background:#D92D20;animation:gr-lat 1.2s infinite;flex:none}
.graba > span:not(.gr-p){flex:1}.graba b{font-variant-numeric:tabular-nums}
@keyframes gr-lat{0%,100%{opacity:1}50%{opacity:.3}}
.emo{flex:none;border-top:1px solid var(--line);background:var(--surface);max-height:min(320px,45vh);display:flex;flex-direction:column}
.emo[hidden]{display:none}
.emo-tabs{display:flex;align-items:center;gap:4px;padding:6px 8px 0;border-bottom:1px solid var(--line)}
.emo-tabs [role=tab]{border:0;background:none;color:var(--muted);font-weight:700;font-size:13.5px;padding:8px 12px;border-bottom:3px solid transparent}
.emo-tabs [role=tab][aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.emo-tabs .bi{margin-left:auto;width:34px;height:34px}
.emo-cu{flex:1;min-height:0;overflow-y:auto;padding:6px 8px 10px;overscroll-behavior:contain}
.emo h4{margin:8px 4px 4px;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.emo-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr))}
.emo-g button{border:0;background:none;font-size:24px;line-height:1;height:42px;border-radius:8px;padding:0;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.emo-g button:hover{background:var(--surface-2)}
.stk-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.stk-g button{border:0;background:none;padding:2px;border-radius:12px}.stk-g button:hover{background:var(--surface-2)}
.stk-g .stk-s{width:100%;height:auto;display:block}
.m.stk .bur{background:none!important;box-shadow:none!important;padding:0!important}
.m.stk .stk-s{width:132px;height:132px;display:block;filter:drop-shadow(0 2px 6px rgba(0,0,0,.18))}
.m.stk .m-meta{background:rgba(0,0,0,.35);color:#fff!important;border-radius:8px;padding:1px 6px;width:max-content;margin:4px 0 0 auto}
.m.stk .m-meta *{color:#fff!important}
.voz{display:flex;align-items:center;gap:8px;min-width:min(260px,62vw)}
.voz .vz-ic{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.voz .vz-ic svg{width:18px;height:18px}.voz audio{flex:1;min-width:0;height:40px}
@media (prefers-reduced-motion: reduce){.graba .gr-p{animation:none}}
.manda{width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none;padding:0}
.manda[disabled]{opacity:.5;cursor:default}
.suelta{position:absolute;inset:0;z-index:20;background:rgba(31,56,100,.82);color:#fff;display:grid;place-items:center;text-align:center;font-size:18px;font-weight:700;border:3px dashed #F07A1E;border-radius:14px;pointer-events:none}
.suelta .ic{width:48px;height:48px;margin:0 auto 8px}

/* ---- datos del chat (a la derecha o encima) ---- */
.info{width:350px;flex:none}
.inf-cab{flex:none;display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.inf-cab b{flex:1;font-size:15px}
.inf-cu{flex:1;min-height:0;overflow-y:auto;padding:16px}
.inf-yo{text-align:center;margin-bottom:14px}
.inf-yo .av{margin:0 auto 10px}
.inf-yo h2{font-size:21px;font-weight:800;overflow-wrap:anywhere}
.inf-yo p{margin:4px 0 0;color:var(--muted);font-size:13px}
.sec{border-top:1px solid var(--line);padding:12px 0}
.sec h3{font-family:var(--f-body);font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.sec h3 span{flex:1}
.fila{display:flex;align-items:center;gap:10px;padding:7px 0;min-width:0}
.fila .tx{flex:1;min-width:0}
.fila .tx b{display:block;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fila .tx small{color:var(--muted);font-size:12px}
.etq{flex:none;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--accent-soft);color:var(--accent-ink)}
.sw{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 0;color:inherit;text-align:left}
.sw span{flex:1}
.sw i{width:40px;height:22px;border-radius:11px;background:var(--line-strong);position:relative;flex:none;transition:background .15s}
.sw i::after{content:"";position:absolute;left:2px;top:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw[aria-checked="true"] i{background:var(--accent)}
.sw[aria-checked="true"] i::after{left:20px}
.lnk{border:0;background:none;color:var(--navy-2);font-weight:600;padding:4px 0;font-size:13.5px}
:root[data-theme="dark"] .lnk{color:#9CC0F2}
.lnk.rojo{color:var(--red)}
.mini{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:8px;padding:3px 8px;font-size:12px;font-weight:600;flex:none}
.campo{display:block;margin:0 0 12px}
.campo span{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:4px}
.campo input,.campo textarea{width:100%;border:1px solid var(--line-strong);border-radius:10px;padding:9px 11px;background:var(--surface-2);color:var(--ink);font-size:14.5px}
.campo textarea{resize:vertical;min-height:64px}
.nota{font-size:12.5px;color:var(--muted);margin:6px 0 0}

/* ---- ventanas ---- */
.velo{position:fixed;inset:0;background:rgba(10,18,34,.45);z-index:40;display:grid;place-items:center;padding:16px}
.dlg{background:var(--surface);color:var(--ink);border-radius:14px;width:min(460px,100%);max-height:min(680px,calc(100dvh - 32px));display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.3);overflow:hidden}
.dlg-cab{flex:none;display:flex;align-items:center;gap:8px;padding:14px 14px 10px 18px;border-top:4px solid var(--accent)}
.dlg-cab h2{flex:1;font-size:19px;font-weight:800}
.dlg-cu{flex:1;min-height:0;overflow-y:auto;padding:4px 18px 12px}
.dlg-pie{flex:none;display:flex;gap:8px;justify-content:flex-end;padding:12px 18px 16px;border-top:1px solid var(--line)}
.dlg .busca{padding:0 0 10px}
.dlg .busca .ic{left:11px}
.pers{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:inherit;text-align:left;padding:8px 6px;border-radius:10px}
.pers:hover{background:var(--surface-2)}
.pers .tx{flex:1;min-width:0}
.pers .tx b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pers .tx small{color:var(--muted);font-size:12px}
.pers .ck{width:22px;height:22px;border-radius:6px;border:2px solid var(--line-strong);flex:none;display:grid;place-items:center;color:#fff}
.pers[aria-checked="true"] .ck{background:var(--accent);border-color:var(--accent)}
.pers .ck .ic{width:14px;height:14px;opacity:0}
.pers[aria-checked="true"] .ck .ic{opacity:1}
.sel-chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.sel-chips span{background:var(--navy-soft);border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600}
.leyo h4{margin:12px 0 4px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}

/* menú del mensaje */
.menu{position:fixed;z-index:45;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 34px rgba(10,20,40,.25);min-width:220px;max-width:calc(100vw - 16px);overflow:hidden}
.menu .emos{display:flex;gap:2px;padding:6px 6px;border-bottom:1px solid var(--line)}
.menu .emos button{border:0;background:none;font-size:22px;width:36px;height:38px;border-radius:8px;padding:0;line-height:1}
.menu .emos button:hover,.menu .emos button[aria-pressed="true"]{background:var(--accent-soft)}
.menu .op{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:inherit;text-align:left;padding:10px 14px;font-size:14px}
.menu .op:hover{background:var(--surface-2)}
.menu .op.rojo{color:var(--red)}
.menu .op .ic{width:18px;height:18px;color:var(--muted)}
.menu .op.rojo .ic{color:var(--red)}
.menu .op-nota{display:flex;gap:8px;align-items:flex-start;width:0;min-width:100%;box-sizing:border-box;padding:9px 14px 11px;border-top:1px solid var(--line);font-size:12.5px;line-height:1.35;color:var(--muted)}
.menu .op-nota .ic{width:15px;height:15px;flex:none;margin-top:1px}
.velo-menu{position:fixed;inset:0;z-index:44;background:transparent}

/* imagen en grande */
/* vista previa de Excel, XML y texto */
.vx{position:fixed;inset:0;z-index:50;background:rgba(5,10,20,.6);display:flex;align-items:center;justify-content:center;padding:2vh 2vw}
.vx-p{background:var(--surface);color:var(--ink);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.35);width:min(1200px,100%);height:min(92vh,100%);display:flex;flex-direction:column;overflow:hidden}
.vx-cab{flex:none;display:flex;align-items:center;gap:10px;padding:10px 10px 10px 14px;border-bottom:1px solid var(--line)}
.vx-cab b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14.5px}
.vx-cab .tipo{flex:none;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-size:10px;font-weight:800;color:#fff;background:#5A6577}
.vx-cab .tipo.xls{background:#1D6F42}.vx-cab .tipo.xml{background:#7A4CC2}
.vx-cab .bt{height:34px}
.vx-tabs{flex:none;display:flex;gap:4px;padding:8px 10px 0;overflow-x:auto;scrollbar-width:thin;border-bottom:1px solid var(--line);background:var(--surface-2)}
.vx-tabs button{flex:none;border:1px solid transparent;border-bottom:0;background:none;color:var(--muted);padding:7px 12px;border-radius:8px 8px 0 0;font-weight:600;font-size:13px;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.vx-tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);border-color:var(--line);box-shadow:inset 0 3px 0 #1D6F42}
.vx-cu{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.vx-t{border-collapse:separate;border-spacing:0;font-size:12.5px;font-variant-numeric:tabular-nums}
.vx-t th,.vx-t td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 8px;white-space:nowrap;max-width:360px;overflow:hidden;text-overflow:ellipsis;text-align:left;vertical-align:top}
.vx-t td.n{text-align:right}.vx-t td.e{color:var(--red)}
.vx-t thead th{position:sticky;top:0;z-index:2;background:var(--surface-3);color:var(--muted);font-weight:600;text-align:center;font-size:11.5px}
.vx-t tbody th{position:sticky;left:0;z-index:1;background:var(--surface-2);color:var(--muted);font-weight:600;text-align:right;font-size:11.5px;min-width:36px}
.vx-t thead th.vx-esq{left:0;z-index:3}
.vx-hoja{position:relative;display:inline-block;vertical-align:top}
.vx-fmt{table-layout:fixed;font:14.7px/1.2 Calibri,Carlito,'Segoe UI',Arial,sans-serif}
.vx-fmt th{font-family:var(--f-body,inherit);overflow:hidden;text-overflow:clip;padding:2px 4px;line-height:1.2}
.vx-fmt td{background:#fff;color:#000;padding:0 3px;max-width:none;border:0;white-space:nowrap;overflow:hidden;text-overflow:clip;vertical-align:bottom}
.vx-fmt td.sale{overflow:visible}
.vx-fmt .vx-sl{overflow:hidden;white-space:nowrap}
.vx-fmt .vx-aj{overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere}
.vx-fmt .vx-oc{padding:0;font-size:0;border:0;box-shadow:none}
.vx-img{position:absolute;z-index:0;pointer-events:none;max-width:none;user-select:none}
.vx-vacio,.vx-nota{color:var(--muted);font-size:12.5px;margin:10px 14px}
.vx-pre{margin:0;padding:12px 14px;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;color:var(--ink)}
.vx-pre .xt{color:#2B5797}.vx-pre .xa{color:#A64B0A}.vx-pre .xv{color:#1D7A4F}.vx-pre .xc{color:var(--muted)}
:root[data-theme="dark"] .vx-pre .xt{color:#9CC0F2}:root[data-theme="dark"] .vx-pre .xa{color:#FFB27A}:root[data-theme="dark"] .vx-pre .xv{color:#7FD4A6}
.vx-xml{border-top:1px solid var(--line);margin-top:6px}
.vx-xml summary{cursor:pointer;padding:10px 14px;font-weight:600;color:var(--navy-2)}
:root[data-theme="dark"] .vx-xml summary{color:#9CC0F2}
.cfdi{padding:14px;display:flex;flex-direction:column;gap:12px;font-size:13px}
.cf-cab{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;padding:12px 14px;border-radius:12px;background:var(--navy);color:var(--navy-ink)}
.cf-cab small{display:block;opacity:.8;font-size:12px}.cf-cab b{display:block;font-size:17px;margin:2px 0}
.cf-tot{text-align:right}.cf-tot b{font-size:20px;color:#FFB27A}
.cf-uuid{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.cf-uuid span{color:var(--muted);font-size:12px;font-weight:600}.cf-uuid b{flex:1;min-width:0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;word-break:break-all}
.cf-uuid.sin{border-color:var(--red);background:var(--red-soft)}
.cf-uuid button{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:8px;padding:4px 10px;font-weight:600;font-size:12px}
.cf-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cf-2 section,.cf-s{border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.cfdi h4{margin:0 0 6px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink)}
.cf-f{display:flex;gap:10px;justify-content:space-between;padding:3px 0;border-bottom:1px dashed var(--line);min-width:0}
.cf-f:last-child{border-bottom:0}
.cf-f span{color:var(--muted);flex:none}.cf-f b{font-weight:600;text-align:right;min-width:0;overflow-wrap:anywhere}
.cf-g{display:grid;grid-template-columns:1fr 1fr;column-gap:18px}
.cf-tots{max-width:420px;margin-left:auto;width:100%}
.cf-gran{border-top:2px solid var(--ink);margin-top:4px;padding-top:6px;font-size:15px}
.cf-p{margin:2px 0 4px;color:var(--muted)}
.cf-mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;word-break:break-all}
.cf-tw{overflow-x:auto;margin-top:4px}
.cf-t{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
.cf-t th,.cf-t td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;white-space:nowrap}
.cf-t th{color:var(--muted);font-weight:600;font-size:11.5px;background:var(--surface-2)}
.cf-t .n{text-align:right}.cf-t td.d{white-space:normal;min-width:220px}
@media (max-width:759px){
  .vx{padding:0}
  .vx-p{width:100%;height:100%;border-radius:0}
  .cf-2,.cf-g{grid-template-columns:1fr}
  .vx-t th,.vx-t td{max-width:240px}
  .cf-tots{max-width:none}
}
.lb{position:fixed;inset:0;z-index:50;background:rgba(5,10,20,.92);display:flex;flex-direction:column}
.lb-cab{flex:none;display:flex;align-items:center;gap:10px;padding:10px 14px;color:#fff}
.lb-cab b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-cab button{border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.1);color:#fff;border-radius:8px;padding:6px 12px;font-weight:600}
.lb-cu{flex:1;min-height:0;display:grid;place-items:center;padding:10px}
.lb-cu img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}

.aviso{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:60;max-width:min(420px,calc(100vw - 24px));background:#1F3864;color:#fff;border-left:5px solid #F07A1E;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:10px 14px;font-size:14px}
.aviso.mal{border-left-color:#F2867B}
.sin{flex:1;display:grid;place-items:center;text-align:center;padding:30px;color:var(--muted)}

/* ---- pantallas ---- */
@media (min-width:1280px){ .info{position:static} }
@media (max-width:1279px){
  .info{position:fixed;top:0;right:0;bottom:0;width:min(380px,100%);z-index:30;border-radius:0;border-top:0;border-bottom:0;border-right:0;box-shadow:-10px 0 30px rgba(0,0,0,.2)}
}
@media (max-width:1023px){ .lado{width:300px} }
@media (max-width:759px){
  .app{padding:0;gap:0}
  .panel{border:0;border-radius:0}
  .lado{width:100%}
  body.en-conv .lado{display:none}
  body:not(.en-conv) .conv{display:none}
  .cv-cab .atras{display:grid}
  .m-col{max-width:86%}
  .m .avs{width:28px}.m .avs .av{width:28px;height:28px;font-size:11px}
  .caja{padding:8px}
  .caja textarea,.busca input,.bus-msg input,.campo input,.campo textarea{font-size:16px}
  .abajo{bottom:76px;right:12px}
  .lado-cab h1{font-size:22px}
  .lado-cab .bt span{display:none}
  .dlg{width:100%;max-height:calc(100dvh - 24px)}
  .velo{padding:12px;align-items:end}
  .suelta{border-radius:0}
}
@media (prefers-reduced-motion: reduce){.gira{animation:none}.m-op,.sw i,.sw i::after{transition:none}}

    }
    if ((x = ev.target.closest('[data-img]'))) { verImagen(x.dataset.img); return; }
    if ((x = ev.target.closest('[data-dver]'))) { VISOR.ver(docDe(x), x); return; }
    if ((x = ev.target.closest('[data-xver]'))) { verArchivo(x.dataset.xver, x); return; }
    if ((x = ev.target.closest('[data-dbaja]'))) { VISOR.baja(docDe(x), x); return; }
    if (ev.target.closest('[data-agrega]')) {
      escogePersonas('Agregar al grupo', (ACT.info.miembros || []).map(function (m) { return m.usuario; }), false, 'Agregar', async function (us) {
        await rpc('chat_agrega', { p_conv: ACT.id, p_usuarios: us }); await recargaInfo();
      });
      return;
    }
    if ((x = ev.target.closest('[data-saca]'))) {
      if (!(await confirma('¿Sacar a ' + nombre(x.dataset.saca) + '?', 'Ya no verá este grupo ni sus mensajes.', 'Sacar'))) return;
      try { await rpc('chat_quita', { p_conv: ACT.id, p_usuario: x.dataset.saca }); await recargaInfo(); } catch (e) { aviso(err(e), true); }
      return;
    }
    if ((x = ev.target.closest('[data-admin]'))) {
      try { await rpc('chat_admin', { p_conv: ACT.id, p_usuario: x.dataset.admin, p_si: x.dataset.si === '1' }); await recargaInfo(); } catch (e) { aviso(err(e), true); }
      return;
    }
    if (ev.target.closest('[data-sale]')) {
      if (!(await confirma('¿Salir del grupo «' + ACT.info.nombre + '»?', 'Dejarás de ver sus mensajes. Para volver, un administrador te tiene que agregar.', 'Salir'))) return;
      try { await rpc('chat_quita', { p_conv: ACT.id, p_usuario: YO.usuario }); cierraConv(); await cargaLista(); } catch (e) { aviso(err(e), true); }
      return;
    }
    if (ev.target.closest('[data-edita]')) {
      var v = ventana('Datos del grupo', '<label class="campo"><span>Nombre</span><input data-n maxlength="60" value="' + esc(ACT.info.nombre) + '"></label><label class="campo"><span>Descripción</span><textarea data-d maxlength="300">' + esc(ACT.info.descripcion || '') + '</textarea></label>',
        '<button type="button" class="bt" data-x>Cancelar</button><button type="button" class="bt pri" data-ok>Guardar</button>');
      v.el.querySelector('[data-ok]').onclick = async function () {
        try { await rpc('chat_grupo_edita', { p_conv: ACT.id, p_nombre: v.el.querySelector('[data-n]').value, p_descripcion: v.el.querySelector('[data-d]').value }); v.cierra(); await recargaInfo(); await cargaLista(); }
        catch (e) { aviso(err(e), true); }
      };
    }
  });
  async function recargaInfo() {
    if (!ACT) return;
    try {
      var inf = await rpc('chat_conv_info', { p_conv: ACT.id });
      if (!inf) { aviso('Ya no estás en esa conversación.', true); cierraConv(); cargaLista(); return; }
      ACT.info = inf; (inf.miembros || []).forEach(function (m) { ACT.lect[m.usuario] = Math.max(ACT.lect[m.usuario] || 0, m.leido_id || 0); });
      pintaCab(); pintaInfo(); sincroniza();
    } catch (e) { aviso(err(e), true); }
  }

  // ---------------------------------------------------------------- avisos al celular y a la computadora (aunque el portal esté cerrado)
  function PUSH() { var a = arriba(); try { return a && a.__chatPush ? a.__chatPush : null; } catch (e) { return null; } }
  var IC_CAMP = '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>';
  var PASOS_IPHONE = '<ol class="pasos"><li>Abre <b>crmprofase.com.mx</b> en Safari.</li><li>Pica <b>Compartir</b> (el cuadrito con la flecha; si no lo ves, está en <b>⋯</b>) y luego <b>Agregar a inicio</b>.</li><li>Abre el portal desde ese ícono, entra con tu usuario y activa aquí los avisos.</li></ol>';
  // pide el permiso aquí mismo, en el toque (Safari y Chrome lo piden así), y luego activa en la página del portal
  async function activaPush() {
    var pu = PUSH(); if (!pu) throw new Error('Los avisos no están listos; recarga el portal.');
    if ('Notification' in window && Notification.permission === 'default') {
      var per = await Notification.requestPermission();
      if (per !== 'granted') throw new Error(per === 'denied' ? 'El navegador tiene bloqueados los avisos de este sitio; se activan en sus ajustes.' : 'No se dio permiso para los avisos.');
    }
    await pu.activar();
  }
  window.__chatRevisaInv = function () { return revisaInv(); };
  async function revisaInv() {
    var el = $('#push-inv'), pu = PUSH();
    if (!el || !pu) return;
    var st = 'no-soportado';
    try { st = await pu.estado(); } catch (e) { /* sin avisos */ }
    if (guarda.get('profase-chat-push-inv') === '0' || (st !== 'no' && st !== 'iphone-sin-app')) { el.hidden = true; return; }
    if (st === 'no') pu.prepara();
    el.innerHTML = IC_CAMP + '<div><b class="t">Recibe los mensajes aunque el portal esté cerrado</b>'
      + (st === 'no' ? 'Te avisa en este ' + (/iPhone|iPad|Android/.test(navigator.userAgent) ? 'celular' : 'equipo') + ' quién te escribió y lo que dice el mensaje, como WhatsApp.<br><button type="button" class="bt pri" data-act>Activar avisos</button>'
        : 'En iPhone, los avisos llegan con el portal en tu pantalla de inicio:' + PASOS_IPHONE)
      + '</div><button type="button" class="bi" data-x aria-label="Ya no enseñar">' + IC.tache + '</button>';
    el.hidden = false;
    el.querySelector('[data-x]').onclick = function () { guarda.set('profase-chat-push-inv', '0'); el.hidden = true; };
    var b = el.querySelector('[data-act]');
    if (b) b.onclick = async function () {
      b.disabled = true; b.textContent = 'Activando…';
      try { await activaPush(); el.hidden = true; aviso('Listo: aquí te van a llegar los avisos del chat.'); }
      catch (e) { aviso(err(e), true); b.disabled = false; b.textContent = 'Activar avisos'; }
    };
  }

  // ---------------------------------------------------------------- ajustes: avisos y sonido
  $('#ajustes').onclick = async function (ev) {
    ev.stopPropagation();
    var pu = PUSH(), st = 'no-soportado';
    if (pu) { try { st = await pu.estado(); } catch (e) { st = 'no-soportado'; } if (st === 'no') pu.prepara(); }
    var puedeNotif = 'Notification' in window;
    var on = guarda.get('profase-chat-avisos') === '1' && puedeNotif && Notification.permission === 'granted';
    var son = guarda.get('profase-chat-sonido') !== '0';
    var cuerpo = '';
    if (st === 'si' || st === 'no') {
      cuerpo += sw('push', 'Avisos en este equipo aunque el portal esté cerrado', st === 'si')
        + '<p class="nota">Llegan al celular o a la computadora como los de cualquier app. Dicen quién te escribió, en qué chat y lo que dice el mensaje, como WhatsApp (también con el celular bloqueado). Se activan en cada equipo.</p>'
        + '<div class="sec" data-prueba' + (st === 'si' ? '' : ' hidden') + ' style="border:0;padding:6px 0 0"><button type="button" class="lnk" data-mprueba>Mandarme un aviso de prueba</button></div>';
    } else if (st === 'iphone-sin-app') {
      cuerpo += '<p style="margin:0 0 4px;font-weight:600">Avisos en el iPhone</p><p class="nota" style="margin:0">Llegan solo con el portal en tu pantalla de inicio:</p>' + PASOS_IPHONE;
    } else if (st === 'bloqueado') {
      cuerpo += '<p style="margin:0 0 4px;font-weight:600">Avisos en este equipo</p><p class="nota" style="margin:0">El navegador tiene bloqueados los avisos de este sitio. Se activan en sus ajustes (permisos del sitio › Notificaciones) y luego aquí.</p>';
    } else {
      cuerpo += sw('avisos', 'Avisos en la computadora cuando el portal está en otra ventana', on)
        + '<p class="nota">' + (puedeNotif ? 'Los avisos dicen quién te escribió y lo que dice el mensaje.' : 'Este navegador no muestra avisos fuera de la página.') + '</p>';
    }
    cuerpo += '<div class="sec" style="margin-top:10px">' + sw('sonido', 'Sonido al llegar un mensaje', son) + '<p class="nota">Los chats silenciados no suenan ni avisan.</p></div>'
      + (arriba() && arriba().__chatRecorrido ? '<div class="sec"><button type="button" class="lnk" data-recorrido>Ver otra vez el recorrido del chat</button>'
        + (ESTA() && ESTA().listo() && arriba().__chatRecorridoEstatus ? '<br><button type="button" class="lnk" data-recorrido-est>Ver cómo funciona tu estatus</button>' : '') + '</div>' : '');
    var v = ventana('Ajustes del chat', cuerpo);
    var rb = v.el.querySelector('[data-recorrido]');
    if (rb) rb.onclick = function () { v.cierra(); try { arriba().__chatRecorrido(); } catch (e) { /* sin recorrido */ } };
    var re = v.el.querySelector('[data-recorrido-est]');
    if (re) re.onclick = function () { v.cierra(); try { arriba().__chatRecorridoEstatus(); } catch (e) { /* sin recorrido */ } };
    var mp = v.el.querySelector('[data-mprueba]');
    if (mp) mp.onclick = async function () {
      mp.disabled = true;
      try { var r = await PUSH().prueba(); aviso(r && r.enviados > 0 ? 'Listo: en unos segundos te llega el aviso de prueba.' : 'No se encontró este equipo; desactiva y vuelve a activar los avisos.', !(r && r.enviados > 0)); }
      catch (e) { aviso(err(e), true); }
      mp.disabled = false;
    };
    var ocupado = false;
    v.el.addEventListener('click', async function (e) {
      var x = e.target.closest('[data-sw]'); if (!x || ocupado) return;
      var val = x.getAttribute('aria-checked') !== 'true';
      if (x.dataset.sw === 'push') {
        ocupado = true; x.setAttribute('aria-busy', 'true');
        try {
          if (val) { await activaPush(); aviso('Listo: aquí te van a llegar los avisos del chat.'); }
          else { await PUSH().desactivar(); aviso('Ya no te llegarán avisos en este equipo.'); }
          x.setAttribute('aria-checked', val ? 'true' : 'false');
          var pr = v.el.querySelector('[data-prueba]'); if (pr) pr.hidden = !val;
          var iv = $('#push-inv'); if (iv && val) iv.hidden = true;
        } catch (er) { aviso(err(er), true); }
        x.removeAttribute('aria-busy'); ocupado = false;
        return;
      }
      if (x.dataset.sw === 'avisos') {
        if (val) {
          if (!puedeNotif) { aviso('Este navegador no muestra avisos.', true); return; }
          var p = Notification.permission === 'granted' ? 'granted' : await Notification.requestPermission();
          if (p !== 'granted') { aviso('El navegador no dio permiso para avisos.', true); return; }
        }
        guarda.set('profase-chat-avisos', val ? '1' : '0');
      } else guarda.set('profase-chat-sonido', val ? '1' : '0');
      x.setAttribute('aria-checked', val ? 'true' : 'false');
    });
  };
})();
</script>
</body></html>
