<!doctype html><html lang="es" data-rol="todos" data-incrustada="1"><head><meta charset="utf-8"><script>/* Cierre temporal del portal (30-oct-2026, pedido de Daniel cuando la base se trabó: «cierra temporalmente crm»;
   «Saca a todos del CRM con ese aviso y cuando quede ya les avisamos»).
   construir.py lo pone escrito al principio del <head> de cada página que arma (y va a mano en index.html), antes de
   cualquier otro script. Lee cierre.json, que vive en la raíz de profase-portal (no pasa por la base), y si dice
   "cerrado": true detiene la página y lleva a cerrado.html, que avisa y regresa sola al portal en cuanto cierre.json
   diga false. Si la página va en un marco, se lleva a la de arriba. Guarda a dónde iba cada quien para regresarlo ahí.
   Solo en crmprofase.com.mx: en las pruebas locales no hace nada (salvo con window.__PRUEBA_CIERRE).
   Si cierre.json no llega, la página sigue normal. No lee ni escribe nada de la base. */
(function () {
  'use strict';
  if (!/(^|\.)crmprofase\.com\.mx$/.test(location.hostname) && !window.__PRUEBA_CIERRE) return;
  if (/\/cerrado\.html$/.test(location.pathname)) return;
  // la llamada del soporte de Quo (sala.html?marca=quo, Q Chat): nunca lleva a la pantalla de cierre de PROFASE (PROFASE no
  // sale en los sistemas Quo); si la base no contesta, la misma sala lo dice con la marca de Quo
  if (/\/sala\.html$/.test(location.pathname) && /[?&]marca=quo(?:&|$)/.test(location.search)) return;
  var j = null;
  try {
    var x = new XMLHttpRequest();
    x.open('GET', '/cierre.json?t=' + Date.now(), false);
    x.send(null);
    if (x.status === 200) j = JSON.parse(x.responseText);
  } catch (e) { j = null; }
  if (!j || j.cerrado !== true) return;
  // «hasta» (2-nov-2026, Daniel: «no dejes ingresar al sistema hasta las nueve A.M.»): a esa hora abre solo
  if (j.hasta && !isNaN(Date.parse(j.hasta)) && Date.now() >= Date.parse(j.hasta)) return;
  var w = window;
  try { if (window.top && window.top.location.host === location.host) w = window.top; } catch (e) { w = window; }
  try {
    var r = w.location.pathname + w.location.search + w.location.hash;
    if (!/cerrado\.html/.test(r)) sessionStorage.setItem('profase-regreso', r);
  } catch (e) { /* sin almacenamiento: regresa a la entrada */ }
  try { window.stop(); } catch (e) { /* navegador viejo */ }
  try { w.location.replace('/cerrado.html'); } catch (e) { location.replace('/cerrado.html'); }
})();</script><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Portal PROFASE · Costos de sistemas</title>

(function () {

  var TONO = { crm: 'azul', contabilita: 'verde', facturita: 'violeta', nominita: 'naranja' };
  var FUENTES = { lee_github: 'Lo lee de GitHub', lista_supabase: 'Lista de precios de Supabase',
    base: 'Lo cuenta la base', capturado: 'Lo capturas tú', semilla: 'Del plan o la factura' };
  var CADA = { mes: 'Cada mes', anio: 'Al año (va entre 12 cada mes)', unico: 'En cada compra', uso: 'Por lo que se usa' };
  var MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function falla(e) { var m = (e && (e.message || e.error_description || e.msg)) || ''; return String(m).replace(/^.*?ERROR:\s*/, '') || 'No se pudo. Vuelve a intentar en un momento.'; }

  function avisa(t) { $('aviso').textContent = t; $('aviso').hidden = false; clearTimeout(avisa.t); avisa.t = setTimeout(function () { $('aviso').hidden = true; }, 9000); }

          + '<div class="campo"><label for="k-prov">Proveedor</label><input id="k-prov" maxlength="80"></div></div>')
      + '<div class="campo"><span class="et">Cada cuándo se cobra</span><div class="radios">'
      + [['mes', 'Cada mes'], ['anio', 'Al año'], ['unico', 'Una compra']].map(function (x) { return '<label><input type="radio" name="k-cada" value="' + x[0] + '"' + ((cada === x[0] || (cada === 'uso' && x[0] === 'mes')) ? ' checked' : '') + '> ' + x[1] + '</label>'; }).join('')
      + '</div></div>'
      + '<div class="dos"><div class="campo"><label for="k-monto">Monto</label><input id="k-monto" type="number" min="0" step="0.01" inputmode="decimal" value="' + esc(a && a.monto_fijo != null ? a.monto_fijo : '') + '"></div>'
      + '<div class="campo"><span class="et">Moneda</span><div class="radios">'
      + ['MXN', 'USD'].map(function (m) { return '<label><input type="radio" name="k-mon" value="' + m + '"' + (((a && a.moneda) || 'MXN') === m ? ' checked' : '') + '> ' + m + '</label>'; }).join('')
      + '</div></div>'
      + '<div class="campo"><label for="k-f" id="k-f-et">Desde cuándo</label><input id="k-f" type="date" value="' + esc((a && a.desde) || hoy) + '" max="' + esc(hoy) + '"></div></div>'
      + '<div class="dos" id="k-cant-w"><div class="campo"><label for="k-cant">Cantidad (opcional)</label><input id="k-cant" type="number" min="0" step="1" inputmode="numeric" placeholder="Por ejemplo: 1000"></div>'
      + '<div class="campo"><label for="k-uni">De qué</label><input id="k-uni" maxlength="30" value="' + esc((a && a.unidad) || '') + '" placeholder="timbres, créditos…"></div></div>'
      + '<div class="campo"><span class="et">De qué sistema es</span><div class="radios">'
      + [['fijo', 'De uno solo'], ['iguales', 'En partes iguales'], ['pct', 'Por porcentajes']].map(function (x) { return '<label><input type="radio" name="k-rg" value="' + x[0] + '"' + (t === x[0] ? ' checked' : '') + '> ' + x[1] + '</label>'; }).join('')
      + '</div></div>'
      + '<div class="campo" id="k-rg-fijo"><select id="k-sis" aria-label="Sistema">' + sOpt + '</select></div>'
      + '<div class="campo radios" id="k-rg-iguales">' + sIg + '</div>'
      + '<div class="pct" id="k-rg-pct">' + sPct + '</div>'
      + '<div class="campo"><label for="k-nota">Nota (opcional)</label><textarea id="k-nota" maxlength="600"></textarea></div>'
      + (ult && ult.detalle && ult.detalle.compras ? '<div class="mut">Ya hay ' + ult.detalle.compras.length + ' compra(s) en ' + esc(nombreMes(ult.mes)) + '; esta se suma.</div>' : '')
      + '<div class="msg mal" id="k-e" hidden></div>'
      + '<div class="acciones"><button class="btn" type="button" id="k-no">Cancelar</button><button class="btn acento" type="button" id="k-si">Guardar</button></div>', a ? 'k-monto' : 'k-nom');
    function val(n) { var x = $('dlg-c').querySelector('input[name="' + n + '"]:checked'); return x ? x.value : ''; }
    function ver() {
      var r = val('k-rg'), c = val('k-cada');
      $('k-rg-fijo').hidden = r !== 'fijo'; $('k-rg-iguales').hidden = r !== 'iguales'; $('k-rg-pct').hidden = r !== 'pct';
      $('k-cant-w').hidden = c !== 'unico';
      $('k-f-et').textContent = c === 'unico' ? 'Día de la compra' : 'Desde cuándo';
    }
    $('dlg-c').addEventListener('change', ver); ver();
    $('k-no').onclick = function () { if (a) ficha(a.id); else cierra(); };
    $('k-si').onclick = async function () {
      var r = val('k-rg'), regla = { tipo: r };
      if (r === 'fijo') regla.sistema = $('k-sis').value;
      if (r === 'iguales') regla.sistemas = Array.prototype.map.call($('dlg-c').querySelectorAll('input[name="k-ig"]:checked'), function (x) { return x.value; });
      if (r === 'pct') { regla.pct = {}; Array.prototype.forEach.call($('dlg-c').querySelectorAll('input[name="k-pct"]'), function (x) { var v = parseFloat(x.value); if (v > 0) regla.pct[x.getAttribute('data-k')] = v; }); }
      if (r === 'iguales' && !regla.sistemas.length) { $('k-e').textContent = 'Escoge al menos un sistema.'; $('k-e').hidden = false; return; }
      var p = { id: a ? a.id : null, nombre: a ? '' : $('k-nom').value, proveedor: a ? '' : $('k-prov').value, moneda: val('k-mon'), cada: val('k-cada'),
        monto: $('k-monto').value, fecha: $('k-f').value, cantidad: val('k-cada') === 'unico' ? $('k-cant').value : '', unidad: $('k-uni').value, regla: regla, nota: $('k-nota').value };
      this.disabled = true;
      try { var x = await rpc('cos_captura', { p: p }); avisa('Listo: quedó capturado y repartido.'); await carga(); ficha(x.id); }
      catch (e) { $('k-e').textContent = falla(e); $('k-e').hidden = false; this.disabled = false; }
    };
  }
  function como() {
    abre('<h3 id="dlg-t">Cómo se lee</h3>'
      + '<p><b>Cada sistema</b> suma lo que le toca de cada servicio del mes que escojas. Abajo de cada número va su moneda: lo que se cobra en dólares se queda en dólares y lo que se cobra en pesos, en pesos; con «Ver en MXN» todo se pasa a pesos con el tipo de cambio FIX del DOF del mes.</p>'
      + '<p><b>Lo compartido se reparte solo:</b> por lo que usa cada sistema cuando se puede medir (los minutos de cada repositorio en GitHub, lo que ocupa cada uno en la base de Quo, los cambios que hizo Claude en cada sistema) y, si no, en partes iguales entre los sistemas que ya existían ese mes. Cada renglón dice su regla en palabras en su ficha.</p>'
      + '<p><b>De dónde sale cada dato:</b> GitHub se lee solo con una llave de solo lectura; Supabase se calcula con su lista de precios (confirmada con su factura) y lo que mide cada base; SuperConta y WhatsApp los cuenta la base; lo de las facturas (Claude, GoDaddy) lo toma Claude con tu Chrome o lo capturas tú, y se queda. Lo marcado «Estimado» se confirma con la factura.</p>'
      + '<p><b>Los planes de Claude:</b> solo cuenta la parte que es de los sistemas (lo demás es trabajo del despacho); Claude la revisa cada mes con lo que se usó.</p>'
      + '<p><b>Se pone al día solo</b> cada mañana y al momento con «Actualizar».</p>'
      + '<div class="acciones"><button class="btn" type="button" id="c-ok">Cerrar</button></div>', 'c-ok');
    $('c-ok').onclick = cierra;
  }

  /* ---------- Excel y PDF (con la marca PROFASE; el PDF sale del mismo libro) ---------- */
  $('x-lista').onclick = async function () {
    var b = this; b.disabled = true;
    try {
      var L = filtradas(), titulo = 'Costos de sistemas · ' + nombreMes(DATOS.mes);
      var S = (DATOS.sistemas || []);
      var MK = window.PROFASE_MARCA, EX = await MK.excelJS(), wb = MK.libro(EX, titulo);
      var w1 = wb.addWorksheet('Por sistema'), h1 = ['Sistema', 'Gastado del mes (USD)', 'Gastado del mes (MXN)', 'Todo en pesos (MXN)', 'Acumulado (USD)', 'Acumulado (MXN)', 'Acumulado en pesos (MXN)'];
      w1.columns = [28, 18, 18, 20, 18, 18, 22].map(function (x) { return { width: x }; });
      var a0 = MK.encabezado(wb, w1, h1.length, { titulo: titulo, lineas: ['Dólar a $' + (DATOS.tc_hoy ? F2.format(DATOS.tc_hoy) : '—') + ' (FIX del DOF)', 'Exportado el ' + fechaHora(new Date().toISOString())] });
      w1.getRow(a0).values = h1; MK.cabecera(w1, a0, 1, h1.length);
      S.forEach(function (s, i) { var m = s.mes || {}, x = s.acum || {}; w1.getRow(a0 + 1 + i).values = [s.nombre, +m.USD || 0, +m.MXN || 0, +m.mxn || 0, +x.USD || 0, +x.MXN || 0, +x.mxn || 0]; });
      if (S.length) MK.cuerpo(w1, a0 + 1, a0 + S.length, 1, h1.length);
      for (var c = 2; c <= h1.length; c++) w1.getColumn(c).numFmt = '#,##0.00';
      MK.impresion(w1, { repetir: a0 });
      var ws = wb.addWorksheet('Servicios');
      var head = ['Servicio', 'Proveedor', 'Moneda', 'Gastado', 'En pesos (MXN)', 'Tipo de cambio', 'Parte de los sistemas'].concat(S.map(function (s) { return s.nombre + ' (en pesos)'; }))
        .concat(['Consumido', 'Unidad', 'Incluido o tope', 'Cómo se reparte', 'De dónde sale', 'Estimado']);
      ws.columns = [34, 16, 9, 14, 15, 12, 12].concat(S.map(function () { return 15; })).concat([12, 16, 14, 50, 34, 10]).map(function (x) { return { width: x }; });
      var f0 = MK.encabezado(wb, ws, head.length, { titulo: titulo, lineas: [L.length + (L.length === 1 ? ' servicio' : ' servicios') + (SIS ? ' · ' + sisNombre(SIS) : '') + (Q ? ' · búsqueda: ' + Q : ''), 'Exportado el ' + fechaHora(new Date().toISOString())] });
      ws.getRow(f0).values = head; MK.cabecera(ws, f0, 1, head.length);
      L.forEach(function (f, i) {
        var c = f.cargo || {}, rep = {}; (c.reparto || []).forEach(function (r) { rep[r.k] = r.mxn; });
        var r = ws.getRow(f0 + 1 + i);
        r.values = [f.nombre, f.proveedor || '', f.moneda, c.monto != null ? +c.monto : (f.por_capturar ? 'Por capturar' : ''), c.mxn != null ? +c.mxn : '', c.tc != null ? +c.tc : '',
          c.parte != null ? +c.parte : ''].concat(S.map(function (s) { return rep[s.k] != null ? +rep[s.k] : ''; }))
          .concat([c.consumido != null ? +c.consumido : '', c.unidad || f.unidad || '', c.incluido != null ? +c.incluido : (f.tope != null ? +f.tope : ''), f.regla_txt || '', c.fuente_txt || f.fuente_txt || '', c.estimado ? 'Sí' : '']);
        r.getCell(head.length - 2).alignment = { wrapText: true, vertical: 'top' };
      });
      if (L.length) MK.cuerpo(ws, f0 + 1, f0 + L.length, 1, head.length);
      [4, 5].concat(S.map(function (s, i) { return 8 + i; })).forEach(function (c) { ws.getColumn(c).numFmt = '#,##0.00'; });
      ws.getColumn(6).numFmt = '0.0000'; ws.getColumn(7).numFmt = '0%';
      ws.views = [{ state: 'frozen', ySplit: f0 }];
      MK.impresion(ws, { repetir: f0 });
      await MK.guardar(wb, 'Costos de sistemas ' + DATOS.mes + '.xlsx');
    } catch (e) { error('No se pudo armar el archivo. Vuelve a intentar.'); }
    b.disabled = false;
  };

  /* ---------- traer ---------- */
  async function carga() {
    DATOS = await rpc('cos_lista', { p: { mes: MES || null } });
    MES = DATOS.mes;
    PUEDE = !!DATOS.puede && !CONSULTA;
    $('todo').hidden = false;
    $('b-act').hidden = !PUEDE; $('b-cap').hidden = !PUEDE;
    barra(); pintaSelects(); pintaFaltan(); pinta();
    $('pie').textContent = 'Los dólares se pasan a pesos con el tipo de cambio FIX que publica el DOF (el último del mes; el de hoy en el mes en curso). Nada de esto sale de esta pantalla: no va en avisos, SuperConta ni resúmenes.';
  }
  $('f-q').addEventListener('input', function () { Q = this.value; if (PAG) PAG.inicio(); pinta(); });
  $('f-mes').onchange = async function () { MES = this.value; if (PAG) PAG.inicio(); try { await carga(); } catch (e) { error(falla(e)); } };
  $('f-sis').onchange = function () { SIS = this.value; if (PAG) PAG.inicio(); pinta(); };
  $('f-fuente').onchange = function () { FUENTE = this.value; if (PAG) PAG.inicio(); pinta(); };
  $('b-mxn').onclick = function () { MXN = !MXN; try { localStorage.setItem('profase-cos-mxn', MXN ? '1' : '0'); } catch (e) {} pintaSelects(); pinta(); };
  $('b-cap').onclick = function () { forma(null); };
  $('b-como').onclick = function () { como(); };
  $('b-act').onclick = async function () {
    var b = this; b.disabled = true;
    var antes = DATOS && DATOS.config && DATOS.config.ultima;
    try {
      var r = await rpc('cos_pide');
      avisa(r && r.ya ? 'Ya se está poniendo al día: en unos minutos se ve lo nuevo.' : r && r.ok ? 'Listo: en unos minutos se pone al día (GitHub, Supabase y lo demás). Esta pantalla se actualiza sola.' : 'No se pudo pedir ahora; vuelve a intentar en un momento.');
      var n = 0;
      (function espera() {   // revisa cada 20 s, hasta 8 minutos, si ya se puso al día
        if (++n > 24) { b.disabled = false; return; }
        setTimeout(async function () {
          try { var d = await rpc('cos_lista', { p: { mes: MES || null } }); if (d.config && d.config.ultima && d.config.ultima !== antes) { await carga(); avisa('Se puso al día.'); b.disabled = false; return; } } catch (e) {}
          espera();
        }, 20000);
      })();
    } catch (e) { error(falla(e)); b.disabled = false; }
  };
  $('lista').addEventListener('click', function (e) { var tr = e.target.closest('tr.fila'); if (tr) { COLA = LISTA.map(function (f) { return f.id; }); ficha(tr.getAttribute('data-id')); } });
  $('lista').addEventListener('keydown', function (e) { if (e.key !== 'Enter' && e.key !== ' ') return; var tr = e.target.closest('tr.fila'); if (tr) { e.preventDefault(); COLA = LISTA.map(function (f) { return f.id; }); ficha(tr.getAttribute('data-id')); } });
  // la campanita o el Inicio: «ver:capturar» abre la captura; «ver:por-capturar» la pila; «ver:<servicio>» su ficha
  window.__cosAbre = function (que) {
    var s = String(que || '').replace(/^ver:/, '');
    if (!DATOS) return false;
    if (s === 'capturar') { if (PUEDE) forma(null); return true; }
    if (s === 'por-capturar') { VISTA = 'capturar'; pinta(); return true; }
    if (s === 'sistemas') { try { $('sis').scrollIntoView({ block: 'start' }); } catch (e) {} return true; }
    if (filas().some(function (f) { return f.id === s; })) { SEL = s; pinta(); ficha(s); return true; }
    return false;
  };
  async function arranca() {
    try {
      if (!P) { $('cargando').textContent = 'Sin conexión con la base: recarga la página.'; return; }
      var u = await P.listo; if (!u) return;
      if (window.top === window.self) $('logo').hidden = false;
      EST = await rpc('cos_estado');
      if (!EST || !EST.ve) throw new Error('Esta pantalla es solo para la dirección.');
      CONSULTA = !!P.consulta || !!EST.consulta; $('consulta').hidden = !CONSULTA;
      PAG = window.PROFASE_PAGINAS.crea({ donde: $('pag'), clave: 'costos.servicios', nombre: 'Servicios', arriba: $('caja-lista'), cambio: function () { pinta(); } });
      await carga();
      $('cargando').hidden = true;
    } catch (e) { $('cargando').hidden = true; error(falla(e)); }
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden && EST && EST.ve && $('dlg').hidden) carga().catch(function () {}); });
  arranca();
})();
</script>
</body></html>
