/* ---------- Movimientos: su propio seguimiento de cada mes (5-nov-2026, pedido de Fernando Cadengo; «sí, así es»; 292) ----------
   Antes (4-nov-2026, 221) un hallazgo abría aquí el mismo seguimiento de Variaciones y los demás meses solo «Comentarios del
   mes», sin estatus. Ahora Movimientos lleva su propio seguimiento de cada mes de cada cuenta de cada empresa, sea hallazgo o
   no y también los meses vacíos: los mismos cinco estatus (con las mismas reglas) y su propia plática, con la llave
   RFC_mes_cuenta_año_mov (movRid). Lo de Variaciones no se ve aquí ni lo de aquí en Variaciones. ‹ › y «Guardar y
   siguiente ›» pasan por los meses con importe de la cuenta (NAV_CTA); «Revisados» cuenta cuántos de esos meses están en
   «Justificado» o «Modificación Exitosa» en Movimientos y «Revisar ›» abre el primero que falta. Quién ve, quién cambia el
   estatus y quién comenta, lo de siempre de Variaciones (la base lo revisa igual: 07, 210, 218 y 292). */
const movRid = (rfc, m, cta, y) => rfc+"_"+m+"_"+cta+"_"+y+"_mov";
const MOV_RE = /^(.+?)_(\d{1,2})_(\d{3}\.\d{2}\.\d{2})_(\d{4})_mov$/;
const esMov = k => MOV_RE.test(String(k||""));
// lo que dice una llave de Movimientos (para la Bitácora, la bandeja y lo que se guarda con el estatus)
function movInfo(k){
  const g = MOV_RE.exec(String(k||"")); if(!g) return null;
  const cl = BASE.clientes.find(c=>c[1]===g[1]), cu = BASE.cuentas.find(c=>c[0]===g[3]);
  return {rfc:g[1], mes:+g[2], cta:g[3], anio:+g[4], cliente: cl ? cl[0] : g[1], nombre: cu ? cu[1] : "", mesN: MESES.get(+g[2]) || MESES_ES[+g[2]-1] || ""};
}
const movTxt = k => { const i = movInfo(k); return i ? `Movimientos · ${i.cta}${i.nombre?" "+i.nombre:""} · ${i.mesN} ${i.anio}` : ""; };
let NAV_CTA = [];
const MOV_VACIO = {ant:0, act:0, sf:0, sfAnt:0, car:null, abo:null};
function celdaF(ct, ci, m){
  const c = variacionesAnio(S.anio).get(ct); if(!c) return null;
  const x = (c.emp.get(ci) || new Map()).get(m) || null;
  const [nom, rfc, cont, , grupo] = BASE.clientes[ci];
  return {celda:true, rid:movRid(rfc, m, c.cta, S.anio), x: x || MOV_VACIO, vacio:!x, hall: x && esHall(x) ? x.hall : null,
          ct, ci, mes:m, mesN:MESES.get(m)||"", anio:S.anio, cliente:nom, rfc, cta:c.cta, nombre:c.nombre,
          grupo:grupo||"—", contador:cont||""};
}
// cada mes de la cuenta abierta, con su llave de Movimientos
const itemCelda = (ct, ci, m) => ({rid: movRid(BASE.clientes[ci][1], m, BASE.cuentas[ct][0], S.anio), celda:()=>celdaF(ct, ci, m)});
const abreDeCuenta = it => { if(!it) return; const f = it.celda ? it.celda() : null; if(!f) return;
  mSeguimiento(it.rid, {f, lista:NAV_CTA, donde:"en esta cuenta"}); };
function abreCelda(ci, m){
  const c = variacionesAnio(S.anio).get(SC.sel); if(!c) return;
  const it = itemCelda(c.ct, ci, m);
  abreDeCuenta(NAV_CTA.find(x=>x.rid===it.rid) || it);
}
// los meses de una empresa que cuentan en «Revisados» y en ‹ ›: los que tienen importe (o son hallazgo), en el orden de la tabla
const mesesCuentan = (cel, meses) => meses.filter(m=>{ const x = cel.get(m); if(!x) return false;
  const [va, vp] = importeDe(x); return !!(va || vp || esHall(x)); });
// «Revisar ›»: el primer mes con importe que falta por revisar en Movimientos, en el orden de los meses
function revisaEmpresa(ci){
  const c = variacionesAnio(S.anio).get(SC.sel), cel = c && empDe(c).get(ci); if(!cel) return;
  const rfc = BASE.clientes[ci][1];
  for(const m of mesesCuentan(cel, mesesAnio(S.anio).map(([n])=>n)))
    if(!cerrado(lee(movRid(rfc, m, c.cta, S.anio)))){ abreCelda(ci, m); return; }
}
// abrir por su llave (desde un aviso o la Bitácora): un hallazgo de Variaciones, o un mes de Movimientos con su cuenta
// abierta. Una llave de antes de un mes que no es hallazgo (221) lleva a ese mes en Movimientos.
function abreRid(rid){
  rid = String(rid||"");
  if(PORRID.has(rid)){ const f = PORRID.get(rid); S.anio = f.anio; mostrarVista("mov"); mSeguimiento(rid); return true; }
  let g = MOV_RE.exec(rid), rfc, mes, cta, anio;
  if(g){ rfc = g[1]; mes = +g[2]; cta = g[3]; anio = +g[4]; }
  else { g = RID_RE.exec(rid); if(!g || g[4]) return false; rfc = g[1]; mes = +g[2]; cta = g[3]; anio = g[5] ? +g[5] : BASE.anioBase; }
  const ci = BASE.clientes.findIndex(c=>c[1]===rfc), ct = BASE.cuentas.findIndex(c=>c[0]===cta);
  if(ci<0 || ct<0) return false;
  S.anio = anio; SC.sel = ct; SC.solo = false;
  mostrarVista("cta");
  const f = celdaF(ct, ci, mes); if(!f) return false;
  mSeguimiento(f.rid, {f, lista:NAV_CTA, donde:"en esta cuenta"});
  return true;
}

/* El desglose de la cuenta elegida se dibuja justo debajo de su renglón. */
function detalleCuentaHTML(datos, meses){
  const c = SC.sel===null ? null : datos.get(SC.sel);
  if(!c) return "";
  const filas = [], empV = empDe(c);
  const ridDe = (ci, m) => movRid(BASE.clientes[ci][1], m, c.cta, S.anio);
  for(const [ci,cel] of empV){
    if(!empPasa(ci)) continue;
    const hs = [...cel.values()].filter(esHall);
    if(SC.solo && !hs.length) continue;
    if(!SC.solo && ![...cel.values()].some(x=>x.act || x.ant || x.sf)) continue;
    // «Revisados» (5-nov-2026, 292): los meses con importe ya en «Justificado» o «Modificación Exitosa» en Movimientos
    const cuentan = mesesCuentan(cel, meses), rev = cuentan.filter(m=>cerrado(lee(ridDe(ci, m)))).length;
    const mx = Math.max(0, ...[...cel.values()].filter(x=>x.v!==null && !x.solo).map(x=>Math.abs(x.v)));
    filas.push({ci, cel, nh:hs.length, rev, nt:cuentan.length, mx});
  }
  filas.sort((a,b)=>b.nh-a.nh || b.mx-a.mx || BASE.clientes[a.ci][0].localeCompare(BASE.clientes[b.ci][0],"es"));
  const enMes = m => { let u=0,d=0; filas.forEach(f=>{ const x=f.cel.get(m); if(x && esHall(x)) (x.v!==null && x.v<0) ? d++ : u++; }); return {u,d}; };
  const total = [...empV.keys()].filter(empPasa).length;
  const conAviso = verSaldo() ? [...empV].filter(([ci,cel])=>empPasa(ci) && [...cel.values()].some(x=>x.aviso)).length : 0;
  // cada mes (también el vacío) abre su seguimiento de Movimientos. El hallazgo, pastilla con borde; un mes con estatus,
  // borde punteado; el color, el del estatus de Movimientos (naranja por revisar, azul Modificación QUO, verde revisado)
  const celda = (x, m, ci) => {
    const rid = ridDe(ci, m), e = lee(rid), nc = hiloDe(rid).length, conEst = e.i!==DEF_I;
    const cls = cerrado(e) ? "ok" : e.i==="modif_quo" ? "quo" : "pend";
    const glob = nc ? `<span class="cglob" title="${nc} ${nc===1?"comentario":"comentarios"}">${ico("chat","")}${nc}</span>` : "";
    const estT = "\nMovimientos: "+tI(e.i)+(nc ? " · "+nc+(nc===1?" comentario":" comentarios") : "")+"\nAbrir su seguimiento";
    if(!x) return `<td class="vc"><button type="button" class="vcb${conEst?" est "+cls:""}" data-cel="${ci}|${m}" title="${esc("Sin saldo ni movimiento en el mes"+estT)}"><span style="color:var(--ink-4)">·</span>${glob}</button></td>`;
    const [va, vp] = importeDe(x), av = avisoCelda(x, m);
    const tit = `Saldo final ${money(x.sf)} (mes anterior ${money(x.sfAnt)})\nMovimiento del mes ${money(x.act)} (mes anterior ${money(x.ant)})`
      + (x.acr ? `\nCargos ${money(x.car)} · Abonos ${money(x.abo)} · ${sentidoDe(x.aum)}${x.v!==null?" "+pct(x.v)+" sobre el saldo inicial":""}${x.sf<0?"\nSaldo contrario a su naturaleza":""}` : "");
    const imp = !va && !vp ? `<span style="color:var(--ink-4)">·</span>${av}` : `<span class="mny">${esc(money(va))}</span>${signo(va, vp)}${av}`;
    if(esHall(x)) return `<td class="vc"><button type="button" class="hzb ${cls}" data-cel="${ci}|${m}" title="${esc(tit+"\nEs hallazgo en Variaciones"+estT)}">${imp}${glob}</button></td>`;
    return `<td class="vc"><button type="button" class="vcb${conEst?" est "+cls:""}" data-cel="${ci}|${m}" title="${esc(tit+estT)}">${imp}${glob}</button></td>`;
  };
  // ‹ › y «Guardar y siguiente ›» dentro de la cuenta: los meses con importe, empresa por empresa y mes por mes
  NAV_CTA = [];
  for(const f of filas) for(const m of mesesCuentan(f.cel, meses)) NAV_CTA.push(itemCelda(c.ct, f.ci, m));
  const puedeRev = rfc => dbNS && !soloLectura && (puedeEst() || puedeCom(rfc));
  return `<div class="dhd">
      <div><h3><span class="cta">${esc(c.cta)}</span> ${esc(c.nombre)}</h3>
        <p>${fNum.format(total)} empresas tienen la cuenta en ${S.anio}; ${fNum.format(filas.filter(f=>f.nh).length)} con hallazgo.${conAviso ? ` ⚠️ ${fNum.format(conAviso)} ${conAviso===1?"empresa tiene":"empresas tienen"} algún mes cuyo saldo inicial no cuadra con el cierre del mes anterior${SC.solo?" (con «Todas las empresas» se ven todas)":""}.` : ""}</p>
        <p class="vleg" id="cLeg"><span>Cada mes abre su propio seguimiento de Movimientos, aparte del de Variaciones.</span>
          <span><i class="sw hz"></i>Hallazgo</span><span><i class="sw es"></i>Con estatus</span>
          <span><i class="sw pend"></i>Por revisar</span><span><i class="sw quo"></i>Modificación QUO</span><span><i class="sw ok"></i>Revisado</span></p></div>
      <div class="chips" id="cSolo">
        <button class="chip${SC.solo?" on":""}" data-v="1">Solo empresas con hallazgo</button>
        <button class="chip${SC.solo?"":" on"}" data-v="0">Todas las empresas</button>
      </div></div>
    <div class="tscroll"><table class="vtab"><thead><tr>
      <th>Empresa</th>${meses.map(m=>{ const n=enMes(m), k=n.u+n.d;
        return `<th class="mh">${esc(mesCorto(m))}<small>${k?fNum.format(k)+(k===1?" hallazgo":" hallazgos"):"·"}</small></th>`; }).join("")}
      <th class="r">Hallazgos</th><th class="r" title="Meses con importe que ya están en «Justificado» o «Modificación Exitosa» en Movimientos">Revisados</th></tr></thead>
      <tbody>${filas.length ? filas.map(f=>{ const [nom,rfc,cont,,grupo] = BASE.clientes[f.ci];
        return `<tr><td class="cli">${esc(nom)}<br><span class="grp" style="font-weight:400">${esc(grupo||"—")} · ${esc(SIGLA(cont))}</span></td>
          ${meses.map(m=>celda(f.cel.get(m), m, f.ci)).join("")}
          <td class="r mny">${fNum.format(f.nh)}</td><td class="r mny" title="Meses con importe revisados en Movimientos">${f.nt?fNum.format(f.rev)+" / "+fNum.format(f.nt):"—"}${
            puedeRev(rfc) && f.rev<f.nt ? `<br><button type="button" class="lnk crev" data-rev="${f.ci}" title="Abre el primer mes que falta por revisar de esta empresa en esta cuenta">Revisar ›</button>` : ""}</td></tr>`; }).join("")
        : `<tr><td colspan="${meses.length+3}"><div class="vacio">Ninguna empresa con hallazgo en esta cuenta. Prueba «Todas las empresas».</div></td></tr>`}</tbody></table></div>`;
}


/* De «Por cuenta» a «Movimientos»: filtra al hallazgo elegido y guarda los filtros anteriores para volver. */
function copiaFiltros(){
  return {q:S.q, meses:new Set(S.meses), clientes:new Set(S.clientes), grupos:new Set(S.grupos), contadores:new Set(S.contadores),
          estC:new Set(S.estC), estI:new Set(S.estI), ctasOff:new Set(S.ctasOff), ctasSolo:new Set(S.ctasSolo), dir:S.dir, rec:S.rec, umbPct:S.umbPct, umbMxn:S.umbMxn, verSil:S.verSil, cero:S.cero};
}
/* Al escoger uno a cinco clientes, lo más nuevo de Quo: el carril rápido (199_quo_carril_rapido.sql, js/quo-al-dia.js);
   al llegar sale «hay datos nuevos», como con la vuelta de cada hora */
function alDiaQuo(s){ const l=[...s]; if(window.PROFASE_QUO && l.length && l.length<=5) window.PROFASE_QUO.abierto(l, {aviso:true}); }
/* Deja la tabla de Movimientos con solo ese hallazgo (su cliente, su cuenta y su mes). La usan «Por cuenta» y los meses
   del historial del caso. */
function filtraHallazgo(f){
  S.anio = f.anio; S.q = norm(f.cta); S.meses = new Set([f.mes]); S.clientes = new Set([f.rfc]);
  alDiaQuo([f.rfc]);
  S.grupos = new Set(); S.contadores = new Set(); S.estC = new Set(); S.estI = new Set(); S.ctasOff = new Set(); S.ctasSolo = new Set();
  S.dir = "todos"; S.rec = "todos"; S.umbPct = Math.min(UMB_VISTA, Math.floor(Math.abs(f.v)*100)); S.umbMxn = 0; S.cero = "si";
  if(silenciado(f)) S.verSil = true;
  S.sel = f.rid;
  document.getElementById("q").value = f.cta;
}
function irAMovimientos(rid){
  const f = PORRID.get(rid); if(!f) return;
  const prev = S.origen ? S.origen.prev : copiaFiltros();
  filtraHallazgo(f);
  S.origen = {rid, prev, texto:`${f.cliente} · ${f.cta} ${f.nombre} · ${f.mesN} ${f.anio}`};
  mostrarVista("mov");
  pintar();
  requestAnimationFrame(()=>{
    const tr = document.querySelector(`#tb tr[data-rid="${CSS.escape(rid)}"]`);
    (tr || document.getElementById("secMov")).scrollIntoView({block:"center", behavior:"smooth"});
  });
}
function quitarOrigen(volver){
  if(!S.origen) return;
  Object.assign(S, S.origen.prev);
  document.getElementById("q").value = S.q;
  S.origen = null; S.sel = null;
  if(volver){ mostrarVista("cta"); pintar(); const tr = document.querySelector("#ctb tr.csel"); if(tr) tr.scrollIntoView({block:"center", behavior:"smooth"}); }
  else pintar();
}
/* ---------- Saltos entre meses desde «Seguimiento de revisión» (3-nov-2026, pedido de Fernando Barbosa) ----------
   Cada mes con hallazgo del historial del caso lleva a ese mes en Movimientos, con el mismo cliente y la misma cuenta, y
   abre su seguimiento con el detalle del movimiento (saldo inicial, cargos, abonos y saldo final). Antes de brincar se
   guarda una foto de dónde estabas (vista, año, filtros, cuentas abiertas, posición y la ventana abierta); la franja fija
   regresa paso por paso, como «atrás», o al inicio de un jalón. Solo mueve la pantalla: no cambia quién ve qué ni ningún
   saldo. */
const SALTOS = [];
let saltoAqui = "";
const mesAnioDe = f => f ? f.mesN+" "+f.anio : "";
function fotoAqui(rid){
  const ts = document.querySelector("#secMov .tscroll");
  return {rid, vista:S.vista||"mov", filtros:copiaFiltros(), anio:S.anio, orden:S.orden, asc:S.asc, origen:S.origen,
    qTxt:document.getElementById("q").value,
    sh:{abiertas:new Set(SH.abiertas), lim:new Map(SH.lim), toco:SH.toco, selVisto:SH.selVisto},
    sm:{modo:SM.modo, solo:SM.solo, abiertos:new Set(SM.abiertos), todos:SM.todos},
    sc:Object.assign({}, SC), y:window.scrollY, x:ts ? ts.scrollLeft : 0,
    texto: mesAnioDe(PORRID.get(rid)) || "donde estabas"};
}
function saltaAMes(rid, desde){
  const f = PORRID.get(rid); if(!f || rid===desde) return;
  SALTOS.push(fotoAqui(desde));
  if(cerrarModal) cerrarModal();
  filtraHallazgo(f);
  S.origen = null;   // la foto lo guarda; al regresar vuelve
  SM.modo = "hall";
  saltoAqui = `${f.cliente} · ${f.cta} ${f.nombre} · ${mesAnioDe(f)}`;
  mostrarVista("mov");
  pintar();
  requestAnimationFrame(()=>{
    const tr = document.querySelector(`#tb tr[data-rid="${CSS.escape(rid)}"]`);
    (tr || document.getElementById("secMov")).scrollIntoView({block:"center"});
    mSeguimiento(rid, {detalle:true});
  });
}
function regresaSalto(alInicio){
  if(!SALTOS.length) return;
  const p = alInicio ? SALTOS[0] : SALTOS[SALTOS.length-1];
  if(alInicio) SALTOS.length = 0; else SALTOS.pop();
  if(cerrarModal) cerrarModal();
  Object.assign(S, p.filtros);
  S.anio = p.anio; S.orden = p.orden; S.asc = p.asc; S.origen = p.origen; S.sel = p.rid || null;
  Object.assign(SH, p.sh); Object.assign(SM, p.sm); Object.assign(SC, p.sc);
  document.getElementById("q").value = p.qTxt;
  // si todavía quedan pasos, la franja dice a qué mes llegaste
  if(SALTOS.length){ const g = PORRID.get(p.rid); saltoAqui = g ? `${g.cliente} · ${g.cta} ${g.nombre} · ${mesAnioDe(g)}` : ""; }
  mostrarVista(p.vista);
  if(p.vista!=="bit") pintar();
  requestAnimationFrame(()=>{
    window.scrollTo(0, p.y);
    const ts = document.querySelector("#secMov .tscroll"); if(ts) ts.scrollLeft = p.x;
    const tr = p.rid && p.vista==="mov" ? document.querySelector(`#tb tr[data-rid="${CSS.escape(p.rid)}"]`) : null;
    if(tr){ const r = tr.getBoundingClientRect(); if(r.bottom<0 || r.top>window.innerHeight) tr.scrollIntoView({block:"center"}); }
    if(p.rid && PORRID.has(p.rid)) mSeguimiento(p.rid);
  });
}
// botones de regresar: en la franja fija y dentro de la ventana de seguimiento
function saltoBotones(){
  if(!SALTOS.length) return "";
  const ult = SALTOS[SALTOS.length-1];
  return SALTOS.length>1
    ? `<button class="btn-2" data-o="atras" title="Regresa un paso: a ${esc(ult.texto)}, con sus filtros y su ventana">‹ Regresar a ${esc(ult.texto)}</button>
       <button class="btn-2" data-o="inicio" title="Regresa a donde empezaste: ${esc(SALTOS[0].texto)}">Regresar al inicio</button>`
    : `<button class="btn-2" data-o="inicio" title="Regresa a ${esc(ult.texto)}, con tus filtros y la ventana de seguimiento abierta">‹ Regresar al inicio</button>`;
}
function pintarOrigen(){
  const box = document.getElementById("origen");
  if(SALTOS.length){
    const hdr = document.querySelector(".hdr");
    const h = hdr && hdr.getClientRects().length && getComputedStyle(hdr).position==="sticky" ? hdr.offsetHeight : 0;
    box.style.setProperty("--hdrH", h+"px");
    box.hidden = false; box.classList.add("fijo");
    box.innerHTML = `<span class="lb">Revisando otro mes</span><b>${esc(saltoAqui)}</b><span class="acts">${saltoBotones()}</span>`;
    return;
  }
  box.classList.remove("fijo");
  if(!S.origen){ box.hidden = true; box.innerHTML = ""; return; }
  box.hidden = false;
  box.innerHTML = `<span class="lb">Desde Movimientos</span><b>${esc(S.origen.texto)}</b>
    <span class="acts"><button class="btn-2" data-o="volver">Volver a Movimientos</button><button class="btn-2" data-o="quitar">Ver todas las variaciones</button></span>`;
}

/* ---------- Movimientos · Por mes (formato del Dashboard Movimientos del Excel) ---------- */
const SM = {modo:"hall", solo:true, abiertos:new Set(), todos:null};
const MOV_ANIO = new Map();
function movAnio(y){
  if(MOV_ANIO.has(y)) return MOV_ANIO.get(y);
  const pre = y+"-", m = new Map(); let max = 0;
  if(BASE.mov) for(const [ci,ct,p,v] of BASE.mov){
    if(!p.startsWith(pre)) continue;
    const mes = +p.slice(5); if(mes>max) max = mes;
    let e = m.get(ci); if(!e){ e = new Map(); m.set(ci,e); }
    let a = e.get(ct); if(!a){ a = new Array(13).fill(0); e.set(ct,a); }
    a[mes] += v;
  }
  const r = {m, max}; MOV_ANIO.set(y, r); return r;
}
const hallDe = (rfc, m, cta, y) => {
  const h = PORRID.get(rfc+"_"+m+"_"+cta+(y===BASE.anioBase ? "" : "_"+y));
  return h && (S.verSil || !silenciado(h)) ? h : null;
};

function pintarPorMes(){

  const meses = S.meses.size ? todos.filter(k=>S.meses.has(k)) : todos;
  const empresas = [];
  for(const [ci, ctas] of m){
    if(!empPasa(ci)) continue;
    const [nom, rfc, cont, , grupo] = BASE.clientes[ci];
    const empTxt = norm(nom+" "+rfc);
    const filas = []; let nh = 0;
    for(const [ct, a] of ctas){

      if(ctaFuera(cta)) continue;
      if(S.q && !empTxt.includes(S.q) && !norm(cta+" "+nombre).includes(S.q)) continue;
      if(!meses.some(k=>a[k])) continue;
      const hs = meses.map(k=>hallDe(rfc, k, cta, y)), n = hs.filter(Boolean).length;
      if(SM.solo && !n) continue;
      nh += n; filas.push({ct, cta, nombre, a, hs, ci, acr: ES_ACR(cta)});

    if(!filas.length) continue;
    filas.sort((p,q)=>p.cta.localeCompare(q.cta));

  }

  const nCtas = empresas.reduce((s,e)=>s+e.filas.length,0), nHall = empresas.reduce((s,e)=>s+e.nh,0);

    const ant = k>1 ? f.a[k-1] : 0;
    let vt = ant && v ? (CRIT.baseAbs ? (v-ant)/Math.abs(ant) : v/ant-1) : null;
    if(f.acr){ const fin = idxR().sal.get(f.ci+"|"+f.ct+"|"+y+"-"+String(k).padStart(2,"0")) || 0, ini = r2(fin - v); vt = ini && v ? v/Math.abs(ini) : null; }
    return `<td class="mv${v<0?" neg":""}">${esc(money(v))}${vt!==null?`<span class="vp pct mu ${vt<0?"down":"up"}">${esc(pct(vt))}</span>`:""}</td>`;
  };
  const cuerpo = empresas.map(e=>{
    const ab = SM.abiertos.has(e.rfc);
    let h = `<tr class="emp" data-emp="${esc(e.rfc)}"><td colspan="${meses.length+2}"><span class="car">${ab?"⊟":"⊞"}</span>${esc(e.nom)}
      <span class="sub2">${esc(e.rfc)} · ${esc(e.grupo)} · ${esc(SIGLA(e.cont))} · ${fNum.format(e.filas.length)} cuentas${e.nh?" · "+fNum.format(e.nh)+" hallazgos":""}</span></td></tr>`;
    if(ab) h += e.filas.map(f=>`<tr><td class="rfc">${esc(f.cta)}</td><td class="nom">${esc(f.nombre)}</td>${meses.map((k,i)=>celda(f,k,i)).join("")}</tr>`).join("");
    return h;
  }).join("");
  box.innerHTML = `<div class="pm-top">
      <div class="slicer"><span class="lb">Mes</span><div class="ms" id="pmMeses">${todos.map(k=>`<button class="${S.meses.size&&S.meses.has(k)?"on":(!S.meses.size?"on":"")}" data-m="${k}">${esc((MESES.get(k)||MESES_ES[k-1]).slice(0,3))}</button>`).join("")}</div>
        ${S.meses.size?'<button class="lnk" data-m="todos">Todos</button>':""}</div>
      <div class="acts">
        <div class="chips" id="pmSolo" style="margin:0"><button class="chip${SM.solo?" on":""}" data-v="1">Solo cuentas con hallazgo</button><button class="chip${SM.solo?"":" on"}" data-v="0">Todas las cuentas</button></div>
        <button class="btn-2" id="pmAbrir">${SM.abiertos.size ? "Contraer todo" : "Desplegar todo"}</button>
      </div></div>
    <div class="tscroll"><table class="ptab"><thead><tr><th>Cuenta QUO</th><th>Nombre cuenta</th>${meses.map(k=>`<th class="mm">${esc(MESES.get(k)||MESES_ES[k-1])}</th>`).join("")}</tr></thead>
      <tbody>${cuerpo || `<tr><td colspan="${meses.length+2}"><div class="vacio">No hay movimientos con estos filtros${SM.solo?"; prueba «Todas las cuentas»":""}.</div></td></tr>`}</tbody></table></div>
    <div class="tfoot"><span>${fNum.format(empresas.length)} empresas · ${fNum.format(nCtas)} cuentas · ${fNum.format(nHall)} hallazgos en ${meses.length===todos.length?"el año":fNum.format(meses.length)+" meses"}</span><span>Importes: saldo final − saldo inicial del mes (MXN)</span></div>`;

/* ---------- Bitácora (3-nov-2026, pedido de Fernando Cadengo) ----------
   Cada cambio de estatus, comentario, silencio y criterios queda en la base (rep_bitacora, 166_bitacora_reportes.sql):
   quién, cuándo, el antes y el después; antes solo quedaba el último. La ven quienes ven Variaciones (la base lo decide:
   rep_bitacora('var')). La pantalla y el Excel son la pieza común js/bitacora.js (la misma de Cartera y Activo fijo). */
let BIT = null;
const BIT_TIPOS = [{k:"estatus",t:"Estatus"},{k:"comentario",t:"Comentarios"},{k:"silencio",t:"Cuentas excluidas"},{k:"criterios",t:"Criterios"}];
const silTxt = v => !v || v.vig===null || v.vig===undefined ? "No excluida"
  : (v.alcance==="todos" ? "Excluida para todos los clientes" : "Excluida")+(v.vig===0 ? ", permanente" : ", "+v.vig+" meses");
const CRIT_LAB = {umbral:"Sube (%)",umbralBaja:"Baja (%)",nominaRangos:"Cuentas de nómina",nominaMeses:"Meses de nómina",pagoRangos:"Cuentas de provisión",
  pagoTolMxn:"Tolerancia del pago ($)",pagoTolPct:"Tolerancia del pago (%)",bimestralRangos:"Cuentas bimestrales",
  contraCero:"Comparar contra $0",excluirBajas:"Excluir bajas",excluirAltas:"Excluir altas",baseUltimo:"Comparar contra el último mes con movimiento"};
const critVal = v => v===true ? "Sí" : v===false ? "No" : v===null || v===undefined || v==="" ? "—" : String(v);
// un hallazgo que ya no viene con el criterio de hoy: su cuenta y su mes salen de la llave (RFC_mes_cuenta…)
const sinHallazgo = k => { const p = String(k||"").split("_"); const m = MESES.get(p[1]) || MESES.get(+p[1]);
  return p[2] ? "Cuenta "+p[2]+(m ? " · "+m : "")+" · ya no sale con el criterio de hoy" : "Hallazgo "+k; };
// los comentarios de un mes de Movimientos que no es hallazgo (221): su cuenta y su mes, y se abren en Movimientos. Desde el
// 5-nov-2026 (292) Movimientos lleva su propio seguimiento (llave _mov) y la Bitácora dice de qué pestaña viene cada cambio.
const esMesCom = k => !PORRID.has(k) && !!(COMS[k] && COMS[k].foto && COMS[k].foto.celda);
const mesComTxt = k => { const p = String(k||"").split("_"), m = MESES.get(+p[1]) || MESES.get(p[1]);
  return "Cuenta "+p[2]+(m ? " · "+m : "")+" · comentarios del mes (no es hallazgo)"; };
function filaBitVar(b){
  const a = b.antes || {}, d = b.despues || {};
  const f = PORRID.get(b.llave);
  const rfc = b.rfc || (b.col==="var_casos" ? (d.rfc||a.rfc||(/^x\|/.test(d.caso||a.caso||"") ? "" : String(d.caso||a.caso||"").split("|")[0])) : "");
  const cl = f ? f.cliente : ((CLIENTES.find(c=>c.rfc===rfc)||{}).cliente || (CLIENTES.find(c=>c.rfc===rfc)||{}).nombre || "");
  const base = {id:b.id, hora:b.hora, quien:b.quien, rfc, cliente:cl, previo:b.previo,
    objeto: esMov(b.llave) ? movTxt(b.llave) : f ? `Variaciones · ${f.cta} ${f.nombre} · ${f.mesN} ${f.anio}` : b.col==="var_criterios" ? "Criterios de la bitácora"
      : b.col==="var_casos" ? "Cuenta "+(d.cta||a.cta||String(d.caso||a.caso||"").split("|").slice(/^x\|/.test(d.caso||a.caso||"")?2:1).join(" · "))+((d.alcance||a.alcance)==="todos"?" · todos los clientes":"")
      : esMesCom(b.llave) ? mesComTxt(b.llave) : sinHallazgo(b.llave),
    abre: esMov(b.llave) ? ()=>abreRid(b.llave) : f ? ()=>{ S.anio = f.anio; mSeguimiento(f.rid); } : esMesCom(b.llave) ? ()=>abreRid(b.llave) : null};
  if(b.que==="estatus") return Object.assign(base, {tipo:"estatus", tipoTxt:"Estatus",
    cambio:(b.antes ? tI(okI(a.invit)) : "Sin revisión")+" → "+tI(okI(d.invit)),
    detalle:[d.rol==="gc" ? "Lo puso la Gerencia Contable" : d.rol==="contador" ? "Lo puso un contador del cliente" : "",
      d.motivo ? "Motivo: "+d.motivo : "", d.excel ? "Desde el Excel compartido ("+d.excel+")" : ""].filter(Boolean).join(" · ")});
  // desde el 4-nov-2026 (218): cada comentario de la plática va aparte, con lo que se hizo («accion»)
  if(b.que==="comentario" && d.accion) return Object.assign(base, {tipo:"comentario",
    tipoTxt: d.accion==="borra" ? "Borró su comentario" : d.accion==="corrige" ? "Corrigió su comentario" : "Comentó",
    cambio: d.accion==="corrige" && d.antes ? "Antes: «"+d.antes+"»" : "",
    detalle: d.accion==="borra" ? (d.antes ? "«"+d.antes+"»" : "") : (d.comentario ? "«"+d.comentario+"»" : "")});
  if(b.que==="comentario" || b.que==="comentario_borrado") return Object.assign(base, {tipo:"comentario",
    tipoTxt: b.que==="comentario_borrado" || !d.comentario ? "Borró el comentario" : a.comentario ? "Cambió el comentario" : "Comentó",
    cambio: a.comentario ? "Antes: «"+a.comentario+"»" : "", detalle: d.comentario ? "«"+d.comentario+"»" : ""});
  if(b.que==="silencio" || b.que==="silencio_borrado") return Object.assign(base, {tipo:"silencio", tipoTxt:"Cuenta excluida",
    cambio: silTxt(b.antes)+" → "+silTxt(b.despues), detalle: d.desde ? "Desde "+MESN(d.desde) : d.desdeMes ? "Desde "+(MESES.get(d.desdeMes)||"") : ""});
  // criterios: qué cambió
  const ks = Array.from(new Set(Object.keys(a).concat(Object.keys(d)))).filter(k=>JSON.stringify(a[k])!==JSON.stringify(d[k]));
  return Object.assign(base, {tipo:"criterios", tipoTxt:"Criterios",
    cambio: b.antes ? ks.map(k=>(CRIT_LAB[k]||k)+": "+critVal(a[k])+" → "+critVal(d[k])).join(" · ") || "Sin cambios" : "Criterios vigentes"});
}
function abreBitacora(nota){

      return {filas:((q.data && q.data.filas) || []).map(filaBitVar), mas:!!(q.data && q.data.mas)};

/* ---------- ventanas ---------- */
let cerrarModal = null;
/* pendiente (5-nov-2026, pedido de Gabriel Cavazos): si dice que hay algo sin guardar, cerrar con la parte oscura, la ✕,
   «Cancelar» o Esc primero pregunta; y la parte oscura solo cierra con un clic que empieza y termina en ella (antes,
   arrastrar o seleccionar texto y soltar afuera cerraba la ventana y se perdía lo escrito). */
function modal({kick,titulo,cuerpo,pie,ancho,chico,alCerrar,nav,pendiente}){
  const host = document.getElementById("modal");
  host.innerHTML = `<div class="scrim" role="dialog" aria-modal="true">
    <div class="modal${ancho?" wide":""}"${chico?' style="max-width:420px"':""}>
      <div class="mhead">
        <div>${kick?`<p class="kick">${esc(kick)}</p>`:""}<h2>${esc(titulo)}</h2></div>
        ${nav?`<div class="mnav">${nav}<button class="x" data-x aria-label="Cerrar ventana">${ico("cerrar")}</button></div>`
             :`<button class="x" data-x aria-label="Cerrar ventana">${ico("cerrar")}</button>`}
      </div>
      <div class="mbody">${cuerpo}</div>
      ${pie?`<div class="mfoot">${pie}</div>`:""}
    </div></div>`;
  const scrim = host.firstElementChild;
  let conf = null, abajoFuera = false;
  const cerrar = ()=>{ host.innerHTML=""; cerrarModal=null; document.removeEventListener("keydown",onKey);
                       if(alCerrar) alCerrar(); };
  const quitaConf = ()=>{ if(conf){ conf.remove(); conf = null; } };
  const pideCerrar = ()=>{
    if(!pendiente || !pendiente()){ cerrar(); return; }
    if(conf) return;
    conf = document.createElement("div"); conf.className = "mconf";
    conf.setAttribute("role","alertdialog"); conf.setAttribute("aria-modal","true");
    conf.innerHTML = `<div><b>Tienes cambios sin guardar</b><p>Si cierras ahora, se pierde lo que escribiste o el estatus que escogiste.</p>
      <div class="acts"><button class="btn-2" data-conf-sale>Cerrar sin guardar</button><button class="btn-1" data-conf-sigue>Seguir escribiendo</button></div></div>`;
    scrim.appendChild(conf); conf.querySelector("[data-conf-sigue]").focus();
  };
  const onKey = e => { if(e.key!=="Escape") return; if(conf) quitaConf(); else pideCerrar(); };
  cerrarModal = cerrar;
  document.addEventListener("keydown", onKey);
  scrim.addEventListener("pointerdown", e=>{ abajoFuera = e.target===scrim; });
  scrim.addEventListener("click", e=>{
    if(conf && conf.contains(e.target)){
      if(e.target.closest("[data-conf-sale]")) cerrar(); else if(e.target.closest("[data-conf-sigue]")) quitaConf();
      return; }
    if(e.target===scrim){ if(abajoFuera) pideCerrar(); abajoFuera = false; return; }
    abajoFuera = false;
    if(e.target.closest("[data-x],[data-cancelar]")) pideCerrar(); });
  const foco = scrim.querySelector("input,textarea,button");
  if(foco) foco.focus();
  return {scrim, cerrar};
}

function listaModal({kick,titulo,ph,items,get,nombre,aplicar,aviso}){
  const sel = new Set(get);
  const pinta = q => items.filter(it=>!q||norm(it.busca).includes(q)).map(it=>
    rowHTML(sel.has(it.v), it.izq, it.t, it.s, it.v, it.r)).join("") ||
    `<p class="hint" style="padding:18px 4px">Sin coincidencias.</p>`;
  const {scrim,cerrar} = modal({
    kick, titulo,
    cuerpo:(aviso?`<p class="resume" style="margin:0 0 14px">${aviso}</p>`:"")+
      `<div class="srch">${ico("buscar","")}<input class="inp" id="mq" placeholder="${esc(ph)}" autocomplete="off"></div>`+
      `<div class="mrow"><p class="hint" id="mcount">${items.length} opciones disponibles</p>
        <button class="lnk" id="mall">Seleccionar todos</button></div>
      <div class="list" id="mlist">${pinta("")}</div>`,
    pie:`<p><strong id="mn">${sel.size}</strong> ${esc(nombre)}</p>
      <div class="acts"><button class="btn-2" data-cancelar>Cancelar</button>
      <button class="btn-1" id="mok">Aplicar selección</button></div>`
  });
  const lista = scrim.querySelector("#mlist"), cont = scrim.querySelector("#mn"), cnt = scrim.querySelector("#mcount");
  const q = () => { const el = scrim.querySelector("#mq"); return el ? norm(el.value.trim()) : ""; };
  const refresca = ()=>{ lista.innerHTML = pinta(q()); cont.textContent = sel.size;
    cnt.textContent = lista.querySelectorAll(".row").length+" opciones disponibles"; };
  if(scrim.querySelector("#mq")) scrim.querySelector("#mq").addEventListener("input", refresca);
  lista.addEventListener("click", e=>{ const b=e.target.closest(".row"); if(!b) return;
    const v=b.dataset.v; sel.has(v)?sel.delete(v):sel.add(v); b.classList.toggle("on"); cont.textContent=sel.size; });
  scrim.querySelector("#mall").addEventListener("click", ()=>{
    const vs=[...lista.querySelectorAll(".row")].map(b=>b.dataset.v);
    const todos=vs.every(v=>sel.has(v)); vs.forEach(v=>todos?sel.delete(v):sel.add(v)); refresca(); });
  scrim.querySelector("#mok").addEventListener("click", ()=>{ aplicar(sel); cerrar(); pintar(); });
}

      <div class="mrow"><p class="hint">Seleccionar por rango</p><span class="acts"><button class="lnk" id="mlimpia" title="Quita todas las cuentas para elegir solo las que quieras">Limpiar cuentas</button><button class="lnk" id="mtodas">Incluir todas</button></span></div>
      <div class="ranges" id="mrang">${rangos()}</div>

      <p class="hint" style="margin-top:12px">Toca un rubro para incluirlo o excluirlo completo, y desmarca las cuentas específicas que quieras dejar fuera.</p>`,

  });
  const $r=scrim.querySelector("#mrang"), $l=scrim.querySelector("#mlist");

function mCriterio(){
  const t = {pct:S.umbPct, mxn:S.umbMxn, dir:S.dir, rec:S.rec, sil:S.verSil?"si":"no"};
  const pisos = [[0,"Sin piso"],[10000,"$10 mil"],[25000,"$25 mil"],[100000,"$100 mil"]];
  const chipset = (arr,val) => arr.map(([v,l])=>`<button class="chip${String(val)===String(v)?" on":""}" data-v="${v}">${esc(l)}</button>`).join("");
  const {scrim,cerrar} = modal({
    kick:"Umbral de revisión", titulo:"Criterio de revisión",
    cuerpo:`<div class="field"><label class="lb" for="cp">Porcentaje de referencia</label>
        <div class="pair"><input class="inp num" id="cp" type="number" min="0" step="10" value="${t.pct}"><span>% o más</span></div></div>
      <div class="field"><label class="lb" for="cm">Valor de referencia</label>
        <div class="pair"><span>$</span><input class="inp num" id="cm" type="number" min="0" step="5000" value="${t.mxn}"></div>
        <div class="chips" id="cpisos">${chipset(pisos,t.mxn)}</div></div>
      <div class="field"><span class="lb">Dirección</span>
        <div class="chips" id="cdir">${chipset([["todos","Todas"],["sube","Incrementos"],["baja","Disminuciones"]],t.dir)}</div></div>
      <div class="field"><span class="lb">Recurrencia</span>
        <div class="chips" id="crec">${chipset([["todos","Todas"],["si","Solo recurrentes"],["no","Solo únicas"]],t.rec)}</div></div>
      <div class="field"><span class="lb">Cuentas excluidas</span>
        <div class="chips" id="csil">${chipset([["no","Ocultarlos"],["si","Mostrarlos"]],t.sil)}</div></div>
      <p class="resume" id="cres"></p>`,
    pie:`<p>Afecta a los ${fNum.format(FILAS.filter(f=>f.anio===S.anio).length)} movimientos de ${S.anio}</p>
      <div class="acts"><button class="btn-2" data-cancelar>Cancelar</button>
      <button class="btn-1" id="mok">Aplicar criterio</button></div>`
  });
  const res = scrim.querySelector("#cres");
  const dibuja = ()=>{
    scrim.querySelectorAll("#cpisos .chip").forEach(b=>b.classList.toggle("on",String(t.mxn)===b.dataset.v));
    scrim.querySelectorAll("#cdir .chip").forEach(b=>b.classList.toggle("on",t.dir===b.dataset.v));
    scrim.querySelectorAll("#crec .chip").forEach(b=>b.classList.toggle("on",t.rec===b.dataset.v));
    scrim.querySelectorAll("#csil .chip").forEach(b=>b.classList.toggle("on",t.sil===b.dataset.v));
    const n = FILAS.filter(f=>f.anio===S.anio && (f.esPago || f.contra || Math.abs(f.v)*100>=t.pct-1e-9) && (t.mxn<=0||f.adif===null||f.adif>=t.mxn)
      && !(t.dir==="sube"&&f.v<=0) && !(t.dir==="baja"&&f.v>=0)
      && !(t.rec==="si"&&f.rec<2) && !(t.rec==="no"&&f.rec>1)).length;
    res.innerHTML = `Se mostrarán los movimientos con una variación de <strong>${t.pct}% o más</strong>, `+
      (t.mxn>0?`con un cambio de <strong>${fMoney.format(t.mxn)}</strong> o más`:"sin importe mínimo")+
      (t.dir==="todos"?"":`, solo ${t.dir==="sube"?"incrementos":"disminuciones"}`)+
      (t.rec==="todos"?"":`, solo los ${t.rec==="si"?"recurrentes":"de un único mes"}`)+
      `. <strong>${fNum.format(n)}</strong> cumplen hoy.`;
  };
  scrim.querySelector("#cp").addEventListener("input", e=>{ t.pct=parseFloat(e.target.value)||0; dibuja(); });
  scrim.querySelector("#cm").addEventListener("input", e=>{ t.mxn=parseFloat(e.target.value)||0; dibuja(); });
  scrim.querySelector("#cpisos").addEventListener("click", e=>{ const b=e.target.closest(".chip"); if(!b) return;
    t.mxn=+b.dataset.v; scrim.querySelector("#cm").value=t.mxn; dibuja(); });
  scrim.querySelector("#cdir").addEventListener("click", e=>{ const b=e.target.closest(".chip"); if(!b) return; t.dir=b.dataset.v; dibuja(); });
  scrim.querySelector("#crec").addEventListener("click", e=>{ const b=e.target.closest(".chip"); if(!b) return; t.rec=b.dataset.v; dibuja(); });
  scrim.querySelector("#csil").addEventListener("click", e=>{ const b=e.target.closest(".chip"); if(!b) return; t.sil=b.dataset.v; dibuja(); });
  scrim.querySelector("#mok").addEventListener("click", ()=>{
    S.umbPct=t.pct; S.umbMxn=t.mxn; S.dir=t.dir; S.rec=t.rec; S.verSil=(t.sil==="si"); cerrar(); pintar(); });
  dibuja();
}

async function comenta(p){

   de QUO (cada concepto con la cuenta donde QUO lo registró), por la única puerta var_facturas, que primero revisa quién ve
   ese cliente. Al abrir el desplegable trae el cuadre (de todas) y las primeras 500; «Ver más» trae las siguientes y cada

/* El Excel (y su PDF, siempre juntos) de las facturas del mes: «Facturas» y «Conceptos», con la marca PROFASE. Trae todas las

async function excelFacturasMes(f, R, V, mes, avance){

  if(V && L.length > (V.L.todas||[]).length) V.L.todas = L;

  const EX = await cargaExcelJS(), MK = window.PROFASE_MARCA;

      +(R.inv?"; en la 115, las compras de 502 (la póliza del mes las pasa a Inventario)":"")+" · exportado el "+cuando];
  const F = ["Fecha","Folio","UUID","Tipo","Recibida o emitida","RFC","Proveedor o cliente","Cuenta","Cargo","Abono","¿Cuenta?","Moneda","Tipo de cambio","Conceptos"];
  await hojaXL(wb, "Facturas", L.map(x=>({"Fecha":vfFecha(x.fe), "Folio":x.folio||"", "UUID":x.u||"", "Tipo":VF_TIPO(x), "Recibida o emitida":VF_MOV(x),
      "RFC":x.rfc||"", "Proveedor o cliente":x.nom||"", "Cuenta":vfCtas(x).join(", "), "Cargo":x.car||null, "Abono":x.abo||null,
      "¿Cuenta?":x.poliza?"Sí":"No: sin póliza en QUO", "Moneda":x.moneda||"MXN", "Tipo de cambio":x.tc||1, "Conceptos":x.ncon})),
    F, {"Cargo":"#,##0.00", "Abono":"#,##0.00", "Tipo de cambio":"#,##0.0000"}, {fijar:2, titulo:"Facturas del mes · Variaciones", lineas});
  const C = ["Folio","UUID","Clave SAT","Descripción","Unidad","Cantidad","Valor unitario","Importe","Cuenta","Cargo o abono"];

/* --- varios a la vez: estatus y comentario (3-nov-2026, pedido de Fernando Cadengo) ---
   La Gerencia Contable y quienes comentan el cliente; a cada hallazgo marcado se le aplica lo que se puede con sus reglas
   (reglaEstatus) y lo demás se salta, diciendo cuántos y por qué. Desde el 4-nov-2026 el comentario entra a la plática de
   cada hallazgo como un comentario aparte, con el nombre y la hora de quien lo escribe (218_variaciones_platica.sql). */
function planVarios(rids, invit, texto){
  const items = [], com = [], salto = {cliente:0, exito:0, quo:0, regla:0, com:0};
  for(const rid of rids){
    const a = lee(rid);
    if(invit && invit!==a.i){
      if(!puedeEst() && !puedeCom(rfcDe(rid))) salto.cliente++;
      else { const m = reglaEstatus(a.i, invit);
        if(!m) items.push({rid, campos:{invit}});
        else if(m===MSJ_FIJO) salto.exito++; else if(m===MSJ_QUO) salto.quo++; else salto.regla++; }
    }
    if(texto){
      if(!puedeComV(rid)) salto.com++;
      else com.push(rid);
    }
  }
  const n = new Set([...items.map(x=>x.rid), ...com]).size;
  return {items, com, n, salto};
}
function textoSaltos(sl){
  const p = [];
  if(sl.cliente) p.push(fNum.format(sl.cliente)+(sl.cliente===1?" no es":" no son")+" de tus clientes");
  if(sl.exito) p.push(fNum.format(sl.exito)+(sl.exito===1?" está":" están")+" en Modificación Exitosa (solo la Gerencia Contable la cambia)");
  if(sl.quo) p.push(fNum.format(sl.quo)+(sl.quo===1?" está":" están")+" en Modificación QUO (de ahí a Modificación Exitosa, a Consulta con Gerencia o de regreso a Consulta con el Cliente)");
  if(sl.regla) p.push(fNum.format(sl.regla)+(sl.regla===1?" no estaba":" no estaban")+" en Modificación QUO (Modificación Exitosa va después de Modificación QUO)");
  if(sl.com) p.push(fNum.format(sl.com)+" sin comentario (no son de tus clientes)");
  return p.join(" · ");
}

      if(typeof c==="string") r = p.items.length ? "El estatus se aplicó, pero el comentario no: "+c : c;
      else await avisar(p.com, {invit:"", comentario:texto}, {c:0, i:0, com:c.hechos||p.com.length});
    }
    if(r===true){
      const sl = textoSaltos(p.salto);

      /* ya aplicado, se desmarcan los hallazgos (los filtros se quedan como estaban): así el siguiente cambio
         masivo no les cae otra vez a los ya trabajados (pedido del staff por Gabo, «sí, así es» 10-nov-2026) */

/* --- guardar (uno o varios) ---
   El estatus va a «var_est»; el comentario va a la plática por la base (comenta(), 218_variaciones_platica.sql). Varios a la vez se mandan en tandas de 200 para no tardar. La base
   revisa lo mismo (07_variaciones.sql y 210_variaciones_estatus.sql). */
const rfcDe = rid => { const f = PORRID.get(rid); return f ? f.rfc : String(rid).split("_")[0]; };
async function escribeVarios(col, docs, avance, total){
  const P = window.PORTAL, ids = Object.keys(docs);
  if(P && P.sb && ids.length > 1){
    for(let i=0; i<ids.length; i+=200){
      const r = await P.sb.from("docs").upsert(ids.slice(i,i+200).map(id=>({col, id, data:docs[id]})), {onConflict:"col,id"});
      if(r.error){ const x = new Error(r.error.message); x.code = r.error.code==="42501" ? "not_granted" : (r.error.code||"error"); throw x; }
      if(avance) avance(Math.min(i+200, ids.length), total||ids.length);
    }
    return;
  }
  for(const id of ids) await dbNS.collection(col).doc(id).set(docs[id]);
  if(avance) avance(ids.length, total||ids.length);
}
const guardar = (rids, campos, avance) => guardarLista(rids.map(rid=>({rid, campos})), avance);
async function guardarLista(items, avance){
  if(!dbNS) return "No se puede guardar desde esta vista.";
  const ts = new Date().toLocaleString("es-MX",{timeZone:TZ,dateStyle:"medium",timeStyle:"short"});
  const iso = new Date().toISOString();
  const cam = {c:0, i:0, com:0}, est = {}, estI = new Set();
  for(const {rid, campos} of items){
    const a = lee(rid);
    const ni = campos.invit!==undefined ? campos.invit : a.i;
    if(ni!==a.i){
      if(!puedeI(rid)) return "El estatus de este cliente lo cambian la Gerencia Contable y sus contadores del WorkFlow.";
      const m = reglaEstatus(a.i, ni); if(m) return m+".";
      est[rid] = {invit:ni, motivo: campos.motivo!==undefined ? campos.motivo : (a.motivo||""), foto:fotoDe(rid),
                  ts, tsISO:iso, por:userId||"", porNombre:MI_NOMBRE};
      cam.i++; estI.add(ni);
    }
  }
  try{
    const total = cam.i;
    await escribeVarios("var_est", est, avance ? (k)=>avance(k, total) : null, total);
    Object.assign(EST, est); juntaRev();
    if(cam.i) await avisar(items.map(x=>x.rid), {invit: estI.size===1 ? [...estI][0] : "", comentario: ""}, cam);
    return true;
  }catch(err){
    const c = err && err.code ? err.code : "error";
    if(esRechazo(c)) return SIN_ESCRITURA;
    return "No se pudo guardar ("+c+"). Intenta de nuevo.";
  }
}

/* ---------- cuentas excluidas: guardar y regresar (solo la Gerencia Contable; la base no deja a nadie más) ---------- */
const idCaso = caso => caso.replace(/[^A-Za-z0-9_.~:@+-]/g,"_");
async function excluir({alcance, rfc, cta, vig, desde, quita}){
  if(!dbNS) return "No se puede guardar desde esta vista.";
  if(!puedeEst()) return "Las cuentas las excluye la Gerencia Contable.";
  const caso = "x|"+(alcance==="todos" ? "*" : rfc)+"|"+cta;
  const d = {caso, alcance: alcance==="todos" ? "todos" : "cliente", rfc: alcance==="todos" ? null : rfc, cta, vig, desde,
             por:userId||"", porNombre:MI_NOMBRE, ts:new Date().toISOString()};
  try{
    // si la que tenía es otra (de antes o del otro alcance), se regresa para que quede una sola
    if(quita && quita.caso!==caso) await regresaCuenta(quita, true);
    await dbNS.collection("var_casos").doc(idCaso(caso)).set(d);
    SIL[caso] = d;
    return true;
  }catch(e){ return "No se pudo guardar la exclusión ("+((e&&e.code)||"error")+")."; }
}
async function regresaCuenta(s, callado){
  if(!dbNS) return "No se puede guardar desde esta vista.";
  if(!puedeEst()) return "Las cuentas las regresa la Gerencia Contable.";
  if(!s || !s.caso) return true;
  try{
    await dbNS.collection("var_casos").doc(idCaso(s.caso))
      .set({vig:null, desdeMes:null, desde:null, caso:s.caso, alcance:s.alcance||null, cta:s.cta||null, rfc:s.rfc||null,
            por:userId||"", porNombre:MI_NOMBRE, ts:new Date().toISOString()});
    delete SIL[s.caso];
    return true;
  }catch(e){ return callado ? true : "No se pudo regresar la cuenta ("+((e&&e.code)||"error")+")."; }
}

  return [...m].map(([ci,ms])=>{ const [nom, rfc, cont, , grupo] = BASE.clientes[ci];
    return {ci, nom, rfc, cont, grupo:grupo||"—", meses:ms.sort((a,b)=>a-b)}; })

/* ---------- exportar en Excel (y su PDF) ---------- */
/* El libro lleva una fila por hallazgo con su seguimiento, y el movimiento mes a mes de cada caso. Desde el 3-nov-2026 ya no
   se regresa con «Importar Excel» (se quitó, pedido de Fernando Cadengo): el estatus y el comentario se cambian en la
   pantalla, también varios a la vez. */
const XH = {id:"ID hallazgo", i:"Estatus de revisión", com:"Comentario"};
const LIGA = "https://crmprofase.com.mx/variaciones.html";
// La empresa timbra nómina en el año si su balanza trae movimiento en las cuentas de nómina (601.01–601.31) ese año.
let TIMBRA = null;
const timbraNomina = (rfc, y) => {
  if(!TIMBRA){
    TIMBRA = new Set();
    const nomK = new Set();
    BASE.cuentas.forEach(([cta],i)=>{ if(/^601\.(0[1-9]|[12]\d|3[01])\b/.test(cta)) nomK.add(i); });
    for(const [ci,ct,p,v] of (BASE.mov||[])) if(v && nomK.has(ct)) TIMBRA.add(BASE.clientes[ci][1]+"|"+p.slice(0,4));
  }
  return TIMBRA.has(rfc+"|"+y);
};
// Observaciones del hallazgo para el Excel, en palabras
const observacionesDe = f => {
  const o = [], tag = f.tag||"";
  if(tag.startsWith("ROMPE")){
    const caso = CASOS.get(f.caso);
    const ms = [...new Set((caso ? caso.ocur : [f]).filter(x=>(x.tag||"").startsWith("ROMPE")).map(x=>x.mesN))];
    o.push("No se provisionó nómina en "+(ms.length ? ms.join(", ") : f.mesN));
  } else if(tag.startsWith("FALTA")){
    const m = /sin movimiento en ([^\s;]+) ni ([^\s;]+)/.exec(tag);
    o.push("No se provisionó en "+(m ? m[1]+" y "+m[2] : f.mesN)+" (cuenta bimestral)");
  } else if(tag.startsWith("PAGO") || tag.startsWith("SIN PAGO")){
    const txt = tag.replace(/^[^:]+:\s*/,""); o.push(txt.charAt(0).toUpperCase()+txt.slice(1));
  } else if(f.acr && tag){
    o.push(tagTxt(tag)+" (cuenta acreedora): "+tag.replace(/^[^:]+:\s*/,""));
  } else if(tag.startsWith("BIMESTRAL")) o.push("Cuenta bimestral: "+tag.replace(/^BIMESTRAL:\s*/,""));
  else if(tag.startsWith("REAPARECE")) o.push("La cuenta reaparece: "+tag.replace(/^REAPARECE:\s*/,""));
  else if(tag) o.push(tagTxt(tag));
  if(f.baseneg) o.push(f.acr ? "El saldo inicial era negativo" : "El mes anterior fue negativo");
  if(f.calc) o.push("Calculado");
  if(silenciado(f)) o.push("Cuenta excluida: "+exclTexto(f));
  return o.join(" · ");
};
const marcasDe = f => [f.tag||"", f.baseneg?"Base negativa":"", f.calc?"Calculado":"", silenciado(f)?"Cuenta excluida":""].filter(Boolean).join(" · ");

/* El libro se escribe con ExcelJS, con la marca PROFASE (js/marca.js) y su PDF al lado. */
let EXJS = null;
function cargaExcelJS(){
  if(window.ExcelJS) return Promise.resolve(window.ExcelJS);
  if(!EXJS) EXJS = new Promise((res,rej)=>{
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js";
    s.onload = ()=> window.ExcelJS ? res(window.ExcelJS) : rej(new Error("sin generador de Excel"));
    s.onerror = ()=>{ EXJS = null; rej(new Error("no cargó el generador de Excel")); };
    document.head.appendChild(s);
  });
  return EXJS;
}
const XL_COLOR = {cab:"FF1F3864", txt:"FFFFFFFF", borde:"FFD5DEE6"};
async function hojaXL(wb, nombre, filas, cols, formatos, op){
  op = op || {};
  const MK = window.PROFASE_MARCA;
  const ws = wb.addWorksheet(nombre);
  // en el PDF (siempre junto al Excel) no van el ID ni la liga
  ws.__pdf = {sin:[XH.id, "Liga al hallazgo"]};
  ws.columns = cols.map(c=>({key:c, width: Math.min(c===XH.com?60:48, Math.max(10, c.length+2,
    ...filas.slice(0,200).map(r=>String(r[c]==null?"":r[c]).length+1)))}));
  // marca PROFASE arriba (js/marca.js); los encabezados van en el renglón h
  const h = MK.encabezado(wb, ws, cols.length, {titulo: op.titulo, lineas: op.lineas});
  cols.forEach((c,i)=>{ ws.getCell(h, i+1).value = c; });
  filas.forEach((r,k)=>{ const row = ws.getRow(h+1+k); cols.forEach((c,i)=>{ const v = r[c]; row.getCell(i+1).value = v===undefined ? null : v; }); });
  ws.views = [{state:"frozen", ySplit:h, xSplit:op.fijar||0}];
  const borde = {style:"thin", color:{argb:XL_COLOR.borde}}, B = {top:borde, left:borde, bottom:borde, right:borde};
  ws.getRow(h).height = 30;
  cols.forEach((c,i)=>{
    const hc = ws.getCell(h, i+1);
    hc.font = {name:MK.fuente, size:10, bold:true, color:{argb:XL_COLOR.txt}};
    hc.fill = {type:"pattern", pattern:"solid", fgColor:{argb:XL_COLOR.cab}};
    hc.alignment = {vertical:"middle", wrapText:true}; hc.border = B;
    const fmt = formatos && formatos[c];
    for(let r=h+1; r<=filas.length+h; r++){
      const cel = ws.getCell(r, i+1);
      cel.border = B; cel.font = {name:MK.fuente, size:10};
      if(fmt) cel.numFmt = fmt;
      if(c===XH.com) cel.alignment = {wrapText:true, vertical:"top"};
    }
  });
  if(filas.length) ws.autoFilter = {from:{row:h, column:1}, to:{row:filas.length+h, column:cols.length}};
  MK.impresion(ws, {repetir:h});
  return ws;
}

  const lineaXL = fNum.format(lista.length)+" variaciones · año "+S.anio+" · exportado el "+cuando;
  const COLV = [XH.id,"Hallazgo #","Año","Mes","Cliente","RFC","Grupo","Contador","Cuenta","Nombre de la cuenta","Rubro",
    "Timbra nómina","Base del cálculo","Variación %","Mes anterior","Mes evaluado","Cambio","Aumentó / Disminuyó","Cargos del mes","Abonos del mes",
    "Saldo contrario a su naturaleza","Recurrencia (meses)","Observaciones",
    XH.i, XH.com, "Motivo","Última actualización","Modificó","Cuenta excluida","Liga al hallazgo"];
  const filas = lista.map(f=>{ const e = lee(f.rid); return {
    [XH.id]:f.rid, "Hallazgo #":f.num, "Año":f.anio, "Mes":f.mesN, "Cliente":f.cliente, "RFC":f.rfc, "Grupo":f.grupo,
    "Contador":f.contador||"", "Cuenta":f.cta, "Nombre de la cuenta":f.nombre, "Rubro":f.rubro, "Timbra nómina":timbraNomina(f.rfc, f.anio)?"Sí":"No",
    "Base del cálculo": f.acr ? "Saldo (cuenta acreedora): mes anterior = saldo inicial, mes evaluado = saldo final, cambio = abonos − cargos"
      : f.esPago ? "Provisión del mes anterior contra el pago del mes"
      : f.cero ? "Comparado contra $0: el mes anterior no tuvo movimiento en esta cuenta (la variación puede verse muy alta)"
      : "Movimiento del mes contra el del mes anterior",
    "Variación %":f.cero ? null : f.v, "Mes anterior":f.ap, "Mes evaluado":f.ac, "Cambio":f.dif, "Aumentó / Disminuyó":f.sentido,
    "Cargos del mes":f.car, "Abonos del mes":f.abo, "Saldo contrario a su naturaleza":f.contra?"Sí":"",
    "Recurrencia (meses)":f.rec, "Observaciones":observacionesDe(f),
    [XH.i]:tI(e.i), [XH.com]:e.com, "Motivo":e.motivo, "Última actualización":e.ts||e.comTs, "Modificó":e.por?nombreReal(e.por)+rolTxt(e.rol):(e.comPor?nombreReal(e.comPor):""), "Cuenta excluida":exclTexto(f),
    "Liga al hallazgo":LIGA+"#"+f.rid }; });
  await hojaXL(wb, "Variaciones", filas, COLV, {"Variación %":"0.0%","Mes anterior":"#,##0.00","Mes evaluado":"#,##0.00","Cambio":"#,##0.00",
    "Cargos del mes":"#,##0.00","Abonos del mes":"#,##0.00"}, {fijar:1, titulo:"Bitácora de variaciones DECOMSA", lineas:[lineaXL]});

  if(conHist){
    // movimiento mes a mes de cada caso exportado (cliente + cuenta), con lo que haya rebasado el criterio
    const COLH = [XH.id,"Cliente","RFC","Cuenta","Nombre de la cuenta","Año","Mes","Saldo mes anterior","Saldo del mes",
      "Cargos","Abonos","Aumentó / Disminuyó","Variación %","Tipo","¿Es hallazgo?",XH.i,XH.com];
    const idx = new Map(), hist = [], vistos = new Set();
    const celdas = (y, rfc, cta) => {
      if(!idx.has(y)){ const m = new Map();
        for(const c of variacionesAnio(y).values()) for(const [ci,cel] of c.empMov) m.set(BASE.clientes[ci][1]+"|"+c.cta, cel);
        idx.set(y, m); }
      return idx.get(y).get(rfc+"|"+cta);
    };
    lista.forEach(f=>{
      if(vistos.has(f.caso)) return; vistos.add(f.caso);
      const cel = celdas(f.anio, f.rfc, f.cta);
      const meses = cel ? [...cel.keys()].sort((a,b)=>a-b) : (CASOS.get(f.caso)||{ocur:[f]}).ocur.map(o=>o.mes);
      meses.forEach(m=>{
        const x = cel ? cel.get(m) : null;
        const h = x ? (x.hall && (S.verSil || !silenciado(x.hall)) ? x.hall : null)
                    : (CASOS.get(f.caso)||{ocur:[]}).ocur.find(o=>o.mes===m) || null;
        const e = h ? lee(h.rid) : null;
        hist.push({[XH.id]:f.rid, "Cliente":f.cliente, "RFC":f.rfc, "Cuenta":f.cta, "Nombre de la cuenta":f.nombre,
          "Año":f.anio, "Mes":MESES.get(m)||MESES_ES[m-1],
          // acreedoras: saldo inicial y saldo final del mes; las demás, el movimiento del mes anterior y el del mes
          "Saldo mes anterior":x?(x.acr?x.ini:x.ant):(h?h.ap:null), "Saldo del mes":x?(x.acr?x.sf:x.act):(h?h.ac:null),
          "Cargos":x&&x.acr?x.car:(h?h.car:null), "Abonos":x&&x.acr?x.abo:(h?h.abo:null),
          "Aumentó / Disminuyó":x&&x.acr?sentidoDe(x.aum):(h?h.sentido:""),
          "Variación %":x?x.v:(h?h.v:null), "Tipo":x?(x.sf<0&&x.acr?"Saldo contrario a su naturaleza":x.tipo==="alta"?"Alta de cuenta":x.tipo==="baja"?"Baja de cuenta":"Variación"):(h&&h.contra?"Saldo contrario a su naturaleza":"Variación"),
          "¿Es hallazgo?":h?"Sí":"No", [XH.i]:e?tI(e.i):"", [XH.com]:e?e.com:""});
      });
    });
    await hojaXL(wb, "Mes a mes", hist, COLH, {"Variación %":"0.0%","Saldo mes anterior":"#,##0.00","Saldo del mes":"#,##0.00","Cargos":"#,##0.00","Abonos":"#,##0.00"},
      {titulo:"Bitácora de variaciones DECOMSA · Mes a mes", lineas:["Saldo de cada mes de los casos exportados (misma empresa y cuenta)"]});
  }

  // cómo se lee (no va en el PDF)
  const ins = [
    ["Cómo se lee esta bitácora"],
    ["Cada renglón de «Variaciones» es un hallazgo: una cuenta de un cliente que en ese mes se movió fuera del criterio vigente contra el mes anterior."],
    ["«Comparado contra $0»: el mes anterior la cuenta no tuvo movimiento (y el cliente sí tenía balanza); la variación no tiene porcentaje y puede verse muy alta."],
    ["«Baja de cuenta»: la cuenta traía movimiento y el mes evaluado quedó en $0."],
    ["Los meses en que la balanza de un cliente viene completa en $0 no dan hallazgos: se ven con el botón «Balanzas en 0» de la pantalla."],
    ["Estatus: Sin revisión, Consulta con el Cliente, Consulta con Gerencia, Modificación QUO, Justificado y Modificación Exitosa. «Justificado» y «Modificación Exitosa» cuentan como revisado. Se cambian en la pantalla."],
    ["La hoja «Mes a mes» muestra el saldo de cada mes del caso (misma empresa y cuenta) y si ese mes rebasó el criterio."],
    ["Cuentas acreedoras (pasivo y capital): la variación se mide sobre el saldo, (saldo final − saldo inicial) ÷ |saldo inicial|; «Mes anterior» es el saldo inicial, «Mes evaluado» el saldo final y «Cambio» el aumento del mes (abonos − cargos: positivo aumentó, negativo disminuyó). Un saldo final negativo se marca «Saldo contrario a su naturaleza»."]
  ];
  const wi = wb.addWorksheet("Cómo se lee", {views:[{showGridLines:false}]});
  wi.__pdf = {omitir:true};
  wi.getColumn(1).width = 120;
  const i0 = MK.encabezado(wb, wi, 1, {titulo:"Bitácora de variaciones DECOMSA", lineas:["Exportado el "+cuando, fNum.format(lista.length)+" variaciones · año "+S.anio+" · criterio vigente: "+textoCrit(CRIT)]});
  ins.forEach((l,k)=>{ const c = wi.getCell(i0+k, 1); c.value = l[0]; c.alignment = {wrapText:true}; c.font = {name:MK.fuente, size:10}; });
  wi.getCell(i0,1).font = {name:MK.fuente, size:11, bold:true, color:{argb:MK.colores.azul}};
  MK.impresion(wi);

  // con PROFASE_MARCA.guardar(): el mismo libro sale en Excel o, con su botón «PDF» al lado, en PDF (siempre juntos)
  const nombre = "Bitacora variaciones DECOMSA "+new Date().toLocaleDateString("en-CA",{timeZone:TZ})+".xlsx";
  try{ await MK.guardar(wb, nombre); return "Listo: se descargó."; }
  catch(e){
    if(e && e.code==="declined") return "Descarga cancelada.";
    return "No se pudo descargar ("+((e&&e.code)||e&&e.message||"error")+").";
  }
}

function mExportar(){
  const vis = window.__vis || [];
  const marc = [...S.marcadas].map(r=>PORRID.get(r)).filter(Boolean);
  let alc = marc.length ? "marc" : "vis", hist = true;
  const {scrim} = modal({
    kick:"Descarga", titulo:"Exportar a Excel o PDF",
    cuerpo:`<div class="field"><span class="lb">Qué variaciones</span>
        <div class="chips" id="xAlc">
          <button class="chip${alc==="marc"?" on":""}" data-v="marc"${marc.length?"":" disabled"}>Marcadas · ${fNum.format(marc.length)}</button>
          <button class="chip${alc==="vis"?" on":""}" data-v="vis">Con los filtros actuales · ${fNum.format(vis.length)}</button>
        </div></div>
      <div class="field"><span class="lb">Hoja «Mes a mes»</span>
        <div class="chips" id="xHist">
          <button class="chip on" data-v="1">Incluir el movimiento mes a mes de cada caso</button>
          <button class="chip" data-v="0">Sin historial</button>
        </div></div>
      <p class="resume">El libro trae una fila por variación con cliente, cuenta, variación, mes anterior, mes evaluado, cambio (con «Aumentó» o «Disminuyó» en las acreedoras), cargos y abonos del mes, marcas,
        estatus de revisión, comentario y la liga directa.</p>
      <p class="saved" id="xSaved"></p>`,
    pie:`<p id="xN"></p>
      <div class="acts"><button class="btn-2" data-cancelar>Cancelar</button>
      <button class="btn-1" id="xOk" data-excel>Descargar Excel</button></div>`
  });
  const q = s => scrim.querySelector(s);
  const cuenta = ()=>{ const n = alc==="marc" ? marc.length : vis.length;
    q("#xN").innerHTML = `<strong>${fNum.format(n)}</strong> ${n===1?"variación":"variaciones"}`; q("#xOk").disabled = !n; };
  q("#xAlc").addEventListener("click", e=>{ const b=e.target.closest(".chip"); if(!b||b.disabled) return; alc=b.dataset.v;
    scrim.querySelectorAll("#xAlc .chip").forEach(x=>x.classList.toggle("on", x===b)); cuenta(); });
  q("#xHist").addEventListener("click", e=>{ const b=e.target.closest(".chip"); if(!b) return; hist = b.dataset.v==="1";
    scrim.querySelectorAll("#xHist .chip").forEach(x=>x.classList.toggle("on", x===b)); });
  q("#xOk").addEventListener("click", async ()=>{
    const ok = q("#xOk"), av = q("#xSaved");
    ok.disabled = true; av.textContent = "Armando el archivo…";
    try{ av.textContent = await exportar(alc==="marc" ? marc : vis, hist); }
    catch(e){ av.textContent = "No se pudo armar el archivo ("+(e.message||e)+")."; }
    ok.disabled = false;
  });
  cuenta();
}

document.getElementById("exportarBtn").addEventListener("click", mExportar);

/* ---------- eventos ---------- */
document.getElementById("anios").addEventListener("click", e=>{
  const b=e.target.closest(".anio"); if(!b||b.disabled) return;
  S.anio = +b.dataset.y; S.marcadas.clear(); pintar();
});
document.getElementById("cards").addEventListener("click", e=>{
  const b=e.target.closest(".card"); if(!b) return; VENTANAS[b.dataset.m]();
});
document.getElementById("colsbtn").addEventListener("click", mColumnas);
document.getElementById("usuarios").addEventListener("click", mUsuarios);
document.getElementById("campana").addEventListener("click", mNotif);
document.getElementById("graf").addEventListener("click", e=>{
  const b=e.target.closest("[data-mes]"); if(!b) return;
  const m=+b.dataset.mes; S.meses.has(m)?S.meses.delete(m):S.meses.add(m); pintar();
});
document.getElementById("gTabla").addEventListener("click", ()=>{ GR.tabla = !GR.tabla; pintarGrafica(); });
let tGraf = 0; window.addEventListener("resize", ()=>{ clearTimeout(tGraf); tGraf = setTimeout(pintarGrafica, 150); });
document.getElementById("rFiltro").addEventListener("click", e=>{
  const b=e.target.closest("button[data-v]"); if(!b) return; RS.filtro = b.dataset.v; pintarResueltas();
});
document.getElementById("rtb").addEventListener("click", e=>{
  const tr=e.target.closest("tr[data-rid]"); if(tr && PORRID.get(tr.dataset.rid)) mSeguimiento(tr.dataset.rid);
});
document.getElementById("thr").addEventListener("click", e=>{
  if(e.target.closest("#cball")){
    const vis = window.__vis||[];
    const todas = vis.length>0 && vis.every(f=>S.marcadas.has(f.rid));
    vis.forEach(f=> todas ? S.marcadas.delete(f.rid) : S.marcadas.add(f.rid));
    pintar(); return;
  }
  const b=e.target.closest("button[data-k]"); if(!b) return;
  let k=b.dataset.k; if(k==="dif") k="adif";
  if(S.orden===k) S.asc=!S.asc; else { S.orden=k; S.asc=["cliente","grupo","sigla","cta","nombre"].includes(k); }
  pintar();
});
document.getElementById("gAbrir").addEventListener("click", ()=>{
  if(SH.abiertas.size) SH.abiertas.clear(); else SH.ctas.forEach(k=>SH.abiertas.add(k));
  SH.toco = true; pintar();
});
document.getElementById("tb").addEventListener("click", e=>{
  const sk = e.target.closest("tr.gsub button[data-k]");
  if(sk){ let k=sk.dataset.k; if(k==="dif") k="adif";
    if(S.orden===k) S.asc=!S.asc; else { S.orden=k; S.asc=["cliente","grupo","sigla","cta","nombre"].includes(k); }
    pintar(); return; }
  if(e.target.closest("tr.gsub")) return;
  const cb = e.target.closest("[data-cb]");
  if(cb){ marcaCasilla(cb.dataset.cb); return; }
  if(e.target.closest("[data-mas]")){ if(TABLA.siguiente) TABLA.siguiente(); return; }
  const gm = e.target.closest("[data-gmas]");
  if(gm){ const k = gm.dataset.gmas; SH.lim.set(k, (SH.lim.get(k) || TANDA) + TANDA*2); pintar(); return; }
  const gc = e.target.closest("tr.gcta");
  if(gc){ const k = gc.dataset.gcta; SH.abiertas.has(k) ? SH.abiertas.delete(k) : SH.abiertas.add(k); SH.toco = true; pintar(); return; }
  const b = e.target.closest("[data-seg],[data-det]");
  if(b){ mSeguimiento(b.dataset.seg || b.dataset.det); return; }
  const tr = e.target.closest("tr"); if(tr && tr.dataset.rid) mSeguimiento(tr.dataset.rid);
});
let tBusca = 0;
document.getElementById("q").addEventListener("input", e=>{
  clearTimeout(tBusca); tBusca = setTimeout(()=>{ S.q=norm(e.target.value.trim()); pintar(); }, 220); });
document.getElementById("limpiar").addEventListener("click", ()=>{
  S.origen = null;
  S.q=""; S.meses.clear(); S.clientes.clear(); S.grupos.clear(); S.contadores.clear();
  S.estC.clear(); S.estI.clear(); S.ctasOff.clear(); S.ctasSolo.clear(); S.marcadas.clear();
  S.dir="todos"; S.rec="todos"; S.umbPct=UMB_VISTA; S.umbMxn=0; S.verSil=false; S.cero="si";
  document.getElementById("q").value=""; pintar();
});

/* ---------- datos nuevos ----------
   La actualización del portal lee las balanzas cada 3 horas. Si llegan con la página abierta, se ofrece cargarlas. */
const AVISO_HORAS = 7;
const horasDe = iso => iso ? (Date.now()-new Date(iso).getTime())/3600000 : Infinity;
const fHora = iso => new Date(iso).toLocaleString("es-MX",{timeZone:TZ,weekday:"long",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit",hourCycle:"h23"});
function pintarLead(extra){
  const act = D.generado ? " · datos de la base al "+fHora(D.generado) : "";
  const viejo = horasDe(D.generado) > AVISO_HORAS ? " · tienen más de "+AVISO_HORAS+" horas; se actualizan solos cada 3 horas" : "";
  document.getElementById("lead").textContent =
    `${D.periodo} · ${fNum.format(new Set(FILAS.map(f=>f.rfc)).size)} de ${D.totalClientes} clientes con hallazgos · ${fNum.format(FILAS.length)} variaciones (${textoCrit(CRIT)})${act}${viejo}${extra||""}`;
}
const btnR = document.getElementById("recargar");
btnR.addEventListener("click", ()=>{ btnR.disabled = true; location.reload(); });
function hayNuevos(){ btnR.hidden = false; pintarLead(" · hay datos nuevos"); }

/* ---------- arranque ---------- */
pintarLead();
pintar();

/* liga directa a un hallazgo: …/artifact/<id>#<RFC_mes_cuenta> */
let hashAbierto = false;
function abrirHash(){
  if(hashAbierto) return; hashAbierto = true;
  const f = PORRID.get(location.hash.slice(1));
  if(f){ S.anio = f.anio; mSeguimiento(f.rid); }
}

/* ---------- datos compartidos (portal) ---------- */
if(window.top===window) document.getElementById("alPortal").hidden = false;   // abierta sola, fuera de la pestaña
else { const h1 = document.querySelector("main .titlebar h1"); if(h1) h1.hidden = true; }   // en la pestaña el título ya está arriba
(async ()=>{
  if(!window.claude){ abrirHash(); return; }
  userNS = await claude.use("user").catch(()=>null);
  if(userNS){ try{ userId = await userNS.id(); }catch(e){} }
  const db = await claude.use("db").catch(()=>null);
  if(!db){ abrirHash(); return; }
  dbNS = db;
  const P = window.PORTAL || {};
  MI_USUARIO = (P.perfil && P.perfil.usuario) || ""; MI_ROL = (P.perfil && P.perfil.rol) || ""; MI_NOMBRE = (P.perfil && P.perfil.nombre) || "";
  if(userId && MI_NOMBRE) NOMBRES[userId] = MI_NOMBRE;
  try{ const r = await P.sb.rpc("es_gerencia_contable"); PUEDE_EST = r.data===true; }catch(e){ PUEDE_EST = false; }
  try{ const d = await db.doc("datos/var_permisos").get(); const pr = d.exists ? (d.data().porRfc||{}) : {};
       MIS_RFC = new Set(Object.keys(pr).filter(r=>(pr[r]||[]).includes(MI_USUARIO))); }catch(e){}
  if(window.PROFASE_OCULTOS){ await window.PROFASE_OCULTOS.carga(); window.PROFASE_OCULTOS.alCambiar(()=>{ S.clientes.forEach(r=>{ if(OCU(r)) S.clientes.delete(r); }); pintar(); }); }
  // los contadores abren con sus clientes; «Limpiar filtros» muestra todos
  if(MI_ROL==="contador" && !S.clientes.size){
    const mios = CLIENTES.filter(c=>MIS_RFC.has(c.rfc)&&!OCU(c.rfc)).map(c=>c.rfc);
    if(mios.length) S.clientes = new Set(mios);
  }
  document.getElementById("usuarios").hidden = true;
  document.getElementById("campana").hidden = false;
  try{ LEIDO = localStorage.getItem("var-leido-"+(userId||"")) || ""; }catch(e){}
  const mapa = s => { const n={}; s.docs.forEach(d=>{ if(d.exists) n[d.id]=d.data(); }); return n; };
  // primero lo ya capturado, para que una liga directa abra el hallazgo con su estatus
  try{ const [a, b] = await Promise.all([db.collection("var_est").get(), db.collection("var_com").get()]);
       EST = mapa(a); COMS = mapa(b); juntaRev(); }catch(e){}
  db.collection("var_est").onSnapshot(s=>{ EST = mapa(s); juntaRev(); pintarLuego(); }, ()=>{});
  db.collection("var_com").onSnapshot(s=>{ COMS = mapa(s); juntaRev(); pintarLuego(); }, ()=>{});
  db.doc("datos/meta").onSnapshot(d=>{
    const v = d && d.exists ? (d.data().var||"") : "";
    if(v && HORA_DATOS && v!==HORA_DATOS) hayNuevos();
  }, ()=>{});
  db.collection("var_casos").onSnapshot(s=>{
    const n={}; s.docs.forEach(d=>{ if(d.exists){ const v=d.data();
      if(v && v.caso && v.vig!==null && v.vig!==undefined) n[v.caso]=v; } }); SIL=n; pintarLuego();
  }, ()=>{});
  db.collection("var_eventos").onSnapshot(s=>{
    EVENTOS = s.docs.filter(d=>d.exists).map(d=>({id:d.id, ...d.data()}))
      .filter(e=>e && e.ts).sort((a,b)=>b.ts.localeCompare(a.ts));
    EVENTOS.forEach(e=>{ if(e.por && e.porNombre) NOMBRES[e.por] = e.porNombre; });
    pintarCampana();
  }, ()=>{});
  pintar(); pintarCampana();
  abrirHash();
})();
})();
</script>
