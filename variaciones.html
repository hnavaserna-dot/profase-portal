<!doctype html><html lang="es" data-rol="todos" data-incrustada="1"><head><meta charset="utf-8"><script>/* Cierre temporal del portal (30-oct-2026, pedido de Daniel cuando la base se trabó: «cierra temporalmente crm»;
   «Saca a todos del CRM con ese aviso y cuando quede ya les avisamos»).
   construir.py lo pone escrito al principio del <head> de cada página que arma (y va a mano en index.html), antes de
   cualquier otro script. Lee cierre.json, que vive en la raíz de profase-portal (no pasa por la base), y si dice
   "cerrado": true detiene la página y lleva a cerrado.html, que avisa y regresa sola al portal en cuanto cierre.json
   diga false. Si la página va en un marco, se lleva a la de arriba. Guarda a dónde iba cada quien para regresarlo ahí.
   Solo en crmprofase.com.mx: en las pruebas locales no hace nada (salvo con window.__PRUEBA_CIERRE).
   Si cierre.json no llega, la página sigue normal. No lee ni escribe nada de la base. */
(function () {
  'use strict';
  if (!/(^|\.)crmprofase\.com\.mx$/.test(location.hostname) && !window.__PRUEBA_CIERRE) return;
  if (/\/cerrado\.html$/.test(location.pathname)) return;
  // la llamada del soporte de Quo (sala.html?marca=quo, Q Chat): nunca lleva a la pantalla de cierre de PROFASE (PROFASE no
  // sale en los sistemas Quo); si la base no contesta, la misma sala lo dice con la marca de Quo
  if (/\/sala\.html$/.test(location.pathname) && /[?&]marca=quo(?:&|$)/.test(location.search)) return;
  var j = null;
  try {
    var x = new XMLHttpRequest();
    x.open('GET', '/cierre.json?t=' + Date.now(), false);
    x.send(null);
    if (x.status === 200) j = JSON.parse(x.responseText);
  } catch (e) { j = null; }
  if (!j || j.cerrado !== true) return;
  // «hasta» (2-nov-2026, Daniel: «no dejes ingresar al sistema hasta las nueve A.M.»): a esa hora abre solo
  if (j.hasta && !isNaN(Date.parse(j.hasta)) && Date.now() >= Date.parse(j.hasta)) return;
  var w = window;
  try { if (window.top && window.top.location.host === location.host) w = window.top; } catch (e) { w = window; }
  try {
    var r = w.location.pathname + w.location.search + w.location.hash;
    if (!/cerrado\.html/.test(r)) sessionStorage.setItem('profase-regreso', r);
  } catch (e) { /* sin almacenamiento: regresa a la entrada */ }
  try { window.stop(); } catch (e) { /* navegador viejo */ }
  try { w.location.replace('/cerrado.html'); } catch (e) { location.replace('/cerrado.html'); }
})();</script><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Portal PROFASE · Variaciones / Movimientos</title><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><script src="js/supabase.js?v=bb37eb706b"></script><script src="js/portal.js?v=001f58e6e8"></script><script src="js/marca.js?v=8eb6f0cb8f"></script><script src="js/bitacora.js?v=a62c64c724"></script><script src="js/seguimiento.js"></script><script src="js/filtros.js?v=0836a918f4"></script><script src="js/buscador.js?v=514b1d6650"></script><script src="js/ocultos.js?v=6fbbeb4ec0"></script><script src="js/quo-al-dia.js"></script><script src="js/pilas.js?v=e11dcfe3e0"></script></head><body>

/* Tablero de variaciones — paleta y componentes tomados del proyecto de Figma Make. */

:root[data-theme="light"]{
  --bg:#eef3f7; --header:#ffffff; --surface:#ffffff; --surface-2:#ffffff; --surface-3:#e9f2f9;
  --tile:rgba(10,38,51,.028); --tile-2:rgba(10,38,51,.06);

.x{display:grid;place-items:center;height:36px;width:36px;flex:none;border:0;border-radius:10px;background:none;

.mbody{padding:24px;overflow-y:auto}
.mfoot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;

.mfoot p{margin:0;font-size:12px;color:var(--ink-3)}
.mfoot strong{color:var(--ink)}
.inp{width:100%;border-radius:10px;border:1px solid var(--line-2);background:var(--tile);padding:10px 12px;
     font-size:13.5px;color:var(--ink)}
.inp::placeholder{color:var(--ink-4)}
.inp:focus{border-color:var(--accent);outline:none}
.srch{position:relative}
.srch svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);height:16px;width:16px;color:var(--ink-4)}
.srch .inp{padding-left:38px}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px}
.lnk{border:0;background:none;font-size:12px;font-weight:600;color:var(--accent-3);cursor:pointer;padding:0}
.lnk:hover{color:var(--ink)}
.list{margin-top:12px;max-height:46vh;overflow-y:auto;padding-right:4px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;width:100%;align-items:center;gap:12px;border-radius:10px;border:1px solid var(--line);
     background:var(--tile);padding:10px 12px;text-align:left;cursor:pointer;transition:.13s}
.row:hover{border-color:var(--line-2);background:var(--tile-2)}
.row.on{border-color:rgba(22,132,189,.55);background:var(--accent-soft)}
.chk{display:grid;place-items:center;height:20px;width:20px;flex:none;border-radius:6px;border:1px solid var(--line-2);
     background:var(--tile);color:transparent;transition:.13s}
.chk svg{height:12px;width:12px}
.row.on .chk{background:var(--accent);border-color:var(--accent);color:#fff}
.ini{display:grid;place-items:center;height:40px;width:40px;flex:none;border-radius:10px;background:var(--tile-2);
     font-size:11.5px;font-weight:700;color:var(--accent-3);font-family:var(--f-num)}
.ini.con-foto{border-radius:50%;overflow:hidden;padding:0}.ini.con-foto img{width:100%;height:100%;object-fit:cover;display:block}
.row .mid{min-width:0;flex:1}
.row .t{display:block;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{display:block;margin-top:2px;font-size:11.5px;color:var(--ink-3)}
.row .r{text-align:right;flex:none}
.row .r strong{display:block;font-size:13px;font-family:var(--f-num)}
.row .r span{font-size:10px;color:var(--ink-4)}
.ranges{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));margin-top:12px}
.rg{border-radius:10px;border:1px solid var(--line);background:var(--tile);padding:10px;text-align:left;
    cursor:pointer;transition:.13s}
.rg:hover{border-color:var(--line-2)}
.rg.on{border-color:rgba(22,132,189,.55);background:var(--accent-soft)}
.rg b{display:block;font-family:var(--f-num);font-size:13px;color:var(--accent-3)}
.rg span{display:block;font-size:11px;color:var(--ink-2);margin-top:1px}
.rg em{display:block;font-size:10px;font-style:normal;color:var(--ink-4);margin-top:2px}
.ghdr{display:flex;align-items:center;gap:8px;margin:14px 0 6px;font-size:10px;font-weight:700;
      text-transform:uppercase;letter-spacing:.12em;color:var(--ink-4)}
.ghdr b{font-family:var(--f-num);color:var(--accent-3)}
.ctarow{display:flex;width:100%;align-items:center;gap:10px;border-radius:9px;border:1px solid transparent;
        background:none;padding:7px 8px;text-align:left;cursor:pointer;transition:.13s}
.ctarow:hover{background:var(--tile-2)}
.ctarow .c{font-family:var(--f-num);font-size:12px;color:var(--ink-3);white-space:nowrap}
.ctarow .n{flex:1;min-width:0;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{border-radius:999px;padding:2px 8px;font-size:9px;font-weight:700;letter-spacing:.04em;white-space:nowrap}
.badge.inc{background:var(--up-soft);color:var(--up)}
.badge.exc{background:var(--tile-2);color:var(--ink-4)}
.ctarow.off .n,.ctarow.off .c{opacity:.45}
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
.lb{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3)}
.pair{display:flex;align-items:center;gap:8px}
.pair .inp{flex:1}
.pair span{font-size:12px;color:var(--ink-3);white-space:nowrap}
/* celular (regla de Daniel, 29-oct-2026: todo se acomoda a la pantalla): el texto junto al número baja de renglón en lugar de cortarse */
@media (max-width:560px){.pair{flex-wrap:wrap}.pair span{white-space:normal}.pair .inp{flex:0 0 110px;min-width:90px}}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{border-radius:999px;border:1px solid var(--line-2);background:var(--tile);padding:5px 12px;font-size:12px;
      cursor:pointer;transition:.13s;color:var(--ink-2)}
.chip:hover{border-color:var(--line-2);background:var(--tile-2)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-3);font-weight:600}
.resume{border-radius:10px;border:1px solid var(--line);background:var(--tile);padding:12px 14px;font-size:12.5px;
        color:var(--ink-2);margin-top:4px}
.resume strong{color:var(--ink)}
.cols{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}

/* ---------- años ---------- */
.anios{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.anio{border-radius:999px;border:1px solid var(--line-2);background:var(--tile);padding:5px 14px;font-size:12.5px;
      font-weight:600;font-family:var(--f-num);color:var(--ink-2);cursor:pointer;transition:.13s}
.anio:hover:not([disabled]){border-color:var(--accent);color:var(--ink)}
.anio.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-3)}
.anio[disabled]{opacity:.4;cursor:not-allowed}
.anio small{font-family:var(--f-ui);font-weight:500;font-size:10px;color:var(--ink-4);margin-left:6px}

/* ---------- estatus dobles ---------- */
.ests{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.ebadge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:11px;
        font-weight:600;white-space:nowrap;border:1px solid transparent}
.ebadge.c{background:var(--accent-soft);color:var(--accent-3);border-color:rgba(22,132,189,.35)}
.ebadge.i{background:var(--orange-soft);color:var(--orange-2);border-color:rgba(242,122,43,.35)}
.ebadge .dot{height:6px;width:6px}
/* «Modificación QUO» lleva su propio color (3-nov-2026) */
.ebadge.i.quo{background:var(--quo-soft);color:var(--quo);border-color:color-mix(in srgb, var(--quo) 40%, transparent)}
.acc{display:flex;align-items:center;gap:4px;justify-content:flex-end}
.iconbtn{display:grid;place-items:center;height:30px;width:30px;border:0;border-radius:8px;background:none;
         color:var(--ink-4);cursor:pointer;transition:.13s}
.iconbtn:hover{background:var(--tile-2);color:var(--accent-2)}
.iconbtn.lleno{color:var(--accent-2)}
.selcb{display:grid;place-items:center;height:18px;width:18px;border-radius:5px;border:1px solid var(--line-2);
       background:var(--tile);color:transparent;cursor:pointer;transition:.13s;padding:0}
.selcb svg{height:11px;width:11px}
.selcb.on{background:var(--accent);border-color:var(--accent);color:#fff}
td.cbcell,th.cbcell{width:34px;padding-left:14px;padding-right:0}

/* ---------- barra masiva ---------- */
.bulk{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:45;display:flex;align-items:center;
      gap:10px;flex-wrap:wrap;justify-content:center;border-radius:14px;border:1px solid var(--line-2);
      background:var(--surface-2);padding:12px 16px;box-shadow:0 20px 45px -15px rgba(0,0,0,.65);
      max-width:calc(100% - 32px)}
.bulk b{font-size:13px;font-weight:600;white-space:nowrap}
.bulk .sep{width:1px;height:22px;background:var(--line);flex:none}

/* ---------- ventana de seguimiento ---------- */
.resumen{border-radius:12px;border:1px solid var(--line);background:var(--tile);padding:14px 16px;
         display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px}
.resumen h3{margin:0;font-size:15px;font-weight:600}
.resumen p{margin:3px 0 0;font-size:12px;color:var(--ink-3)}
.resumen .big{font-family:var(--f-num);font-size:20px;font-weight:600;white-space:nowrap}
.dualc{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:640px){.dualc{grid-template-columns:1fr 1fr}}
.colh{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.colh .box{display:grid;place-items:center;height:32px;width:32px;border-radius:9px;flex:none}
.colh.c .box{background:var(--accent-soft);color:var(--accent-3)}
.colh.i .box{background:var(--orange-soft);color:var(--orange-2)}
.colh b{display:block;font-size:13.5px;font-weight:600}
.colh span{display:block;font-size:11px;color:var(--ink-4)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;border-radius:10px;
     border:1px solid var(--line-2);background:transparent;padding:13px 15px;font-size:13.5px;text-align:left;
     color:var(--ink-2);cursor:pointer;transition:.13s}
.opt:hover:not([disabled]){border-color:var(--line-2);background:var(--tile-2);color:var(--ink)}
.opt svg{height:15px;width:15px;opacity:0;flex:none}
.opt.on svg{opacity:1}
.opt.c.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-3);font-weight:600}
.opt.i.on{border-color:var(--orange);background:var(--orange-soft);color:var(--orange-2);font-weight:600}
.opt[disabled]{opacity:.45;cursor:not-allowed}
.opt.i.quo.on{border-color:var(--quo);background:var(--quo-soft);color:var(--quo)}
.opt .por{font-size:10.5px;font-weight:500;color:var(--ink-4);margin-left:auto;margin-right:6px;text-align:right}
.bloq{margin:10px 0 0;font-size:11px;color:var(--ink-4)}
.leyenda{display:flex;align-items:center;gap:14px;font-size:10px;font-weight:700;letter-spacing:.08em;
         text-transform:uppercase;color:var(--ink-4)}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda i{height:7px;width:7px;border-radius:50%;display:block}

/* la ventana de seguimiento (resumen, pastillas y plática) vive en la pieza común js/seguimiento.js (4-nov-2026) */
.mfoot .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

.tg.sil{background:var(--violet-soft);color:var(--violet)}

/* ---------- historial del caso ---------- */
.hist{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.hmes{display:flex;align-items:center;gap:10px;border-radius:9px;border:1px solid var(--line);
      background:var(--tile);padding:8px 11px;font-size:12.5px}
.hmes.aqui{border-color:var(--accent);background:var(--accent-soft)}
.hmes .m{width:62px;flex:none;font-weight:600}
.hmes .p{font-family:var(--f-num);font-weight:600;width:72px;flex:none;text-align:right}
.hmes .e{flex:1;min-width:0;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* cada mes con hallazgo lleva a ese mes en Variaciones (3-nov-2026, pedido de Fernando Barbosa) */
button.hmes{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;border-radius:9px;border:1px solid var(--line);
      background:var(--tile);padding:8px 11px;font-size:12.5px;cursor:pointer;transition:.13s;color:var(--ink)}
button.hmes:hover{border-color:var(--accent);background:var(--tile-2)}
button.hmes:focus-visible{outline:2px solid var(--accent-2);outline-offset:1px}
button.hmes .m{text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
.hmes .ir{flex:none;color:var(--accent-3);font-size:11.5px;font-weight:600;white-space:nowrap}
.hmes.aqui .ir{color:var(--ink-4);font-weight:400}
@media (max-width:560px){.hmes .ir{display:none}}
.salto{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-radius:10px;border:1px solid var(--accent);
       background:var(--accent-soft);padding:8px 12px;margin:0 0 16px;font-size:12.5px}
.salto .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.origen.fijo{position:sticky;top:var(--hdrH,0px);z-index:29;box-shadow:0 8px 18px -14px rgba(0,0,0,.55)}

/* ---------- notificaciones ---------- */
.bell{position:relative}
.bdg{position:absolute;top:-7px;right:-7px;min-width:18px;height:18px;border-radius:999px;background:var(--orange);
     color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 5px;line-height:1}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tab{border:0;background:none;padding:9px 13px;font-size:13px;font-weight:600;color:var(--ink-3);cursor:pointer;
     border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-flex;align-items:center;gap:7px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--accent-3);border-color:var(--accent)}
.tab .c{border-radius:999px;background:var(--tile-2);padding:1px 7px;font-size:10px;font-family:var(--f-num)}
.tab.on .c{background:var(--accent-soft);color:var(--accent-3)}
.ev{display:flex;gap:12px;align-items:flex-start;width:100%;border-radius:10px;border:1px solid var(--line);
    background:var(--tile);padding:11px 13px;text-align:left;cursor:pointer;transition:.13s}
.ev:hover{border-color:var(--line-2);background:var(--tile-2)}
.ev.nuevo{border-color:rgba(242,122,43,.45);background:var(--orange-soft)}
.ev .mid{flex:1;min-width:0}
.ev .t{display:block;font-size:13px;font-weight:600}
.ev .s{display:block;font-size:11.5px;color:var(--ink-3);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .w{font-size:11px;color:var(--ink-4);white-space:nowrap;flex:none}
.ev .pt{height:8px;width:8px;border-radius:50%;flex:none;margin-top:6px}

/* ---------- detalle plegable ---------- */
details.det{border-top:1px solid var(--line);margin-top:20px;padding-top:14px}
details.det summary{cursor:pointer;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;
                    color:var(--ink-3);list-style:none;display:flex;align-items:center;gap:8px}
details.det summary::-webkit-details-marker{display:none}
details.det summary::after{content:"▾";font-size:10px;color:var(--ink-4)}
details.det[open] summary::after{content:"▴"}
details.det .dl{margin-top:14px}

/* ---------- Facturas del mes (en la ventana de seguimiento; 268) ---------- */
.vf{margin-top:12px}
.vf-res{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:10px}
.vf-t{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--tile)}
.vf-t .lb{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-4)}
.vf-t .v{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:15px;font-weight:600;color:var(--ink);margin-top:4px}
.vf-t .s{font-size:11.5px;color:var(--ink-3);margin-top:4px;line-height:1.45}
.vf-t .s b{font-family:var(--f-num);font-weight:600;color:var(--ink-2)}
.vf-bar{display:flex;height:6px;border-radius:4px;overflow:hidden;background:var(--line);margin-top:8px}
.vf-bar i{display:block;background:var(--accent)} .vf-bar i+i{background:var(--orange)}
.vf-ley{display:flex;gap:12px;font-size:11px;color:var(--ink-3);margin:0 0 10px;flex-wrap:wrap}
.vf-ley span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;background:var(--accent)}
.vf-ley span+span::before{background:var(--orange)}
.vf-inf{border:1px solid var(--accent-soft);background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:8px 10px;font-size:12px;margin-bottom:8px;line-height:1.45}
.vf-inf.vf-av{border-color:var(--orange-soft);background:var(--orange-soft)}
.vf-bar2{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.vf-bar2 .sp{flex:1}
.vf-tb{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.vf-r{display:grid;grid-template-columns:88px 72px 118px minmax(0,1fr) 118px;gap:10px;align-items:center;padding:9px 12px;
      border-top:1px solid var(--line);font-size:12.5px;color:var(--ink);background:transparent;width:100%;text-align:left;
      font-family:inherit;border-left:0;border-right:0;border-bottom:0}
.vf-r:first-child{border-top:0}
.vf-r.h{background:var(--tile-2);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-4)}
button.vf-r{cursor:pointer} button.vf-r:hover{background:var(--tile)}
.vf-r .n{font-family:var(--f-num);font-variant-numeric:tabular-nums;text-align:right}
.vf-r .n small{display:block;font-size:10.5px;color:var(--ink-4);font-family:var(--f-ui)}
.vf-r .who b{display:block;font-weight:600;line-height:1.3}
.vf-r .who small{display:block;color:var(--ink-4);font-family:var(--f-num);font-size:11px;margin-top:2px}
.vf-r .who small.uu{font-size:10px;overflow-wrap:anywhere}
.vf-r .fo{font-family:var(--f-num);overflow-wrap:anywhere}
.vf-r .ct{display:block;font-family:var(--f-num);font-size:11px;color:var(--ink-4);margin-top:3px}
.vf-r .car{color:var(--ink-4);margin-right:6px}
.vf-r.np{opacity:.62}
.vf-tag{display:inline-block;border-radius:999px;padding:2px 8px;margin:0 4px 3px 0;font-size:11px;font-weight:600;background:var(--accent-soft);color:var(--accent-3)}
.vf-tag.nc{background:var(--tile-2);color:var(--ink-2)}
.vf-tag.av{background:var(--orange-soft);color:var(--orange-2)}
.vf-con{padding:6px 12px 10px 118px;border-top:1px dashed var(--line);background:var(--tile)}
.vf-uu{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:2px 0 6px;font-size:12px;color:var(--ink-3)}
.vf-uu b{font-family:var(--f-num);font-weight:600;color:var(--ink);overflow-wrap:anywhere}
.vf-ci{display:grid;grid-template-columns:minmax(0,1fr) 84px 118px;gap:10px;font-size:12px;color:var(--ink-2);padding:4px 0}
.vf-ci span:nth-child(2){font-family:var(--f-num);color:var(--ink-4)}
.vf-ci span:last-child{font-family:var(--f-num);text-align:right}
.vf-ci small{display:block;color:var(--ink-4);font-size:11px}
.vf-mas{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 12px;
        border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-3)}
.vf-pie{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 12px;border-top:1px solid var(--line);
        background:var(--tile-2);font-size:12.5px;font-weight:600;color:var(--ink)}
.vf-pie .n{font-family:var(--f-num)}
.vf-nota{font-size:11.5px;color:var(--ink-3);margin:10px 0 0;line-height:1.5}
.vf-vacio{border:1px dashed var(--line-2);border-radius:12px;padding:14px;font-size:12.5px;color:var(--ink-2);line-height:1.5}
.vf-vacio b{color:var(--ink)}
@media (max-width:640px){
  .vf-res{grid-template-columns:1fr 1fr;gap:8px}
  .vf-res .vf-t:last-child{grid-column:1/-1}
  .vf-t{padding:8px 10px} .vf-t .v{font-size:14px}
  .vf-r.h{display:none}
  .vf-r{grid-template-columns:minmax(0,1fr) auto;gap:4px 10px}
  .vf-r .who{order:1} .vf-r .n{order:2}
  .vf-r .fe{order:3;color:var(--ink-3);font-size:11.5px}
  .vf-r .fo{order:4;text-align:right;color:var(--ink-3);font-size:11.5px}
  .vf-r .ti{order:5;grid-column:1/-1}
  .vf-con{padding:6px 12px 10px}
  .vf-ci{grid-template-columns:minmax(0,1fr) auto}
  .vf-ci span:nth-child(2){display:none}

<script>
/* optimización (5-nov-2026): un solo comparador del español para los órdenes de las listas (mismo resultado que localeCompare(…,"es"), más rápido) */
const COLL_ES = new Intl.Collator("es");
/* Portal PROFASE: los hallazgos salen de las balanzas de la base, que la actualización del portal lee cada 3 horas
   y deja en el documento datos/var_0 (comprimido). Las horas siempre en hora de Monterrey. */
const TZ = "America/Monterrey";
let HORA_DATOS = "";
async function desempaca(doc){
  if(!doc || !doc.b64) return null;
  if(typeof DecompressionStream==="undefined") throw new Error("este navegador no puede abrir los datos; actualízalo");
  const bin = Uint8Array.from(atob(doc.b64), c=>c.charCodeAt(0));
  const st = new Blob([bin]).stream().pipeThrough(new DecompressionStream("gzip"));
  return JSON.parse(await new Response(st).text());
}
async function cargarDatos(silencioso){
  const lead = document.getElementById("lead");
  const falla = t => { if(!silencioso) lead.textContent = t; return null; };
  if(!window.claude) return falla("Entra al portal para ver la bitácora.");
  const db = await claude.use("db").catch(()=>null);
  if(!db) return falla("Sin conexión con la base: recarga la página.");
  try{
    const d = await db.doc("datos/var_0").get();
    if(!d.exists) return falla("Todavía no hay balanzas en el portal; llegan con la próxima actualización.");
    const j = await desempaca(d.data());
    if(!j) return falla("Los datos de la bitácora no se pudieron leer; recarga la página en unos minutos.");
    HORA_DATOS = d.data().refreshedAt || "";
    return j;
  }catch(e){ return falla("No se pudieron cargar los hallazgos ("+((e && (e.code||e.message))||"error")+"). Recarga la página en unos minutos."); }
}

/* ---------- criterios de la bitácora (editables; de inicio, los de la hoja «Criterios» del Excel) ---------- */
const CRIT_EXCEL = {
  umbral: 100,              // incremento: se registra si sube +umbral % o más
  umbralBaja: 100,          // disminución: se registra si cae umbralBaja % o más
  excluirAltas: true,       // altas en pasivo, capital y bimestrales (saldo inicial o meses anteriores en cero)
  baseUltimo: true,         // (ya no se usa en activo, ingresos, costos y gastos: ver contraCero)
  contraCero: true,         // 3-nov-2026 (Fernando Cadengo): mes anterior en $0 con balanza → se compara contra $0 y se registra
  excluirBajas: true,       // actual en cero
  evaluarEnero: false,      // enero contra diciembre del año anterior
  baseAbs: true,            // (actual − anterior) ÷ |anterior|; si no, actual ÷ anterior − 1
  nomina: true,             // regla de nómina: la baja se registra si rompe patrón
  nominaRangos: "601.01-601.31, 699.01-699.31",
  nominaMeses: 2,           // meses previos del año con movimiento para romper patrón
  bimestral: true,          // regla bimestral (SIPARE): Infonavit, SAR, RCV y sus provisiones
  pagoProv: true,           // la provisión de un mes (abono) debe pagarse completa el mes siguiente (cargo)
  pagoRangos: "211.01.01, 211.02.01-211.02.02, 211.03.01",
  pagoTolMxn: 100,          // tolerancia: diferencias de hasta este importe…
  pagoTolPct: 1,            // …o de este % de la provisión no son hallazgo
  bimestralRangos: "601.27.01, 601.28.01-601.28.02, 211.02.01-211.02.02, 211.03.01-211.03.02",
  acreedora: true,          // pasivo y capital (acreedoras): la variación se mide sobre el saldo, no sobre el movimiento
  acreedoraRangos: "200-399",
  saldoContrario: true      // saldo final negativo (deudor) en una acreedora: hallazgo sin importar el porcentaje
};
function normCrit(x){
  const c = Object.assign({}, CRIT_EXCEL, x||{});
  c.umbral = Math.max(0, Number(c.umbral)||0);
  c.umbralBaja = Math.max(0, Number(c.umbralBaja)||0);
  c.nominaMeses = Math.max(1, Math.round(Number(c.nominaMeses)||1));
  ["excluirAltas","excluirBajas","evaluarEnero","baseAbs","nomina","bimestral","baseUltimo","contraCero","pagoProv","acreedora","saldoContrario"].forEach(k=>{ c[k] = !!c[k]; });
  c.nominaRangos = String(c.nominaRangos||"").slice(0,300);
  c.bimestralRangos = String(c.bimestralRangos==null ? CRIT_EXCEL.bimestralRangos : c.bimestralRangos).slice(0,300);
  c.pagoRangos = String(c.pagoRangos==null ? CRIT_EXCEL.pagoRangos : c.pagoRangos).slice(0,300);
  c.acreedoraRangos = String(c.acreedoraRangos==null ? CRIT_EXCEL.acreedoraRangos : c.acreedoraRangos).slice(0,300);
  c.pagoTolMxn = Math.max(0, Number(c.pagoTolMxn)||0);
  c.pagoTolPct = Math.max(0, Number(c.pagoTolPct)||0);
  return c;
}
const rangosDe = txt => String(txt||"").split(/[,;\n]+/).map(s=>s.trim()).filter(Boolean)
  .map(s=>{ const [a,b] = s.split(/\s*[-–]\s*/); return [a, b||a]; }).filter(([a])=>/^\d{3}(\.\d\d){0,2}$/.test(a));
const enRango = (rs, cta) => rs.some(([a,b])=>{ const k = cta.slice(0,a.length); return k>=a && k<=b.slice(0,a.length); });
/* Cuentas acreedoras (pasivo 2xx y capital 3xx, o los rangos de «Criterios de la bitácora») que se evalúan sobre el saldo.
   Las de «Pago de provisiones», mientras esa regla esté activa, siguen solo con esa regla. */
function acreedoraDe(C, B){
  const rA = C.acreedora && B && B.sal ? rangosDe(C.acreedoraRangos) : [];
  const rP = C.pagoProv && B && B.ca ? rangosDe(C.pagoRangos) : [];
  return cta => rA.length>0 && enRango(rA, cta) && !(rP.length>0 && enRango(rP, cta));
}
const r2 = x => Math.round((Number(x)||0)*100)/100;
const sentidoDe = aum => aum>0 ? "Aumentó" : aum<0 ? "Disminuyó" : "Sin cambio";
async function cargarCriterios(){
  if(!window.claude) return normCrit();
  const db = await claude.use("db").catch(()=>null);
  if(!db) return normCrit();
  try{ const d = await db.doc("var_criterios/actual").get(); return normCrit(d.exists ? d.data() : null); }
  catch(e){ return normCrit(); }
}

/* Aplica los criterios a los movimientos de SQL y arma la bitácora en el formato que usa la página. */
const MESES_ES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
function rubroDe(cta){
  const p = +cta.slice(0,3);
  if(p===699) return "Gastos no deducibles";
  if(p>=600 && p<700) return "Gastos";
  if(p>=400 && p<500) return "Ingresos";
  if(p===701) return "Gastos financieros";
  if(p===702) return "Productos financieros";
  if(p>=703 && p<800) return "Resultado financiero";
  if(p>=800) return "Cuentas de orden";
  if(p>=500) return "Costos";
  if(p>=300) return "Capital";
  if(p>=200) return "Pasivo";
  return "Activo";
}
/* Meses en que la balanza de un cliente viene completa en $0 (3-nov-2026, pedido de Fernando Cadengo): entre su primer y su
   último mes con balanza, un mes sin movimiento en ninguna cuenta quiere decir que la información de ese mes no está. Ese mes
   no da hallazgos ni se usa para comparar (se compara contra el último mes que sí la trae) y sale en «Balanzas en 0».
   Una sola versión: la usan construir(), «Resueltas» y la lista. */
function mesesVacios(B){
  const con = new Set(), primero = new Map(), hasta = new Map();
  for(const [ci,,p] of (B.mov||[])){
    con.add(ci+"|"+p);
    if(!(primero.get(ci) <= p)) primero.set(ci, p);
    if(!(hasta.get(ci) >= p)) hasta.set(ci, p);
  }
  const es = (ci, p) => { const a = primero.get(ci); return !!a && p>=a && p<=hasta.get(ci) && !con.has(ci+"|"+p); };
  const desde = B.anios && B.anios.length ? B.anios[0]+"-01" : "";
  const lista = [];
  for(const [ci,a] of primero){
    let [y,m] = a.split("-").map(Number); const z = hasta.get(ci);
    for(let n=0; n<240; n++){
      const p = y+"-"+String(m).padStart(2,"0"); if(p > z) break;
      if(p >= desde && !con.has(ci+"|"+p)) lista.push([ci, p]);
      if(++m > 12){ m = 1; y++; }
    }
  }
  return {es, primero, hasta, lista};
}
function construir(B, C){
  if(!B.mov) return B;                       // archivo anterior: ya trae los hallazgos calculados
  const rangos = rangosDe(C.nominaRangos), rangosB = C.bimestral ? rangosDe(C.bimestralRangos) : [];
  const rangosP = C.pagoProv && B.ca ? rangosDe(C.pagoRangos) : [];
  const ca = new Map(); for(const [ci,ct,p,c,a] of (B.ca||[])) ca.set(ci+"|"+ct+"|"+p, [c,a]);
  const sal = new Map(); for(const [ci,ct,p,v] of (B.sal||[])) sal.set(ci+"|"+ct+"|"+p, v);
  const esAcr = acreedoraDe(C, B);
  const fmtP = v => new Intl.NumberFormat("es-MX",{style:"currency",currency:"MXN",maximumFractionDigits:0}).format(v);
  const esNomina = cta => enRango(rangos, cta);
  const per = (y,m) => y+"-"+String(m).padStart(2,"0");
  const atras = (y,m,k) => { m -= k; while(m<1){ m += 12; y--; } return per(y,m); };
  const mesDe = p => MESES_ES[+p.slice(5)-1];
  const mesAnio = p => MESES_ES[+p.slice(5)-1]+" "+p.slice(0,4);
  // último mes con movimiento antes de (y,m), buscando desde «desde» meses atrás y hasta 12 (lo usa la regla bimestral)
  const ultimoCon = (k, y, m, desde) => {
    for(let q=desde; q<=12; q++){ const p = atras(y,m,q), v = mov.get(k+p); if(v) return {p, v}; }
    return null;
  };
  const VAC = mesesVacios(B);
  const mov = new Map(), ultimo = new Map(), pares = new Map();
  for(const [ci,ct,p,v] of B.mov){
    mov.set(ci+"|"+ct+"|"+p, v);
    if(!(ultimo.get(ci) >= p)) ultimo.set(ci, p);
    pares.set(ci+"|"+ct, [ci,ct]);
  }
  // acreedoras: también las que solo traen saldo (un saldo contrario puede no tener movimiento)
  for(const [ci,ct] of (B.sal||[])){ const k = ci+"|"+ct; if(!pares.has(k) && ultimo.has(ci) && esAcr(B.cuentas[ct][0])) pares.set(k, [ci,ct]); }
  const mIni = C.evaluarEnero ? 1 : 2;
  const hall = [];
  for(const [ci,ct] of pares.values()){
    const cta = B.cuentas[ct][0], nom = esNomina(cta), bim = rangosB.length>0 && enRango(rangosB, cta), hasta = ultimo.get(ci);
    const pag = rangosP.length>0 && enRango(rangosP, cta), acr = !pag && esAcr(cta);
    for(const y of B.anios){
      for(let m=mIni; m<=12; m++){
        const p = per(y,m); if(p > hasta) break;
        if(VAC.es(ci, p)) continue;          // la balanza de ese mes viene completa en $0: no da hallazgos
        if(pag){
          // provisión por pagar: el abono del mes anterior (provisión) se paga con el cargo de este mes
          const k = ci+"|"+ct+"|", pAnt = atras(y,m,1);
          const prov = (ca.get(k+pAnt)||[0,0])[1], pago = (ca.get(k+p)||[0,0])[0];
          if(!prov) continue;
          const dif = pago - prov, tol = x => Math.max(C.pagoTolMxn, Math.abs(x)*C.pagoTolPct/100) + 1e-9;
          if(Math.abs(dif) <= tol(prov)) continue;
          if(bim){
            // bimestrales: el pago puede cubrir dos provisiones juntas (las dos del bimestre)
            const prov2 = (ca.get(k+atras(y,m,2))||[0,0])[1], provM = (ca.get(k+p)||[0,0])[1], pagoSig = (ca.get(k+(m===12 ? per(y+1,1) : per(y,m+1)))||[0,0])[0];
            if(Math.abs(pago-(prov+prov2)) <= tol(prov+prov2)) continue;
            if(!pago && Math.abs(pagoSig-(prov+provM)) <= tol(prov+provM)) continue;
          }
          hall.push({ci, ct, y, m, v: dif/Math.abs(prov), ant: prov, act: pago, pago: true,
            tag: pago ? `PAGO DISTINTO: la provisión de ${mesAnio(pAnt)} (${fmtP(prov)}) se pagó por ${fmtP(pago)} en ${MESES_ES[m-1]}; diferencia ${fmtP(dif)}`
                      : `SIN PAGO: la provisión de ${mesAnio(pAnt)} (${fmtP(prov)}) no tiene pago en ${MESES_ES[m-1]}`});
          continue;
        }
        if(acr){
          // cuenta acreedora: aumento del mes = abonos − cargos; variación = (saldo final − saldo inicial) ÷ |saldo inicial|,
          // con el saldo acreedor en positivo (la balanza ya los trae así). Saldo inicial en cero: regla de altas.
          // Saldo final en cero: no es hallazgo (lo decidió Daniel el 28-oct).
          const k = ci+"|"+ct+"|", fin = sal.get(k+p) || 0, mv = mov.get(k+p) || 0, ini = r2(fin - mv);
          if(!fin) continue;
          const cav = ca.get(k+p) || (B.caTodas && /^[23]/.test(cta) ? [0,0] : null), aum = cav ? r2(cav[1] - cav[0]) : r2(mv);
          const contra = C.saldoContrario && fin < -0.004;
          let v = null, porVar = false, alta = false;
          if(!ini){ if(!C.excluirAltas){ alta = true; v = fin>0 ? 1 : -1; } }
          else { v = (fin - ini)/Math.abs(ini); porVar = v>=0 ? v*100 >= C.umbral - 1e-9 : -v*100 >= C.umbralBaja - 1e-9; }
          if(!porVar && !alta && !contra) continue;
          if(v===null) v = fin>0 ? 1 : -1;
          const cambio = !aum && (!cav || (!cav[0] && !cav[1])) ? "sin movimiento en el mes"
            : `${sentidoDe(aum).toLowerCase()} ${fmtP(Math.abs(aum))}`+(cav ? ` (abonos ${fmtP(cav[1])} − cargos ${fmtP(cav[0])})` : "");
          const tag = contra ? `SALDO CONTRARIO A SU NATURALEZA: saldo final deudor de ${fmtP(Math.abs(fin))}; saldo inicial ${fmtP(ini)}; ${cambio}`
            : alta ? `ALTA DE CUENTA: saldo inicial en cero; saldo final ${fmtP(fin)}; ${cambio}`
            : `VARIACIÓN DE SALDO: saldo inicial ${fmtP(ini)} → saldo final ${fmtP(fin)}; ${cambio}`;
          hall.push({ci, ct, y, m, v, ant: ini, act: fin, tag, acr: true, contra, aum});
          continue;
        }
        if(bim){
          // cuentas que se mueven cada dos meses: el mes en cero es normal y la base es el mismo mes del bimestre anterior
          const k = ci+"|"+ct+"|", act = mov.get(k+p) || 0;
          const a1 = mov.get(k+atras(y,m,1)) || 0, a2 = mov.get(k+atras(y,m,2)) || 0;
          if(!act){
            if(a1 || !a2) continue;
            if(VAC.es(ci, atras(y,m,1))) continue;   // el mes anterior no trae balanza: no se sabe si faltó

            const previos = [];
            for(let q=1; q<m; q++) if(mov.get(k+per(y,q))) previos.push(MESES_ES[q-1]);
            if(previos.length < C.nominaMeses) continue;
            hall.push({ci, ct, y, m, v:-1, ant:a2, act:0,
              tag:`FALTA BIMESTRE: sin movimiento en ${mesDe(atras(y,m,1))} ni ${MESES_ES[m-1]}; traía en ${previos.join(", ")}`});
            continue;
          }
          let ant = a2 || a1, base = a2 ? atras(y,m,2) : atras(y,m,1), reap = null;
          if(!ant){ reap = ultimoCon(k, y, m, 3); if(reap){ ant = reap.v; base = reap.p; } }
          let v, tag;
          if(!ant){
            if(C.excluirAltas) continue;
            v = act>0 ? 1 : -1; tag = "ALTA DE CUENTA";
          } else {
            v = C.baseAbs ? (act-ant)/Math.abs(ant) : act/ant - 1;
            if(v>=0 ? v*100 < C.umbral - 1e-9 : -v*100 < C.umbralBaja - 1e-9) continue;
            tag = reap ? `REAPARECE: último movimiento en ${mesAnio(base)}; comparado contra ese mes`
                       : `BIMESTRAL: comparado contra ${mesDe(base)} (${a2 ? "mismo mes del bimestre anterior" : "mes anterior"})`;
          }
          hall.push({ci, ct, y, m, v, ant, act, tag});
          continue;
        }
        // activo, ingresos, costos y gastos: contra el mes anterior; si ese mes la balanza viene completa en $0, contra el
        // último mes que sí la trae (hasta 12 atrás). Si el mes anterior sí trae balanza y esta cuenta está en $0, se compara
        // contra $0 («Comparado contra $0»; 3-nov-2026, Fernando Cadengo). Antes del primer mes con balanza no hay base.
        let q = 1, bp = atras(y,m,1);
        while(q<12 && VAC.es(ci, bp)){ q++; bp = atras(y,m,q); }
        const pri = VAC.primero.get(ci);
        if(!pri || bp < pri || VAC.es(ci, bp)) continue;
        let ant = mov.get(ci+"|"+ct+"|"+bp) || 0;
        const act = mov.get(ci+"|"+ct+"|"+p) || 0;
        if(ant===0 && act===0) continue;
        const salto = q>1 ? (q===2 ? " (el mes de en medio no trae balanza)" : ` (los ${q-1} meses de en medio no traen balanza)`) : "";
        let v, tag = "", cero = false;
        if(ant===0){

        }
        hall.push({ci, ct, y, m, v, ant, act, tag, cero});
      }
    }
  }

  const usadosC = [...new Set(hall.map(h=>h.ci))].sort((a,b)=>a-b);
  const usadosK = [...new Set(hall.map(h=>h.ct))].sort((a,b)=>B.cuentas[a][0].localeCompare(B.cuentas[b][0]));
  const iC = new Map(usadosC.map((c,i)=>[c,i])), iK = new Map(usadosK.map((c,i)=>[c,i]));
  const rubros = [...new Set(usadosK.map(k=>rubroDe(B.cuentas[k][0])))];

  let ultimoGlobal = "";
  for(const p of ultimo.values()) if(p > ultimoGlobal) ultimoGlobal = p;
  for(const y of B.anios){
    let max = 0; for(const p of ultimo.values()) if(p.startsWith(y+"-")) max = Math.max(max, +p.slice(5));
    if(!max && String(ultimoGlobal) > String(y)) max = 12;

      iC.get(h.ci), h.m, iK.get(h.ct), h.v, h.ant, h.act, rec.get(h.y+"|"+h.ci+"|"+h.ct), 0, h.tag, h.y,

function exclusionDe(f){
  const per = mesNum(f.anio, f.mes);
  for(const k of ["x|"+f.rfc+"|"+f.cta, "x|*|"+f.cta]){ const s = SIL[k]; if(s && exclVigente(s, per)) return s; }
  const s = SIL[f.caso];   // las de antes
  if(s && s.desdeMes && !s.desde && f.mes >= s.desdeMes && (s.vig===0 || f.mes < s.desdeMes + s.vig)) return s;
  return null;
}
const silenciado = f => !!exclusionDe(f);
const MESN = p => { const [y,m] = String(p||"").split("-").map(Number); return y && m ? MESES_ES[m-1].toLowerCase()+" "+y : ""; };
const hastaTxt = s => { if(s.vig===0) return "permanente"; const d = pmes(s.desde)+s.vig-1, y = Math.floor((d-1)/12), m = d-y*12;
  return s.vig+" meses (hasta "+MESES_ES[m-1].toLowerCase()+" "+y+")"; };
function exclTexto(f){
  const s = exclusionDe(f); if(!s) return "";
  if(!s.desde) return s.vig===0 ? "Este cliente, permanente" : "Este cliente, "+s.vig+" meses desde "+(MESES.get(s.desdeMes)||"");
  return (s.alcance==="todos" ? "Todos los clientes" : "Este cliente")+", desde "+MESN(s.desde)+", "+hastaTxt(s);
}
/* ---------- filtro ---------- */
// «Mis clientes ocultos» (js/ocultos.js, 172_clientes_ocultos.sql): los que ocultó quien entró no salen (solo a él)
const OCU = rfc => !!(window.PROFASE_OCULTOS && window.PROFASE_OCULTOS.es(rfc));
function pasa(f, omitir){
  if(OCU(f.rfc)) return false;
  if(!S.verSil && silenciado(f)) return false;
  if(f.anio !== S.anio) return false;
  if(S.q && !f.busca.includes(S.q)) return false;
  if(omitir!=="mes" && S.meses.size && !S.meses.has(f.mes)) return false;
  if(S.clientes.size && !S.clientes.has(f.rfc)) return false;
  if(S.grupos.size && !S.grupos.has(f.grupo)) return false;
  if(S.contadores.size && !S.contadores.has(f.contador)) return false;
  if(ctaFuera(f.cta)) return false;
  if(S.dir==="sube" && f.v<=0) return false;
  if(S.dir==="baja" && f.v>=0) return false;
  if(S.rec==="si" && f.rec<2) return false;
  if(S.rec==="no" && f.rec>1) return false;
  if(S.cero==="no" && f.cero) return false;
  if(!f.esPago && !f.contra && !f.cero && Math.abs(f.v)*100 < S.umbPct - 1e-9) return false;
  if(S.umbMxn>0 && f.adif!==null && f.adif < S.umbMxn) return false;
  if(omitir!=="est" && (S.estC.size || S.estI.size)){
    const e = lee(f.rid);
    if(S.estC.size && !S.estC.has(e.c)) return false;
    if(S.estI.size && !S.estI.has(e.i)) return false;
  }
  return true;
}

function ordenar(xs){
  const k = S.orden, s = S.asc?1:-1;
  const val = f => {
    if(k==="estatus") return INVIT.findIndex(e=>e.id===lee(f.rid).i);
    if(k==="adif"||k==="dif") return f.adif;
    const v = f[k];
    return v===null||v===undefined ? (S.asc?Infinity:-Infinity) : v;
  };
  /* optimización (5-nov-2026): un solo comparador del español para todo el orden (mismo resultado que localeCompare(…,"es"), más rápido) */
  const cmp = COLL_ES.compare;
  return xs.slice().sort((x,y)=>{
    const a=val(x), b=val(y);
    if(typeof a==="string") return s*cmp(a,b);
    return a===b ? cmp(x.cliente,y.cliente) : s*(a-b);
  });
}

function resumenes(){
  const nc=S.clientes.size, ng=S.grupos.size, nk=S.contadores.size, ne=S.estC.size+S.estI.size;
  const inc = CUENTAS.filter(c=>!ctaFuera(c.cta)).length;
  const crit = [S.umbPct+"% o más", S.umbMxn>0 ? fMoney.format(S.umbMxn)+" o más" : "Sin piso"];
  if(S.dir!=="todos") crit.push(S.dir==="sube"?"Incrementos":"Disminuciones");
  if(S.rec!=="todos") crit.push(S.rec==="si"?"Recurrentes":"Únicas");
  if(S.verSil) crit.push("Con cuentas excluidas");
  if(S.cero==="no") crit.push("Sin los comparados contra $0");
  return {
    clientes: nc===0?(ng?"Todos los del grupo":"Todos los clientes")
              :nc===1?(CLIENTES.find(c=>S.clientes.has(c.rfc))||{}).nombre:nc+" clientes",
    grupos:   ng===0?"Todos los grupos":ng===1?[...S.grupos][0]:ng+" grupos",
    cuentas:  inc===CUENTAS.length?CUENTAS.length+" cuentas incluidas":inc+" de "+CUENTAS.length+" cuentas",
    criterio: crit.join(" · "),
    contador: nk===0?"Todos los contadores":nk===1?SIGLA([...S.contadores][0]):nk+" contadores",
    estatus:  ne===0?"Todos los estatus":ne===1?(S.estC.size?tC([...S.estC][0]):tI([...S.estI][0])):ne+" estatus"
  };
}

];
function activa(k){
  if(k==="clientes") return S.clientes.size>0;
  if(k==="grupos")   return S.grupos.size>0;
  if(k==="cuentas")  return S.ctasOff.size>0 || S.ctasSolo.size>0;
  if(k==="criterio") return S.umbPct!==100||S.umbMxn!==0||S.dir!=="todos"||S.rec!=="todos"||S.verSil||S.cero!=="si";
  if(k==="contador") return S.contadores.size>0;
  if(k==="estatus")  return S.estC.size>0||S.estI.size>0;
  return false;
}

let obsMas = null;
function observaMas(){
  const tr = document.querySelector("#tb tr.mas"); if(!tr) return;
  if(!("IntersectionObserver" in window)) return;
  if(!obsMas) obsMas = new IntersectionObserver(es=>{
    if(es.some(e=>e.isIntersecting) && TABLA.siguiente) TABLA.siguiente();
  }, {rootMargin:"600px 0px"});
  obsMas.disconnect(); obsMas.observe(tr);
}

    const topeG = Math.max(1, ...resumenes.flatMap(r=>[...r.pm.values()].map(x=>x.u+x.d)));

      </div></td></tr>`;

/* ---------- gráfica: movimiento mes a mes según los filtros ---------- */
const SERIES = [
  {t:"Activo", d:[100,199]}, {t:"Pasivo", d:[200,299]}, {t:"Capital", d:[300,399]}, {t:"Ingresos", d:[400,499]},
  {t:"Costos", d:[500,599]}, {t:"Gastos", d:[600,699]}, {t:"Financieros", d:[700,799]}, {t:"Cuentas de orden", d:[800,999]}];
const serieDe = cta => { const p = +cta.slice(0,3); return SERIES.findIndex(s=>p>=s.d[0] && p<=s.d[1]); };
const fCorto = v => { const a = Math.abs(v), s = v<0 ? "−" : "";
  return a>=1e9 ? s+"$"+(a/1e9).toFixed(1)+" mil M" : a>=1e6 ? s+"$"+(a/1e6).toFixed(1)+" M" : a>=1e3 ? s+"$"+Math.round(a/1e3)+" mil" : s+"$"+Math.round(a); };
const GR = {tabla:false};
function datosGrafica(){
  const y = S.anio, meses = mesesAnio(y).map(([n])=>n), pre = y+"-";
  const ctasOn = CUENTAS.filter(c=>!ctaFuera(c.cta));
  // la gráfica se enfoca en las cuentas desplegadas de la vista activa (Variaciones o Movimientos)
  const abiertas = (S.vista||"mov")==="mov" ? [...SH.abiertas]
    : S.vista==="cta" && SC.sel!==null && BASE.cuentas[SC.sel] ? [BASE.cuentas[SC.sel][0]] : [];
  const foco = abiertas.length ? new Set(abiertas) : (ctasOn.length===1 ? new Set([ctasOn[0].cta]) : null);
  const porCuenta = foco && foco.size<=SERIES.length ? [...foco].sort() : null;   // una barra por cuenta
  const nombreCta = cta => { const c = BASE.cuentas.find(x=>x[0]===cta); return cta+" "+(c ? c[1] : ""); };
  const val = new Map();
  for(const [ci,ct,p,v] of (BASE.mov||[])){
    if(!p.startsWith(pre)) continue;
    const cta = BASE.cuentas[ct][0];
    if(foco ? !foco.has(cta) : ctaFuera(cta)) continue;
    if(!empPasa(ci)) continue;
    const s = porCuenta ? porCuenta.indexOf(cta) : serieDe(cta); if(s<0) continue;
    const m = +p.slice(5); if(!meses.includes(m)) continue;
    if(!val.has(s)) val.set(s, new Map());
    const mm = val.get(s); mm.set(m, (mm.get(m)||0) + v);
  }
  const series = [...val.keys()].sort((a,b)=>a-b).map(s=>({s, t: porCuenta ? nombreCta(porCuenta[s]) : SERIES[s].t, m: val.get(s)}));
  const emp = S.clientes.size===1 ? (BASE.clientes.find(c=>S.clientes.has(c[1]))||[])[0] : null;
  const ctx = [emp || (S.clientes.size ? fNum.format(S.clientes.size)+" empresas" : "Todas las empresas"),
    porCuenta && porCuenta.length===1 ? nombreCta(porCuenta[0])
      : abiertas.length ? fNum.format(foco.size)+" cuentas desplegadas"
      : (ctasOn.length===CUENTAS.length ? "todas las cuentas" : fNum.format(ctasOn.length)+" cuentas"),
    S.grupos.size ? fNum.format(S.grupos.size)+(S.grupos.size===1?" grupo":" grupos") : "",
    S.contadores.size ? fNum.format(S.contadores.size)+(S.contadores.size===1?" contador":" contadores") : "",
    String(y)].filter(Boolean).join(" · ");
  return {meses, series, ctx};
}
/* ---------- «Tu trabajo»: las pilas de arriba (5-nov-2026; Héctor Daniel: «quiero optimizar esos reportes para encontrar
   cosas fáciles y también poder trabajar desde ahí (los contadores)»; a la propuesta: «Si asi es") ----------
   Una pila por estatus de revisión, con los hallazgos que pasan todos los filtros menos el del estatus (así cuadran con la
   lista al picarlas: pica una y la lista queda con esos; otra vez, regresa todo). «Empezar a revisar» abre el primero en
   la ventana de seguimiento y «Guardar y siguiente ›» pasa al que sigue de esa misma pila. A la Gerencia Contable le toca
   primero lo que le consultan; a cada contador, lo que está sin revisión de sus clientes. La pieza es js/pilas.js. */
const PILAS_V = [

  {k:"cli", est:["consulta"], t:"Esperando al cliente", d:"Consulta con el Cliente", tono:"azul"},

];
const pilaOn = p => S.estI.size===p.est.length && p.est.every(x=>S.estI.has(x));
function pilaToca(){ return puedeEst() ? "ger" : "sin"; }
function pintaPilas(){
  const host = document.getElementById("pilas"); if(!host || !window.PROFASE_PILAS) return;

  const toca = pilaToca(), gc = puedeEst(), mios = comentaAlgo() && !gc;

    return {k, t: gc && k==="ger" ? "Te consultan" : p.t, d: gc && k==="ger" ? "Consulta con Gerencia: te toca contestar" : p.d,
      n:n[k], tono:p.tono, on:pilaOn(p), tag:(gc||mios) && k===toca && n[k] ? "Te toca" : ""}; });
  // la lista del botón: los de la pila que está puesta (en el orden en que se ven) o, sin pila, los que te tocan
  const sel = PILAS_V.find(pilaOn);

    pilas, alPicar: k=>{ const p = PILAS_V.find(x=>x.k===k); S.estC = new Set(); S.estI = pilaOn(p) ? new Set() : new Set(p.est);
      S.marcadas.clear(); if(S.vista!=="mov" && S.vista!=="cta") mostrarVista("mov"); pintar(); },
    boton: {t: !puedeMover ? "Ver uno por uno" : sel ? "Revisar estos" : gc ? "Empezar a contestar" : "Empezar a revisar", n: lista.length,
      alPicar: ()=>{ if(!lista.length) return; if(S.vista!=="mov") mostrarVista("mov");
        mSeguimiento(lista[0], {lista: lista.map(r=>({rid:r})), donde: sel ? "en «"+(pilas.find(x=>x.k===sel.k)||{}).t+"»" : "por revisar"}); }},
    nota: puedeMover ? "Abre el primero; con «Guardar y siguiente ›» pasas al que sigue sin salir de la ventana." : "Abre el primero; con ‹ › pasas al siguiente.",
    extra: [botonGrafica()]
  });
}
// el mismo orden de la tabla (agrupada por cuenta, la que tiene más hallazgos primero), para que el botón vaya en ese orden
function ordenaComo(fs){
  const g = new Map(); for(const f of ordenar(fs)){ let x = g.get(f.cta); if(!x){ x = []; g.set(f.cta, x); } x.push(f); }
  return [...g.entries()].sort((a,b)=>b[1].length-a[1].length || a[0].localeCompare(b[0])).flatMap(([,x])=>x.map(f=>f.rid));
}

  document.getElementById("gLeg").innerHTML = series.length>1
    ? series.map(x=>`<span><i style="background:var(--s${x.s+1})"></i>${esc(x.t)}</span>`).join("") : "";
  if(!series.length){ box.style.height = "auto"; box.innerHTML = `<div class="vacio">Sin movimientos con estos filtros.</div>`; return; }
  if(GR.tabla){
    box.style.height = "auto";
    box.innerHTML = `<div class="tscroll"><table class="gtab"><thead><tr><th>Concepto</th>${meses.map(m=>`<th class="r">${esc(mesCorto(m))}</th>`).join("")}</tr></thead>
      <tbody>${series.map(x=>`<tr><td>${esc(x.t)}</td>${meses.map(m=>{ const v=x.m.get(m)||0; return `<td class="r mny${v<0?" neg":""}">${v?esc(money(v)):"·"}</td>`; }).join("")}</tr>`).join("")}</tbody></table></div>`;
    return;
  }
  box.style.height = "";
  const W = Math.max(320, box.clientWidth), H = 280, L = 70, R = 10, T = 12, B = 28;
  let lo = 0, hi = 0; series.forEach(x=>x.m.forEach(v=>{ lo = Math.min(lo, v); hi = Math.max(hi, v); }));
  if(lo===hi) hi = 1;
  const paso = (()=>{ const r = (hi-lo)/4, e = Math.pow(10, Math.floor(Math.log10(r))), f = r/e; return (f<=1?1:f<=2?2:f<=5?5:10)*e; })();
  lo = Math.floor(lo/paso)*paso; hi = Math.ceil(hi/paso)*paso;
  const Y = v => T + (hi-v)/(hi-lo)*(H-T-B), y0 = Y(0);
  const band = (W-L-R)/meses.length, n = series.length;
  const bw = Math.max(2, Math.min(22, (band*0.78)/n - 2));
  const grupo = n*bw + (n-1)*2;
  const redondo = (x,w,ya,yb) => { const h = Math.abs(yb-ya); if(h<0.5) return ""; const r = Math.min(4, w/2, h), up = yb<ya;
    return up ? `M${x},${ya}V${yb+r}Q${x},${yb} ${x+r},${yb}H${x+w-r}Q${x+w},${yb} ${x+w},${yb+r}V${ya}Z`
              : `M${x},${ya}V${yb-r}Q${x},${yb} ${x+r},${yb}H${x+w-r}Q${x+w},${yb} ${x+w},${yb-r}V${ya}Z`; };
  let ticks = ""; for(let v=lo; v<=hi+paso/2; v+=paso){ const yy = Y(v);
    ticks += `<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" class="${Math.abs(v)<paso/2?"g0":"gl"}"/><text x="${L-8}" y="${yy+4}" class="gy">${esc(fCorto(v))}</text>`; }
  let barras = "", hits = "";
  meses.forEach((m,i)=>{
    const x0 = L + i*band + (band-grupo)/2, dim = S.meses.size && !S.meses.has(m);
    series.forEach((x,j)=>{ const v = x.m.get(m)||0; if(!v) return;
      barras += `<path d="${redondo(x0+j*(bw+2), bw, y0, Y(v))}" fill="var(--s${x.s+1})"${dim?' opacity=".3"':""}/>`; });
    hits += `<rect class="ghit${S.meses.has(m)?" on":""}" data-mes="${m}" x="${L+i*band}" y="${T}" width="${band}" height="${H-T-B}"/>
      <text x="${L+i*band+band/2}" y="${H-8}" class="gx${S.meses.has(m)?" on":""}">${esc(mesCorto(m))}</text>`;
  });
  box.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Movimiento por mes: ${esc(ctx)}">${ticks}${hits}${barras}</svg><div class="gtip" hidden></div>`;
  const tip = box.querySelector(".gtip");
  box.querySelectorAll(".ghit").forEach(r=>{
    r.addEventListener("mousemove", ev=>{
      const m = +r.dataset.mes;
      tip.innerHTML = `<b>${esc(MESES.get(m)||"")} ${S.anio}</b>`+series.map(x=>{ const v = x.m.get(m)||0;

      const bx = box.getBoundingClientRect(); let lx = ev.clientX-bx.left+14, ly = ev.clientY-bx.top+10;
      if(lx + tip.offsetWidth > bx.width) lx = ev.clientX-bx.left-tip.offsetWidth-14;
      tip.style.left = lx+"px"; tip.style.top = Math.min(ly, bx.height-tip.offsetHeight)+"px";
    });
    r.addEventListener("mouseleave", ()=>{ tip.hidden = true; });
  });
}

const RS = {filtro:"todas"};
const RID_RE = /^(.+?)_(\d{1,2})_(\d{3}\.\d{2}\.\d{2})(_pago)?(?:_(\d{4}))?$/;

function datosActuales(rfc, cta, y, m){
  const {cli, cta:ix, mov, sal} = idxR(), ci = cli.get(rfc), ct = ix.get(cta);
  if(ci===undefined || ct===undefined) return null;
  const per = (yy,mm)=>{ while(mm<1){ mm+=12; yy--; } return yy+"-"+String(mm).padStart(2,"0"); };
  const k = ci+"|"+ct+"|", act = mov.get(k+per(y,m)) || 0;
  if(ES_ACR(cta)){   // acreedora: saldo inicial contra saldo final del mes
    const fin = sal.get(k+per(y,m)) || 0, ini = r2(fin - act);
    return {ap:ini, ac:fin, v: ini ? (fin-ini)/Math.abs(ini) : null};
  }
  // contra el mes anterior; si ese mes la balanza viene completa en $0, contra el último que sí la trae (mesesVacios)
  let q = 1; while(q<12 && VAC_PAG.es(ci, per(y,m-q))) q++;
  const ant = mov.get(k+per(y,m-q)) || 0;
  return {ap:ant, ac:act, v: ant ? (CRIT.baseAbs ? (act-ant)/Math.abs(ant) : act/ant-1) : null};
}
// provisión del mes anterior contra el pago de este mes, con los datos de hoy
function pagoActual(rfc, cta, y, m){
  const {cli, cta:ix} = idxR(), ci = cli.get(rfc), ct = ix.get(cta);
  if(ci===undefined || ct===undefined) return null;
  const per = (yy,mm)=>{ while(mm<1){ mm+=12; yy--; } return yy+"-"+String(mm).padStart(2,"0"); };
  let prov = 0, pago = 0;
  for(const [c,t2,p,car,abo] of (BASE.ca||[])){ if(c!==ci || t2!==ct) continue; if(p===per(y,m-1)) prov = abo; if(p===per(y,m)) pago = car; }
  return {ap:prov, ac:pago, v: prov ? (pago-prov)/Math.abs(prov) : null};
}
const fotoDe = rid => (REV[rid] && REV[rid].foto) || (()=>{ const f = PORRID.get(rid);
  // un mes de Movimientos (292): de su llave
  if(!f && esMov(rid)){ const i = movInfo(rid); return {celda:true, mov:true, mes:i.mes, anio:i.anio, cliente:i.cliente, rfc:i.rfc, cta:i.cta, nombre:i.nombre}; }
  return f ? {v:f.v, ap:f.ap, ac:f.ac, mes:f.mes, anio:f.anio, cliente:f.cliente, rfc:f.rfc, cta:f.cta, nombre:f.nombre, detectado:new Date().toISOString()} : null; })();
function resueltasDe(y){
  const out = [];
  for(const rid of Object.keys(REV)){
    const g = RID_RE.exec(rid); if(!g) continue;
    const anio = g[5] ? +g[5] : BASE.anioBase; if(anio!==y) continue;
    const e = lee(rid), f = PORRID.get(rid), foto = REV[rid].foto || null;
    if(f && !cerrado(e)) continue;
    if(!f && !EST[rid] && foto && foto.celda) continue;   // comentarios de un mes que no es hallazgo (Movimientos)
    const rfc = g[1], mes = +g[2], cta = g[3];
    const cl = BASE.clientes.find(c=>c[1]===rfc), cu = BASE.cuentas.find(c=>c[0]===cta);
    out.push({rid, rfc, mes, anio, cta, e,
      cliente: f ? f.cliente : (foto && foto.cliente) || (cl ? cl[0] : rfc),
      nombre: f ? f.nombre : (foto && foto.nombre) || (cu ? cu[1] : ""),
      contador: cl ? cl[2] : "",
      estado: f ? "just" : "corr",
      antes: foto ? {v:foto.v, ap:foto.ap, ac:foto.ac} : (f ? {v:f.v, ap:f.ap, ac:f.ac} : null),
      ahora: g[4] ? pagoActual(rfc, cta, anio, mes) : datosActuales(rfc, cta, anio, mes)});
  }
  return out.sort((a,b)=>(b.e.iso||"").localeCompare(a.e.iso||"") || a.cliente.localeCompare(b.cliente,"es"));
}

      <td><span class="ebadge ${r.estado==="just"?"c":"i"}"><span class="dot"></span>${r.estado==="just"?esc(tI(r.e.i)):"Ya no cumple el criterio"}</span>
        <span class="quien">${esc(tI(r.e.i))}${r.e.por?" · "+esc(nombreReal(r.e.por)):""}${r.e.ts?" · "+esc(r.e.ts):""}</span></td>
      <td class="nom" style="max-width:280px">${esc(r.e.com||"")}</td></tr>`).join("")
    : `<tr><td colspan="8"><div class="vacio">No hay anomalías resueltas con estos filtros.</div></td></tr>`;

/* ---------- vista por cuenta: % de variación de todas las cuentas y empresas en común ----------
   Cada cuenta trae dos juegos de empresas:
   - emp: lo que muestra «Saldo final». Todas las empresas con movimiento o con saldo en la cuenta, y cada una hasta
     su último mes con balanza (el mayor entre movimiento y saldo). El saldo es el de la balanza, tal cual (BASE.sal).
   - empMov: lo que muestra «Movimiento del mes», igual que antes (empresas con movimiento, hasta su último mes con
     movimiento). Las celdas que solo existen en «Saldo final» llevan solo:true y nunca son hallazgo.
   Continuidad de la balanza (solo se muestra en «Saldo final»): el saldo inicial del mes es saldo final − movimiento
   (BASE.sal y BASE.mov); si difiere en más de $1 del saldo final del mes anterior de la misma empresa y cuenta, la
   celda lleva aviso:{ini, ant}. No se revisa el primer mes con balanza de la empresa (no hay mes anterior que comparar)
   ni enero de las cuentas de resultados (4xx a 7xx) que inician en $0, porque así quedan por el cierre del ejercicio.
   El aviso no cambia hallazgos ni «Movimiento del mes». */
const VAR_CACHE = new Map();
function variacionesAnio(y){
  if(VAR_CACHE.has(y)) return VAR_CACHE.get(y);
  const out = new Map();                    // cuenta -> {cta, nombre, emp, empMov: Map(cliente -> Map(mes -> celda))}
  VAR_CACHE.set(y, out);
  if(!BASE.mov) return out;
  const per = (yy,m) => yy+"-"+String(m).padStart(2,"0");
  const mov = new Map(), ultMov = new Map(), ultimo = new Map(), primero = new Map(), pares = new Set(), sal = new Map(), ca = new Map();
  for(const [ci,ct,p,c,a] of (BASE.ca||[])) ca.set(ci+"|"+ct+"|"+p, [c,a]);
  for(const [ci,ct,p,v] of BASE.mov){
    mov.set(ci+"|"+ct+"|"+p, v);
    if(!(ultMov.get(ci) >= p)) ultMov.set(ci, p);
    if(!(ultimo.get(ci) >= p)) ultimo.set(ci, p);
    if(!(primero.get(ci) <= p)) primero.set(ci, p);
    pares.add(ci+"|"+ct);
  }
  for(const [ci,ct,p,v] of (BASE.sal||[])){
    sal.set(ci+"|"+ct+"|"+p, v);
    if(!(ultimo.get(ci) >= p)) ultimo.set(ci, p);   // último mes con balanza: el mayor entre movimiento y saldo
    if(!(primero.get(ci) <= p)) primero.set(ci, p);
    // acreedoras con saldo y sin movimiento (un saldo contrario puede quedarse quieto)
    if(ultMov.has(ci) && !pares.has(ci+"|"+ct) && ES_ACR(BASE.cuentas[ct][0])) pares.add(ci+"|"+ct);
  }
  const deMov = new Set(pares);             // las parejas de «Movimiento del mes»
  for(const [ci,ct] of (BASE.sal||[])) pares.add(ci+"|"+ct);   // «Saldo final»: también las que solo tienen saldo
  const meses = mesesAnio(y).map(([n])=>n), hechos = [];
  for(const par of pares){
    const [ci,ct] = par.split("|").map(Number), hasta = ultimo.get(ci), cel = new Map(), celMov = new Map();
    const hastaMov = deMov.has(par) ? ultMov.get(ci) : "";
    const rfc = BASE.clientes[ci][1], cta = BASE.cuentas[ct][0], acr = ES_ACR(cta);
    for(const m of meses){
      const p = per(y,m); if(p > hasta) break;
      const pAnt = m===1 ? per(y-1,12) : per(y,m-1);
      const ant = mov.get(par+"|"+pAnt) || 0, act = mov.get(par+"|"+p) || 0;
      const sf = sal.get(par+"|"+p) || 0, sfAnt = sal.get(par+"|"+pAnt) || 0;
      if(!ant && !act && !sf && !sfAnt) continue;
      const solo = !(p <= hastaMov);       // solo existe en «Saldo final»
      const rid = rfc+"_"+m+"_"+cta+(y===BASE.anioBase ? "" : "_"+y);
      const hall = solo ? null : PORRID.get(rid) || PORRID.get(rfc+"_"+m+"_"+cta+"_pago"+(y===BASE.anioBase ? "" : "_"+y)) || null;
      let x;
      if(acr){   // acreedora: variación del saldo (saldo inicial del mes contra saldo final)
        const ini = r2(sf - act), cav = ca.get(par+"|"+p) || (BASE.caTodas && /^[23]/.test(cta) ? [0,0] : null);
        x = {ant, act, sf, sfAnt, rid, hall, acr:true, ini, car: cav ? cav[0] : null, abo: cav ? cav[1] : null,
          aum: cav ? r2(cav[1]-cav[0]) : r2(act),
          tipo: !ini && !sf ? "sin" : !ini ? "alta" : !sf ? "baja" : "var", v: ini ? (sf-ini)/Math.abs(ini) : null};
      } else {
        x = {ant, act, sf, sfAnt, rid, hall,
          tipo: !ant && !act ? "sin" : !ant ? "alta" : !act ? "baja" : "var",
          v: !ant ? null : (CRIT.baseAbs ? (act-ant)/Math.abs(ant) : act/ant-1)};
      }
      x.solo = solo;
      // continuidad: saldo inicial (saldo final − movimiento) contra el cierre del mes anterior
      // (en enero, las cuentas de resultados 4xx a 7xx que inician en $0 vienen del cierre del ejercicio: no es aviso)
      const iniBal = r2(sf - act), cierreEjercicio = m===1 && /^[4-7]/.test(cta) && Math.abs(iniBal) <= 1;
      if(pAnt >= primero.get(ci) && !cierreEjercicio && Math.abs(iniBal - sfAnt) > 1) x.aviso = {ini: iniBal, ant: sfAnt};
      cel.set(m, x);
      if(!solo) celMov.set(m, x);
    }
    if(cel.size) hechos.push({ci, ct, cta, cel, celMov});
  }
  // las cuentas quedan en el mismo orden de antes; al final, las que solo tienen saldo
  const cuenta = h => { if(!out.has(h.ct)) out.set(h.ct, {ct:h.ct, cta:h.cta, nombre: BASE.cuentas[h.ct][1], emp: new Map(), empMov: new Map()}); return out.get(h.ct); };
  for(const h of hechos) if(h.celMov.size) cuenta(h).empMov.set(h.ci, h.celMov);
  for(const h of hechos) cuenta(h).emp.set(h.ci, h.cel);
  return out;
}
const empPasa = ci => {
  const [, rfc, cont, , grupo] = BASE.clientes[ci];
  if(OCU(rfc)) return false;
  if(S.clientes.size && !S.clientes.has(rfc)) return false;
  if(S.grupos.size && !S.grupos.has(grupo || "—")) return false;
  if(S.contadores.size && !S.contadores.has(cont)) return false;
  return true;
};
const esHall = x => !!x.hall && (S.verSil || !silenciado(x.hall));
// ▲ sube 10% o más, ▼ baja 10% o más, = similar (dentro de ±10%) contra el mes anterior
const SIM = 0.10;
function signo(act, ant){
  if(!ant && !act) return "";
  if(!ant) return '<span class="sy up" title="El mes anterior estaba en cero">▲</span>';
  const r = (act-ant)/Math.abs(ant);
  return r >= SIM-1e-9 ? '<span class="sy up" title="Sube 10% o más contra el mes anterior">▲</span>'
       : r <= -SIM+1e-9 ? '<span class="sy down" title="Baja 10% o más contra el mes anterior">▼</span>'
       : '<span class="sy eq" title="Similar al mes anterior (±10%)">=</span>';
}
// 3-nov-2026 (pedido de Fernando Cadengo): abre ordenada por cuenta; cada título (también cada mes) ordena con tres clics:
// de mayor a menor, de menor a mayor y de vuelta por cuenta. Los meses, por el tamaño del monto aunque sea negativo.
const SC = {orden:"cta", asc:true, sel:null, solo:true, ver:null};   // ver: "saldo" | "mov"; orden: cta | emp | conH | max | m<mes>
let CTA_VIS = [];   // las cuentas como se ven (para el Excel, en el mismo orden)
const verSaldo = () => { if(SC.ver===null) SC.ver = BASE.sal ? "saldo" : "mov"; return SC.ver==="saldo"; };
// importe que muestra Movimientos para una celda: saldo final del mes o movimiento del mes, con su mes anterior
const importeDe = x => verSaldo() ? [x.sf, x.sfAnt] : [x.act, x.ant];
// empresas de una cuenta según lo que se muestra (ver variacionesAnio)
const empDe = c => verSaldo() ? c.emp : c.empMov;
const mesCorto = m => (MESES.get(m)||"").slice(0,3);
// ⚠️ continuidad de la balanza (solo en «Saldo final»; ver variacionesAnio)
const avisoTexto = (x, m) => `La balanza de ${MESES_ES[m-1].toLowerCase()} ${S.anio} inicia con ${money(x.aviso.ini)}, pero el mes anterior cerró en ${money(x.aviso.ant)}; diferencia ${money(r2(x.aviso.ini - x.aviso.ant))}`;
const avisoCelda = (x, m) => verSaldo() && x.aviso ? `<span class="avi" title="${esc(avisoTexto(x, m))}">⚠️</span>` : "";
const avisoCuenta = n => verSaldo() && n ? `<span class="avi" title="${esc(`${n} ${n===1?"empresa inicia":"empresas inician"} el mes con un saldo distinto al cierre del mes anterior`)}">⚠️<b>${fNum.format(n)}</b></span>` : "";

function pintarCuentas(){
  const datos = variacionesAnio(S.anio), meses = mesesAnio(S.anio).map(([n])=>n);
  const filas = [];
  for(const c of datos.values()){
    if(ctaFuera(c.cta)) continue;
    if(S.q && !norm(c.cta+" "+c.nombre).includes(S.q)) continue;
    let emp = 0, conH = 0, nH = 0, max = null, min = null;
    const porMes = new Map(meses.map(m=>[m,{u:0,d:0}])), tot = new Map(meses.map(m=>[m,{a:0,p:0,s:0,sp:0,av:0}]));
    // «Saldo final»: todas las empresas con saldo o movimiento; «Movimiento del mes»: como antes
    for(const [ci,cel] of empDe(c)){
      if(!empPasa(ci)) continue;
      emp++; let tiene = false;
      for(const [m,x] of cel){
        const tt = tot.get(m); if(tt){ tt.a += x.act; tt.p += x.ant; tt.s += x.sf; tt.sp += x.sfAnt; if(x.aviso) tt.av++; }
        if(x.solo) continue;   // solo saldo: no cuenta para «Mayor alza» ni para hallazgos
        const alza = x.act - x.ant;
        if(alza>0 && (!max || alza>max.v)) max = {v:alza, ci, m, rid: esHall(x) ? x.rid : null};
        if(esHall(x)){ tiene = true; nH++; const pm = porMes.get(m); if(pm) (x.v!==null && x.v<0) ? pm.d++ : pm.u++; }
      }
      if(tiene) conH++;
    }
    if(emp) filas.push({c, emp, conH, nH, max, min, porMes, tot, nAv: [...tot.values()].reduce((a,t)=>a+t.av,0)});
  }
  const mesDe = (f, m) => { const tt = f.tot.get(m); return tt ? (verSaldo() ? tt.s : tt.a) : 0; };
  const val = f => /^m\d+$/.test(SC.orden) ? Math.abs(mesDe(f, +SC.orden.slice(1)))
    : ({cta:f.c.cta, emp:f.emp, conH:f.conH, max:f.max?f.max.v:-Infinity, min:f.min?f.min.v:Infinity})[SC.orden];
  filas.sort((a,b)=>{ const A=val(a), B=val(b); const r = typeof A==="string" ? A.localeCompare(B) : A-B;
    return (SC.asc?r:-r) || a.c.cta.localeCompare(b.c.cta); });
  CTA_VIS = filas.map(f=>({f, meses:meses.map(m=>mesDe(f,m))}));
  const flecha = k => SC.orden===k && !(k==="cta" && SC.asc) ? `<b class="fl" aria-hidden="true">${SC.asc?"▲":"▼"}</b>` : "";
  const tituloOrden = (k, t) => SC.orden!==k ? `Ordenar por ${t}: de mayor a menor` : SC.asc ? `Ordenado por ${t}, de menor a mayor; otra vez regresa al orden por cuenta`
    : `Ordenado por ${t}, de mayor a menor; otra vez, de menor a mayor`;
  const tope = Math.max(1, ...filas.flatMap(f=>[...f.porMes.values()].map(x=>x.u+x.d)));
  const COL = [["cta","Cuenta",""],["emp","Empresas","r"],["conH","Con hallazgo","r"]];
  document.getElementById("cthr").innerHTML =
    COL.map(([k,t,r])=>`<th class="${r}${SC.orden===k?" act":""}"><button data-ck="${k}" title="${esc(k==="cta"?(SC.orden==="cta"&&SC.asc?"Ordenado por cuenta; pica para el orden contrario":"Ordenar por cuenta"):tituloOrden(k, t.toLowerCase()))}">${t}${flecha(k)}${ico("orden","")}</button></th>`).join("") +
    meses.map(m=>{ const k = "m"+m;
      return `<th class="r mes${SC.orden===k?" act":""}" style="text-align:right"><button data-ck="${k}" title="${esc(tituloOrden(k, (MESES.get(m)||"").toLowerCase()))}">${esc(mesCorto(m))}${flecha(k)}</button></th>`; }).join("") +
    [["max","Mayor alza"]].map(([k,t])=>`<th class="r${SC.orden===k?" act":""}"><button data-ck="${k}" title="${esc(tituloOrden(k, "mayor alza"))}">${t}${flecha(k)}${ico("orden","")}</button></th>`).join("");
  const extremo = (x,cls) => {
    if(!x) return "—";
    const cuerpo = `<span class="pct ${cls}">+${esc(money(x.v))}</span><span class="xt">${esc(BASE.clientes[x.ci][0])} · ${esc(mesCorto(x.m))}</span>`;
    return cuerpo;
  };
  const ts0 = document.querySelector("#ctb tr.cdrow .tscroll"), x0 = ts0 ? ts0.scrollLeft : 0;   // al guardar, la tabla se queda donde estaba
  document.getElementById("ctb").innerHTML = filas.length ? filas.map(f=>`
    <tr data-ct="${f.c.ct}"${SC.sel===f.c.ct?' class="csel"':""}>
      <td><span class="cta">${esc(f.c.cta)}</span><br><span style="font-size:12.5px">${esc(f.c.nombre)}</span></td>
      <td class="r mny">${fNum.format(f.emp)}</td>

      ${meses.map(m=>{ const x=f.porMes.get(m), n=x.u+x.d, tt=f.tot.get(m);
        const [va, vp] = verSaldo() ? [tt.s, tt.sp] : [tt.a, tt.p];
        const tit = `Saldo final ${money(tt.s)} · mes anterior ${money(tt.sp)}\nMovimiento del mes ${money(tt.a)}`+(n?`\n${n} ${n===1?"hallazgo":"hallazgos"} en el mes`:"");
        return `<td class="cm${SC.orden==="m"+m?" ord":""}" title="${esc(tit)}" style="${n?`background:color-mix(in srgb, var(--accent) ${Math.round(6+n/tope*34)}%, transparent)`:""}">${va||vp?`<span class="${va<0?"neg":""}">${esc(money(va))}</span>${signo(va,vp)}`:'<span style="color:var(--ink-4)">·</span>'}${avisoCuenta(tt.av)}</td>`; }).join("")}
      <td class="r">${extremo(f.max,"up")}</td></tr>${SC.sel===f.c.ct ? `<tr class="cdrow"><td colspan="${meses.length+4}">${detalleCuentaHTML(datos, meses)}</td></tr>` : ""}`).join("")
    : `<tr><td colspan="${meses.length+4}"><div class="vacio">Ninguna cuenta cumple estos filtros.</div></td></tr>`;
  if(x0){ const ts1 = document.querySelector("#ctb tr.cdrow .tscroll"); if(ts1) ts1.scrollLeft = x0; }
  const totH = filas.reduce((a,f)=>a+f.nH,0), totAv = filas.reduce((a,f)=>a+f.nAv,0);
