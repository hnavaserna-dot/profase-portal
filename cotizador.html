<!doctype html>
<html lang="es" data-rol="cotizador">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Portal PROFASE · Cotizador</title>
<link rel="icon" href="img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Cotizador DECOMSA dentro del portal: mismos colores, letras y encabezado que el resto del portal.
   La hoja de la cotización (vista previa y PDF) conserva el formato de DECOMSA. */
:root{
  color-scheme:light;
  --bg:#F3F5F9; --surface:#FFFFFF; --surface-2:#EDF1F7; --ink:#132036; --muted:#5A6577; --line:#DCE2EB; --line-strong:#C4CDDA;
  --navy:#1F3864; --navy-ink:#FFFFFF; --navy-soft:#E6ECF6; --accent:#F07A1E; --accent-soft:#FDEBDC; --brand-blue:#014F8F; --brand-ink:#1F3864;
  --red:#B42318; --red-soft:#FDECEA; --amber:#9A5B00; --amber-soft:#FFF4D6; --ok:#0B7A45; --ok-soft:#E3F4EA;
  --row-alt:#F8FAFC;
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif;
  --f-body:"Public Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:10px;
  /* Hoja de la cotización: siempre sobre papel blanco */
  --d-navy:#0D4E96; --d-navy2:#1F3864; --d-or:#F58220; --d-tx:#404040; --d-ln:#D9D9D9; --d-lb:#BDD7EE; --d-soft:#ECF3FB;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1320; --surface:#141C2B; --surface-2:#1A2436; --ink:#E5EAF2; --muted:#98A3B5; --line:#243049; --line-strong:#33415E;
  --navy:#1A2D52; --navy-ink:#F1F4FA; --navy-soft:#1C2A44; --accent:#FF8F3F; --accent-soft:#3A2516; --brand-blue:#5B9BD8; --brand-ink:#D6E1F3;
  --red:#F2867B; --red-soft:#3A1C1A; --amber:#F2C066; --amber-soft:#33280F; --ok:#5BD69A; --ok-soft:#14301F;
  --row-alt:#111827; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1320; --surface:#141C2B; --surface-2:#1A2436; --ink:#E5EAF2; --muted:#98A3B5; --line:#243049; --line-strong:#33415E;
  --navy:#1A2D52; --navy-ink:#F1F4FA; --navy-soft:#1C2A44; --accent:#FF8F3F; --accent-soft:#3A2516; --brand-blue:#5B9BD8; --brand-ink:#D6E1F3;
  --red:#F2867B; --red-soft:#3A1C1A; --amber:#F2C066; --amber-soft:#33280F; --ok:#5BD69A; --ok-soft:#14301F;
  --row-alt:#111827; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-text-size-adjust:100%;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1500px;margin:0 auto}

/* Encabezado del portal */
header.band{background:var(--surface);color:var(--ink);border-bottom:3px solid var(--navy)}
header.band .wrap{padding-block:8px;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;justify-content:space-between}
h1{font-family:var(--f-display);font-weight:750;font-stretch:85%;font-size:clamp(19px,2vw,23px);letter-spacing:.2px;margin:0;line-height:1.1;text-wrap:balance}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:30px;height:auto;display:block;flex:none}
.brandtxt{display:flex;flex-direction:column;line-height:1.05;flex:none}
.wm{font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;font-weight:700;letter-spacing:.16em;color:var(--brand-ink);font-size:17px}
.tag{font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;font-size:10.5px;font-style:italic;color:var(--muted);margin-top:3px}
.bsep{width:1px;align-self:stretch;min-height:30px;background:var(--line-strong);margin:0 6px;flex:none}
.meta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:flex-end}
.notas{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;text-decoration:none}
.notas:hover{border-color:var(--navy)}
.sync{display:inline-flex;align-items:center;gap:6px}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync[data-s="ok"]::before{background:var(--ok)}
.sync[data-s="off"]::before{background:var(--red)}
@media (max-width:640px){h1{font-size:18px}.brandtxt,.bsep{display:none}}

/* Pestañas */
.tabbar{background:var(--surface);border-bottom:1px solid var(--line-strong)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;text-decoration:none;color:var(--muted);padding:10px 14px;font-weight:600;font-size:13.5px;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}

main{padding-top:18px;padding-bottom:60px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
h2{font-family:var(--f-display);font-stretch:85%;font-weight:750;font-size:17px;margin:0;color:var(--ink)}
.vhead{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.vhead h2{font-size:22px}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.banner{border-radius:var(--r);padding:10px 14px;margin-bottom:14px;font-size:13.5px;background:var(--amber-soft);border:1px solid var(--line)}
.banner.info{background:var(--navy-soft)}

/* Controles */
.btn{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--navy)}
.btn.primary{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.btn.primary:hover{background:var(--brand-blue);border-color:var(--brand-blue)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--brand-blue);padding:5px 8px}
.btn.ghost:hover{background:var(--navy-soft)}
.btn.danger{color:var(--red)}
.btn.sm{padding:5px 9px;font-size:12.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
label.f,div.f{display:grid;gap:4px;align-content:start;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
.in{width:100%;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:7px 9px;font-size:14px;font-weight:400;color:var(--ink);min-width:0}
textarea.in{resize:vertical;line-height:1.4}
.in:focus{border-color:var(--brand-blue);outline:none;box-shadow:0 0 0 3px var(--navy-soft)}
.in[readonly],.in:disabled{background:var(--surface-2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media (max-width:460px){.grid3{grid-template-columns:1fr 1fr}}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 10px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:7px}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button b{font-size:16px;line-height:1}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink)}
.seg button[disabled]{cursor:not-allowed;opacity:.6}
.adorn{position:relative;display:block}
.adorn-s{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-weight:700;color:var(--brand-blue);pointer-events:none}
.adorn .in{padding-left:26px}
.hint{font-size:11.5px;color:var(--amber);font-weight:500}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--navy-soft);color:var(--muted);white-space:nowrap}
.chip.new{background:var(--amber-soft);color:var(--amber)}
.errors{background:var(--red-soft);color:var(--red);border-radius:8px;padding:10px 12px;font-size:13px}
.errors ul{margin:4px 0 0;padding-left:18px}
.warnbox{background:var(--amber-soft);color:var(--amber);border-radius:8px;padding:8px 12px;font-size:13px}

/* Editor: formulario | hoja */
.editor{display:grid;grid-template-columns:minmax(340px,470px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1000px){.editor{grid-template-columns:minmax(0,1fr)}.pv-wrap{position:static!important}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel>section{padding:14px 16px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.panel>section:last-child{border-bottom:0}
.ed-head{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap}
.folio{font-family:var(--f-display);font-stretch:85%;font-weight:750;font-size:22px;color:var(--brand-blue)}
.lockbar{background:var(--navy-soft);padding:10px 16px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-radius:var(--r) var(--r) 0 0}
.typeahead{position:relative}
.ta-list{position:absolute;z-index:10;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;box-shadow:0 10px 30px rgba(10,20,40,.18);max-height:290px;overflow:auto}
.ta-list button{display:grid;width:100%;text-align:left;border:0;background:none;padding:7px 10px;cursor:pointer;gap:1px}
.ta-list button:hover,.ta-list button.on{background:var(--navy-soft)}
.ta-list small{color:var(--muted);font-size:11.5px}
.items{display:grid;gap:10px}
.item{border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:8px}
.item-h{display:flex;gap:8px;align-items:center}
.item-n{font-family:var(--f-display);font-weight:750;color:var(--accent);width:18px;text-align:center}
.item-h select{flex:1}
.item-g{display:grid;grid-template-columns:90px 1fr 1fr;gap:8px;align-items:end}
.item-imp{text-align:right;font-weight:700;color:var(--brand-blue);padding-bottom:7px;font-variant-numeric:tabular-nums}
.totals-mini{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:13px;font-variant-numeric:tabular-nums}
.totals-mini .t{font-weight:700;font-size:15px;color:var(--brand-blue)}
.actions{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);border-radius:0 0 var(--r) var(--r);padding:12px 16px;display:flex;gap:8px;flex-wrap:wrap}
.hist summary{cursor:pointer;font-family:var(--f-display);font-stretch:85%;font-weight:750;font-size:15px}
.hist ol{list-style:none;margin:8px 0 0;padding:0 0 0 14px;border-left:2px solid var(--line);display:grid;gap:10px}
.hist ol>li{position:relative;font-size:13px}
.hist ol>li::before{content:"";position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--brand-blue)}
.hist .who-l{color:var(--muted);font-size:12px}
.chg{margin:3px 0 0;padding:0;list-style:none;display:grid;gap:2px;font-size:12px;color:var(--muted)}
.chg b{color:var(--ink);font-weight:600}
.chg .a{text-decoration:line-through;text-decoration-color:var(--red)}
.chg .d{color:var(--ink)}

/* Hoja de la cotización (vista previa a escala; así sale el PDF) */
.pv-wrap{position:sticky;top:12px;min-width:0}
.pv-bar{display:flex;align-items:center;gap:8px;margin-bottom:8px;color:var(--muted);font-size:12.5px}
.pv-scale{overflow:hidden;border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 12px 32px rgba(10,25,50,.14);background:#fff}
.doc{width:816px;min-height:1056px;display:flex;flex-direction:column;background:#fff;color:var(--d-tx);font-family:Helvetica,Arial,sans-serif;padding:40px 48px 48px;transform-origin:0 0;font-size:12px;line-height:1.3}
.doc .d-top{display:grid;grid-template-columns:160px 1fr 92px;align-items:center;height:84px}
.doc .d-top .l1{width:158px}
.doc .d-top .l2{width:88px;justify-self:end}
.doc .d-title{text-align:center;color:var(--d-navy);font-weight:700;font-size:20px}
.doc .d-rule{height:5px;background:var(--d-navy);margin-top:6px}
.doc .d-rule2{height:3px;background:var(--d-or);margin-top:2px}
.doc .d-info{display:grid;grid-template-columns:1fr 1fr;gap:0 40px;margin-top:18px}
.doc .d-kv{display:grid;grid-template-columns:124px 1fr;align-items:end;height:21px;color:var(--d-navy2)}
.doc .d-kv span{border-bottom:1px solid var(--d-lb);padding-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc .d-info .r .d-kv{grid-template-columns:1fr 125px}
.doc .d-info .r .d-kv b{text-align:right;padding-right:10px}
.doc .d-info .r .d-kv span{text-align:right;color:var(--d-navy)}
.doc table{width:100%;border-collapse:collapse;margin-top:16px}
.doc th{background:var(--d-navy);color:#fff;font-weight:700;text-align:left;padding:6px 7px;font-size:11.5px}
.doc td{padding:9px 7px;border-bottom:1px solid var(--d-ln);vertical-align:middle}
.doc td.n{color:var(--d-or);font-weight:700;font-size:13px;text-align:center;width:28px}
.doc td.s{color:var(--d-navy);font-weight:700;width:168px}
.doc td.ds{font-size:9.8px;line-height:1.33;white-space:pre-line}
.doc td.c{text-align:center;width:48px}
.doc td.c small{display:block;font-size:9px}
.doc td.p,.doc th.p{text-align:right;width:104px}
.doc td.i{text-align:right;color:var(--d-navy);font-weight:700;width:104px}
.doc .d-empty td{color:#9aa4b2;text-align:center;padding:26px;font-style:italic}
.doc .d-bottom{display:grid;grid-template-columns:360px 1fr;gap:28px;margin-top:auto;padding-top:20px;align-items:start}
.doc .d-box{border:1px solid var(--d-or)}
.doc .d-box h4{margin:0;background:var(--d-or);color:#fff;font-size:11.5px;padding:3px 7px}
.doc .d-box p{margin:0;font-size:9.5px;padding:3px 6px;border-bottom:1px solid var(--d-ln);line-height:1.3}
.doc .d-box p:last-child{border-bottom:0}
.doc .d-pay{margin-top:12px}
.doc .d-pay h4{margin:0;background:var(--d-navy);color:#fff;font-size:11.5px;padding:2px 7px}
.doc .d-pay div{display:grid;grid-template-columns:106px 1fr;font-size:10px;border-bottom:1px solid var(--d-ln);padding:1.5px 6px}
.doc .d-pay div b:first-child{color:var(--d-navy2)}
.doc .d-tot div{display:grid;grid-template-columns:1fr 70px 120px;border-bottom:1px solid var(--d-lb);padding:3px 5px}
.doc .d-tot div:first-child{border-top:1px solid var(--d-lb)}
.doc .d-tot b{color:var(--d-navy2)}
.doc .d-tot .pc{color:var(--d-navy);text-align:right;padding-right:8px}
.doc .d-tot .v{text-align:right}
.doc .d-tot .T{background:var(--d-navy);color:#fff;font-weight:700;font-size:15px;border:0;margin-top:3px;padding:4px 6px}
.doc .d-tot .T b{color:#fff}
.doc .d-res{background:var(--d-soft);padding:7px 8px;margin-top:10px;font-size:10.5px;color:var(--d-navy2)}
.doc .d-res .h{font-size:9px;font-weight:700;color:var(--d-navy);letter-spacing:.03em}
.doc .d-res div{display:flex;justify-content:space-between;margin-top:3px}
.doc .d-sig{margin-top:28px;border-top:1px solid var(--d-navy2);text-align:center;padding-top:4px;font-size:11px;margin-left:18px;line-height:1.4}
.doc .d-sig b{color:var(--d-navy2);font-size:12px}
.doc .d-foot{margin-top:18px;background:var(--d-navy);color:#fff;text-align:center;font-weight:700;font-size:10px;padding:4px;min-height:20px}

/* Indicadores, filtros y tablas */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;border-top:3px solid var(--navy)}
.stat .v{font-family:var(--f-display);font-stretch:85%;font-weight:750;font-size:24px;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .s{font-size:12px;color:var(--muted)}
.filters{display:grid;grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}
.bit-filters{display:grid;grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr)) auto;gap:10px;margin:14px 0 12px;align-items:end}
@media (max-width:860px){.filters,.bit-filters{grid-template-columns:1fr 1fr}.filters>:first-child,.bit-filters>:first-child{grid-column:1/-1}}
.tbl-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line-strong);background:var(--surface);position:sticky;top:0;white-space:nowrap}
table.t td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tbody tr:nth-child(even) td{background:var(--row-alt)}
table.t tbody tr:last-child td{border-bottom:0}
table.t .r{text-align:right;font-variant-numeric:tabular-nums}
table.t td.fol{font-weight:700;color:var(--brand-blue);white-space:nowrap}
table.t td.cl{max-width:320px}
table.t td.cl div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
table.t td.cl small{color:var(--muted)}
table.t td.det{min-width:280px}
.acts{display:flex;gap:2px;flex-wrap:nowrap}
.empty{padding:28px 10px;text-align:center;color:var(--muted)}
.st{border-radius:99px;font-size:12px;font-weight:700;padding:4px 8px;border:1px solid transparent;cursor:pointer}
.st:disabled{cursor:default;opacity:1}
.pill{display:inline-block;border-radius:99px;font-size:12px;font-weight:700;padding:3px 10px}
.st-borrador{background:var(--navy-soft);color:var(--muted)}
.st-enviada{background:var(--navy-soft);color:var(--brand-blue)}
.st-aceptada{background:var(--ok-soft);color:var(--ok)}
.st-rechazada{background:var(--red-soft);color:var(--red)}
.st-vencida{background:var(--amber-soft);color:var(--amber)}
.area{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.03em;padding:2px 8px;border-radius:99px;background:var(--navy-soft);color:var(--muted);white-space:nowrap}
.area.a-Cotizaciones{background:var(--accent-soft);color:var(--ink)}
.area.a-Ajustes,.area.a-Servicios{background:var(--amber-soft);color:var(--amber)}
.subtabs{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;margin:12px 0 14px}
.subtabs button{border:0;background:var(--surface);padding:7px 14px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted)}
.subtabs button+button{border-left:1px solid var(--line-strong)}
.subtabs button[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink)}
.cat-desc{min-width:300px}
.cform{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;margin-bottom:14px}
.cform .g{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
@media (max-width:700px){.cform .g{grid-template-columns:1fr}}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;align-items:start}
.settings .panel{padding:14px 16px;display:grid;gap:10px}

/* Avisos y diálogos (los usa también el encabezado del portal) */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:var(--navy-ink);padding:10px 16px;border-radius:10px;font-size:13.5px;font-weight:600;z-index:70;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.ov{position:fixed;inset:0;background:rgba(13,19,32,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.dlg{background:var(--surface);color:var(--ink);border-radius:14px;box-shadow:0 18px 60px rgba(0,0,0,.28);width:min(560px,100%);max-height:calc(100% - 32px);overflow:auto;padding:20px 22px;border-top:4px solid var(--navy)}
.dlg h2{font-size:21px;margin:0 0 2px}
.dlg .sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.dmsg{margin-top:14px;font-size:13.5px;padding:10px 12px;border-radius:8px;background:var(--navy-soft)}
.dmsg.bad{background:var(--red-soft)}
.dmsg.warn{background:var(--amber-soft)}
.dmsg.ok{background:var(--accent-soft)}
.dmsg:empty{display:none}
.dacts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.dacts .btn.primary{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
</style>
</head>
<body>
<header class="band">
  <div class="wrap">
    <div class="brand">
      <img class="logo" alt="PROFASE" width="30" height="33" src="img/logo.png">
      <div class="brandtxt"><span class="wm">PROFASE</span><span class="tag">Asesoría Contable, Legal y Fiscal</span></div>
      <span class="bsep" aria-hidden="true"></span>
      <h1>Cotizador DECOMSA</h1>
    </div>
    <div class="meta">
      <span class="sync" id="sync">Conectando…</span>
      <span class="equipo"></span>
    </div>
  </div>
</header>
<div class="tabbar">
  <nav class="tabs wrap" aria-label="Secciones del cotizador">
    <a href="#nueva" data-nav="nueva">Nueva cotización</a>
    <a href="#cotizaciones" data-nav="cotizaciones">Cotizaciones</a>
    <a href="#catalogos" data-nav="catalogos">Catálogos</a>
    <a href="#bitacora" data-nav="bitacora">Bitácora</a>
    <a href="#ajustes" data-nav="ajustes">Ajustes</a>
  </nav>
</div>
<main class="wrap">
  <div id="banner"></div>

  <section id="v-nueva" data-view="nueva">
    <div class="editor">
      <div class="panel" id="ed-panel">
        <div class="lockbar" id="ed-lock" hidden></div>
        <section>
          <div class="ed-head">
            <div><div class="eyebrow" id="ed-mode">Nueva cotización</div><div class="folio num" id="ed-folio">Folio al guardar</div></div>
            <span class="spacer"></span>
            <label class="f" id="ed-st-wrap" hidden>Estatus<select id="ed-estatus" class="st"></select></label>
          </div>
        </section>
        <section>
          <h2>Cliente</h2>
          <label class="f">Razón social
            <div class="typeahead">
              <input id="f-cliente" class="in" autocomplete="off" placeholder="Busca por nombre o RFC" aria-autocomplete="list" aria-controls="ta">
              <div class="ta-list" id="ta" role="listbox" hidden></div>
            </div>
          </label>
          <div id="cli-state" class="row"></div>
          <div class="grid2">
            <label class="f">RFC<input id="f-rfc" class="in num" maxlength="20" autocomplete="off" autocapitalize="characters" spellcheck="false"></label>
            <label class="f">Contacto<input id="f-contacto" class="in"></label>
          </div>
          <label class="f">Teléfono / correo<input id="f-telefono" class="in"></label>
        </section>
        <section>
          <div class="grid3">
            <label class="f">Fecha<input type="date" id="f-fecha" class="in"></label>
            <label class="f">Vigencia (días)<input type="number" min="1" max="365" step="1" id="f-vigencia" class="in num"></label>
            <label class="f">Válida hasta<input id="f-hasta" class="in num" readonly tabindex="-1"></label>
          </div>
          <label class="f">Asesor que firma<select id="f-asesor" class="in"></select></label>
        </section>
        <section>
          <div class="row"><h2>Servicios</h2><span class="spacer"></span><button type="button" class="btn sm" id="add-item">+ Agregar servicio</button></div>
          <div class="items" id="items"></div>
        </section>
        <section>
          <div class="f" role="group" aria-labelledby="desc-lbl">
            <span id="desc-lbl">Tipo de descuento</span>
            <div class="seg" id="desc-tipo">
              <button type="button" data-v="porc"><b>%</b> Porcentaje</button>
              <button type="button" data-v="monto"><b>$</b> Monto fijo</button>
            </div>
          </div>
          <div class="grid2">
            <label class="f"><span id="desc-in-lbl">Descuento (%)</span>
              <span class="adorn"><span class="adorn-s" id="desc-sym">%</span><input type="number" id="f-desc" class="in num" min="0" step="0.01" placeholder="0"></span>
              <span class="muted" id="desc-eq" style="font-weight:500"></span>
            </label>
            <label class="f">IVA (%)<input type="number" id="f-iva" class="in num" min="0" max="100" step="0.01"></label>
          </div>
          <div class="totals-mini" id="tot-mini"></div>
          <label class="f">Notas adicionales para esta cotización<textarea id="f-nota" class="in" rows="2" placeholder="Una nota por renglón; se agregan a Condiciones y notas"></textarea></label>
        </section>
        <section id="ed-msgs" hidden></section>
        <section id="ed-hist" hidden></section>
        <div class="actions" id="ed-actions"></div>
      </div>
      <div class="pv-wrap">
        <div class="pv-bar"><span>Vista previa · así sale el PDF</span></div>
        <div class="pv-scale" id="pv-scale"><div class="doc" id="doc"></div></div>
      </div>
    </div>
  </section>

  <section id="v-cotizaciones" data-view="cotizaciones" hidden></section>
  <section id="v-catalogos" data-view="catalogos" hidden></section>
  <section id="v-bitacora" data-view="bitacora" hidden></section>
  <section id="v-ajustes" data-view="ajustes" hidden></section>
</main>
<div id="toast" class="toast" role="status" hidden></div>

<script src="js/supabase.js?v=bb37eb706b"></script>
<script src="js/portal.js?v=41b8937c8b"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="js/cotizador.js?v=0fb661799d"></script>
</body>
</html>
